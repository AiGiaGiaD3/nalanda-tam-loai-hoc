đã chứng là tánh tướng của Tái quyết tri.’ Lại có\nngười nói: ‘Liễu tri lại chấp trì nghĩa mà lượng trước đó dẫn đến nó đã chứng không quên.’ Điều đầu tiên không hợp lý bởi vì\nkhông khẳng định bằng nhất thiết chủng trí sát na thứ hai. Điều thứ hai cũng không hợp lý bởi vì không khẳng định bằng cái sát\nna thứ hai đó.’","26":"Nhân Minh Thất Luận Trang Nghiêm Trừ Ám Sớ\nTrong Nhân Minh Thất Luận Trang Nghiêm Trừ Ám Sớ của Khedrup Rinpoche: “Vì lẽ đó, giác tri chứng âm thanh vô thường\nsanh sau tỷ lượng chứng âm thanh vô thường không là tỷ độ do đó không có tái quyết tri mà đó là tỷ độ.”\nTrong Nhân Minh Thất Luận Trang Nghiêm Trừ Ám Sớ của Khedrup Rinpoche: “Có người đồng ý cho các hiện tiền sát na sau đó\nđều là tái quyết tri bởi vì tái quyết tri là giác tri nhớ cảnh đã được khẳng định trước đó, nếu là giác tri mà đó là Niệm (nhớ) thì\nphải là phân biệt.\nNếu không phải như vậy thì sẽ trở thành tái quyết tri bằng đơn thuần chấp trì mà lượng trước đó đã chấp trì, có vô số tổn hại\nnhư ứng thành như ứng thành tất cả Bản trí biến tri sát na thứ hai trở đi là tái quyết tri và ứng thành không có hiện lượng\nchứng vô ngã …”\nTrong Nhân Minh Thất Luận Trang Nghiêm Trừ Ám Sớ của Khedrup Rinpoche trước tác: “Đối với thừa nhận cho bản chất của\nTái quyết tri là Niệm thì chính tôi và hầu hết các học giả đều cùng một luận điệu. Nếu do vì điều đó cho nên tánh tướng của Tái\nquyết tri là ‘giác tri nghĩa mà đã được tiền lượng dẫn xuất chính nó khẳng định.’”\nTất cả tri thức không là lượng đều là phi lượng.\nBk – chứng rồi lại chứng\nLấy Liễu tri phi lượng chứng lại mà lượng trước đó dẫn đến nó đã chứng làm bđ. UT là tánh tướng của Tái quyết tri sao? Đý\nLấy ‘Liễu tri lại chấp trì nghĩa mà lượng trước đó dẫn đến nó đã chứng không quên’ làm bđ.\nUT không là tánh tướng của Tái quyết tri sao? đý\nTại sao không là Tái quyết tri?\nBởi vì Tám ngả nt không khẳng định.\nNgả nào không khẳng định?\nNếu là Liễu tri lại chấp trì nghĩa mà lượng trước đó dẫn đến nó đã chứng không quên thì không nt là Tái quyết tri.\nXin hãy nêu sự tướng.","27":"Lấy Nhất thiết chủng trí sát na thứ hai làm bđ.\nLấy Nhất thiết chủng trí sát na thứ hai làm bđ.\nUT là Liễu tri lại chấp trì nghĩa mà lượng trước đó dẫn đến nó đã chứng không quên sao? Đý\nUT là Giác tri lại chấp trì nghĩa mà lượng cận thủ trước đó của nó đã chứng không quên sao? Tại sao?\nUT không là Giác tri lại chấp trì nghĩa mà lượng cận thủ trước đó của nó đã chứng không quên sao? Đý\nUT không là lại chứng mà lượng cận thủ trước đó của chính nó đã chứng sao?\nĐý.\nXin nêu ra lượng cận thủ trước đó của nhất thiết chủng trí ở sát na thứ hai.\nLấy nhất thiết chủng trí sát na thứ nhất làm bđ.\nLấy Nhất thiết chủng trí sát na thứ hai làm bđ. UT là liễu tri lại chứng mà lượng trước đó dẫn đến nó đã chứng sao?\nĐý\nUT là lại chứng mà lượng trước đó dẫn đến nó đã chứng sao? Đý\nUT là lại chứng mà lượng cận thủ trước đó của chính nó đã chứng sao? Đý\nUT là Tái quyết tri sao?\nTại sao?\nBởi vì là Giác tri lại chấp trì nghĩa mà lượng cận thủ trước đó của nó đã chứng không quên.\nUT là nt bởi vì cái đó là tánh tướng của Tái quyết tri.\nLDKTL\nUT là tánh tướng của Tái quyết tri bởi vì là tôn ý của Gyalwa Gedun Drup.\nLDKTL\nUT là tôn ý của ngài bởi vì trong Lượng Lý Trang Nghiêm Luận của Gyalwa Gedun Drup: “Tánh tướng của Tái quyết tri: Giác tri\nlại chấp trì nghĩa mà lượng cận thủ trước đó của nó đã chứng không quên.”\nPhân loại có 2 đó là Hiện tiền tái quyết tri và Phân biệt tái quyết tri.","28":"Thứ nhất, Hiện tiền tái quyết tri có 4 đó là Căn hiện tiền tái quyết tri, Ý hiện tiền tái quyết tri, Tự\nchứng tái quyết tri và Du già hiện tiền tái quyết tri.\nThứ hai, Phân biệt tái quyết tri có 2 đó là Hiện tiền sở dẫn sinh phân biệt tái quyết tri và Tỷ\nlượng sở dẫn sinh phân biệt tái quyết tri.\nHT sở dẫn sinh phân biệt TQT\nSự tướng của Hiện tiền sở dẫn sinh phân biệt tái quyết tri: Định tri (tri thức xác định) mà đó\nsinh khởi sau khi Hiện tiền chấp trì màu xanh khẳng định màu xanh.\nTL sở dẫn sinh phân biệt TQT\nSự tướng của Tỷ lượng sở dẫn sinh phân biệt tái quyết tri: Tỷ độ ở sát na thứ hai chứng âm\nthanh là vô thường.\nBởi vì trong Hữu lý do Lobpon Choe Chog biên soạn có thuyết rằng: ‘Sát na thứ nhất của hai\nHiện tiền và Tỷ độ là lượng. Những thứ Thành trụ bất dị sau đó mà đã trở thành dòng lưu của\nhiện và tỷ độ thì nên phủ nhận chúng là lượng’.\nCó nói thành trụ đồng nhất ở ngay thời điểm này là quả đồng nhất.\nTứ sát tri\nLiễu tri chỉ nhất ý đam trước vào pháp mà đó là xúc nhập cảnh chủ yếu của chính nó, nhưng\nkhông thấu đạt được quán sát nghĩa là tánh tướng của Tứ sát tri.\nPhân loại có 3 đó là Vô lý do tứ sát tri, Bất định lý do tứ sát tri và Y tương tự tứ sát tri.","29":"Vô lý do tứ sát tri\nSự tướng của Vô lý do tứ sát tri: Giác tri không dựa vào bất kỳ lý do nào để nghĩ âm thanh là vô\nthường.\nBất định lý do tứ sát tri\nSự tướng của Bất định lý do tứ sát tri: Giác tri nghĩ âm thanh vô thường từ nhân Tác, không\nkhẳng định được âm thanh là tác và nếu là tác thì nhất thiết là vô thường.\nY tương tự tứ sát tri\nSự tướng của Y tương tự tứ sát tri: Giác tri nghĩ âm thanh là vô thường từ nhân sở lượng.\nCũng giống như thế (như vậy tuy nhiên) trong Lý Tạng của Sakya Pandita Kunga Gyaltsen có nói:\nTứ sát tri không dựa vào nhân\nThừa nhận đơn thuần sẽ thành nghi\nNếu dựa vào nhân thì không dựa\nGì hơn Chánh hoặc ba tự nhân.\nSóng Hào Quang\nNgài Palden Dragpa trong Phương Thức Học Lý Đạo Biến Hóa Mới Mẻ Sóng Hào Quang có nói: “Trong Thuyết Tục Bản Trí Kim\nCang Tập (trước tác bởi Đức Kim Cang Trì) có nói rõ ràng: ‘Thành nghi, tứ sát tri’. Tuy nhiên trong Chú giải Bản Trí Kim Cang Tập,\ntừ ngữ và chú giải không rõ rệt do đó nên quán sát.”\nCó người cho rằng ‘Khẳng định thuận với nghĩa của ẩn tế không được chứng trước đó, không dựa vào nhân’ là tánh tướng của\nTứ sát tri.","30":"Trong Lý Tạng tự tông bài xích tha tông:\n1.    Nếu không dựa vào nhân thì không thể nào Khẳng định thuận với nghĩa của ẩn tế.\n2.    Duy thừa nhận không dựa vào nhân thì sẽ trở thành tâm nghi.\n3.    Nếu dựa vào nhân thì cần dựa vào chánh nhân hoặc ba tự nhân. Nếu dựa vào chánh nhân thì lại trở thành Tỷ độ.\nNếu dựa vào tự nhân thì không chứng cảnh.\nLại tánh tướng Tứ sát tri\nLại nữa, an lập Đam trước tri không thấu đạt quán sát nghĩa, nhất ý chấp trì không sai loạn\nvới tự xúc nhập cảnh, không dựa vào kinh nghiệm và chánh nhân là tánh tướng của Tứ sát tri.\nChính nó tứ sát tri\nTrong Tâm Loại Học của Ratod: Đam trước tri mới khẳng định, nhất ý khẳng định thực cảnh,\nkhông dựa vào tự kinh nghiệm và chánh nhân là tánh tướng của chính nó tứ sát tri.\nBk – dựa vào kinh nghiệm\nUT nếu là Tứ sát tri thì nt không dựa vào kinh nghiệm sao? Đý\nLấy Tứ sát tri mà đã trở thành bản chất của cảm thọ làm bđ\nUT không dựa vào kinh nghiệm sao? Đý\nUT dựa vào kinh nghiệm bởi vì là kinh nghiệm.\n1/ nếu nói Không nhất thiết:\nLấy bất tịnh định làm bđ.\nTại sao dựa vào kinh nghiệm?\nBởi vì dựa kinh nghiệm tu sở sinh.\nBởi vì là kinh nghiệm tu sở sinh. (chỗ này nhất thiết vì không còn cách trả lời nào khác)\n2/ nếu nói LDKTL:","31":"Lấy Tứ sát tri mà đã trở thành bản chất của cảm thọ làm bđ\nUT không là kinh nghiệm sao?\nUT là kinh nghiệm bởi vì là cảm thọ.\nKhông nt.\nUT nt bởi vì là tôn ý của ngài Nguyệt Xứng.LDKTL\nBởi vì trong Nhập Trung Luận do ngài trước tác có nói: ‘Cảm thọ hữu bản tính của kinh nghiệm.’\nLấy Tứ sát tri mà đã trở thành bản chất của cảm thọ làm bđ\nUT không dựa vào kinh nghiệm bởi vì là tôn ý của Geshe Jampal Samphel.\nBởi vì trong Kiến Lập Tâm Loại Học có nói: ‘Lại nữa, an lập Đam trước tri không thấu đạt quán sát nghĩa, nhất ý chấp trì không\nsai loạn với tự xúc nhập cảnh, không dựa vào kinh nghiệm và chánh nhân là tánh tướng của Tứ sát tri.’\nLấy Tứ sát tri mà đã trở thành quả của Kinh nghiệm làm bđ. (Tứ sát tri khán kiến kinh nghiệm vô thường là Quả của kinh nghiệm\ngiống như Tứ sát tri khán kiến âm thanh vô thường là Quả của âm thanh vô thường và Quả của âm thanh)\nUT không dựa vào kinh nghiệm sao? Đý\nUT dựa vào kinh nghiệm bởi vì là quả của kinh nghiệm.\nKhông nhất thiết.\nUT là nhất thiết bởi vì tất cả tông luận của nội giả Phật giáo đồ đều công nhận quả dựa vào nhân, duy Trung quán Ứng thành\ncông nhận cả hai nhân dựa vào quả và quả dựa vào nhân.\nLấy Tứ sát tri mà đã trở thành quả của Kinh nghiệm làm bđ.\nUT không dựa vào kinh nghiệm bởi vì là tôn ý của Geshe Jampal Samphel.\nBởi vì trong Kiến Lập Tâm Loại Học có nói: ‘Lại nữa, an lập Đam trước tri không thấu đạt quán sát nghĩa, nhất ý chấp trì không\nsai loạn với tự xúc nhập cảnh, không dựa vào kinh nghiệm và chánh nhân là tánh tướng của Tứ sát tri.’\nCó 3 loại kinh nghiệm đó là kinh nghiệm tu sở sinh, kinh nghiệm tự chứng và kinh\nnghiệm sáng suốt không trộn lẫn với nghĩa tổng (tri thức vô phân biệt). Tứ sát tri cần không dựa\nvào bất kỳ kinh nghiệm nào. Nếu vậy thì nếu là giác tri thì không nhất thiết là một trong 7 loại\ngiác tri bởi vì Bất tịnh định và các loại giác tri thuộc chủng tánh chứng phương tiện như là tâm\nđại bi trong dòng tương tục của bậc Hữu học v..v.. không là 1 trong 5 giác tri (hiện tiền, tỷ độ,\ntái quyết tri, nghi và hiển nhi bất định). Cũng dễ hiểu rằng không là những dạng giác tri còn lại.","32":"Nên khảo sát nếu nghĩ rằng do dựa vào kinh nghiệm tu nên không thể là tứ sát tri, do không bị\nnhiễm ô bởi nhân sai loạn nên không thể là điên đảo tri.\nBk – bất tịnh định\nUT nếu là giác tri thì không nt là bất kỳ giác tri nào trong 7 loại giác tri sao?\nLấy bất tịnh định làm bđ.\nUT không là bất kỳ giác tri nào trong 7 loại giác tri sao?\nUT là bởi vì là tái quyết tri.\nBởi vì là giác tri phi lượng và không là bất kỳ cái nào trong hiển nhi bất định, điên đảo tri, nghi, tứ sát tri’’\nLdktl\nUT là nghi sao? Đý\nUT nếu là giác tri thì nt là bất kỳ giác tri nào trong 7 loại giác tri sao? ố xà\nNếu là giác tri phi lượng và không là bất kỳ cái nào trong hiển nhi bất định, điên đảo tri, nghi, tứ sát tri thì không nt là tát quyết\ntri sao?\nUT là nt bởi vì là tôn ý của Pachen Sonam Dragpa.\nBởi vì trong Bát Nhã Nghiên Thảo Đệ Nhất Thời do ngài trước tác: “Có người nói: ‘Gia hành đạo đó không là Tái quyết tri.’\nKhông đồng ý bởi vì cái đó là giác tri phi lượng và không là bất kỳ cái nào trong hiển nhi bất định, điên đảo tri, nghi, tứ sát tri và\nvân vân.’’\nTrong sách Chú Giải Tâm Loại Học của ngài Palden Dragpa (giáo thọ của thầy Loyang): “Hơn nữa, trong Tâm Loại Học có nói bất\ntịnh định không bị nhiễm ô bởi nhân sai loạn. Đối với phát biểu này, những học giả khác nói ứng thành không chấp nhận điều đó\nbởi vì cái đó bị nhiễm ô bởi nhân sai loạn bởi vì trong Thích Lượng Luận của Pháp Xứng có nói: “Cái dư sót là tuyệt đối bị ô\nnhiễm”, trong Thích Lượng Luận Minh Chiếu Giải Thoát Đạo cũng có nói: “Lấy cái dư sót, giác tri tu bất tịnh làm biện đề. Tại\nsao cảnh trình hiện rõ ràng nhưng không là Du già hiện tiền? Bởi vì là tri thức tuyệt đối bị ô nhiễm và nhầm lẫn”, trong Đại Thích\ncủa Khedrup Rinpoche có nói: “Bởi vì là tri thức tuyệt đối bị ô nhiễm và sai loạn. Không là Hiện lượng.””\nNhân sai loạn được chia làm 2 loại: Nhân sai loạn trường viễn và nhân sai loạn nhãn tiền (tạm thời).\nNhân sai loạn trường viễn: Ví dụ như Chấp ngã và Chấp thực. Do chấp ngã nên trình hiện như ngã lập trước Phân biệt.\nDo chấp thực nên trình hiện như thực trước tất cả Phân biệt.\nNhân sai loạn nhãn tiền: Có 4 loại.","33":"1.    Nhân sai loạn có ở địa điểm: Ngồi xe hơi là nhân sai loạn có ở địa điểm bởi vì do có nhân này nên căn tri sinh, mà\ncăn tri này thì cây trình hiện như là đang đi trước nó.\n2.    Nhân sai loạn có ở sở y: Mắt bị nhặm là nhân sai loạn có ở sở y bởi vì do có nhân sai loạn này nên căn tri sinh, mà\ncăn tri này thì một mặt trăng trình hiện như hai mặt trăng trước nó.\n3.    Nhân sai loạn có ở cảnh: Quay nhanh khúc củi đang cháy là nhân sai loạn có ở cảnh bởi vì do có nhân sai loạn này\nnên căn tri sinh, mà căn tri này thì khúc củi đang cháy trình hiện như là bánh xe trước nó.\n4.    Nhân sai loạn có ở vô gián duyên: Tâm bị sân khuấy động là nhân sai loạn có ở vô gián duyên bởi vì do có sai\nloạn nhân này nên căn tri sinh, mà căn tri này thì mặt đất trình hiện như màu đỏ trước nó.\nNghi\nLiễu tri hoài nghi nhị biên bằng tự lực (của chính nó) là tánh tướng của Nghi.\nPhân loại có 3: Hợp nghĩa nghi, Bất hợp nghĩa nghi, Đẳng phần nghi.\nSự tướng thứ nhất: Nghi chắc âm thanh là vô thường.\nSự tướng thứ hai: Nghi chắc âm thanh là thường.\nSự tướng thứ ba: Nghi âm thanh là thường hay vô thường.\nBk – Nghi là tâm sở\nUT nếu là nghi thì nt là tâm sở sao? Đý\nLấy Tâm tương ứng với nghi làm bđ.\nUT không là bất kỳ giác tri nào trong 7 loại giác tri sao? (không thể trả lời là nghi bởi vì sẽ thành ra Tâm tương ứng với nghi là\ntâm sở. Nghi là giác tri bất chứng cảnh > Tâm tương ứng với nó cũng là giác tri bất chứng cảnh.\nBởi vì là bất kỳ giác tri nào trong 7 loại giác tri bởi vì là tái quyết tri.\nUT là tái quyết tri bởi vì là giác tri phi lượng và không là bất kỳ cái nào trong hiển nhi bất định, điên đảo tri, nghi và tứ sát tri.\nKhg nt.\nBát Nhã Nghiên Thảo Đệ Nhất Thời: “Có người nói: ‘Gia hành đạo đó không là Tái quyết tri.’ Không đồng ý bởi vì cái đó là giác\ntri phi lượng và không là bất kỳ cái nào trong hiển nhi bất định, điên đảo tri, nghi, tứ sát tri và vân vân.’’\nNếu là Tâm tương ứng với bất kỳ phiền não nào trong 6 phiền não căn bản và 20 tâm sở tùy phiền não thì nt là hữu phiền não.\nNếu nói là nghi thì UT nếu là nghi thì không nt là tâm sở sao? Bởi vì tâm tương ứng với nghi đó là tâm vương và là nghi.","34":"UT là nghi vừa có tâm sở và tâm vương sao?\nLấy tâm tương ứng với nghi hữu phiền não làm bđ.\nUT là tâm sở sao?\nBởi vì là phiền não.\nBởi vì là nghi hữu phiền não.\nBởi vì là hữu phiền não và là nghi.\nUT là nghi bởi vì là Liễu tri hoài nghi nhị biên. Không nói tự lực bởi vì đã công nhận nghi có tâm và tâm sở.\nHiển nhi bất định\nLiễu tri mà tự tướng mà đã trở thành xúc nhập cảnh của chính nó trình hiện rõ ràng nhưng\nkhông có khả năng dẫn đến khẳng định cái đó là tánh tướng của Hiển nhi bất định.\nPhân loại có 3 đó là Căn hiện tiền mà đã trở thành cái đó, Ý hiện tiền mà đã trở thành cái đó và\nTự chứng mà đã trở thành cái đó.\nHiển nhi bất định được nói trong Thích Lượng Luận: “Thức tham đắm vào tha nghĩa nên không có khả năng, không chấp trì vào\ntha nghĩa”. Nghĩa gồm có sắc thinh hương vân vân.\nTự tông giải thích văn bản trên như sau: Ý tri được dẫn sau nhĩ tri đó tham đắm vào âm thanh êm tai cho nên nhĩ tri đó chứng\nâm thanh êm tai nhưng nhãn tri (và các tri thức khác) không có khả năng chứng cảnh. Cảnh trình hiện trước nhãn tri (và các tri\nthức khác) nhưng khả năng chứng cảnh do duyên tham đắm dẫn từ ý thức làm cho khả năng chứng được màu xanh màu vàng\nvân vân của nhãn tri bị mất mặc dầu nhãn tri vẫn sinh. Nhãn tri đó là giác tri bất chứng cảnh.\nNgài Khedrup Rinpoche không đồng ý cách diễn giải ý nghĩa của trích dẫn trên. Ngài cho rằng thư tịch trên ý nói khi ý thức tham\nđắm vào âm thanh (chẳng hạn) thì năng lực của vô gián duyên năng sanh nhãn tri bị tiêu diệt vì thế nhãn tri không thể sinh.","35":"Không có Hiển nhi bất định du già hiện tiền bởi vì nếu là Du già hiện tiền thì nhất thiết chứng tự\ncảnh. Bởi vì trong Thích lượng luận có thuyết rằng: ‘đại tuệ chỉ thấy thôi, thì khẳng định tất cả\ntướng’.\nHNBĐ căn hiện tiền\nSự tướng của hiển nhi bất định căn hiện tiền:\nCăn hiện tiền chấp màu xanh dẫn đến nghi ngờ tôi không chắc đã thấy hay không thấy màu\nxanh.\nHNBĐ ý hiện tiền\nSự tướng của hiển nhi bất định ý hiện tiền:\nÝ hiện tiền chấp sắc trong dòng tương tục của phàm phu.\nHNBĐ tự chứng hiện tiền\nSự tướng của hiển nhi bất định tự chứng hiện tiền:\nTự chứng kinh nghiệm là tỷ lượng trong dòng tương tục của Thuận thế giả.\nThích lượng luận\nThích lượng luận có thuyết rằng: ‘đại tuệ từ thấy nên khẳng định tất cả tướng’.\nTập Lượng Luận Tự Thích\nTập Lượng Luận Tự Thích (Sư trưởng Trần Na) có nói: “Hiện tiền này đối với bất kỳ cảnh nào cũng không có khẳng định.” (lưu ý:\nchỉ có Phân biệt mới khẳng định cảnh và đam trước cảnh. Hiện tiền không khẳng định cảnh)\nMinh chiếu giải thoát đạo\nMinh chiếu giải thoát đạo do Ngài Rgyal Tsab Rinpoche biên soạn có dạy rằng: “Nếu chính nó không được chứng bởi Tự chứng\nhiện tiền thì chính nó không thể là lượng”.","36":"Bk – HNBĐ du già hiện tiền\nKhông có Hiển nhi bất định du già hiện tiền bởi vì nếu là Du già hiện tiền thì nhất thiết chứng tự cảnh. Bởi vì trong Thích lượng\nluận có thuyết rằng: ‘đại tuệ chỉ thấy thôi thì khẳng định tất cả tướng’.\n“Đại trí khi thấy thì đều khẳng định được tất cả hành tướng”\nThấy có nghĩa là trình hiện.\nỨng thành nếu là bất cứ gì trình hiện thì nhất thiết khẳng định cảnh sao? đý\nTại sao?\nBởi vì trong Thích lượng luận có thuyết rằng: ‘đại tuệ từ thấy nên khẳng định tất cả tướng’.\nLấy Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả làm biện đề.\nỨng thành không là hiện tiền sao? Tại sao?\nBởi vì khẳng định cảnh.\nLý do không thành lập.\nỨng thành là khẳng định cảnh bởi vì là Du già hiện tiền.\nỨng thành là nhất thiết bởi vì trong Thích lượng luận có thuyết rằng: ‘đại tuệ chỉ thấy thôi thì khẳng định tất cả tướng’.\nKhông nhất thiết.\nỨng thành là nhất thiết bởi vì trong Tập Lượng Luận Tự Thích (Sư trưởng Trần Na) có nói: “Hiện tiền này đối với bất kỳ cảnh\nnào cũng không có khẳng định.” (lưu ý: chỉ có Phân biệt mới khẳng định cảnh và đam trước cảnh. Hiện tiền không khẳng định\ncảnh)\nLấy du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả làm biện đề.\nỨng thành không có khẳng định cảnh sao? Đồng ý.\nỨng thành có khẳng định cảnh bởi vì trong Căn bản Thích lượng luận dạy rằng: ‘đại tuệ chỉ thấy thôi thì khẳng định tất cả\ntướng’\nỨng thành không có khẳng định cảnh bởi vì là hiện tiền.\nNếu nói khẳng định có nghĩa là chứng thì\nỨng thành nếu trình hiện trước nó thì nhất thiết nó phải chứng sao? đý\nLấy Nhất thiết chủng trí làm biện đề.\nỨng thành Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả chứng\nđược Nhất thiết chủng trí đó sao? Tại sao?\nBởi vì NTCT trình hiện trước Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát\nThánh giả.\nLấy du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả làm biện đề.","37":"Ứng thành không chứng được Nhất thiết chủng trí bởi vì NTCT chỉ là thọ dụng cảnh của Hiện tiền trong dòng tương tục của chư\nPhật thánh giả lẫn nhau.\nLấy du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả làm biện đề.\nỨng thành là giác tri hiển nhi bất định sao?\nTại sao?\nBởi vì hiển nhi bất định đối với Nhất thiết chủng trí.\nKhông nt\nỨng thành nếu là hiển nhi bất định đối với Nhất thiết chủng trí thì không nt là giác tri hiển nhi bất định sao? Đý\nỨng thành nếu là hiển nhi bất định đối với một pháp nào đó thì không nt là giác tri hiển nhi bất định sao? Đý\nLấy Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư làm bđ.\nỨng thành không là hiển nhi bất định sao?\nTại sao?\nBởi vì không hnbd đối vói tỷ lượng.\nLý do khg thành lập. Không nhất thiết.\nỨng thành nếu không là hiển nhi bất định đối với tỷ lượng thì không nhất thiết không là giác tri hiển nhi bất định sao?\nLấy Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư làm bđ.\nỨng thành là giác tri hiển nhi bất định và không là hiển nhi bất định đối với tỷ lượng sao?\nĐý\nỨng thành nếu hiển nhiên bất định đối với một pháp nào đó thì không nt là giác tri hiển nhi bất định sao?\nĐý\nLấy Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả làm bđ.\nỨng thành là giác tri hiển nhiên bất định sao?\nTại sao?\nBởi vì là hiển nhi bất định đối với Nhất thiết chủng trí.\nỨng thành là hiển nhi bất định đối với tỷ lượng sao?\nđý\nLấy tỷ lượng mà được kinh nghiệm bởi tự chứng hiện tiền kinh nghiệm Là tỷ lượng trong dòng tương tục của Thuận thế giả làm\nbđ.\nỨng thành không là lượng sao?\nTại sao?\nBởi vì không được chứng bởi Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư.\nKnt.\nỨng thành là nt bởi vì trong Minh chiếu giải thoát đạo do Ngài Rgyal Tsab Rinpoche biên soạn có dạy rằng: “Nếu chính nó\nkhông được chứng bởi Tự chứng hiện tiền thì chính nó không thể là lượng”.\nTại sao?\nỨng thành không là hiển nhi bất định đối với tỷ lượng sao?\nđý\nỨng thành không là giác tri hiển nhi bất định sao?\nTại sao?\nBởi vì chỉ hiển nhi bất định đối với Là tỷ lượng và không hiển nhi bất định đối với tỷ lượng.\nLấy Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư làm bđ.\nỨng thành không là giác tri hiển nhi bất định mà đã trở thành Tự chứng sao? đý\nỨng thành không phải như vậy bởi vì chưa nói ra sự tướng của Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền.\nLưu ý: Nếu là giác tri hiển nhi bất định thì nhất thiết không chứng bất kỳ cảnh nào. Nếu hiển nhi bất định đối với một cảnh nào\nđó thì không nt là giác tri hiển nhi bất định.","38":"Điên đảo tri\nLiễu tri sai loạn đối với xúc nhập cảnh của chính nó là tánh tướng của Điên đảo tri.\nPhân loại có 2 đó là Phân biệt điên đảo tri và Vô phân biệt điên đảo tri.\nPhân biệt điên đảo tri\nSự tướng của Phân biệt điên đảo tri: Phân biệt chấp trì sừng thỏ và Chấp ngã cá thể.\nVô phân biệt điên đảo tri\nSự tướng của Vô phân biệt điên đảo tri:\nCăn tri vô phân biệt điên đảo tri: Căn tri mà 1 mặt trăng trình hiện như là 2 mặt trăng và căn tri\nmà núi tuyết trình hiện như là núi xanh dương.\nÝ tri vô phân biệt điên đảo tri: Mộng tri mà màu xanh trình hiện rõ ràng.\nCó nhiều loại mộng tri:\n1. Mộng tri mà đó là phân biệt.\nĐa số các mộng tri trong dòng tương tục của phàm phu hạ liệt, trong mơ không tri nhận rõ ràng, mờ mờ ảo ảo,\nđều là Phân biệt.\nGhi nhớ: Trong mơ không có căn tri. Nếu là mộng tri thì nhất thiết là ý tri.\n2. Mộng tri mà đó là ý tri vô phân biệt điên đảo tri.\nHình, màu, âm thanh, hương, vị vân vân trình hiện rõ ràng trước mộng tri. Ví dụ: trong mơ thấy căn nhà rõ cũng\nnhư con mắt nhìn thấy lúc tỉnh.\n3. Mộng tri mà pháp xứ trình hiện trước nó.\nGồm có mộng tri thiện, mộng tri bất thiện và mộng tri vô ký.\nMộng tri thiện: Trong mơ thấy rõ ràng sư phụ, bổn tôn, chư Phật …","39":"Mộng tri bất thiện: Trong mơ thấy rõ ràng ăn cắp đồ …\nMộng tri vô ký: Trong mơ thấy rõ ràng ăn cơm…\nTrong mơ nếu thấy, nghe … không rõ ràng thì là phân biệt điên đảo tri.\nTrong mơ nếu thấy, nghe … rõ ràng thì là ý tri vô phân biệt điên đảo tri.\nTuy nhiên, nếu thấy rõ ràng thì nhất thiết là ý tri vô phân biệt điên đảo tri không? Cần nghiên tầm bởi vì một\nhành giả lúc không ngủ thiền quán chứng tánh không miên mật, đến lúc ngủ nằm mơ thấy chứng tánh không rõ\nràng. Vậy mộng tri này có phải là ý tri vô phân biệt điên đảo tri không? Chứng tánh không, chứng được cảnh rõ\nràng. Tương tự, ban ngày tư duy về tâm Bồ đề, đến lúc ngủ nằm mơ thấy rõ ràng chúng sanh đau khổ nên phát\nnguyện tu thành Phật vì lợi lạc chúng sanh. Vậy mộng tri đó có phải là ý tri vô phân biệt điên đảo tri không?\nCó loại mộng tri mà trong mơ ý tri tri nhận được đó là mơ, biết tôi đang ngủ, đang nằm mơ. Vào lúc mơ lại nghĩ đến\ntánh không, là giác tri chứng cảnh là thiện.\nCó 12 xứ: 6 xứ từ sắc xứ cho đến pháp xứ và 6 xứ từ nhãn xứ cho đến ý xứ.\n6 xứ từ nhãn xứ cho đến ý xứ gồm có:\nNhãn xứ: Nhãn căn.\nNhĩ xứ: Nhĩ căn.\nTỷ xứ: Tỷ căn.\nThiệt xứ: Thiệt căn.\nThân xứ: Thân căn\nÝ xứ: Tâm hay ý hay thức (tất cả đều đồng nghĩa với nhau)\n6 xứ từ sắc xứ cho đến pháp xứ gồm có: Sắc xứ, thanh xứ, hương xứ, vị xứ, xúc xứ và pháp xứ.\nPháp xứ: bất kỳ pháp thường hằng nào, bất tương ứng hành và tâm sở.\nNếu là trình hiện của Phân biệt thì nhất thiết là thường.\nNếu là thường thì nhất thiết là pháp xứ.\nNếu là trình hiện trước mộng tri hay trình hiện trước mộng tri mà đó là tri thức vô phân biệt thì nhất thiết là sắc mà\nđó đã trở thành pháp xứ.\nSự khác biệt giữa pháp xứ và sắc mà đó đã trở thành pháp xứ là musum. Nếu là sắc mà đó đã trở thành pháp xứ thì\nnhất thiết là pháp xứ.","40":"Bất cứ pháp nào không là một trong 11 xứ trước thì là pháp xứ. Bất cứ tâm Bồ đề nào thì đều là ý xứ. Huệ chứng tánh\nkhông là pháp xứ bởi vì huệ là tâm sở.\nBa loại giác tri\nThứ hai, giác tri được chia làm 3 loại bởi vì có Phân biệt lấy nghĩa tổng làm sở thủ cảnh,\nTri thức vô sai loạn vô phân biệt lấy tự tướng làm sở thủ cảnh và Sai loạn tri vô phân biệt lấy\nhữu vô minh hiện (không trộn với nghĩa tổng) làm sở thủ cảnh.\nNếu cái bình là sở thủ cảnh thì nt lấy tự tướng làm sở thủ cảnh bởi vì cái bình là tự tướng.\n(Phân biệt lấy nghĩa tổng làm sở thủ cảnh) Cái thứ nhất và Phân biệt là đồng nghĩa.\n(Tri thức vô sai loạn vô phân biệt lấy tự tướng làm sở thủ cảnh) Cái thứ hai và Hiện tiền là đồng nghĩa.\n(Sai loạn tri vô phân biệt lấy hữu vô minh hiện làm sở thủ cảnh) Cái thứ ba và Vô phân biệt điên đảo tri là đồng\nnghĩa.\nLượng Lý Trang Nghiêm Luận\nLượng Lý Trang Nghiêm Luận có nói: “phân biệt trong dòng tương tục của phàm phu không tinh thông ký hiệu cho nên lấy\nthanh hoặc nghĩa tổng làm cảnh nhưng không lấy cả hai làm cảnh.”\nĐại Thích Thích Lượng Luận\nĐại Thích Thích Lượng Luận do Khedrup R biên soạn có nói: “Do lực tu nên là tri thứa vô phân biệt mà tướng của cảnh trình\nhiện rõ ràng, tuy nhiên bởi vì sai loạn nên không là Du già hiện tiền.”\nBk – Phân biệt\nỨng thành nếu là phân biệt thì nt là Phân biệt lấy nghĩa tổng làm sở thủ cảnh sao?\nĐý\nLấy phân biệt chấp duy thanh tổng làm bđ.\nSgra’I chi kyang pa zin pai tog pa.\nỨng thành là Phân biệt lấy nghĩa tổng làm sở thủ cảnh sao? Tại sao?\nBởi vì là Phân biệt.\nLý do không thành lập.","41":"Ứng thành là phân biệt bởi vì trong Lượng Lý Trang Nghiêm Luận có nói: “phân biệt trong dòng tương tục của phàm phu không\ntinh thông ký hiệu cho nên lấy thanh hoặc nghĩa tổng làm cảnh nhưng không lấy cả hai làm cảnh.”\nTrong Đại Thích Thích Lượng Luận do Khedrup R biên soạn có nói: “Do lực tu nên là tri thứa vô phân biệt mà tướng của cảnh\ntrình hiện rõ ràng, tuy nhiên bởi vì sai loạn nên không là Du già hiện tiền.”\nHai loại giác tri\nThứ ba, giác tri có 2 loại bởi vì 2 loại Lượng và tri thức phi lượng, 2 loại phân biệt và tri\nthức vô phân biệt, 2 loại sai loạn tri và vô sai loạn tri, 2 loại ý tri và căn tri, 2 loại khiển nhập giác\nvà thành nhập giác, 2 loại tâm và tâm sở.\nNghĩa của mỗi loại:\nLượng và tri thức phi lượng\nLượng\nLiễu tri mới mẻ, không nhầm lẫn là tánh tướng của Lượng.\nPhân loại có 2 đó là Hiện lượng và Tỷ lượng.\nLượng được định số là hai bởi vì nếu nhiều hơn hai thì không cần thiết và nếu ít hơn hai thì\nkhông tính. Hơn nữa, tại sao định số này là định số bài xích đảo chấp, không là định số bài xích\nđệ tam loại? Bởi vì nếu là lượng thì khó mà an lập nó là bất kỳ 1 trong 2 lượng nào.\n(tại sao định số này là định số bài xích đảo chấp) Điều đầu tiên được thành lập bởi vì nói chung vì để bài xích\nnhiều đảo chấp của các tông luận giả như Thuận thế giả đối với số ấn định của lượng công nhận","42":"có một hiện lượng, Sarika công nhận có 11 lượng nên có nhiều Sự thế chánh nhân như ‘Bởi vì có\n2 sở lượng nên có 2 lượng’ v..v.. được nói bởi Chánh Lý Tự Tại (Pháp Xứng) và v..v.. bài xích triệt\nđể các đảo chấp đó để chứng minh định số có 2.\nMinh Giải Thâm Ý\nTrong Thích Lượng Minh Giải Thâm Ý do Panchen Sonam Dragpa biên soạn, phẩm thứ ba có nói:\n“Có người nói: ‘Lượng được định số là hai hiện và tỷ bởi vì sở lượng được định số là hai tự và tổng tướng.’ Không chấp nhận các\nan bài này bởi vì nếu xét điều đó thì có lỗi là Ứng thành sở lượng của hiện tiền nhất thiết là tự tướng và sở lượng của tỷ độ nhất\nthiết là tổng tướng. Theo tự tông lượng được định số là hai hiện lượng và tỷ lượng bởi vì hiện cảnh của lượng được định số là\nhai tự và tổng tướng.”\nTheo tự tông, lượng được định số là hai đó là hiện lượng và tỷ lượng bởi vì lượng có hai loại, hai loại này cũng không có đệ tam\nloại là cả hai và cũng không có đệ tam loại không là cả hai.”\nMinh Chiếu Giải Thoát Đạo\nTrong Thích Lượng Minh Chiếu Giải Thoát Đạo của Gyaltsab Rinpoche có nói: “Phần không nhầm lẫn nếu được khẳng định bởi\ntự lực thì là tự quyết định; phần không nhầm lẫn nếu được khẳng định bởi tha lực thì là tha quyết định.” (Ý nghĩa: tự chứng hiện\ntiền trải nghiệm chính nó (lượng) có thể dẫn đến quyết định chính nó là không nhầm lẫn thì là tự quyết định lượng, nếu không\nthể dẫn đến quyết định chính nó là không nhầm lẫn thì là tha quyết định lượng)\nCó đệ tam loại mà đó không là cả hai: nghĩa là khi bài phá cơ sở A thì không cần thành lập cở sở B (không có nghĩa là có một\nthứ không là cả hai)\nVd: Bình cột có đệ tam loại không là cả hai: Nếu bài phá cơ sở đó (cái bình) thì không nhất thiết thành lập cơ sở kia (cái cột).\nKhông có đệ tam loại mà đó không là cả hai: nghĩa là khi bài phá A thì thành lập B (không có nghĩa là không có một thứ không\nlà cả hai)\nVd: Nếu bài phá cái bình vô phần thì sẽ thành lập cái bình có phần.","43":"Nếu có đệ tam loại mà đó không là cả hai thì khi bài xích cái bình vô phần thì sẽ không thể nào thành lập cái bình có phần (hữu\nphần) nhưng sự thật là khi bài xích cái bình vô phần thì sẽ thành lập cái bình có phần vì thế cho nên gọi là không có đệ tam loại\nmà đó không là cả hai.\nLượng lại có 2 loại đó là Tự quyết định lượng và Tha quyết định lượng.\nTự quyết định lượng\nLiễu tri mới mẻ không nhầm lẫn, có thể tự lực dẫn xuất quyết định bản chất rốt ráo của sở\nlượng của chính nó, nếu không có trụ dựa vào đối cảnh của nó thì chính nó không có là tánh\ntướng của Tự quyết định lượng.\nTha quyết định lượng\nLiễu tri mới mẻ không nhầm lẫn, không thể tự lực dẫn xuất quyết định bản chất rốt ráo của\nsở lượng của chính nó mà cần dựa vào hậu sinh danh ngôn lượng khác để dẫn xuất quyết\nđịnh; nếu không có trụ dựa vào đối cảnh của nó thì chính nó không có là tánh tướng của Tha\nquyết định lượng.\nLượng lý trang nghiêm luận\nTrong Lượng lý trang nghiêm luận thuyết rằng: “Tự quyết định lượng nếu phân loại thì Thục tất nghĩa hiện lượng và Tỷ lượng\nđều cùng là Tự quyết định lượng; Kiến năng tác dụng hiện lượng và Tự chứng hiện lượng thì là bất kỳ lượng nào trong hai Tự\nquyết định lượng và Tha quyết định lượng.”","44":"Phân loại Tự quyết định lượng\nThứ nhất, phân loại của Tự quyết định lượng: Có 5 loại.\nThục tất nghĩa căn hiện lượng\nSự tướng Thục tất nghĩa căn hiện lượng: Căn hiện lượng chấp trì sắc của người cha của dòng\ntương tục của người con.\nKiến năng tác dụng căn hiện lượng\nSự tướng của Kiến năng tác dụng căn hiện lượng: Căn hiện lượng chấp trì lửa thấy nó có công\nnăng nấu và đốt cháy.\nTự chứng hiện lượng\nSự tướng của Tự chứng hiện lượng: Tự chứng hiện lượng kinh nghiệm lượng.\nDu già hiện lượng\nSự tướng của Du già hiện lượng: Bản trí hiện tiền chứng vô ngã của cá thể.\nTỷ lượng\nSự tướng của Tỷ lượng: Tỷ lượng chứng âm thanh vô thường.\nTương tự như thế, trong Lý Tạng cho rằng: ‘Hai loại nghĩa và hai tự chứng, cùng tỷ độ là tự\nquyết định.’","45":"Phân loại Tha quyết định lượng\nThứ hai, Tha quyết định lượng theo thanh thuyết được chia làm 3 loại:\nHiển hiện tự quyết định sự thực tha quyết định\n1. Hiển hiện tự quyết định sự thực tha quyết định:\nSự tướng: Căn hiện lượng chấp trì đơn thuần là màu đỏ từ xa, tâm phân biệt sanh nghi\nkhông biết phải là màu của lửa hay không, mặc dầu trên thực tế đó là màu đỏ của lửa.\nTổng tự quyết định sai biệt tha quyết định\n2. Tổng tự quyết định sai biệt tha quyết định:\nSự tướng: Căn hiện lượng chấp trì cây từ xa, do tâm phân biệt nên sanh nghi không biết\nphải là cây tùng hay không, mặc dầu trên thực tế đó là cây tùng.\nLiên hiển hiện dạ thị tha quyết định\n3. Liên hiển hiện dạ thị tha quyết định:\nSự tướng: Căn hiện lượng chấp trì màu xanh dẫn đến nghi ngờ không biết là có phải thấy\nmàu xanh hay không. (hiển nhi bất định)\nNgoài ra, hai tha quyết định lượng đầu tiên là lượng chân thật. Lượng cuối là lượng giả lập.","46":"Lượng Lý Trang Nghiêm Luận\nLượng Lý Trang Nghiêm Luận trang 31: “Hơn nữa, trước tiên dẫn đến định tri rồi sau đó sanh ra Nghi, không có\nlượng trực tiếp năng sanh nghi bởi vì tâm ngụy tạo bài phá việc làm của lượng, tương tự nghi cũng bài phá việc\nlàm của lượng.”\nTrang 32: “Tự quyết định lượng nếu phân loại thì Thục tất nghĩa căn hiện lượng và tỷ độ được liệt kê là tự quyết\nđịnh lượng, Kiến năng tác dụng căn hiện lượng và tự chứng hiện tiền thì là tồn hữu trong bất cứ tự quyết định và\ntha quyết định nào.”\nTha quyết định lượng theo thanh thuyết lại được chia 3:\nHiện tiền đệ nhất thứ\nSự tướng: Căn hiện lượng chấp trì màu của hoa Utpala trong dòng tâm thức của\nngười chưa từng thấy hoa Utpala.\nÝ mạt tưởng\nSự tướng Căn hiện lượng chấp trì âm thanh trong dòng tâm thức của người tâm\nđang say đắm nét đẹp của sắc.\nHữu sai nhân\nSự tướng Căn hiện tiền chấp trì màu của ảo ảnh, trực tiếp sanh tâm ngụy tạo chấp\ncho ảo ảnh đó là nước.\nTrong Lý Tạng thuyết rằng: ‘Đệ nhất thứ và ý mạt tưởng, cùng hữu sai nhân là tha quyết\nđịnh.’","47":"Thích Lượng Minh Chiếu Giải Thoát Đạo\nNgài Gyaltsab Rinpoche trong Thích Lượng Minh Chiếu Giải Thoát Đạo có nói rằng: ‘Về phần không nhầm lẫn, nếu được khẳng định bởi\ntự lực thì nhất thiết là Tự-QĐ, nếu được khẳng định bởi tha lực thì nhất thiết là Tha QĐ’.\nTri thức phi lượng\nLiễu tri không là mới mẻ và không nhầm lẫn là tánh tướng của Tri thức phi lượng.\nPhân loại: có 5 giác tri sau cùng (tái quyết tri, tứ sát tri, hiển nhi bất định, nghi và điên đảo tri).\nPhân biệt và tri thức vô phân biệt\nPhân biệt\nĐam trước tri chấp trì thích hợp trộn lẫn nghĩa tổng hay thanh tổng là tánh tướng của Phân\nbiệt.\nPhân biệt đồng nghĩa với Khiển nhập giác.\nSự tướng: Tỷ độ, tứ sát tri, nghi và một phần của tái quyết tri và điên đảo thì có phân biệt.\nTri thức vô phân biệt\nLiễu tri ly đam trước tri chấp trì thích hợp trộn lẫn nghĩa tổng hay thanh tổng là tánh tướng\ncủa Tri thức vô phân biệt.\nĐồng nghĩa với Thành nhập giác.","48":"Sự tướng: Hiện tiền, hiển nhi bất định và một phần của tái quyết tri và điên đảo tri có vô phân\nbiệt.\nSai loạn tri và vô sai loạn tri\nSai loạn tri\nLiễu tri sai loạn đối với hiện cảnh của chính nó là tánh tướng của Sai loạn tri.\nSự tướng: Điên đảo tri và tất cả phân biệt.\nVô sai loạn tri\nLiễu tri không sai loạn đối với hiện cảnh của chính nó là tánh tướng của Vô sai loạn tri.\nVô sai loạn tri đồng nghĩa với hiện tiền. Đó là theo phương diện Kinh Bộ Tông, không giống như\nDuy thức tông bởi vì DTT cho rằng hiện tiền gồm có sai loạn tri và vô sai loạn tri.\nThích Lượng Luận Minh Giải Thâm Ý\nTrong Thích Lượng Luận Minh Giải Thâm Ý do Ngài Panchen biên soạn: “’Nghĩa tổng của at vô thường trình hiện như là âm\nthanh vô thường nhưng âm thanh vô thường không trình hiện như là nghĩa tổng của âm thanh vô thường’ Không đồng ý phát\nbiểu đó bởi vì hai điều đó trình hiện như là một.”\nNếu cái bình trình hiện như là một với nghĩa tổng của cái bình thì nt cái bình trình hiện như là nghĩa tổng của cái bình và nghĩa\ntổng của cái bình trình hiện như là cái bình.","49":"Ý tri và căn tri\nÝ tri\nLiễu tri sanh dựa vào tăng thượng duyên bất cộng của chính nó là ý căn là tánh tướng của Ý\ntri.\nÝ và ý tri là mushi.\n1. Nếu là ý thì không nhất thiết là ý tri vì nhãn thức là ý nhưng không là ý tri.\n2. Nếu là ý tri thì không nhất thiết là ý vì cảm thọ tùy hành của ý thức là ý tri, nhưng\nkhông là ý vì nó không là tâm mà là tâm sở.\n3. Vừa là ý vừa là ý tri thí dụ ý thức.\n4. Không là cả hai thí dụ tâm sở tùy hành của căn thức không là ý vì là tâm sở, không là\ný tri vì là căn tri.\nTương tự, nên biết sự khác biệt giữa Phân biệt chấp trì cái bình và Phân biệt chứng cái\nbình là mushi, giữa Hiện tiền đối với pháp đó và Hiện lượng đối với pháp đó là mushi,\ngiữa Tỷ lượng đối với pháp đó và Phân biệt đối với pháp đó là mushi, giữa Chứng từ\nnhân của cái đó và Chứng bởi nhân của cái đó, giữa Chứng cảnh do hiện tiền và Chứng\ncảnh hiện tiền, bởi vì chính ngài Panchen đã dạy rằng (trong Minh giải thâm mật, phẩm\nthứ 3): ‘Nên quan tâm đến các đối tự này.’","50":"Căn tri\nLiễu tri sanh dựa vào tăng thượng duyên bất cộng của chính nó là hữu sắc căn là tánh\ntướng của căn tri.\nPhân loại có 5: Nhãn tri, nhĩ tri, tỷ tri, thiệt tri và thân tri.\nBk – PB chấp trì và chứng\n1.   Sự khác biệt giữa Phân biệt chấp trì cái bình và Phân biệt chứng cái bình là mushi.\n●     Nếu là phân biệt chấp trì cái bình không nhất thiết là phân biệt chứng cái bình.\nThí dụ: Tứ sát tri nghĩ đến cái bình.\n●     Nếu là Phân biệt chứng cái bình không nhất thiết là Phân biệt chấp trì cái bình.\nThí dụ: Phân biệt chứng cái bình và nghĩa tổng của cái bình không là Phân biệt chấp trì cái bình bởi vì nếu là\nPhân biệt chấp trì cái bình thì nhất thiết là lấy nghĩa tổng của cái bình làm hiện cảnh của nó, không chứng\nnghĩa tổng của cái bình.\n●     Vừa là cả hai: Phân biệt chấp trì cái bình được dẫn xuất sau nhãn tri chấp trì cái bình.\n●     Vừa không là cả hai: cái cột.\nÝ nghĩa của Phân biệt chấp trì cái bình: Phân biệt sai loạn đối với nghĩa tổng của cái bình thông qua lấy nghĩa\ntổng của cái bình làm hiện cảnh. Cho nên nếu lấy nghĩa tổng của cái bình làm hiện cảnh thì không nhất thiết\nlà Phân biệt chấp trì cái bình bởi vì lấy Phân biệt chứng cái bình và nghĩa tổng của cái bình làm bđ. Phân biệt\nnày lấy nghĩa tổng của cái bình làm hiện cảnh nhưng không là Phân biệt chấp trì cái bình.\nTrong Thích Lượng Luận Minh Giải Thâm Ý có nói: “Không gian vô vi thực vô là hiện cảnh của Tỷ độ chứng không gian\nvô vi thực vô”\nChấp khác Chứng.\n-    Nếu là Phân biệt chấp trì cái bình thì không nhất thiết là Phân biệt chứng cái bình.\nLấy Tứ sát tri chú ý cái bình làm biện đề. Tứ sát tri chú ý cái bình là phân biệt chấp trì cái bình nhưng không chứng\n(được) cái bình, cho nên nó không là Phân biệt chứng cái bình\n-    Nếu là Phân biệt chứng cái bình thì không nhất thiết là Phân biệt chấp trì cái bình.","51":"Lấy Phân biệt chứng cái bình và Nghĩa tổng của cái bình làm biện đề. Phân biệt chứng cái bình và Nghĩa tổng của cái\nbình không là Phân biệt chấp trì cái bình bởi vì nếu là Phân biệt chấp trì cái bình thì nhất thiết là lấy Nghĩa tổng của cái\nbình làm hiện cảnh của nó, nghĩa là phải chứng nghĩa tổng của cái bình. Nghĩa là, tâm phân biệt chấp trì cái bình thì sai\nloạn với nghĩa tổng của cái bình, vì cho nghĩa tổng của cái bình là cái bình. Nhưng Phân biệt chứng cái bình và chứng\nluôn nghĩa tổng của cái bình thì không phải là phân biệt chấp trì cái bình mà là Phân biệt chứng cái bình vì nó chứng\nđược cả cái bình và Nghĩa tổng của cái bình.\n-    Vừa là cả hai:\nLấy Tâm phân biệt chấp trì cái bình được dẫn xuất sau nhãn tri chấp trì cái bình làm biện đề. Đầu tiên nhãn tri chấp trì\ncái bình. Sau đó tâm phân biệt nhớ lại cái bình. Tâm phân biệt này là Niệm tri (tâm nhớ lại cái bình ) vừa là cả hai, vừa\nlà Phân biệt chấp trì cái bình, vừa là Phân biệt chứng cái bình.\n-    Vừa không là cả hai:\nLấy Cái cột làm biện đề.\nChú ý: Khi nói tới Tâm phân biệt chấp trì cái bình tức là tâm phân biệt lấy Nghĩa tổng của cái bình làm hiện cảnh của chính nó.\n2. Sự khác biệt giữa Hiện tiền đối với pháp đó và Hiện lượng đối với pháp đó là mushi.\nDễ chứng minh.\no    Nếu là Hiện tiền đối với Pháp đó thì không nhất thiết là Hiện lượng đối với Pháp đó.\nLấy Nhãn tri chấp trì Cái bình làm biện đề. Nhãn tri chấp tri Cái bình là Hiện tiền đối với Cái bình vô thường, vì Cái bình\nvô thường hiện trước nhãn tri chấp trì cái bình. Nhưng Nhãn tri chấp trì cái bình thì không chứng được cái bình vô\nthường nên nó không là Hiện lượng đối với Cái bình vô thường.\no Nếu là Hiện lượng đối với Pháp đó thì không nhất thiết là Hiện tiền đối với Pháp đó.\nLấy Nhãn tri chấp trì Cái bình làm biện đề, nó là Hiện lượng đối với Pháp ‘không có đồng vị của vừa là cái bình vừa\nkhông là cái bình’. Nhưng Nhãn tri chấp trì cái bình không là Hiện tiền đối với Pháp đó i.e không là Hiện tiền đối với\nPháp ‘không có đồng vị của vừa là cái bình vừa ko là cái bình’, bởi vì Nhãn tri chấp trì cái bình chỉ chứng gián tiếp\n‘không có đồng vị của vừa là cái bình vừa không là cái bình’, không phải là trực chứng.\no Vừa là cả hai:\nLấy Nhãn tri chấp trì cái bình là Hiện tiền đối với Cái bình và cũng là Hiện lượng đối với Cái bình làm biện đề\no    Vừa không là cả hai: Nhãn tri sát na thứ hai chấp trì cái bình không là hiện tiền đối với ‘không có đồng vị của\nvừa là cái bình vừa ko là cái bình’ bởi vì không trình hiện, không là hiện lượng bởi vì là tái quyết tri.\nLấy Sừng thỏ làm biện đề\n3.   Sự khác biệt giữa Tỷ lượng đối với pháp đó và Phân biệt đối với pháp đó là mushi.\n●    Nếu là Tỷ lượng đối với pháp đó không nhất thiết là Phân biệt đối với pháp đó.\nThí dụ: Tỷ lượng chứng âm thanh vô thường là Tỷ lượng đối với âm thanh không thường, không là Phân biệt\nđối với âm thanh không thường.\nNếu là Phân biệt đối với âm thanh không thường nhất thiết hành tướng của âm thanh không thường trình\nhiện trước nó. Hành tướng của âm thanh không thường không trình hiện trước Tỷ độ chứng âm thanh vô\nthường. Bởi vì Tỷ độ chứng âm thanh vô thường không trực chứng âm thanh không thường mà chỉ gián tiếp\nchứng.","52":"●      Nếu là Phân biệt đối với pháp đó thì không nhất thiết là Tỷ lượng đối với pháp đó.\nThí dụ: Tỷ độ ở sát na thứ hai chứng âm thanh vô thường/ Phân biệt chấp trì cái bình.\n●      Vừa là cả 2: Tỷ lượng chứng âm thanh vô thường.\n●      Không là cả 2: Tỷ độ sát na thứ hai chứng cái bình vô thường/ cái bình không thường\n-    Nếu là Tỷ lượng đối với Pháp đó thì không nhất thiết là Phân biệt đối với Pháp đó.\nLấy Tỷ độ chứng Âm thanh vô thường làm biện đề. Nó là Tỷ lượng đối với Âm thanh không thường, (Pháp đó là Âm\nthanh không thường) bởi vì nó mới chứng với Âm thanh không thường. Nhưng Tỷ độ chứng Âm thanh vô thường\nkhông là Phân biệt đối với Âm thanh không thường, bởi vì Âm thanh không thường không trình hiện trước Tỷ độ\nchứng Âm thanh vô thường, Tỷ độ chứng Âm thanh vô thường chỉ gián tiếp chứng với Âm thanh không thường thôi.\nNếu nó là Phân biệt đối với Âm thanh không thường thì Âm thanh không thường phải trình hiện trước nó, khi trình\nhiện trước nó như vậy thì sẽ trực tiếp chứng nhưng trực tiếp chứng không có\n-    Nếu là Phân biệt đối với Pháp đó thì không nhất thiết là Tỷ lượng đối với Pháp đó.\nLấy Niệm tri nhớ đến Cái bình ngay sau khi Nhãn tri chấp trì cái bình làm biện đề i.e Niệm tri nhớ về Cái bình được dẫn\nxuất sau khi Nhãn tri chấp trì cái bình. Niệm tri nhớ về Cái bình được dẫn xuất bởi Nhãn tri chấp trì cái bình là tâm\nphân biệt đối với cái bình. Nhưng nó không là Tỷ lượng đối với cái bình, vì nó không dựa vào chánh nhân để chứng cái\nbình, mà ở đây chỉ nhớ lại không cần chánh nhân. (muốn là Tỷ lượng thì cần phải có chánh nhân để chứng).\n-    Vừa là cả hai:\nLấy Tỷ lượng chứng Âm thanh vô thường làm biện đề.\n-    Vừa không là cả hai:\nLấy Nhãn tri chấp trì cái bình làm biện đề. Nó là Hiện tiền (đối với Cái bình) không là Phân biệt đối với cái bình, cũng\nkhông là Tỷ lượng đối với pháp đó là cái bình.\n4.   Sự khác biệt giữa chứng từ nhân của cái đó và chứng bằng (bới) nhân của cái đó.\nLấy trên cục đường mía trong miệng làm biện đề.\nTại sao có năng lực của vị đường mía trước đó sanh ra sắc của đường mía hiện tại?\nBởi vì có vị của đường mía hiện tại.\nVị của đường mía hiện tại là Tỷ độ nhân pháp quả chánh nhân.\nCăn cứ vào 1 nhân 2 tỷ độ sanh:\n1.     Tỷ độ chứng trên cục đường mía trong miệng có năng lực của vị đường mía trước đó sanh ra sắc của\nđường mía hiện tại.\n2.     Tỷ độ chứng sắc của đường mía.","53":"●   Nếu chứng từ nhân của cái đó không nhất thiết chứng bởi nhân của cái đó.\nTỷ độ chứng sắc của đường mía chứng sắc của đường mía từ nhân đó là vị của đường mía hiện tại, không\nchứng bởi nhân đó là vị của đường mía hiện tại.\nBởi vì nếu được chứng bởi nhân của cái đó thì khi an bày vị của đường mía hiện tại là nhân thì sở lập pháp\nsẽ là sắc của đường mía hiện tại cho nên nhân đó sẽ không là chánh nhân.\n●   Nếu được chứng bởi nhân của sự chứng minh đó nhất thiết chứng từ nhân của sự chứng minh đó.\n-    Nếu là Chứng bởi Nhân của cái đó thì nhất thiết là Chứng từ Nhân của cái đó.\n-    Nếu là Chứng từ Nhân của cái đó thì không nhất thiết là Chứng bởi Nhân của cái đó.\nLấy trên cục đường mía trong miệng làm biện đề. Tại sao có năng lực của vị đường mía trước đó sanh ra sắc của\nđường mía hiện tại? Bởi vì có vị của đường mía hiện tại.\nSắc của đường mía hiện tại, sắc ở đây có nghĩa là hình dáng của cục đường mía. Ta bỏ cục đường mía trong miệng,\nngậm, thì thấy ngọt. Lấy lưỡi đụng hay đẩy vào cục đường mía thì ta biết hình dáng của cục đường mía. Như vậy ta\nbiết được vị của cục đường mía hiện tại (ngọt), và biết được hình dáng của cục đường mía khi dùng lưỡi đẩy qua lại.\nCăn cứ vào lý do chánh đáng (chánh nhân) là vị của đường mía hiện tại, có nghĩa là Căn cứ vào 1 nhân 2 tỷ độ sanh i.e\nCăn cứ vào Vị của đường mía hiện tại sinh ra 2 sự chứng đắc khác nhau:\n1.   Tỷ độ chứng trên cục đường mía trong miệng có năng lực của vị đường mía trước đó sanh ra sắc của đường mía\nhiện tại.\n2.   Tỷ độ chứng sắc của đường mía.\nTỷ độ chứng sắc của đường mía chứng sắc của đường mía từ nhân đó là vị của đường mía hiện tại, không chứng bởi nhân đó là\nvị của đường mía hiện tại.\n-    Vừa là cả hai - Nếu là Chứng từ Nhân của cái đó thì không nhất thiết không là Chứng bởi Nhân của cái đó.\nTỷ độ chứng trên cục đường mía trong miệng có năng lực của vị đường mía trước đó sanh ra sắc của đường mía hiện\ntại.\n-    Vừa không là cả hai - Nếu không là Chứng từ Nhân của cái đó thì không nhất thiết là Chứng bởi Nhân của cái đó.\n5.   Sự khác biệt giữa Chứng cảnh bằng hiện tiền và hiện tiền chứng cảnh.\n●   Nếu Chứng cảnh bằng hiện tiền nhất thiết hiện tiền chứng cảnh.\n●   Nếu hiện tiền chứng cảnh không nhất thiết chứng cảnh bằng hiện tiền.\nThí dụ: Nhãn tri chấp trì cái bình hiện tiền chứng không có đồng vị của vừa là cái bình và vừa không có cái\nbình nhưng không chứng bằng hiện tiền. Bởi vì nhãn tri chấp trì cái bình gián tiếp chứng không có đồng vị\ncủa vừa là cái bình và vừa không có cái bình. Nếu nhãn tri chấp trì cái bình chứng bằng hiện tiền thì không\ncó đồng vị của vừa là cái bình và vừa không có cái bình cần phải trình hiện trước nó.","54":"Nhãn tri chấp trì cái bình chứng hiện tiền không có đồng vị của vừa là cái bình và vừa không có cái bình\nnhưng không chứng bằng hiện tiền. Hiện tiện chứng bởi vì chứng không nhờ vào chánh lý. Không chứng do\nhiện tiền bởi vì nếu chứng do hiện tiền thì nhất thiết hành tướng của cảnh phải trình hiện trước nó.\nKhiển nhập giác và thành nhập giác\nLiễu tri nhập vào tự cảnh bởi lực ký hiệu là tánh tướng của khiển nhập giác.\nĐồng nghĩa với phân biệt.\nLiễu tri nhập vào tự cảnh bởi lực thực hữu là tánh tướng của thành nhập giác.\nĐồng nghĩa với tri thức vô phân biệt.\nThích Lượng Luận Minh Giải Thâm ý\nTrong Thích Lượng Luận Minh Giải Thâm ý của Panchen Sonam Dragpa: ‘Nếu là tri thức thì nhất thiết có hiện cảnh và sở thủ\ncảnh của chính nó nhưng nếu là hiện cảnh và sở thủ cảnh của tri thức đi thì không cần phải có.’\nTrong Thích Lượng Luận Minh Giải Thâm ý của Panchen Sonam Dragpa: ‘Có người nói: ‘Căn tri mà một mặt trăng trình hiện\nnhư là hai mặt trăng trước nó thành nhập vào một mặt trăng.’ Không đồng ý bởi vì một mặt trăng không trình hiện trước nó.’\nGương soi sáng trí tuệ\nTrong Gương soi sáng trí tuệ của tu viện Drepung: ‘Ngoài trừ tóc rơi trình hiện vân vân, các tri thức có hiện cảnh.’\nDiệu Thuyết Tạng\nTrong Diệu Thuyết Tạng của Tsong Khapa: ‘Tri thức mà một mặt trăng trình hiện là hai mặt trăng cũng cần phải dựa vào sở\nduyên duyên một mặt trăng để sanh ra, do đó không sanh mà không có sở duyên của bên ngoài.’","55":"Tâm và tâm sở\nTương ứng với tâm sở mà tâm sở đó hiện hữu như là tùy hành của chính nó là tánh tướng\ncủa (chính nó) Tâm.\nTâm (tâm vương), ý, thức đều đồng nghĩa.\nCó 6 tâm: nhãn thức, nhĩ thức, tỷ thức, thiệt thức, thân thức và ý thức.\nTương ứng với tâm mà tâm đó có chính nó như là tùy hành là tánh tướng của (chính nó) Tâm sở.\nÝ căn đồng nghĩa với ý. Tăng thượng duyên bất cộng của Niệm tri nhớ lại cái bình được dẫn xuất bởi nhãn thức chấp trì cái bình\nlà Ý căn mà đó là nhãn thức cuối cùng chấp trì cái bình.\nThế nào gọi là tương ứng? Thí dụ: Nhãn thức và cảm thọ đi chung với nó (cảm thọ là tùy hành\ncủa nó).\nNăm tướng tương ứng\n1. Sở duyên tương ứng: Cùng một sở duyên.\n2. Hành tướng tương ứng: Cùng một chấp thức nên hành tướng tương ứng.\n3. Thời tương ứng: Cùng một thời gian.\n4. Sở y tương ứng: Cùng một tăng thượng duyên bất cộng.\n5. Chất tương ứng: Mỗi cảm thọ đồng hành của mỗi chất của nhãn thức đều có duy\nmỗi chất nên chất tương ứng.","56":"51 tâm sở\nTâm sở chia ra 6 phần tổng cộng 51:\n1. Ngũ biến hành: Thọ, tưởng, tư, tác ý và xúc.\n2. Ngũ biệt cảnh: Dục, thắng giải, niệm, định, huệ.\n3. Thập nhất thiện: Tín, tàm (tự biết xấu hổ), quý (hổ thẹn với người), vô tham, vô oán, vô\nsi, tinh tấn, khinh an, bất phóng dật, hành xả, bất hại.\n4. Lục phiền não căn bản: Tham, sân, mạn, vô minh hữu phiền não, nghi hữu phiền não,\nkiến hữu phiền não.\nKiến có 5: Hoại kiến, Biên kiến, Tà kiến, Kiến thủ kiến, Giới thủ kiến.\n5. Hai mươi tâm sở tùy phiền não:\nPhẫn, hận, phú (che dấu), não (bứt rứt), tật (ganh tỵ), xan (bỏn xẻn), cuống (lừa\ndối), xiểm (nịnh, quỷ kế đa đoan), kiêu, hại, vô tàm, vô quý, trạo cử, mơ màng, bất tín,\nlười biếng, phóng dật, thất niệm, bất chánh tri, tán loạn.","57":"6. Bốn tâm sở bất định: Ngủ, hối, từ, tầm.\nNguyện cho các Bậc Thầy kính yêu phúc thọ an khang,\nNguyện cho cơn mưa to Mật pháp tối thượng thấm nhuần khắp mọi nơi,\nNguyện cho mật nhũ Kim Cang Thừa xuôi dòng Cửu Long đến tận quê hương con,\nNguyện cho giáo pháp diệu thâm của Đức Thích Ca chiếu sáng đời đời.\nAni Tenzin Palyon Pháp Đăng tạm dịch ngày 18 tháng 8 năm 2017 tại Dharamsala. Hiệu đính lần thứ nhất\n10/1/2026 ở Park Legend, P. Tân Sơn Hòa, Saigon. Hiệu đính lần thứ nhì 4/9/2026 ở Aria resort, Vũng Tàu.\nHồi hướng tất cả thiện căn cho Gen Loyang và các bậc giáo thọ được vĩnh khang và trường thọ."},"lectures":[{"id":"TLH20260410","title":"Bài giảng – Phân loại Hiện tiền (04/10/2026)","text":"<PARSED TEXT FOR PAGE: 1 / 23>\n                                 TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n\n\n                                                                                                                 Bài 03\n\n                                                                PHÂN LOẠI CỦA HIỆN TIỀN\n\n                                                                                              Ngày 04 tháng 10 năm 2026\n\n                                                     Giảng sư: Geshe Lharampa Lobsang Ngodrup\n                                                                  Việt dịch: Ani Tenzin Palyon Pháp Đăng\n\n\n\n[Tuần trước lớp mình đã học về Tánh tướng của Hiện tiền, bàn về ý nghĩa của Ly phân\nbiệt, bàn về không sai loạn, biện kinh về Tâm hiện tiền, Tâm phân biệt. Bây giờ mình\nhọc tiếp]\n\n\n1. Thuyết về Hiện tiền\n1.1. Tánh tướng của Hiện tiền\n              Liễu tri ly phân biệt và không sai loạn là tánh tướng của Hiện tiền.\n              རྟོག་པ་དང་བྲལ་ཞིང་༼ར ངང་གི་ངང་ལལ་ལ་་་ཁྲུལལ་འཁྲིུ་ངིག་པ ་་ཁྲུལལ་འཁྲིུ་ངིག་པ་་ངྟོན་སུ་་གི་་ཚན་ཉིད།\n                                                                                      (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Tánh tướng của Hiện tiền: ‘Liễu tri ly phân biệt và không sai loạn’.\n          ○ Chữ ‘Liễu tri’: là danh từ, không phải động từ.\n          ○ Hiện tiền: nghĩa là liễu tri dạng ly phân biệt và không sai loạn.\n       Mình học tánh tướng của Giác tri và Tri thức. Tánh tướng của Giác tri là Liễu\n       tri. Phải nhớ chữ ‘Liễu tri’ này hiện tại/bây giờ là danh từ, không phải là động\n       từ; giống như Giác tri/Tri thức, bây giờ nó tên là Liễu tri, cũng là Giác tri.\n   -   Tánh tướng của Hiện tiền gồm có hai vế: Ly phân biệt và Không sai loạn.\n\n\nPhần ‘Ly phân biệt’ đã bàn cãi rồi, giờ [bàn luận] tới phần ‘Không sai loạn’.\n1.1.2. Vế thứ hai: Không sai loạn\ni. Nói ‘Liễu tri không sai loạn’ là tánh tướng của Hiện tiền cũng được\n   -   Nói ‘Liễu tri không sai loạn’ là tánh tướng của Hiện tiền cũng vẫn được, tại vì\n       giữa nó [Liễu tri không sai loạn] và Hiện tiền mối quan hệ Tánh tướng và Sở\n\n                                              © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 2 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n       tướng được thành lập và tám ngã nhất thiết được khẳng định, không thể tìm ra\n       ngả [nhất thiết] nào không nhất thiết.\n   -   Không cần để/Bỏ ‘Ly phân biệt’ ra [khỏi tánh tướng của Hiện tiền] cũng không\n       sao, không có nó cũng không ảnh hưởng gì, ‘Liễu tri không sai loạn’ vẫn [thoả]\n       là tánh tướng của hiện tiền.\n   ➢ Nếu là Hiện tiền [thì] nhất thiết là ‘Không sai loạn’, Nếu là ‘Không sai loạn’\n     [thì] nhất thiết là Hiện tiền => Tám ngả nhất thiết được khẳng định.\nii. Tại sao chư Tổ/Tự tông lại để thêm ‘Ly phân biệt’ vào tánh tướng của Hiện tiền\n              Chư Tổ/Tự tông để thêm ‘Ly phân biệt’ vào tánh tướng của Hiện tiền để\n       làm gì?\n             Là để bài phá đảo chấp của những người đưa ra lập luận như thế này: Có\n       trường phái ngoại đạo cho rằng Hiện tiền cũng là Phân biệt.\n   -   Đầu tiên, phải biết Hiện tiền là dạng gì.\n          ○ Hiện tiền là hiện tiền trước mặt: mắt thấy, tai nghe, lưỡi nếm, thân chạm\n            => đó là Hiện tiền.\n              Ví dụ:\n                 ○ Nhãn tri chấp trì cái bình: trước mặt mình có cái bình, con mắt mình\n                   nhìn thẳng vào cái bình; Hoặc Lỗ tai mình nghe âm thanh: nhĩ tri\n                   nghe âm thanh trực tiếp => đó là Hiện tiền;\n                 ○ Mắt thấy, tai nghe, lưỡi nếm, thân xúc chạm: những cái đó là Hiện\n                   tiền;\n                 ○ Mình ngồi suy nghĩ trong đầu, nhớ đến cái bình hoặc ngồi nghĩ đến\n                   âm thanh: đó là Phân biệt, không phải Hiện tiền.\n   -   Có ngoại đạo cho rằng: chẳng hạn khi Nhãn tri chấp trì màu xanh, nhìn thấy màu\n       xanh thì nó nghĩ: “Ồ, đây là màu xanh”, vì vậy, họ cho rằng nhãn tri chấp trì màu\n       xanh cũng là Phân biệt.\n   -   Tự tông nói không phải [phân biệt], Nhãn tri chấp trì màu xanh là Hiện tiền, ly\n       phân biệt, hoàn toàn không có suy nghĩ gì hết.\n   ➢ Cho nên, Tự tông phải để chữ ‘ly phân biệt’ vào [tánh tướng của Hiện tiền] không\n     phải vì mục đích để tám ngả nhất thiết được khẳng định, mối quan hệ giữa sở\n     tướng và tánh tướng được thành lập, mà mục đích là để bài phá đảo chấp/ngăn\n     chặn đảo chấp/ngăn chặn quan điểm của ngoại đạo cho rằng Hiện tiền là\n     phân biệt.\nSự tướng của Hiện tiền: Nhĩ tri chấp trì âm thanh; Nhãn tri chấp trì sắc….\n      Cô nói chữ “Tâm” [trong từ Tâm hiện tiền] để mọi người đừng nghe lộn thôi;\nKhông nên để chữ “Tâm” vào [Hiện tiền] bởi vì bản thân Hiện tiền đã là Giác tri, nếu\nthêm chữ “Tâm” vào dễ nhầm lẫn với Tâm vương và Tâm sở.\n\n\n                               © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 3 / 23>\n                                     TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n\n\n1.2. Tánh tướng của Hiện lượng\n                Liễu tri ly phân biệt và không sai loạn, mới mẻ, không nhầm lẫn là tánh\n         tướng của Hiện lượng.\n                རྟོག་པ་དང་བྲལ་ཞིང་་་ཁྲུལལ་འཁྲིུ་གསུང་དུ་་ི་སླུའ་འཁྲིུ་ངིག་པ་་ངྟོན་སུ་་གི་ཚད་་ཁྲིུ་་ཚན་ཉིད།\n                                                                                             (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   1. Tánh tướng của Lượng: ‘Liễu tri mới mẻ và không nhầm lẫn.’ (đã học về Lượng\n      trong môn Nhiếp loại học).\n   2. Hiện lượng: chỉ ráp thêm phần ‘mới mẻ, không nhầm lẫn’ vào tánh tướng của\n      Hiện tiền [là ra tánh tướng của Hiện lượng].\n            ➢ Tánh tướng của Hiện lượng: ‘Liễu tri ly phân biệt và không sai loạn, mới\n              mẻ, không nhầm lẫn’.\nVí dụ:\n   -     Nhãn tri chấp trì cái bình ở sát na thứ nhất: là Hiện lượng, bởi vì nó mới mẻ, là\n         lần đầu tiên [sát na thứ nhất].\n   -     Nhãn tri chấp trì cái bình ở sát na thứ hai; không phải là Hiện lượng, vì đã sang\n         sát na thứ hai, không còn mới mẻ nữa.\n\n\nBiện kinh 01: Sự khác biệt giữa Hiện lượng và Hiện tiền là musum\nNếu là Hiện lượng thì nhất thiết là Hiện tiền.\nNếu là Hiện tiền thì không nhất thiết là Hiện lượng.\nKhả năng 1: Nếu là Hiện tiền thì không nhất thiết là Hiện lượng\nLấy nhãn tri chấp trì cái bình ở sát na thứ nhì làm biện đề.\n   -     Nó là Hiện tiền nhưng không phải là Hiện lượng: bởi vì Nhãn tri chấp trì cái bình\n         ở sát na thứ nhì không là mới mẻ, nên không thỏa tánh tướng của Hiện lượng.\n   -     Tánh tướng của Hiện lượng: ‘Liễu tri ly phân biệt và không sai loạn, mới mẻ,\n         không nhầm lẫn.’\nKhả năng 2 (vừa là cả hai): Nếu là Hiện lượng thì không nhất thiết không là Hiện\ntiền\nLấy Nhãn tri chấp trì cái bình ở sát na thứ nhất làm biện đề.\nKhả năng 3 (không là cả hai): Nếu không là Hiện lượng thì không nhất thiết là Hiện\ntiền\nLấy Phân biệt chấp trì cái bình làm biện đề => Nó không phải Hiện tiền, cũng không\nphải Hiện lượng.\n   -     Tập thói quen đừng lấy sừng thỏ hay cái bình làm biện đề.\n\n\n                                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 4 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n   -   Tìm một dạng tâm thức nào đó không phải hiện tiền cũng không phải hiện lượng:\n       lấy tâm phân biệt làm biện đề.\n1.3. Phân loại của Hiện tiền\n                   Phân loại có 4: Căn hiện tiền, Ý hiện tiền, Tự chứng hiện tiền, Du già hiện tiền.\n                   ལ་དབྱེདྱེ་་ན། དའང་་ངྟོན། ཡིད་་ངྟོན། ངང་ངིག་་ངྟོན་སུ་༑ རྣལ་ཁྲུབྟོང་་ངྟོན་སུ་་དང་འཞི།\n                                                                                              (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n       -        Phân loại của Hiền tiền có bốn loại:\n                1) Căn hiện tiền\n                2) Ý hiện tiền\n                3) Tự chứng hiện tiền\n                4) Du già hiện tiền\n1.3.1. Căn hiện tiền\n1.3.1.1. Tánh tướng của Căn hiện tiền\n              Liễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất cộng của\n       chính nó đó là hữu sắc căn là tánh tướng của Căn hiện tiền.\n                   ངང་གི་ཐུན་མྟོངས་་་ཡིན་པཁྲིུ་འདག་ངྱེན་དའང་པྟོ་གཟུགས་ཅན་པ་ལས་སྱེས་པཁྲིུ་རྟོག་པ་དང་འལ་ཞིང་་་ཁྲུལལ་འཁྲིུ་ངིག་པ།ཤདའང་་ངྟོན་གི་་ཚན་ཉིད།\n                                                                                              (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   1. Tánh tướng của Căn hiện tiền: ‘Liễu tri ly phân biệt và không sai loạn, sanh từ\n      tăng thượng duyên bất cộng của chính nó đó là hữu sắc căn.’\n           i)      Phần ‘Liễu tri ly phân biệt và không sai loạn’: phần này dễ hiểu (đã học).\n        ii)        Phần: ‘sanh từ tăng thượng duyên bất cộng của chính nó chính là hữu sắc\n                   căn’:\n                         ● Duyên [đã học trong Nhiếp loại học, bao gồm]: Tăng thượng duyên,\n                           Vô gián duyên, Sở duyên duyên [và Nhân duyên].\n                         ● Căn hiện tiền sanh từ tăng thượng duyên bất cộng của chính nó đó\n                           là hữu sắc căn.\n                                       ○ ‘bất cộng’: nghĩa là riêng biệt của chính nó (chỉ mình nó có).\n                                       ○ ‘hữu sắc căn’: chẳng hạn như Chấp sắc căn hiện tiền sinh từ\n                                         nhãn căn… những căn hiện tiền khác cũng tương tự.\n   2. ‘Sinh từ tăng thượng duyên bất cộng của chính nó là hữu sắc căn’: Đây là tánh\n      tướng tổng quát của Căn hiện tiền. Căn hiện tiền lại được chia thành năm loại.\n   3. Tánh tướng của Căn tri: Trong sách không nói riêng tánh tướng của Căn tri nhưng\n      có thể suy luận từ tánh tướng của Căn hiện tiền: Bỏ phần thuộc về Hiện tiền, tức\n      là ‘ly phân biệt và không sai loạn’ thì ra tánh tướng của Căn tri.\n\n\n                                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 5 / 23>\n                                  TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n       Tánh tướng của Căn tri\n              Tánh tướng của Căn tri: ‘‘Liễu tri sanh từ tăng thượng duyên bất cộng\n              của chính nó đó là hữu sắc căn’.\n              Bỏ ‘ly phân biệt và không sai loạn’ (phần thuộc về Hiện tiền) ra khỏi tánh\n              tướng của Căn hiện tiền thì ra tánh tướng của Căn tri.\n              [Tương tự đối với Ý tri - tham chiếu mục 1.3.2]\n\n\ni. Vì sao phải có ‘Liễu tri ly phân biệt và không sai loạn’ [trong tánh tướng của Căn\nhiện tiền]\n[Trong tánh tướng của Căn hiện tiền] Nếu bỏ vế đầu ‘liễu tri ly phân biệt và không sai\nloạn’, chỉ giữ lại vế ‘sanh từ tăng thượng duyên bất cộng của chính nó là hữu sắc căn’\nthì có vấn đề.\n‘Sanh từ tăng thượng duyên bất cộng của chính nó là hữu sắc căn’ không thể là tánh\ntướng của Căn hiện tiền.\nBởi vì: Lấy nhãn tri nhìn một mặt trăng thành hai mặt trăng làm biện đề.\n   -   Thực tế: trên trời chỉ có một mặt trăng, nhưng đối với nhãn tri này lại trình hiện\n       thành hai mặt trăng. Nhìn một thành hai => đây là Điên đảo tri.\n   -   Xét về tăng thượng duyên bất cộng: Nhãn tri này vẫn ‘sanh từ tăng thượng duyên\n       bất cộng của chính nó là hữu sắc căn.’ Nhưng: nó sai loạn.\n   ➢ Nhãn tri này không phải là Căn hiện tiền.\nDo đó, tánh tướng của Căn hiện tiền phải có đầy đủ hai phần: (1) Liễu tri ly phân biệt và\nkhông sai loạn (không sai loạn đối với hiện cảnh), và (2) Sanh từ tăng thượng duyên bất\ncộng của chính nó, đó là hữu sắc căn ⇒ Có đầy đủ hai phần này mới thỏa tánh tướng của\nCăn hiện tiền.\nii. Sự khác biệt giữa Căn hiện tiền và Ý hiện tiền\nSự khác biệt giữa Căn hiện tiền và Ý hiện tiền tuỳ theo ‘Tăng thượng duyên bất cộng\ncủa chính nó’\n   -   Căn hiện tiền: sanh từ Tăng thượng duyên bất cộng của chính nó là Hữu sắc căn.\n   -   Ý hiện tiền: sanh từ Tăng thượng duyên bất cộng của chính nó là Ý căn.\n1.3.1.2. Phân loại của Căn hiện tiền\n              Phân loại có 5: Chấp sắc căn hiện tiền, Chấp thanh căn hiện tiền, Chấp hương\n       căn hiện tiền, Chấp vị căn hiện tiền và Chấp xúc căn hiện tiền.\n              དབྱེ་ན།ཤགཟུགས་ཁྲུཛིན་དའང་་ངྟོན། སྒྲ་ཁྲུཛིན་དའང་་ངྟོན།ཤདི་ཁྲུཛིན་དའང་་ངྟོན།ཤརྟོ་ཁྲུཛིན་དའང་་ངྟོན། ངྱེག་བ་ཁྲུཛིན་པཁྲིུ་དའང་་ངྟོན་དང་ལྔ།.\n                                                                                         (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Căn hiện tiền được chia thành năm loại:\n\n\n                                               © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 6 / 23>\n           TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n Stt              Loại Căn hiện tiền                                            Cách hiểu                                       Cách gọi Hán Việt\n\n  1        Chấp sắc căn hiện tiền                           Căn hiện tiền chấp trì sắc                                    Chấp sắc căn hiện tiền\n\n  2        Chấp thanh căn hiện tiền                         Căn hiện tiền chấp trì âm thanh                               Chấp thanh căn hiện tiền\n\n  3        Chấp hương căn hiện tiền                         Căn hiện tiền chấp trì hương                                  Chấp hương căn hiện tiền\n\n  4        Chấp vị căn hiện tiền                            Căn hiện tiền chấp trì vị                                     Chấp vị căn hiện tiền\n\n  5        Chấp xúc căn hiện tiền                           Căn hiện tiền chấp trì xúc                                    Chấp xúc căn hiện tiền\n\n      -    [Khi xét] tánh tướng [của từng loại Căn hiện tiền], lúc nào cũng phải có ‘liễu tri\n           ly phân biệt và không sai loạn’, bởi vì nó là Hiện tiền.\n1.3.1.3. Tánh tướng của từng loại Căn hiện tiền\nChấp sắc căn hiện tiền\n      1. Chấp sắc căn hiện tiền\n      Liễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của\n      chính nó đó là nhãn căn và sở duyên duyên đó là sắc là tánh tướng của Chấp sắc căn\n      hiện tiền.\n      ངང་གི་ཐུན་མྟོངས་་་ཡིན་པཁྲིུ་འདག་ངྱེན་་ིག་དའང་དང་ད་ིགས་ངྱེན་གཟུགས་ལ་འངྱེན་ནས་སྱེས་པཁྲིུ་རྟོག་པ་དང་འལ་ཞིང་་་ཁྲུལལ་འཁྲིུ་ངིག་པ།\n      གཟུགས་ཁྲུཛིན་དའང་་ངྟོན་གི་་ཚན་ཉིད།\n      Với điều đó, áp dụng tương tự cho những cái dưới.\n      དྱེས་འྟོག་་་རྣ་ས་ལ་ངིགས་ཁྲུགྱེ།\n                                                                                                (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n      1. Chấp sắc căn hiện tiền:\n                   -      Chữ ‘sắc’ ở đây là [chỉ viết tắt của] sắc xứ.\n                   -      Sắc xứ: Màu và Hình.\n                          (Nếu nói “sắc” [nói chung] thì trong đó chia ra: sắc xứ, thanh xứ, hương\n                          xứ, vị xứ, xúc xứ và pháp xứ)\n      a. Tánh tướng của Chấp sắc căn hiện tiền: ‘Liễu tri ly phân biệt và không sai loạn,\n         sanh dựa vào tăng thượng duyên bất cộng của chính nó đó là nhãn căn và sở duyên\n         duyên đó là sắc’\n      b. Tâm thức mà Chấp sắc căn hiện tiền sinh dựa vào Duyên gì? Phải dựa vào:\n                   -      (1) ‘Tăng thượng duyên bất cộng của chính nó’: Nhãn căn.\n                                 ○ ‘bất cộng’: nghĩa là riêng biệt, không chung với cái khác.\n                   -      (2) ‘Sở duyên duyên’: Sắc [xứ]\n                                 ○ Sắc ở đây là Hình và Màu (phần này đã học rồi).\n\n\n                                                        © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 7 / 23>\n                                              TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nTừ Chấp sắc căn hiện tiền, áp dụng tương tự cho bốn loại Căn hiện tiền còn lại\n      Với điều đó, áp dụng tương tự cho những cái dưới.\n      དྱེས་འྟོག་་་རྣ་ས་ལ་ངིགས་ཁྲུགྱེ།\n      2. Chấp thanh căn hiện tiền\n      Liễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của\n      chính nó đó là nhĩ căn và sở duyên duyên đó là thanh là tánh tướng của Chấp thanh căn\n      hiện tiền.\n      གཟུགས་ཁྲུཛིན་དའང་་ངྟོན་དུ་གྱུང་པཁྲིུ་ཚད་་་དཔད་ཤྱེས་ངང་ལ་་་ངྱེས་པཁྲིུ་བྟོ།\n      3. Chấp hương căn hiện tiền\n      Liễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của\n      chính nó đó là tỷ căn và sở duyên duyên đó là hương là tánh tướng của Chấp hương căn\n      hiện tiền.\n      4. Chấp vị căn hiện tiền\n      Liễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của\n      chính nó đó là thiệt căn và sở duyên duyên đó là vị là tánh tướng của Chấp vị căn hiện\n      tiền.\n      5. Chấp xúc căn hiện tiền\n      Liễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của\n      chính nó đó là thân căn và sở duyên duyên đó là xúc là tánh tướng của Chấp xúc căn\n      hiện tiền.\n                                                                                       (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n\n Stt                     Căn hiện tiền                              Tăng thượng duyên bất cộng          Sở duyên duyên\n\n  1         Chấp sắc căn hiện tiền                                                Nhãn căn                    Sắc\n\n  2         Chấp thanh căn hiện tiền                                              Nhĩ căn              Thanh (Âm thanh)\n\n  3         Chấp hương căn hiện tiền                                               Tỷ căn                    Hương\n\n  4         Chấp vị căn hiện tiền                                                 Thiệt căn                    Vị\n\n  5         Chấp xúc căn hiện tiền                                                Thân căn                    Xúc\n\n\n\n\n1.3.2. Ý hiện tiền\n1.3.2.1. Tánh tướng\n\n                                                           © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 8 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n              Liễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất cộng\n       của chính nó đó là ý căn là tánh tướng của Ý hiện tiền.\n              ངང་གི་ཐུན་མྟོང་་་ཡིན་པཁྲིུ་འདག་ངྱེན་ཡིད་དའང་ལས་བྱུང་འཁྲིུ་རྟོག་པ་དང་འལ་ཞིང་་་ཁྲུལལ་འཁྲིུ་ངིག་པ། ཡིད་་ངྟོན་གི་་ཚན་ཉིད།\n                                                                                       (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Tánh tướng của Ý hiện tiền: ‘Liễu tri ly phân biệt và không sai loạn, sanh từ tăng\n       thượng duyên bất cộng của chính nó đó là ý căn.’\n   -   Ở phần trước đã học: Ý hiện tiền sinh từ ý căn, những căn hiện tiền kia sinh từ\n       nhãn căn, nhĩ căn, tỷ căn, thiệt căn, thân căn.\n       Đến đây, mọi người đã có gần mười tánh tướng để về trả bài.\n   -   Bỏ ‘ly phân biệt và không sai loạn’ ra khỏi tánh tướng của Ý hiện tiền thì ra tánh\n       tướng của Ý tri.\n       Tánh tướng của Ý tri\n              Tánh tướng của Ý tri: ‘Liễu tri sanh từ tăng thượng duyên bất cộng của\n              chính nó đó là ý căn.’\n\n\nBiện kinh 02: Sự khác biệt giữa Căn hiện tiền và Căn tri là Musum\nNếu là Căn hiện tiền thì nhất thiết là Căn tri.\nNếu là Căn tri thì không nhất thiết là Căn hiện tiền\nKhả năng 1: Nếu là Căn tri thì không nhất thiết là Căn hiện tiền\nLấy Nhãn tri mà một mặt trăng trình hiện như hai mặt trăng trước nó làm biện đề.\n   -   Biện đề này là Căn tri, nhưng không phải là Căn hiện tiền, vì nó bị sai loạn.\n   -   Căn hiện tiền phải là ‘liễu tri ly phân biệt và không sai loạn’. Trong trường hợp\n       này, nhãn tri đó rõ ràng bị sai loạn đối với hiện cảnh, vì một mặt trăng lại trình\n       hiện như hai mặt trăng trước nó.\nLưu ý: Căn hiện tiền phải là ‘Liễu tri ly phân biệt và không sai loạn’ (không trông gà\nhóa cuốc). Căn tri chỉ cần thỏa phần ‘sanh từ tăng thượng duyên bất cộng của chính nó\nlà hữu sắc căn’ => Do đó, một căn tri bị sai loạn vẫn có thể là Căn tri, nhưng không\nphải là Căn hiện tiền.\nCách diễn đạt biện đề:\n   -   Căn tri có năm loại: nhãn tri, nhĩ tri, tỷ tri, thiệt tri và thân tri. [Khi nêu biện đề]\n       Chọn một cái [căn tri], chẳng hạn Nhãn tri, phải nói rõ Nhãn tri đó cụ thể chấp\n       trì cái gì.\n   -   Phải tập nói đúng theo thuật ngữ Triết học.\n             Ví dụ: Một mặt trăng trình hiện thành hai mặt trăng: Khi con mắt mình\n       nhìn một mặt trăng mà thấy thành hai mặt trăng thì hai mặt trăng trình hiện trước\n\n\n                                              © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 9 / 23>\n                        TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n       nhãn tri đó => Lấy “Nhãn tri chấp trì một mặt trăng thành hai mặt trăng” làm\n       biện đề [nói như vậy chưa chuẩn theo Triết học]=> Cách diễn đạt đúng là: Lấy\n       “Nhãn tri mà một mặt trăng trình hiện như hai mặt trăng trước nó” làm biện\n       đề.\nLG: Lấy Nhãn tri mà một mặt trăng trình hiện như hai mặt trăng trước nó làm biện đề,\nứng thành là Căn tri sao?\nĐLG: Đồng ý.\nLG:    Tại sao?\nĐLG: Bởi vì là Liễu tri sanh từ tăng thượng duyên bất cộng của chính nó đó là hữu sắc\ncăn.\n              Tánh tướng của Căn tri: ‘Liễu tri sanh từ tăng thượng duyên bất cộng của\n       chính nó đó là hữu sắc căn.’\nKhả năng 2 (vừa là cả hai): Nếu là Căn tri thì không nhất thiết không là Căn hiện\ntiền\nLấy Nhãn tri chấp trì cái bình làm biện đề.\nKhả năng 3 (không là cả hai): Nếu không là Căn tri thì không nhất thiết là Căn\nhiện tiền\nLấy Tâm phân biệt chấp trì cái bình làm biện đề.\nLưu ý: [khi nêu biện đề] Phải lấy một tâm phân biệt cụ thể [lấy Tâm phân biệt chấp trì\ncái gì đó, ví dụ: Lấy Tâm phân biệt chấp trì cái bình], không lấy Tâm phân biệt chung\nchung ([không nói] Lấy Tâm phân biệt làm biện đề)\n\n\nBiện kinh 03: Sự khác biệt giữa Hiện tiền và Căn tri là Mushi\nKhả năng 1: Nếu là Hiện tiền thì không nhất thiết là Căn tri\nLấy Ý hiện tiền làm biện đề.\nKhả năng 2: Nếu là Căn tri thì không nhất thiết là Hiện tiền\nLấy Nhãn tri mà một mặt trăng trình hiện thành hai mặt trăng trước nó làm biện đề.\nKhả năng 3 (vừa là cả hai): Nếu là Căn tri thì không nhất thiết không là Hiện tiền\nLấy Nhãn tri chấp trì cái bình làm biện đề.\nKhả năng 4 (không là cả hai): Nếu không là Căn tri thì không nhất thiết là Hiện\ntiền\nLấy [Tâm] Phân biệt chấp trì cái bình làm biện đề.\nTâm phân biệt không phải là Căn tri vì nó là Ý tri.\n\n\nBiện kinh 04: Sự khác biệt giữa Căn hiện tiền và Lượng là Mushi\n● Biện theo SKB là Musum\n\n                               © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 10 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n[LG: Ứng thành không phải như vậy đâu, bởi vì bạn chưa nói ra được sự khác biệt giữa\nCăn hiện tiền và Lượng là musum, mushi, đồng nghĩa hay tương nghịch.\nĐLG: Lý do không thành lập.\nLG:    Ứng thành có sao?\nĐLG: Đồng ý.\nLG:    Xin hãy nói ra?\nĐLG: Là musum.\nLG:    Ứng thành sự khác biệt giữa Căn hiện tiền và Lượng là musum sao?\nĐLG: Đồng ý.]\nLG:    Ứng thành cái gì nhất thiết là cái gì?\nĐLG: Nếu là Căn hiện tiền thì nhất thiết là Lượng.\nLG:    Ứng thành nếu là Căn hiện tiền thì nhất thiết là Lượng sao?\nĐLG: Đồng ý.\nLG:    Lấy Nhãn tri chấp trì cái bình ở sát na thứ hai làm biện đề, ứng thành là Lượng\nsao?\nĐLG: Tại sao?\nLG:    Bởi vì là Căn hiện tiền.\nĐLG: Không nhất thiết.\nKhông nhất thiết nghĩa là Nếu là Căn hiện tiền thì không nhất thiết là Lượng.\nLG:    Otsa.\n[Như vậy sự khác biệt giữa Căn hiện tiền và Lượng không là Musum]\nTrong biện kinh, mọi người phải sẵn sàng đưa ra câu trả lời sai để người khác bắt bẻ,\nmình nhận ra lỗi và biết cách bắt bẻ. Nếu lúc nào cũng chỉ tìm đáp án đúng thì mình sẽ\nkhông biết biện kinh.\n● Biện theo SKB là Mushi\nLG:    Ứng thành [sự khác biệt] không là musum sao?\nĐLG: Đồng ý.\nLG:    Ứng thành sự khác biệt là gì?\nĐLG: Là mushi.\nKhả năng 1: Nếu là Căn hiện tiền thì không nhất thiết là Lượng\nLG:    Ứng thành nếu là Căn hiện tiền thì không nhất thiết là Lượng sao?\nĐLG: Đồng ý.\nLG:    Xin hãy nêu sự tướng?\nĐLG: Lấy Nhãn tri chấp trì màu xanh ở sát na thứ hai làm biện đề.\n\n\n\n                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 11 / 23>\n                         TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nLG: Lấy Nhãn tri chấp trì màu xanh ở sát na thứ hai làm biện đề, ứng thành là Căn\nhiện tiền sao?\nĐLG: Đồng ý.\nLG:    Tại sao?\nĐLG: Bởi vì là Liễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất\ncộng của chính nó đó là hữu sắc căn.\nLG: Lấy Nhãn tri chấp trì màu xanh ở sát na thứ hai làm biện đề, ứng thành không là\nLượng sao?\nĐLG: Đồng ý.\nLG:    Tại sao?\nĐLG: Bởi vì không là Liễu tri mới mẻ, không nhầm lẫn.\nKhả năng 2: Nếu là Lượng thì không nhất thiết là Căn hiện tiền\nLG:    Ứng thành nếu là Lượng thì không nhất thiết là Căn hiện tiền sao?\nĐLG: Đồng ý.\nLG:    Xin hãy nêu sự tướng?\nĐLG: Lấy Tỷ lượng chứng âm thanh vô thường làm biện đề.\n          -   Không là căn hiện tiền bởi vì là căn tri.\n          -   Tỷ độ là ý tri, không là Căn tri, không là Căn hiện tiền.\n          -   Tỷ lượng: là Lượng.\nCách tìm sự tương:\n   -   Lấy Tỷ độ chứng âm thanh vô thường ở sát na thứ nhất làm biện đề => Tỷ độ là\n       Ý tri, không là Căn tri => không là căn hiện tiền;\n   -   Không là Căn hiện tiền [dự vào phân loại của Hiện tiền, có thể tìm biện đề] là Ý\n       hiện tiền. Tuy nhiên Ý hiện tiền chưa học, chưa hiểu nên không nên lấy để đưa sự\n       tướng.\nCác sự tướng sai\n   -   Lấy tâm phân biệt chứng âm thanh là vô thường ở sát na thứ nhất làm biện đề\n       => Tâm phân biệt luôn không là Lượng => Otsa\n   -   Lấy tâm phân biệt chứng âm thanh vô thường ở sát na thứ hai làm biện đề => Vô\n       thường không là tâm thức => Otsa.\n   -   Lấy Nhãn tri chấp trì cái bình ở sát-na thứ nhất làm biện đề => Nhãn tri chấp trì\n       cái bình ở sát-na thứ nhất vừa là lượng, vừa là căn hiện tiền\n              LG: Lấy Nhãn tri chấp trì cái bình ở sát-na thứ nhất làm biện đề, ứng\n              thành không là Căn hiện tiền sao?\n              ĐLG: Tại sao?\n              LG:    Otsa.\n\n                               © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 12 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nKhả năng 3 (vừa là cả hai) Nếu là Lượng thì không nhất thiết không là Căn hiện\ntiền\nLấy Nhãn tri chấp trì màu xanh ở sát na thứ nhất làm biện đề.\nKhả năng 4: Nếu không là Lượng thì không nhất thiết là Căn hiện tiền\nLấy Tỷ độ chứng âm thanh vô thường ở sát na thứ hai làm biện đề.\n   -   Không là Lượng (lý do sẽ học ở những bài sau).\n   -   Không là Căn hiện tiền bởi vì là Ý tri.\nLưu ý: Nhĩ tri chứng “âm thanh”, còn Tỷ độ chứng “âm thanh vô thường”.\nTập thói quen không lấy sừng thỏ làm biện đề, phải tìm một dạng tâm thức nào đó.\n\n\nBiện kinh 05: Sự khác biệt giữa Ý hiện tiền và Ý tri là Musum.\nNếu là Ý hiện tiền thì nhất thiết là Ý tri.\nNếu là Ý tri thì không nhất thiết là Ý hiện tiền.\nKhả năng 1: Nếu là Ý tri thì không nhất thiết là Ý hiện tiền\nLấy Phân biệt chấp trì cái bình làm biện đề.\n       Có thể lấy bất cứ tâm phân biệt nào cũng được, vì tâm Phân biệt nhất thiết là Ý\n       tri. Chẳng hạn, Lấy phân biệt chấp trì cái bình, phân biệt chấp trì sừng thỏ [làm\n       biện đề] đều được.\nKhả năng 2 (vừa là cả hai): Nếu là Ý hiện tiền thì không nhất thiết không là Ý tri\nLấy Ý hiện tiền chấp trì màu xanh làm biện đề.\n   -   Không thể lấy tâm phân biệt chấp trì màu xanh làm biện đề, vì tâm phân biệt\n       không phải là Ý hiện tiền. Hiện tiền phải là ‘liễu tri ly phân biệt và không sai\n       loạn’, tâm phân biệt không thỏa điều kiện ly phân biệt.\n   -   Cũng không thể lấy Nhãn tri chấp trì màu xanh, vì nhãn tri là căn tri, không phải\n       ý tri.\n   ➢ Cho nên lấy biện đề phải nói cụ thể: Ý hiện tiền chấp trì một đối tượng nào đó.\nKhả năng 3 (không là cả hai): Nếu không là Ý hiện tiền thì không nhất thiết là Ý\ntri\nLấy Nhãn tri chấp trì cái bình làm biện đề.\n   -   Nhãn tri chấp trì cái bình không phải ý hiện tiền và cũng không phải ý tri, vì nó\n       là căn tri.\nLưu ý: vì chưa học tới Tự chứng hiện tiền, nên trước mắt chưa lấy ‘tự chứng hiện tiền\ntrải nghiệm nhãn tri’ làm sự tướng.\n1.3.2.2. Phân loại của Ý hiện tiền\n              Phân loại có 2:\n\n\n\n                                 © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 13 / 23>\n                                   TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n              - Ý hiện tiền được chỉ ra ngay thời điểm này và\n              - Ý hiện tiền mà đó không là cái đó.\n              དྱེ་ལ་དབྱེ་ན། སྐའས་ཁྲུདིང་འསྟན་གི་ཡིད་་ངྟོན་དང་། དྱེ་་་ཡིན་པཁྲིུ་ཡིད་་ངྟོན་གཉིས།\n                                                                                            (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Ý hiện tiền được chia làm hai:\n          ○ Ý hiện tiền được chỉ ra ngay thời điểm này: nghĩa là ý hiện tiền được nói\n             ra ngay trong thời điểm này (từ từ sẽ hiểu)\n          ○ Ý hiện tiền mà đó không là cái đó: nghĩa là ý hiện tiền không được nói\n             trong thời điểm này (từ từ sẽ hiểu).\n1.3.2.2.1. Ý hiện tiền được chỉ ra ngay thời điểm này\na. Tánh tướng\n              Ý hiện tiền ngay thời điểm này\n               Tha chứng, ly phân biệt và không sai loạn, được chỉ ra ngay thời điểm này,\n       sanh từ tăng thượng duyên bất cộng của chính nó đó là ý căn là tánh tướng của Ý\n       hiện tiền được chỉ ra ngay thời điểm này.\n              ངང་གི་ཐུན་མྟོངས་་་ཡིན་པཁྲིུ་འདག་ངྱེན་ཡིད་དའང་ལས་བྱུང་འཁྲིུ་སྐའས་ཁྲུདིང་འསྟན་གི་རྟོག་འལ་་་ཁྲུལལ་འཁྲིུ་གཞན་ངིག་དང་པྟོཁྲིུ་་ཚན་ཉིད།\n                                                                                            (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Tánh tướng của Ý hiện tiền được chỉ ra ngay thời điểm này: ‘Tha chứng, ly phân\n       biệt và không sai loạn, được chỉ ra ngay thời điểm này, sanh từ tăng thượng duyên\n       bất cộng của chính nó đó là ý căn.’\n           ○ ‘Tha chứng’: ở đây là ‘tha chứng’, không phải ‘liễu tri’ [tham chiếu mục\n               bên dưới]\n           ○ ‘ly
