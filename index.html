/* === UX/UI refresh v3 === */
html,body{overflow-x:hidden}
body{background:
  radial-gradient(circle at 100% 0%, rgba(232,193,124,.16), transparent 23%),
  radial-gradient(circle at 0% 18%, rgba(47,129,105,.09), transparent 18%),
  linear-gradient(180deg,#fcfbf8 0%,#f3f2ee 100%)}
.topbar{backdrop-filter:saturate(120%) blur(10px);background:rgba(255,253,250,.88);box-shadow:0 10px 24px rgba(28,41,64,.05)}
.sidebar{background:linear-gradient(180deg,#162847 0%,#1b3050 52%,#142440 100%)}
.brand,.panel,.source-left,.source-reader,.map-column,.hero{position:relative;overflow:hidden}
.brand:after{content:'';position:absolute;right:-44px;top:-36px;width:126px;height:126px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.16), transparent 70%);pointer-events:none}

.hero:before{content:'';position:absolute;left:-50px;bottom:-65px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle, rgba(232,193,124,.21), transparent 72%);pointer-events:none}
.hero:after{right:-24px;top:-70px;color:rgba(255,255,255,.05)}
.panel,.source-left,.source-reader,.map-column{background:rgba(255,253,250,.93)}
.dark .topbar{background:rgba(20,32,51,.82)}
.dark .panel,.dark .source-left,.dark .source-reader,.dark .map-column{background:rgba(28,43,66,.96)}
.btn,.iconbtn,.chip,.node,.pagegrid button,.source-results button,.search-item,.flow-step{transition:transform .16s ease,box-shadow .22s ease,border-color .18s ease,background .18s ease,color .18s ease}
.btn:hover,.iconbtn:hover,.flow-step:hover,.node:hover,.search-item:hover{transform:translateY(-1px)}
.panel:after,.source-left:after,.source-reader:after,.map-column:after{content:'';position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(182,139,75,.25),transparent);pointer-events:none}
.notice{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(247,246,241,.95));border-radius:14px}
.flowband{margin:0 0 18px;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(250,248,242,.96));box-shadow:var(--shadow)}
.flowline{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px;align-items:stretch}
.flow-step{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 14px 15px;text-align:left;min-height:116px;color:var(--ink)}
.flow-step span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(182,139,75,.12);color:var(--accent);font-weight:800;font-size:11px}
.flow-step b{font:600 16px/1.3 Georgia,"Times New Roman",serif;color:var(--navy2)}
.flow-step small{display:block;font-size:12px;line-height:1.5;color:var(--muted)}
.flow-arrow{display:grid;place-items:center;color:var(--accent);font-size:24px;font-weight:700}
.lesson-overview{padding:20px 22px}
.journey{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.journey-step{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.journey-step span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(182,139,75,.12);color:var(--accent);font-size:11px;font-weight:900}
.journey-step b{font-size:12px;color:var(--ink)}
.journey-step.active{background:rgba(32,61,101,.08);border-color:rgba(32,61,101,.18)}
.journey-step.active span{background:var(--navy2);color:#fff}
.journey-arrow{color:var(--accent);font-style:normal;font-weight:800}
.insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.insight-card{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(246,244,237,.95))}
.insight-card b{display:block;margin-bottom:7px;color:var(--navy2);font-size:14px}
.insight-card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.6}
.compare-guide{margin-bottom:16px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(248,246,241,.98));box-shadow:var(--shadow)}
.logic-lane{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.logic-node{min-width:138px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:center}
.logic-node b{display:block;font-size:15px;color:var(--navy2)}
.logic-node span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.logic-arrow{color:var(--accent);font-size:23px;font-weight:900}
.logic-pill-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:8px}
.logic-pill{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.logic-pill.strong{border-color:rgba(182,139,75,.55);color:var(--accent)}
.logic-matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.logic-cell{padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.logic-cell b{display:block;color:var(--navy2);font-size:13px;margin-bottom:4px}
.logic-cell span{font-size:11px;color:var(--muted)}
.source-helper{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.tip-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.86);padding:7px 11px;font-size:11px;color:var(--muted)}
.tip-pill b{color:var(--navy2)}
.tree-root{background:linear-gradient(135deg,#203d65,#294f79);box-shadow:var(--shadow)}
.map-sub{background:linear-gradient(180deg,#f5f7fb,#eef2f7)}
.flashcard{background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(248,246,240,.99))}
.flashcard:after{content:'';position:absolute;right:-18px;bottom:-18px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle, rgba(182,139,75,.13), transparent 72%)}
.reader-top{background:linear-gradient(180deg,rgba(250,248,243,.95),rgba(255,253,250,.98))}
.pagegrid button{min-height:36px}
@media(max-width:1160px){
  .flowline{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:auto}
  .flow-arrow{display:none}
}
@media(max-width:880px){
  .sidebar{width:min(84vw,300px);transform:translateX(calc(-100% - 18px));box-shadow:18px 0 42px rgba(12,21,37,.22)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:20px 14px 72px}
  .topbar{height:auto;padding:10px 14px;gap:8px;flex-wrap:wrap}
  .top-middle{display:none}
  .search-wrap{order:2;width:100%;margin-left:0}
  .toolbar{margin-left:auto}
  .hero h1{font-size:clamp(28px,8.3vw,43px);max-width:100%}
  .flowline{grid-template-columns:1fr}
  .flow-step{min-height:unset}
  .flow-arrow{display:grid;transform:rotate(90deg);font-size:20px}
  .insight-grid{grid-template-columns:1fr}
  .logic-lane{flex-direction:column}
  .logic-arrow{transform:rotate(90deg)}
  .reader-text{max-height:none;min-height:340px}
}
@media(max-width:550px){
  .panel,.source-left,.source-reader,.map-column,.hero,.flowband,.compare-guide{border-radius:16px}
  .grid2,.compare-pair,.case-grid,.map-grid,.source-layout{grid-template-columns:1fr}
  .stats .stat{flex:1 1 calc(50% - 10px);min-width:0}
  .journey{align-items:stretch}
  .journey-step{width:100%;justify-content:flex-start}
  .journey-arrow{display:none}
  .logic-matrix{grid-template-columns:1fr}
}

<script type="application/json" id="handbookData">{"lessons":[{"id":1,"group":"01 · Nền tảng","title":"Tổng quan môn Tâm loại học","pages":[3,5],"summary":"Kiến lập Tâm loại học khảo sát giác tri theo tánh tướng, các hệ phân loại và ý nghĩa riêng của từng loại. Nội dung được triển khai theo trục chính của giáo trình: Giác tri → phân 7 loại → phân 3 loại → phân 2 loại.","definition":"“Thuyết về kiến lập tâm loại học ở đây có 3: thuyết về tánh tướng, phân loại và nghĩa của mỗi loại.”","points":["Tánh tướng: nhận diện một khái niệm bằng đặc trưng được nêu trong sách.","Phân loại: một đối tượng được xem xét dưới các hệ tiêu chí khác nhau; không tự động cộng các loại thành một danh sách chung.","Biện kinh: kiểm tra quan hệ tất yếu, sử dụng sự tướng và chứng minh nhân."],"example":"Một giác tri có thể được xác định theo hệ 7 loại, đồng thời xét theo hệ phân loại 3 và 2.","attention":"Các lớp phân loại không phải là ba bộ môn tách biệt: chúng là các góc nhìn vào cùng “Giác tri”.","links":[]},{"id":2,"group":"01 · Nền tảng","title":"Giác tri · Liễu tri · Tri thức","pages":[3,4],"summary":"Ba danh từ Giác tri, Liễu tri và Tri thức được giáo trình xác định là đồng nghĩa. Điểm khởi đầu là khả năng chấp trì cảnh.","definition":"“Liễu tri là tánh tướng của Giác tri.” “Sáng suốt và liễu tri là tánh tướng của Tri thức.” “Giác tri, liễu tri và tri thức đều đồng nghĩa.”","points":["Ý nghĩa của Liễu tri: khả năng chấp trì cảnh.","Khi trả lời tánh tướng phải giữ nguyên cụm từ của giáo trình.","Phân biệt tánh tướng (đặc điểm nhận diện) và sở tướng (đối tượng được nhận diện)."],"example":"Khi gặp “Tri thức” trong các trang sau, liên hệ ngay với “Giác tri” và “Liễu tri”.","attention":"Không đồng nhất khả năng chấp trì cảnh với việc chắc chắn chứng được mọi cảnh đang trình hiện.","links":[]},{"id":3,"group":"01 · Nền tảng","title":"Cảnh · Chấp trì · Chứng · Trình hiện","pages":[3,11,49,54],"summary":"Khi phân tích một tâm thức, cần tách câu hỏi cảnh nào trình hiện, tâm lấy cảnh gì làm đối tượng và có chứng được cảnh đó hay không. Từ “chấp trì” trong tánh tướng không đồng nhất với “chứng”.","definition":"","points":["Hiện cảnh: cảnh trình hiện trước một tri thức; giáo trình dùng trong các định nghĩa về sai loạn.","Sở thủ cảnh: cảnh mà tâm nhận lấy; phần ba loại giác tri phân biệt theo các loại sở thủ cảnh.","Sở duyên duyên: điều kiện đối tượng; ví dụ ở chấp sắc căn hiện tiền là sắc.","Tăng thượng duyên bất cộng: duyên đặc thù; ví dụ nhãn căn với chấp sắc căn hiện tiền.","Chứng cảnh và chấp trì cảnh không thể mặc nhiên hoán đổi."],"example":"Nhãn tri chấp trì cái bình: sở duyên duyên là sắc; tăng thượng duyên bất cộng là nhãn căn (theo ví dụ trong bài giảng).","attention":"Đây là sơ đồ khái niệm để học; với biện đề chính thức, đối chiếu thuật ngữ chính xác của tánh tướng trong SGK.","links":[]},{"id":4,"group":"01 · Nền tảng","title":"Ba hệ phân loại: 7 · 3 · 2","pages":[5,40,41],"summary":"Sơ đồ xương sống của giáo trình: một hệ 7 loại giác tri, một hệ 3 loại theo sở thủ cảnh, và sáu cách chia đôi ở phần cuối.","definition":"“Giác tri được phân làm 7 loại, giác tri được phân làm 3 loại và giác tri được phân làm 2 loại.”","points":["Bảy: Hiện tiền, Tỷ độ, Tái quyết tri, Tứ sát tri, Hiển nhi bất định, Nghi, Điên đảo tri.","Ba: Phân biệt lấy nghĩa tổng; tri thức vô sai loạn vô phân biệt lấy tự tướng; sai loạn tri vô phân biệt lấy hữu vô minh hiện làm sở thủ cảnh.","Hai: Lượng/phi lượng; phân biệt/vô phân biệt; sai loạn/vô sai loạn; ý tri/căn tri; khiển nhập/thành nhập; tâm/tâm sở."],"example":"Một “Tỷ lượng chứng âm thanh vô thường” có thể đồng thời nằm trong nhóm Tỷ độ và nhóm Lượng.","attention":"Không suy diễn rằng mỗi phân loại đều có các nhánh loại trừ nhau trong mọi ngữ cảnh ngoài lập thuyết SGK.","links":[]},{"id":5,"group":"02 · Bảy loại giác tri","title":"Hiện tiền","pages":[5,6,9,10],"summary":"Hiện tiền là loại đầu tiên trong bảy giác tri. Theo phạm vi lập thuyết của giáo trình, tánh tướng nhấn mạnh ly phân biệt và không sai loạn; phân loại chính có bốn.","definition":"“Liễu tri ly phân biệt và không sai loạn là tánh tướng của Hiện tiền.”","points":["Bốn loại: Căn hiện tiền; Ý hiện tiền; Tự chứng hiện tiền; Du già hiện tiền.","Phân biệt Hiện tiền (loại giác tri) với Hiện lượng (loại Lượng).","Các đoạn sách có biện kinh về cách giải thích “ly phân biệt”; cần đọc trong đúng ngữ cảnh lập thuyết."],"example":"Căn hiện tiền chấp trì sắc là ví dụ một nhánh của Hiện tiền.","attention":"Không gán mọi điều kiện của Hiện lượng cho Hiện tiền nói chung.","links":[]},{"id":6,"group":"02 · Bảy loại giác tri","title":"Hiện lượng","pages":[5,41,44],"summary":"Hiện lượng là giác tri hội đủ điều kiện của Hiện tiền và điều kiện của Lượng. Đây cũng là một trong hai loại Lượng.","definition":"“Liễu tri ly phân biệt và không sai loạn, mới mẻ, không nhầm lẫn là tánh tướng của Hiện lượng.”","points":["Lượng có hai: Hiện lượng và Tỷ lượng.","Khi so sánh với Hiện tiền, kiểm tra tính “mới mẻ, không nhầm lẫn”.","Các hiện lượng được minh họa trong phân loại tự quyết định lượng ở trang 44."],"example":"Nhãn tri chấp trì cái bình ở sát-na thứ nhất được dùng làm sự tướng của Lượng và Căn hiện tiền trong bài giảng.","attention":"Cùng một tâm có thể là Hiện tiền nhưng phải xét thêm điều kiện để gọi là Hiện lượng.","links":[]},{"id":7,"group":"02 · Bảy loại giác tri","title":"Căn hiện tiền và năm loại","pages":[11,12],"summary":"Căn hiện tiền nương vào hữu sắc căn làm tăng thượng duyên bất cộng. Năm loại tương ứng năm nhóm cảnh của năm căn.","definition":"“Liễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất cộng của chính nó đó là hữu sắc căn là tánh tướng của Căn hiện tiền.”","points":["Chấp sắc căn hiện tiền — nhãn căn / sắc.","Chấp thanh căn hiện tiền — nhĩ căn / thanh.","Chấp hương căn hiện tiền — tỷ căn / hương.","Chấp vị căn hiện tiền — thiệt căn / vị.","Chấp xúc căn hiện tiền — thân căn / xúc."],"example":"Chấp sắc căn hiện tiền: tăng thượng duyên bất cộng = nhãn căn; sở duyên duyên = sắc.","attention":"Một mặt trăng trình hiện thành hai mặt trăng thuộc ví dụ căn tri điên đảo, không lấy làm tánh tướng của Căn hiện tiền.","links":[]},{"id":8,"group":"02 · Bảy loại giác tri","title":"Ý hiện tiền","pages":[12,13,14,15,16],"summary":"Ý hiện tiền cũng ly phân biệt và không sai loạn nhưng nương vào ý căn. Giáo trình chia làm hai dạng: được chỉ ra ngay thời điểm này và không là dạng đó.","definition":"“Liễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất cộng của chính nó đó là ý căn là tánh tướng của Ý hiện tiền.”","points":["Hai loại: Ý hiện tiền được chỉ ra ngay thời điểm này; Ý hiện tiền mà đó không là cái đó.","Dạng được chỉ ra ngay thời điểm này chia tiếp năm nhóm chấp sắc/thanh/hương/vị/xúc.","Kinh dẫn “Tri Sắc, có hai tướng. Dựa vào nhãn và ý.”","Ví dụ dạng không là cái đó: Tha tâm thông."],"example":"Ý hiện tiền chấp trì màu xanh là sự tướng cần phân biệt với nhãn tri chấp trì màu xanh.","attention":"Bài giảng nhấn mạnh Ý hiện tiền rất vi tế; không dùng đồng nhất Ý hiện tiền với mọi Ý tri.","links":[]},{"id":9,"group":"02 · Bảy loại giác tri","title":"Tự chứng hiện tiền","pages":[16,17,18,19],"summary":"Tự chứng là dạng tri thức hướng nội, lấy hành tướng của tâm thức làm đối tượng trải nghiệm. Phần này phân biệt tự chứng hiện tiền với các giác tri hướng ngoại.","definition":"“Năng thủ hành tướng là tánh tướng của Tự chứng.” “Năng thủ hành tướng, ly phân biệt, không sai loạn là tánh tướng của Tự chứng hiện tiền.”","points":["Ba loại: Lượng đã trở thành Tự chứng hiện tiền; Tái quyết tri đã trở thành Tự chứng hiện tiền; Hiển nhi bất định đã trở thành Tự chứng hiện tiền.","Dùng đúng thuật ngữ “trải nghiệm”, không thay bằng “kinh nghiệm” trong biện đề.","Giáo trình bàn đến Tự chứng trải nghiệm tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư."],"example":"Nhãn tri chấp trì căn nhà và Tự chứng trải nghiệm nhãn tri chấp trì căn nhà là đồng thời.","attention":"“Hiển nhi bất định đối với một cảnh” không suy ra đương nhiên “giác tri Hiển nhi bất định”.","links":[]},{"id":10,"group":"02 · Bảy loại giác tri","title":"Du già hiện tiền","pages":[20,21,35,36],"summary":"Du già hiện tiền thuộc dòng tương tục của Thánh giả, có đặc điểm là sinh từ chánh quán song vận tam ma địa.","definition":"“Trí thuộc dòng tương tục của Thánh giả, ly phân biệt, không sai loạn, sinh từ tăng thượng duyên bất cộng của chính nó đó là chánh quán song vận tam ma địa là tánh tướng của Du già hiện tiền.”","points":["Ba loại: Thinh văn Du già hiện tiền; Duyên giác Du già hiện tiền; Đại thừa Du già hiện tiền.","Giáo trình nêu không có Hiển nhi bất định Du già hiện tiền.","Các câu biện kinh với Nhất thiết chủng trí phải đọc tách biệt giữa trình hiện và chứng."],"example":"Bản trí hiện tiền chứng vô ngã của cá thể được nêu trong mục Du già hiện lượng.","attention":"Trình hiện trước một tâm và được tâm ấy chứng không phải lúc nào cũng đồng nghĩa.","links":[]},{"id":11,"group":"02 · Bảy loại giác tri","title":"Tự hiện tiền (không phải Hiện tiền)","pages":[22,23],"summary":"Tự hiện tiền được giáo trình đặt thành phần riêng ngay sau bốn loại Hiện tiền. Gồm sáu dạng Tự hiện tiền phân biệt và một dạng vô phân biệt.","definition":"“Công nhận có 7 loại Tự hiện tiền đó là 6 Tự hiện tiền phân biệt và 1 Tự hiện tiền vô phân biệt.”","points":["Phân biệt sai loạn; phân biệt thế tục; phân biệt tỷ độ; phân biệt sinh từ tỷ độ; phân biệt niệm; phân biệt hiện cầu.","Loại thứ bảy là Vô phân biệt Tự hiện tiền.","Sách tiếp tục gom thành bốn nhóm để giảng giải."],"example":"Phân biệt nghĩ “tháng trước mình như vậy” thuộc phân biệt niệm; nghĩ về tương lai thuộc phân biệt hiện cầu.","attention":"Không nhầm tên gọi “Tự hiện tiền” với “Tự chứng hiện tiền”.","links":[]},{"id":12,"group":"02 · Bảy loại giác tri","title":"Tỷ độ và Tỷ lượng","pages":[23,24,25],"summary":"Tỷ độ dựa vào chánh nhân để không nhầm lẫn đối với sở lượng ẩn tế; Tỷ lượng là trường hợp có yếu tố mới mẻ. Tỷ độ có ba loại.","definition":"“Đam trước tri dựa vào sở y (điểm tựa) của chính nó đó là chánh nhân để không nhầm lẫn sở lượng ẩn tế của chính nó là tánh tướng của Tỷ độ.”","points":["Tỷ lượng: “Liễu tri dựa vào sở y của chính nó đó là chánh nhân để không nhầm lẫn, mới mẻ đối với sở lượng ẩn tế của chính nó”.","Ba loại: Tín hứa tỷ độ, Cực thành tỷ độ, Sự thế tỷ độ.","Giáo trình nói: Nếu là Tỷ độ thì không nhất thiết là Lượng."],"example":"Tỷ lượng chứng âm thanh vô thường (sát-na đầu). Tỷ độ chứng âm thanh vô thường ở sát-na thứ hai được nêu làm ví dụ Tái quyết tri.","attention":"Không dùng “tỷ độ” và “tỷ lượng” như hai từ luôn thay thế cho nhau trong mọi biện đề.","links":[]},{"id":13,"group":"02 · Bảy loại giác tri","title":"Tín hứa tỷ độ","pages":[23,24],"summary":"Tín hứa tỷ độ liên quan sở lượng cực ẩn tế và tín hứa chánh nhân; giáo trình đưa ví dụ từ kinh văn được khảo sát về tính không nhầm lẫn.","definition":"“Đam trước tri dựa vào sở y của chính nó đó là tín hứa chánh nhân để không nhầm lẫn đối với sở lượng cực ẩn tế của chính nó là tánh tướng của Tín hứa tỷ độ.”","points":["Phân biệt với cực thành và sự thế bằng loại sở lượng và chánh nhân.","Giáo trình nêu ba khảo sát đối với giáo ngôn.","Trích đoạn kinh văn của bài học: “Thí đắc tài, giới sinh lạc”."],"example":"Tỷ độ chứng kinh văn “Thí đắc tài, giới sinh lạc” có ý nghĩa tự sở thuyết không nhầm lẫn.","attention":"Không chuyển ví dụ kinh văn thành một kết luận về mọi kinh văn ngoài phạm vi lập luận của SGK.","links":[]},{"id":14,"group":"02 · Bảy loại giác tri","title":"Cực thành tỷ độ","pages":[24],"summary":"Cực thành tỷ độ xét sự phù hợp của danh xưng hay âm thanh được gọi một cách cộng xứng.","definition":"“Đam trước tri dựa vào sở y của chính nó là cực thành chánh nhân để không nhầm lẫn đối với tự sở lượng thanh khởi cộng xứng ... là tánh tướng của Cực thành tỷ độ.”","points":["Đối tượng trọng tâm: thanh khởi cộng xứng, cách gọi/xưng hô phù hợp.","Chánh nhân: cực thành chánh nhân.","Giữ nguyên sự tướng đặc thù trong SGK."],"example":"“Tỷ độ tri nhận cái có con thỏ phù hợp gọi là ‘mặt trăng’.”","attention":"Đây là ví dụ danh xưng truyền thống, không nên sửa sự tướng thành “con thỏ” đơn thuần.","links":[]},{"id":15,"group":"02 · Bảy loại giác tri","title":"Sự thế tỷ độ","pages":[25],"summary":"Sự thế tỷ độ được xây dựng trên sự thế chánh nhân, không nhầm lẫn đối với sở lượng lược ẩn tế.","definition":"“Đam trước tri dựa vào sở y của chính nó là sự thế chánh nhân để không nhầm lẫn đối với sở lượng lược ẩn tế của chính nó là tánh tướng của Sự thế tỷ độ.”","points":["Sở lượng: lược ẩn tế.","Chánh nhân: sự thế chánh nhân.","Phân biệt sự thế tỷ độ với Tỷ lượng qua tiêu chí “mới mẻ”."],"example":"“Tỷ độ chứng âm thanh vô thường.”","attention":"Trong các bài bốn khả năng, phải xác định đúng sát-na trước khi kết luận có là Lượng.","links":[]},{"id":16,"group":"02 · Bảy loại giác tri","title":"Tái quyết tri","pages":[25,26,27,28],"summary":"Tái quyết tri là phi lượng chứng lại điều lượng trước đó đã chứng. Sách phân thành Hiện tiền tái quyết tri và Phân biệt tái quyết tri.","definition":"“Liễu tri phi lượng chứng lại mà lượng trước đó dẫn đến nó đã chứng là tánh tướng của Tái quyết tri.”","points":["Hiện tiền tái quyết tri: Căn / Ý / Tự chứng / Du già hiện tiền tái quyết tri.","Phân biệt tái quyết tri: Hiện tiền sở dẫn sinh phân biệt tái quyết tri; Tỷ lượng sở dẫn sinh phân biệt tái quyết tri.","Sách thảo luận ngoại lệ liên quan Nhất thiết chủng trí sát-na thứ hai trong tranh luận về các định nghĩa khác."],"example":"Tỷ độ ở sát-na thứ hai chứng âm thanh vô thường là ví dụ Tỷ lượng sở dẫn sinh phân biệt tái quyết tri.","attention":"Không tuyên bố mọi sát-na thứ hai của mọi loại tâm nhất thiết là Tái quyết tri: giáo trình có phản biện rõ.","links":[]},{"id":17,"group":"02 · Bảy loại giác tri","title":"Tứ sát tri","pages":[28,29,30,31,32],"summary":"Tứ sát tri nhất ý chấp trì hoặc khẳng định nhưng không thấu đạt nghĩa được quán sát. Ba nhánh được nêu theo tình trạng lý do.","definition":"“Liễu tri chỉ nhất ý đam trước vào pháp mà đó là xúc nhập cảnh chủ yếu của chính nó, nhưng không thấu đạt được quán sát nghĩa là tánh tướng của Tứ sát tri.”","points":["Vô lý do tứ sát tri.","Bất định lý do tứ sát tri.","Y tương tự tứ sát tri.","Giáo trình còn trình bày cách đề xuất tánh tướng khác và các phản biện về kinh nghiệm."],"example":"Không có lý do mà nghĩ âm thanh vô thường; hoặc lấy “sở lượng” làm nhân để nghĩ âm thanh vô thường.","attention":"Không hiểu “nhất ý khẳng định” là đã “chứng”: chính điểm không thấu đạt quán sát nghĩa là then chốt.","links":[]},{"id":18,"group":"02 · Bảy loại giác tri","title":"Nghi","pages":[33,34],"summary":"Nghi do dự hai biên. Ba loại được minh họa bằng khuynh hướng đối với luận điểm âm thanh vô thường.","definition":"“Liễu tri hoài nghi nhị biên bằng tự lực (của chính nó) là tánh tướng của Nghi.”","points":["Hợp nghĩa nghi: nghiêng về phía phù hợp nghĩa.","Bất hợp nghĩa nghi: nghiêng về phía không phù hợp nghĩa.","Đẳng phần nghi: hai phía tương đương.","Trong biện kinh sách còn xét “tâm tương ứng với nghi”, không tự động đồng nhất nó với tâm sở nghi."],"example":"“Nghi chắc âm thanh là vô thường”; “Nghi chắc âm thanh là thường”; “Nghi âm thanh là thường hay vô thường”.","attention":"Không suy ra một tâm tương ứng với nghi nhất thiết bản thân là tâm sở.","links":[]},{"id":19,"group":"02 · Bảy loại giác tri","title":"Hiển nhi bất định","pages":[34,35,36,37],"summary":"Cảnh trình hiện rõ ràng nhưng tâm không có khả năng dẫn đến khẳng định cảnh đó. SGK phân loại theo Căn, Ý và Tự chứng.","definition":"“Liễu tri mà tự tướng mà đã trở thành xúc nhập cảnh của chính nó trình hiện rõ ràng nhưng không có khả năng dẫn đến khẳng định cái đó là tánh tướng của Hiển nhi bất định.”","points":["Ba dạng: Căn hiện tiền; Ý hiện tiền; Tự chứng hiện tiền đã trở thành Hiển nhi bất định.","Giáo trình không chấp nhận Hiển nhi bất định Du già hiện tiền.","Cần tách “hiển nhi bất định đối với pháp X” khỏi “giác tri Hiển nhi bất định”."],"example":"Căn hiện tiền chấp màu xanh dẫn đến nghi ngờ không chắc đã thấy hay chưa thấy màu xanh.","attention":"Cảnh trình hiện không tất yếu là cảnh được chứng.","links":[]},{"id":20,"group":"02 · Bảy loại giác tri","title":"Điên đảo tri · Nhân sai loạn · Mộng tri","pages":[32,33,38,39,40],"summary":"Điên đảo tri sai loạn đối với xúc nhập cảnh của chính nó. Có hai loại, gồm phân biệt và vô phân biệt; giáo trình đưa các ví dụ nhân sai loạn và mộng tri.","definition":"“Liễu tri sai loạn đối với xúc nhập cảnh của chính nó là tánh tướng của Điên đảo tri.”","points":["Phân biệt điên đảo tri: phân biệt chấp sừng thỏ; chấp ngã cá thể.","Vô phân biệt điên đảo tri: một mặt trăng trình hiện như hai; núi tuyết trình hiện như núi xanh.","Nhân sai loạn nhãn tiền: địa điểm; sở y; cảnh; vô gián duyên.","Trong mơ không có căn tri; mộng tri là ý tri.","SGK còn phân tích 12 xứ và pháp xứ ở trang 39–40."],"example":"Mắt bị nhặm: một mặt trăng thành hai mặt trăng (nhân sai loạn ở sở y); quay khúc củi cháy: thành bánh xe (ở cảnh).","attention":"Mộng tri có nhiều dạng; sách đề nghị tiếp tục nghiên tầm một số trường hợp rõ ràng, không nên chốt mọi trường hợp như nhau.","links":[]},{"id":21,"group":"03 · Ba loại giác tri","title":"Bản đồ ba loại giác tri","pages":[40,41],"summary":"Hệ ba loại phân biệt theo đối tượng làm sở thủ cảnh và đặc điểm phân biệt/vô phân biệt, sai loạn/không sai loạn.","definition":"“Giác tri được chia làm 3 loại bởi vì có Phân biệt lấy nghĩa tổng làm sở thủ cảnh, Tri thức vô sai loạn vô phân biệt lấy tự tướng làm sở thủ cảnh và Sai loạn tri vô phân biệt lấy hữu vô minh hiện ... làm sở thủ cảnh.”","points":["Phân biệt lấy nghĩa tổng làm sở thủ cảnh.","Tri thức vô sai loạn vô phân biệt lấy tự tướng làm sở thủ cảnh.","Sai loạn tri vô phân biệt lấy hữu vô minh hiện làm sở thủ cảnh."],"example":"Giáo trình lần lượt xem ba loại tương ứng với Phân biệt, Hiện tiền và Vô phân biệt điên đảo tri.","attention":"Tâm phân biệt chấp duy thanh tổng là sự tướng được thảo luận trong biện kinh; đọc thêm phản chứng trang 40–41.","links":[]},{"id":22,"group":"03 · Ba loại giác tri","title":"Phân biệt lấy nghĩa tổng","pages":[40,41,47],"summary":"Phân biệt trong nhóm ba loại có đặc điểm lấy nghĩa tổng làm sở thủ cảnh, nhưng SGK cũng thảo luận các trường hợp phân biệt chấp thanh tổng.","definition":"“Đam trước tri chấp trì thích hợp trộn lẫn nghĩa tổng hay thanh tổng là tánh tướng của Phân biệt.”","points":["Nghĩa tổng và thanh tổng là hai cụm cần phân biệt khi gặp Phân biệt.","Giáo trình trang 40–41 có tranh luận về “Phân biệt lấy nghĩa tổng”.","Phân biệt đồng nghĩa với Khiển nhập giác ở phần hệ phân loại hai."],"example":"Phân biệt nghĩ “đó là cái bình” minh họa cơ chế qua khái niệm.","attention":"Không khẳng định mọi Phân biệt đều chỉ có nghĩa tổng mà không có trường hợp thanh tổng.","links":[]},{"id":23,"group":"03 · Ba loại giác tri","title":"Tri thức vô sai loạn vô phân biệt","pages":[40,47,48],"summary":"Nhóm thứ hai của hệ ba loại tương ứng với Hiện tiền trong lập thuyết của sách, lấy tự tướng làm sở thủ cảnh.","definition":"“Tri thức vô sai loạn vô phân biệt lấy tự tướng làm sở thủ cảnh.”","points":["Vô phân biệt không vận hành bằng nghĩa tổng/ thanh tổng theo tánh tướng Phân biệt.","Vô sai loạn đối với hiện cảnh.","Sách nêu nhóm này đồng nghĩa với Hiện tiền theo quan điểm trình bày."],"example":"Căn hiện tiền chấp trì sắc thuộc nhóm này.","attention":"Cần giữ rõ lập thuyết: tại trang 48 SGK phân biệt quan điểm Kinh Bộ và Duy thức.","links":[]},{"id":24,"group":"03 · Ba loại giác tri","title":"Sai loạn tri vô phân biệt","pages":[38,40],"summary":"Nhóm thứ ba là tri thức vô phân biệt nhưng sai loạn: không đồng nhất không phân biệt với luôn đúng.","definition":"“Sai loạn tri vô phân biệt lấy hữu vô minh hiện (không trộn với nghĩa tổng) làm sở thủ cảnh.”","points":["Trong hệ ba loại, đồng nghĩa với Vô phân biệt điên đảo tri.","Không có cơ chế đam trước trộn với nghĩa tổng không đồng nghĩa không sai loạn.","Ví dụ điển hình ở căn tri và mộng tri."],"example":"Căn tri thấy một mặt trăng như hai mặt trăng.","attention":"Không lấy “có hình tướng trình hiện rõ ràng” làm đủ điều kiện của Hiện tiền.","links":[]},{"id":25,"group":"04 · Các cặp phân loại","title":"Sáu cặp phân loại","pages":[41,47,48,49,54,55],"summary":"Bên cạnh 7 và 3 loại, giáo trình trình bày sáu cặp khái niệm. Mỗi cặp trả lời một câu hỏi khác nhau về tâm thức.","definition":"“Giác tri có 2 loại ... Lượng và tri thức phi lượng ... phân biệt và tri thức vô phân biệt ... sai loạn tri và vô sai loạn tri ... ý tri và căn tri ... khiển nhập giác và thành nhập giác ... tâm và tâm sở.”","points":["Giá trị nhận thức: Lượng / Phi lượng.","Phương thức: Phân biệt / Vô phân biệt.","Sự sai loạn: Sai loạn / Vô sai loạn.","Căn cứ duyên: Ý tri / Căn tri.","Cách nhập cảnh: Khiển nhập giác / Thành nhập giác.","Loại tâm thức: Tâm / Tâm sở."],"example":"Tỷ lượng vừa thuộc một loại Lượng, vừa thuộc Phân biệt.","attention":"Không dùng tên một cặp để suy ra toàn bộ cặp khác khi chưa kiểm tra tánh tướng.","links":[]},{"id":26,"group":"04 · Các cặp phân loại","title":"Lượng và Tri thức phi lượng","pages":[41,42,47],"summary":"Lượng nhấn mạnh mới mẻ và không nhầm lẫn; phi lượng là khái niệm đối với giác tri không phải Lượng. Lượng chia hai loại.","definition":"“Liễu tri mới mẻ, không nhầm lẫn là tánh tướng của Lượng.” “Liễu tri không là mới mẻ và không nhầm lẫn là tánh tướng của Tri thức phi lượng.”","points":["Lượng: Hiện lượng và Tỷ lượng.","Phi lượng: năm giác tri sau cùng gồm Tái quyết tri, Tứ sát tri, Hiển nhi bất định, Nghi, Điên đảo tri.","SGK trình bày vấn đề định số Lượng bằng hai và lập luận từ các tông luận."],"example":"Nhãn tri chấp trì cái bình sát-na đầu (Hiện lượng); Tỷ lượng chứng âm thanh vô thường.","attention":"Lưu ý thảo luận về Nhất thiết chủng trí sát-na hai ở trang 9–10, 25–27; không dùng ví dụ này theo suy luận giản lược.","links":[]},{"id":27,"group":"04 · Các cặp phân loại","title":"Tự quyết định lượng · Tha quyết định lượng","pages":[42,43,44,45,46,47],"summary":"Phân loại Lượng theo việc có thể tự lực dẫn xuất quyết định tính không nhầm lẫn hay cần tới lượng khác về sau.","definition":"Tự quyết định lượng: “Liễu tri mới mẻ không nhầm lẫn, có thể tự lực dẫn xuất quyết định bản chất rốt ráo của sở lượng của chính nó ...”. Tha quyết định lượng: “Liễu tri mới mẻ không nhầm lẫn, không thể tự lực dẫn xuất quyết định ... mà cần dựa vào hậu sinh danh ngôn lượng khác ...”.","points":["Tự quyết định: 5 loại trong SGK — Thục tất nghĩa căn hiện lượng; Kiến năng tác dụng căn hiện lượng; Tự chứng hiện lượng; Du già hiện lượng; Tỷ lượng.","Tha quyết định: sách nêu các nhóm ba ví dụ theo hai cách thuyết minh ở trang 45–46.","Trường hợp hiển nhi bất định được nêu là giả lập trong mô tả tha quyết định lượng, cần đọc nguyên văn."],"example":"Thấy cây từ xa nhưng chưa xác định có phải cây tùng: minh họa tổng tự quyết định, sai biệt tha quyết định.","attention":"Đây là mục có cách phân loại khá tinh tế; khi trích tánh tướng nên xem nguyên văn trang 43.","links":[]},{"id":28,"group":"04 · Các cặp phân loại","title":"Phân biệt và Tri thức vô phân biệt","pages":[47,48],"summary":"Cặp này phân loại theo việc có đam trước tri trộn lẫn nghĩa tổng hoặc thanh tổng hay không.","definition":"Phân biệt: “Đam trước tri chấp trì thích hợp trộn lẫn nghĩa tổng hay thanh tổng ...”. Vô phân biệt: “Liễu tri ly đam trước tri chấp trì thích hợp trộn lẫn nghĩa tổng hay thanh tổng ...”.","points":["Phân biệt: Tỷ độ, Tứ sát tri, Nghi, một phần Tái quyết tri và Điên đảo tri.","Vô phân biệt: Hiện tiền, Hiển nhi bất định, một phần Tái quyết tri và Điên đảo tri.","Phân biệt đồng nghĩa Khiển nhập giác; Vô phân biệt đồng nghĩa Thành nhập giác."],"example":"Tỷ lượng chứng âm thanh vô thường: phân biệt. Căn hiện tiền chấp trì màu xanh: vô phân biệt.","attention":"Không coi “vô phân biệt” là “không có tâm” hay là “không thể sai loạn”.","links":[]},{"id":29,"group":"04 · Các cặp phân loại","title":"Sai loạn tri và Vô sai loạn tri","pages":[47,48],"summary":"Cặp này đánh giá sự sai loạn đối với hiện cảnh của chính tâm thức, không phải đơn thuần đúng/sai của một câu văn.","definition":"“Liễu tri sai loạn đối với hiện cảnh của chính nó là tánh tướng của Sai loạn tri.” “Liễu tri không sai loạn đối với hiện cảnh của chính nó là tánh tướng của Vô sai loạn tri.”","points":["Sách cho sự tướng sai loạn tri: Điên đảo tri và tất cả Phân biệt.","Theo cách trình bày Kinh Bộ tông: Vô sai loạn tri đồng nghĩa Hiện tiền.","Giáo trình ghi chú quan điểm Duy thức tông không hoàn toàn giống."],"example":"Phân biệt có thể “chứng” một pháp nhưng vẫn sai loạn với hiện cảnh của nó.","attention":"Đây là cách phân loại theo hiện cảnh, không thay bằng phán đoán đời thường “nghĩ đúng/nghĩ sai”.","links":[]},{"id":30,"group":"04 · Các cặp phân loại","title":"Ý tri và Căn tri","pages":[49,50],"summary":"Ý tri nương ý căn; Căn tri nương hữu sắc căn. Hai nhóm được xác định bằng tăng thượng duyên bất cộng.","definition":"Ý tri: “Liễu tri sanh dựa vào tăng thượng duyên bất cộng của chính nó là ý căn ...”. Căn tri: “Liễu tri sanh dựa vào tăng thượng duyên bất cộng của chính nó là hữu sắc căn ...”.","points":["Căn tri gồm Nhãn tri, Nhĩ tri, Tỷ tri, Thiệt tri, Thân tri.","Ý tri không đồng nghĩa với “Ý” (sách ghi quan hệ mushi).","Không đồng nhất “Căn tri” với “Căn hiện tiền”: có cả căn tri sai loạn."],"example":"Tâm sở tùy hành của ý thức là Ý tri nhưng không là Ý (tâm vương), theo bốn khả năng trang 49.","attention":"Phân biệt ý căn/ý tri/tâm sở và nhãn căn/nhãn tri khi xây biện đề.","links":[]},{"id":31,"group":"04 · Các cặp phân loại","title":"Khiển nhập giác và Thành nhập giác","pages":[54],"summary":"Phân loại theo lực đưa tâm vào đối cảnh: lực ký hiệu hoặc lực thực hữu.","definition":"“Liễu tri nhập vào tự cảnh bởi lực ký hiệu là tánh tướng của khiển nhập giác.” “Liễu tri nhập vào tự cảnh bởi lực thực hữu là tánh tướng của thành nhập giác.”","points":["Khiển nhập giác đồng nghĩa với Phân biệt.","Thành nhập giác đồng nghĩa với Tri thức vô phân biệt.","Xét việc nhập cảnh không tự động suy ra có chứng được mọi cảnh trình hiện."],"example":"Phân biệt nhận “cái bình” dựa vào ký hiệu; căn tri tiếp nhận cảnh qua lực thực hữu.","attention":"Không nhầm Khiển nhập giác với khẳng định đã chứng cảnh.","links":[]},{"id":32,"group":"04 · Các cặp phân loại","title":"Tâm · Tâm sở · 51 tâm sở","pages":[55,56,57],"summary":"Tâm (tâm vương) tương ứng với các tâm sở tùy hành; tâm sở tương ứng với tâm. Giáo trình phân tâm thành sáu và tâm sở thành 51.","definition":"“Tương ứng với tâm sở mà tâm sở đó hiện hữu như là tùy hành của chính nó là tánh tướng của (chính nó) Tâm.” “Tương ứng với tâm mà tâm đó có chính nó như là tùy hành là tánh tướng của (chính nó) Tâm sở.”","points":["Sáu tâm: nhãn thức, nhĩ thức, tỷ thức, thiệt thức, thân thức, ý thức.","51 tâm sở = 5 biến hành + 5 biệt cảnh + 11 thiện + 6 phiền não căn bản + 20 tùy phiền não + 4 bất định.","Tâm, ý, thức đồng nghĩa khi nói Tâm (tâm vương).","Năm tướng tương ứng: sở duyên, hành tướng, thời, sở y, chất."],"example":"Năm biến hành: Thọ, Tưởng, Tư, Tác ý, Xúc. Năm biệt cảnh: Dục, Thắng giải, Niệm, Định, Huệ.","attention":"Để ôn 51 tâm sở, mở sơ đồ nhóm và danh mục đầy đủ ở phía dưới.","links":[]},{"id":33,"group":"04 · Các cặp phân loại","title":"Năm tướng tương ứng","pages":[55],"summary":"Tâm và tâm sở cùng hoạt động trong quan hệ tương ứng; SGK nêu năm tướng.","definition":"","points":["Sở duyên tương ứng: cùng một sở duyên.","Hành tướng tương ứng: cùng một chấp thức.","Thời tương ứng: cùng thời gian.","Sở y tương ứng: cùng một tăng thượng duyên bất cộng.","Chất tương ứng: tương ứng về chất theo mô tả SGK."],"example":"Nhãn thức và cảm thọ đi chung với nó là ví dụ quan hệ tâm–tâm sở.","attention":"Phân biệt năm tướng với năm căn tri; đây là hai danh sách khác nhau.","links":[]},{"id":34,"group":"05 · Biện kinh & vận dụng","title":"Musum · Mushi · Đồng nghĩa · Tương nghịch","pages":[49,50,51,52],"summary":"Để xác định quan hệ giữa A và B, xem hai chiều tất yếu và sự tồn tại của bốn vùng A riêng, B riêng, cả hai, không cả hai. Với thuật ngữ musum/mushi, sử dụng theo đúng ví dụ giảng dạy của Nalanda.","definition":"","points":["Đồng nghĩa: A ⇒ B và B ⇒ A.","Musum (quan hệ bao hàm một chiều): ví dụ Căn hiện tiền ⇒ Căn tri; Căn tri ⇏ Căn hiện tiền.","Mushi: có ví dụ cho A không B, B không A, A và B, không A không B.","Tương nghịch: không có đồng vị của vừa A vừa B; chú ý có thể cần một trường hợp không A không B."],"example":"Ý và Ý tri là mushi; sách trình bày đủ bốn khả năng trang 49.","attention":"Luôn cố định phạm vi biện đề và chứng minh bằng tánh tướng; không suy diễn quan hệ chỉ qua tên gọi.","links":[]},{"id":35,"group":"05 · Biện kinh & vận dụng","title":"Chấp trì và Chứng cái bình","pages":[50,51],"summary":"Giáo trình đưa một cặp mushi: Phân biệt chấp trì cái bình và Phân biệt chứng cái bình.","definition":"","points":["A không B: Tứ sát tri chú ý cái bình.","B không A: Phân biệt chứng cái bình và nghĩa tổng của cái bình.","Cả hai: Phân biệt nhớ lại cái bình được dẫn xuất sau nhãn tri chấp trì cái bình.","Không cả hai: Cái cột (ví dụ SGK)."],"example":"Không thể xem “chấp trì cái bình” là luôn “chứng cái bình”.","attention":"Trong biện kinh, lấy chính tâm thức và đối cảnh được định danh rõ ràng.","links":[]},{"id":36,"group":"05 · Biện kinh & vận dụng","title":"Hiện tiền đối với pháp đó · Hiện lượng đối với pháp đó","pages":[51,52],"summary":"Cùng một tâm có thể hiện tiền đối với một pháp mà không hiện lượng đối với pháp đó, và ngược lại theo trường hợp được sách xây dựng.","definition":"","points":["A không B: Nhãn tri chấp trì cái bình, xét đối với “cái bình vô thường” theo ví dụ sách.","B không A: Nhãn tri chấp trì cái bình, xét đối với “không có đồng vị của vừa là cái bình vừa không là cái bình”.","Cả hai: Nhãn tri chấp trì cái bình xét đối với cái bình.","Không cả hai: dùng ví dụ sách trang 51, chú ý sát-na và pháp đang xét."],"example":"Một tâm có thể trực tiếp chứng bình nhưng chỉ gián tiếp chứng pháp phủ định liên quan cái bình.","attention":"Giữ nguyên “đối với pháp đó” khi nói quan hệ; bỏ cụm này sẽ làm đổi biện đề.","links":[]},{"id":37,"group":"05 · Biện kinh & vận dụng","title":"Tỷ lượng/Phân biệt · Chứng từ nhân/Chứng bởi nhân","pages":[51,52,53],"summary":"Hai đối tự tiếp theo cũng phải xét đúng “đối với pháp đó” hoặc đúng nhân của sự chứng minh.","definition":"","points":["Tỷ lượng đối với một pháp và Phân biệt đối với pháp đó: SGK xác lập quan hệ mushi.","Tỷ lượng chứng âm thanh vô thường có thể chỉ gián tiếp chứng “âm thanh không thường”, nên không là phân biệt đối với đối cảnh gián tiếp ấy.","Chứng bởi nhân của cái đó ⇒ chứng từ nhân của cái đó; chiều ngược lại không nhất thiết.","Ví dụ đường mía: từ một nhân vị hiện tại, giáo trình bàn hai tỷ độ sinh khởi."],"example":"Tỷ độ chứng sắc của đường mía chứng từ nhân “vị đường mía hiện tại” nhưng không chứng bởi nhân đó.","attention":"Không thay “chứng từ nhân” bằng “chứng bởi nhân”; hai quan hệ có điều kiện khác nhau.","links":[]},{"id":38,"group":"05 · Biện kinh & vận dụng","title":"Biện kinh: bốn khả năng và lỗi thường gặp","pages":[3,4,18,19,49,50,51,52,53,54],"summary":"Cách học: định nghĩa A/B, xác định dạng quan hệ, chọn sự tướng đúng loại pháp, rồi kiểm tra từng mệnh đề. Chỉ sử dụng các kết luận đã được chứng minh từ tánh tướng và ví dụ trong sách.","definition":"","points":["Bước 1. Chép chính xác A và B, kể cả “đối với pháp đó”, “sát-na thứ nhất/thứ hai”, “chấp trì/chứng”.","Bước 2. Xét A ⇒ B và B ⇒ A, không đảo chiều khi chưa có chứng minh.","Bước 3. Nếu mushi: tìm A không B; B không A; cả hai; không cả hai.","Bước 4. Nếu musum: chứng chiều bao hàm và một sự tướng phản ví dụ chiều ngược.","Bước 5. Biện đề phải đúng loại pháp yêu cầu; tránh lấy sừng thỏ làm tâm thức."],"example":"Biện kinh Căn hiện tiền / Căn tri: nhãn tri thấy một mặt trăng thành hai có thể là Căn tri nhưng không là Căn hiện tiền.","attention":"Không sửa hoặc rút gọn lời LG/ĐLG khi sao chép nguyên văn bài giảng; phần này chỉ là hướng dẫn hệ thống hóa, không phải biên bản đối thoại.","links":[]}],"glossary":[["Giác tri","Khái niệm nền tảng; đồng nghĩa với Liễu tri và Tri thức.",2,3],["Liễu tri","Khả năng chấp trì cảnh theo giải thích của giáo trình.",2,3],["Tánh tướng","Đặc điểm được nêu để nhận diện sở tướng; học thuộc nguyên văn tánh tướng.",2,3],["Hiện tiền","Liễu tri ly phân biệt và không sai loạn.",5,5],["Hiện lượng","Hiện tiền hội đủ điều kiện Lượng; mới mẻ, không nhầm lẫn.",6,5],["Căn hiện tiền","Hiện tiền nương hữu sắc căn.",7,11],["Ý hiện tiền","Hiện tiền nương ý căn.",8,12],["Tự chứng hiện tiền","Tự chứng năng thủ hành tướng, ly phân biệt, không sai loạn.",9,16],["Du già hiện tiền","Hiện tiền của Thánh giả với chánh quán song vận tam ma địa.",10,20],["Tự hiện tiền","Nhóm riêng có bảy loại gồm sáu phân biệt và một vô phân biệt.",11,22],["Tỷ độ","Đam trước tri dựa vào chánh nhân, hướng sở lượng ẩn tế.",12,23],["Tỷ lượng","Tỷ độ mới mẻ, không nhầm lẫn; một trong hai loại Lượng.",12,23],["Tín hứa tỷ độ","Tỷ độ liên hệ sở lượng cực ẩn tế và tín hứa chánh nhân.",13,23],["Cực thành tỷ độ","Tỷ độ liên hệ sự cộng xứng trong danh xưng.",14,24],["Sự thế tỷ độ","Tỷ độ hướng sở lượng lược ẩn tế.",15,25],["Tái quyết tri","Phi lượng chứng lại điều lượng trước đã chứng.",16,25],["Tứ sát tri","Nhất ý đam trước mà không thấu đạt nghĩa quán sát.",17,28],["Nghi","Liễu tri hoài nghi hai biên bằng tự lực.",18,33],["Hiển nhi bất định","Cảnh trình hiện rõ nhưng không dẫn xuất khẳng định được.",19,34],["Điên đảo tri","Liễu tri sai loạn với xúc nhập cảnh của mình.",20,38],["Phân biệt","Đam trước tri chấp trì thích hợp trộn nghĩa tổng/ thanh tổng.",22,47],["Tri thức vô phân biệt","Ly đam trước tri chấp trì thích hợp trộn nghĩa/ thanh tổng.",28,47],["Lượng","Liễu tri mới mẻ, không nhầm lẫn.",26,41],["Tri thức phi lượng","Năm loại giác tri sau cùng theo SGK.",26,47],["Tự quyết định lượng","Tự lực dẫn xuất sự quyết định bản chất sở lượng.",27,43],["Tha quyết định lượng","Cần lượng khác tiếp theo để dẫn xuất quyết định.",27,43],["Ý tri","Tri nương tăng thượng duyên bất cộng là ý căn.",30,49],["Căn tri","Tri nương tăng thượng duyên bất cộng là hữu sắc căn.",30,50],["Khiển nhập giác","Nhập tự cảnh bởi lực ký hiệu; đồng nghĩa phân biệt.",31,54],["Thành nhập giác","Nhập tự cảnh bởi lực thực hữu; đồng nghĩa vô phân biệt.",31,54],["Tâm (Tâm vương)","Tâm tương ứng với tâm sở tùy hành; có sáu thức.",32,55],["Tâm sở","Yếu tố tương ứng với tâm; giáo trình liệt kê 51.",32,55],["Musum","Quan hệ bao hàm một chiều theo ví dụ biện kinh Nalanda.",34,49],["Mushi","Quan hệ bốn khả năng có đủ A riêng / B riêng / cả hai / không cả hai.",34,49],["Sát-na","Đơn vị thời điểm; trong nhiều biện đề phải nêu rõ sát-na.",38,28],["Đồng vị","Cùng thỏa một tập hợp thuộc tính; quan trọng khi xét tương nghịch.",34,51],["Nghĩa tổng","Yếu tố cần phân biệt trong sở thủ cảnh của Phân biệt.",22,40],["Thanh tổng","Yếu tố song hành với nghĩa tổng trong tánh tướng Phân biệt.",22,47],["Hiện cảnh","Cảnh trình hiện trước tri thức; dùng trong tánh tướng sai loạn.",3,48],["Sở duyên duyên","Duyên đối tượng, ví dụ sắc đối với chấp sắc căn hiện tiền.",3,11],["Tăng thượng duyên bất cộng","Duyên đặc thù, như nhãn căn / ý căn / hữu sắc căn.",3,11],["Năm tướng tương ứng","Sở duyên; hành tướng; thời; sở y; chất.",33,55],["Pháp xứ","Một trong 12 xứ; xem chi tiết trang 39–40.",20,39],["Nhân sai loạn","Các điều kiện dẫn tới giác tri sai loạn; trường viễn và nhãn tiền.",20,32]],"pages":{"1":"KIẾN LẬP TÂM LOẠI HỌC\nTác giả: Geshe Jampal Samphel","2":"Quán Âm đại tạng từ ái vô sở duyên,\nVăn Thù Sư Lợi bậc trí căn vô cấu,\nMật chủ hàng phục quần ma không bỏ sót,\nTsong Khapa vương miện trí giả xứ tuyết,\nThỉnh cầu dưới chân sen Lobsang Dragpa.","3":"Kho tàng trí, bản sao Văn thù vũ khúc,\nKính lễ Ngài Lobsang Dragpa,\nRồi trích yếu kiến lập tâm loại học,\nTăng trưởng tri thức của kẻ hạ trí.\nVề điều này, thuyết về kiến lập tâm loại học ở đây có 3: thuyết về tánh tướng, phân loại và\nnghĩa của mỗi loại.\nThuyết về tánh tướng\nLiễu tri là tánh tướng của Giác tri.\nSáng suốt và liễu tri là tánh tướng của Tri thức.\nGiác tri, liễu tri và tri thức đều đồng nghĩa.\nÝ nghĩa của Liễu tri: Khả năng chấp trì cảnh.\nLượng Lý Trang Nghiêm Luận\nTrong Lượng lý trang nghiêm luận do Ngài biên soạn đã nói rằng: “Đầu tiên, tánh tướng của Liễu tri là Giác tri mà tự cảnh trình\nhiện.”\nMinh Giải Thâm Ý\nMinh Giải Thâm Ý do Ngài Panchen Sonam Dragpa biên soạn: “Không có cá thể nào mà không chứng được Giác tri bằng lượng.\nBởi vì không có cá thể nào mà không chứng được giác tri của chính nó bằng lượng”","4":"BK – liễu tri\nLấy Liễu tri làm biện đề/ Ứng thành là tánh tướng của giác tri sao? Đồng ý.\nTại sao là tánh tướng của giác tri?\nBởi vì giữa nó và giác tri mối quan hệ tánh tướng và sở tướng được thành lập và tám ngả nhất thiết được khẳng định.\nXin hãy nói ra nó và liễu tri mối quan hệ tánh tướng và sở tướng được thành lập như thế nào?\nLiễu tri được lượng khẳng định trước giác tri.\nỨng thành có cá thể chứng liễu tri và không chứng giác tri sao?\nBởi vì Liễu tri được lượng khẳng định trước giác tri.\nỨng thành không có cá thể chứng liễu tri và không chứng giác tri bởi vì nếu là cá thể thì nhất thiết chứng Giác tri.\nỨng thành nếu là cá thể thì nhất thiết chứng Giác tri bởi vì đó là tôn ý của Ngài Panchen Sonam Dragpa.\nUT là tôn ý của Ngài Panchen Sonam Dragpa bởi vì trong luận Minh Giải Thâm Ý do Ngài biên soạn đã nói rằng: “Không có cá\nthể nào mà không chứng được Giác tri bằng lượng. Bởi vì không có cá thể nào mà không chứng được giác tri của chính nó bằng\nlượng”\nLấy Liễu tri làm biện đề/ Ứng thành là Tánh tướng sao?/ Đồng ý.\nỨng thành không là Tánh tướng bởi vì là Sở tướng. Lý do không thành lập.\nỨng thành là Sở tướng bởi vì nó có Tánh tướng. Lý do không thành lập.\nỨng thành là vậy bởi vì đó là ý chỉ của Đức Đạt Lai Lạt Ma đời thứ nhất Gyalwa Gedun Drup.\nTrong Lượng lý trang nghiêm luận do Ngài biên soạn đã nói rằng: “Đầu tiên, tánh tướng của Liễu tri là Giác tri mà tự cảnh trình\nhiện.”\nỨng thành Sở tướng và Tánh tướng không tương nghịch sao?","5":"Thuyết về phân loại\nThứ hai, phân loại có 3: Giác tri được phân làm 7 loại, giác tri được phân làm 3 loại và giác tri\nđược phân làm 2 loại.\nBảy loại giác tri\nCó điều đầu tiên bởi vì có 7 đó là Hiện tiền, Tỷ độ, Tái quyết tri, Tứ sát tri, Hiển nhi bất định,\nNghi và Điên đảo tri.\nHiện tiền\nThứ ba, nghĩa của mỗi loại có 7. Thứ nhất, thuyết về Hiện tiền có hai gồm tánh tướng và phân\nloại\nLiễu tri ly phân biệt và không sai loạn là tánh tướng của Hiện tiền.\nLiễu tri ly phân biệt và không sai loạn, mới mẻ, không nhầm lẫn là tánh tướng của Hiện lượng.\nBk – hiện tiền\nUT tánh tướng của Hiện tiền có hai đó là ‘Liễu tri ly phân biệt và không sai loạn’ và ‘Liễu tri không sai loạn’ sao?\nLấy Hiện tiền làm bđ.\nUT là khác sao?\nBởi vì hai tánh tướng của nó là khác.\nKhg nt\nUT là nt bởi vì là tôn ý của Gyaltsab Rinpoche trong Thích Lượng Luận Minh Chiếu Giải Thoát Đạo: “Không đồng ý có\nngười nói ‘hai cái trước đó và cái này là tánh tướng đa dạng của Lượng’ bởi vì đối với hai cái này thì nghĩa tổng trình\nhiện từng cái khác nhau. Phản thể của sở tướng phải trở thành là khác.”\nLấy Hiện tiền làm bđ.\nUT không là khác bởi vì là một.\nUT là một bởi vì là sở tướng.\nThích Lượng Luận Minh Giải Thâm Ý do Ngài Panchen Sonam Dragpa biên soạn: “Thứ hai, thuyết về ý nghĩa của\ntánh tướng có hai. Đầu tiên, có người tranh cãi về ý nghĩa của ly phân biệt: ‘không là phân biệt là nghĩa của cái đó’, có","6":"người cho ‘ly chất của phân biệt, có người khác cho ‘ly tự phản thể của phân biệt và lại có người cho ‘ly tánh tướng\ncủa phân biệt.” Không đồng ý bởi vì quán hiện thế giả tên Lhejin không là ly phân biệt và Tỳ kheo Lhejin không là ly\ngiới luật của Lhejin. UT là cả hai? Bởi theo thứ tự là hữu phân biệt và tỳ kheo liên đồng giới luật. Không đồng ý điều\nthứ hai bởi vì tự chứng hiện tiền trải nghiệm phân biệt không là ly chất của phân biệt. Bởi vì cái đó là thành trụ đồng\nchất với phân biệt. Nếu không thành lập thì lấy phân biệt làm bđ. UT tự chứng hiện tiền trải nghiệm nó là thành trụ\nđồng chất với nó bởi vì nó là tri thức. Không đồng ý điều ba bởi vì nếu là ly phân biệt thì nhất thiết ly tự phản thể của\nphản thế. Có người cãi lại điều thứ tư đề xuất phân biệt chấp trì cái bình, tuy nhiên thiết nghĩ nếu là phân biệt thì cần\nphải thỏa tánh tướng của phân biệt do đó là cơ sở để phân tích.\nÝ nghĩa của Ly phân biệt được nói trong Thích Lượng Luận Minh Giải Thâm Ý do Ngài Panchen Sonam Dragpa biên\nsoạn chú giải Thích lượng luận của Ngài Pháp xứng. Trong luận đã bác bỏ 3 lối giải thích ý nghĩa của Ly phân biệt.\nTánh tướng của phân biệt: Đam trước tri chấp trì thích hợp trộn lẫn nghĩa tổng hay thanh tổng.\nBàn về ý nghĩa của‘Ly phân biệt’:\n1.        “Không là Phân biệt”\nKhông thể là ý nghĩa của Ly phân biệt bởi vì 8 ngả nhất thiết không khẳng định. Bởi vì: Nếu không là Phân biệt thì\nkhông nhất thiết là Ly Phân biệt.\nUT nếu không là Phân biệt thì nhất thiết là Ly Phân biệt sao? Đý\nLấy cá thể có Phân biệt trong dòng tương tục làm biện đề.\nỨng thành là ly phân biệt sao? đý\nỨng thành không có phân biệt trong dòng tương tục sao? tại sao?\nTại sao? Bởi vì là không là phân biệt.\nLý do không thành lập. Không nhất thiết.\nUT 8 ngã nt không khẳng định sao?\nUT ‘Không là phân biệt’ không là nghĩa của Ly phân biệt sao?\nLấy cá thể có Phân biệt trong dòng tương tục làm biện đề. Ứng thành là phân biệt sao? Đý.\nỨng thành là tri thức sao? Đý\nỨng thành không là tri thức bởi vì là bất tương ứng hành.\n2.        “Ly chất của Phân biệt”\nKhông thể là ý nghĩa của Ly phân biệt bởi vì 8 ngả nhất thiết không khẳng định. Bởi vì: Nếu là Ly Phân biệt thì\nkhông nhất thiết là Ly chất của Phân biệt.\nUT nếu là Ly Phân biệt thì nhất thiết là Ly chất của Phân biệt sao? Đý\nLấy Tự chứng hiện tiền trải nghiệm Phân biệt làm biện đề. UT là Ly chất của Phân biệt sao?","7":"Tại sao?\nBởi vì là Ly phân biệt.\nTự chứng hiện tiền là Ly Phân biệt nhưng không là Ly chất của Phân biệt bởi vì có 2 dạng tâm thức đó là Tha\nchứng và Tự chứng. Tha chứng là dạng tâm thức chứng ngoại cảnh. Tự chứng là dạng tâm thức\nchứng tâm thức khác (nội cảnh) cho nên Tự chứng hiện tiền không là Ly chất của Phân biệt.\nLấy Tự chứng hiện tiền trải nghiệm Phân biệt làm biện đề.\nỨng thành không là Ly chất của Phân biệt sao? Tại sao?\nBởi vì là một chất với Phân biệt.\n3.    “Ly tự phản thể của Phân biệt”\nÔn lại phần Phản thể trong Nhiếp loại học:\nTự phản thể của cái bình là cái bình. Sự phản thể của cái bình là sự tướng của cái bình đó là bình vàng. Nghĩa phản thể\ncủa cái bình là Tánh tướng của cái bình.\nLiên hệ: Tự phản thể của Phân biệt là Phân biệt.\nKhông thể là ý nghĩa của Ly phân biệt bởi vì 8 ngả nhất thiết không khẳng định. Bởi vì: Nếu là Ly tự phản thể của Phân\nbiệt thì không nhất thiết là Ly phân biệt.\nUT Nếu là Ly tự phản thể của Phân biệt thì nhất thiết là Ly phân biệt sao? Đý\nLấy Phân biệt chấp trì cái bình làm biện đề. UT là Ly phân biệt sao?\nBởi vì Ly tự phản thể của Phân biệt.\nUT Ly tự phản thể của Phân biệt bởi vì Tự phản thể của Phân biệt là Phân biệt. Phân biệt chấp trì cái bình là biệt của\nPhân biệt.\nUT không là Ly phân biệt bởi vì là Phân biệt.\nUT nếu là biệt của phân biệt thì nt là ly tự phản thể của phân biệt sao?\nBởi vì trong Thích Lượng Minh Giải Thâm Ý do ngài Panchen Sonam Dragpa biên soạn dạy rằng ‘nếu là biệt của phân biệt thì nt\nlà ly tự phản thể của phân biệt’.\nHay\nUT nếu là biệt của phân biệt thì không nt là ly tự phản thể của phân biệt sao?\nUT Nếu là Ly tự phản thể của Phân biệt thì nhất thiết là Ly phân biệt sao? Tại sao?\nCho sự tướng.\nLấy phân biệt chấp trì cái bình làm bđ. Tại sao là ly tự phản thể của phân biệt? Bởi vì là biệt của phân biệt. Đúng không?\nUT nếu là biệt của phân biệt thì nt là ly tự phản thể của phân biệt bởi vì nếu là Ly tự phản thể của phân biệt thì không nt là ly\nphân biệt, lấy phân biệt chấp trì cái bình làm bđ. PB chấp trì cái bình làm bđ. UT là Ly tự phản thể của phân biệt bởi vì là biệt của\nphân biệt.\nUT nếu là biệt của PB thì nt là ly tự phản thể của PB sao? đý\nLấy phân biệt chấp trì cái bình làm bđ.\nỨng thành là ly tự phản thể của phân biệt sao?","8":"Đý\nTại sao là ly tự phản thể của phân biệt?\nBởi vì không là tự phản thể của phân biệt.\nUT nếu không là tự phản thể của phân biệt thì nhất thiết là ly tự phản thể của phân biệt sao? Đý\nUt nếu không là phân biệt thì nt là ly phân biệt sao? Tại sao?\nBởi vì cũng giống như nếu không là tự phản thể của phân biệt thì nhất thiết là ly tự phản thể của phân biệt.\nLấy cá thể trong dòng tương tục có phân biệt chấp trì cái bình làm bđ. UT là ly phân biệt sao?\nBởi vì không là phân biệt.\nUT không là pb bởi vì không là tri thức.\nUT không là tri thức bởi vì là bất tương ứng hành.\nUT không là ly phân biệt bởi vì có phân biệt.\nLấy Phân biệt chấp trì cái bình làm bđ.\nUT ly tự phản thể của phân biệt sao?\nĐý\nTại sao ly tự phản thể của phân biệt?\nBởi vì không là biệt của phân biệt.\nUT nếu không là biệt của phân biệt thì nt ly tự phản thể của phân biệt sao?\nĐý\nTại sao nếu không là biệt của phân biệt thì nt ly tự phản thể của phân biệt?\nBởi vì nếu là biệt của phân biệt thì nt không là tự phản thể của phân biệt.\nUT nếu không là tự phản thể của phân biệt thì nt ly tự phản thể của phân biệt sao? Đý\nUT nếu không là phân biệt thì nt ly phân biệt sao?","9":"Minh giải thâm ý\nThích Lượng Luận Minh Giải Thâm Ý do Ngài Panchen Sonam Dragpa biên soạn: “Nói chung, thuyết về các ly phân biệt, không\nliên đồng với phân biệt, khác với phân biệt và thoát khỏi phân biệt là phẩm loại.”\nTrong Minh giải thâm ý do Ngài Panchen Sonam Dragpa biên soạn có dạy rằng: “Nhất thiết chủng trí sát na thứ hai là liễu tri\nchứng rồi chứng nhưng không là Tái quyết tri”.\nMinh chiếu giải thoát đạo\nTrong Minh chiếu giải thoát đạo do Ngài Rgyal Tsab Rinpoche biên soạn có dạy rằng: “Không tìm ra Bản trí biến tri mà không là\nlượng”.\nBk – phân biệt\nUT ly phân biệt, không liên đồng với phân biệt, khác với phân biệt và thoát khỏi phân biệt là đồng nghĩa sao?\nUT nếu là ly phân biệt thì nt là thoát khỏi phân biệt sao?\nLấy nhãn tri chấp trì cái bình trong dòng tương tục của phàm phu làm bđ. UT là thoát khỏi phân biệt sao? Tại sao?\nBởi vì là ly phân biệt.\nLDKTL\nUT là ly phân biệt bởi vì là hiện tiền.\nLấy nhãn tri chấp trì cái bình trong dòng tương tục của phàm phu làm bđ.\nUT là thoát khỏi chấp ngã sao?\nBởi vì là thoát khỏi phân biệt.\nUT là đoạn luân hồi sao?\nBởi vì thoát khỏi chấp ngã.\nUT có cái là tri thức trong dòng tương tục của phàm phu và là cái đã đoạn luân hồi sao?\nBk – lượng\nNói ra tánh tướng của lượng.\nỨng thành nếu là lượng thì nhất thiết là liễu tri mới mẻ, không nhầm lẫn sao? Đý\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành là liễu tri mới mẻ, không nhầm lẫn sao?\nTại sao?\nBởi vì là lượng. khg nt thì ứng thành nếu là lượng thì khg nt là liễu tri mới mẻ không nhầm lẫn sao? Ứng thành tánh tướng sở\ntướng 8 ngả nt không được khẳng định sao?\nLấy lượng làm bđ. Ứng thành không là sở tướng của liễu tri mới mẻ không nhầm lẫn sao?\nBởi vì 8 ngả nt không được khẳng định.\nLý do không thành lập\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành không là lượng sao? đý","10":"Ứng thành là lượng bởi vì trong Minh chiếu giải thoát đạo do Ngài Rgyal Tsab Rinpoche biên soạn có dạy rằng: “Không tìm ra\nbản trí biến tri mà không là lượng”.\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành là lượng sao? đý\nỨng thành không là lượng bởi vì không là liễu tri mới mẻ, không nhầm lẫn. khg nt.\nLấy lượng làm bđ ứng thành không là sở tướng của liễu tri mới mẻ, không nhầm lẫn sao?\nBởi vì 8 ngả nt không khẳng định.\nLý do không thành lập\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành là liễu tri mới mẻ, không nhầm lẫn sao?\nĐý\nỨng thành không là liễu tri mới mẻ, không nhầm lẫn bởi vì là liễu tri chứng rồi lại chứng.\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành là Tái quyết tri sao?\nTại sao?\nBởi vì không là liễu tri mới mẻ, không nhầm lẫn.\nỨng thành không là Tái quyết tri bởi vì trong Minh giải thâm ý do Ngài Panchen Sonam Dragpa biên soạn có dạy rằng: “Nhất\nthiết chủng trí sát na thứ hai là liễu tri chứng rồi chứng nhưng không là Tái quyết tri”.\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành không là lượng sao? Tại sao?\nBởi vì là Tái quyết tri.\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành là lượng bởi vì trong Minh chiếu giải thoát đạo do Ngài Rgyal Tsab Rinpoche biên soạn có dạy rằng: “Không tìm ra\nbản trí biến tri mà không là lượng”.\nLấy Nhất thiết chủng trí ở sát na thứ hai làm bđ.\nỨng thành là liễu tri mới mẻ, không nhầm lẫn sao?\nBởi vì là lượng.\nỨng thành là tánh tướng của Lượng bởi vì trong Kiến lập Tâm Loại Học do Geshe Jampal Samphel biên soạn có nói: “tánh\ntướng của lượng là liễu tri ly phân biệt và không sai loạn, mới mẻ, không nhầm lẫn.”\nLấy Lượng làm bđ\nỨng thành là sở tướng của liễu tri mới mẻ, không nhầm lẫn sao?\nỨng thành nếu là lượng thì nt là liễu tri mới mẻ, không nhầm lẫn sao?\nLấy Nhất thiết chủng trí ở sát na thứ 2 làm bđ….\nPhân loại có 4: Căn hiện tiền, Ý hiện tiền, Tự chứng hiện tiền, Du già hiện tiền.","11":"Căn hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất cộng của chính nó đó là\nhữu sắc căn là tánh tướng của Căn hiện tiền.\nPhân loại có 5: Chấp sắc căn hiện tiền, Chấp thanh căn hiện tiền, Chấp hương căn hiện tiền,\nChấp vị căn hiện tiền và Chấp xúc căn hiện tiền.\nChấp sắc căn hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của chính\nnó đó là nhãn căn và sở duyên duyên đó là sắc là tánh tướng của Chấp sắc căn hiện tiền.\nVới điều đó, áp dụng tương tự cho những cái dưới.\nTri thức đó sở hữu tướng của cảnh. Tăng thượng duyên thì thấy không thấy màu xanh. Sở duyên thì làm sanh tri thức\nsở hữu tướng của màu xanh.\nChấp sắc căn hiện tiền trong dòng tương tục của cá thể mà ý đang say đắm vào âm thanh êm tai.\nChấp thanh căn hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của chính\nnó đó là nhĩ căn và sở duyên duyên đó là thanh là tánh tướng của Chấp thanh căn hiện tiền.","12":"Chấp hương căn hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của chính\nnó đó là tỷ căn và sở duyên duyên đó là hương là tánh tướng của Chấp hương căn hiện tiền.\nChấp vị căn hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của chính\nnó đó là thiệt căn và sở duyên duyên đó là vị là tánh tướng của Chấp vị căn hiện tiền.\nChấp xúc căn hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh dựa vào tăng thượng duyên bất cộng của chính\nnó đó là thân căn và sở duyên duyên đó là xúc là tánh tướng của Chấp xúc căn hiện tiền.\nÝ hiện tiền\nLiễu tri ly phân biệt và không sai loạn, sanh từ tăng thượng duyên bất cộng của chính nó đó là\ný căn là tánh tướng của Ý hiện tiền.\nPhân loại có 2: Ý hiện tiền được chỉ ra ngay thời điểm này và Ý hiện tiền mà đó không là cái đó.\nÝ hiện tiền ngay thời điểm này\nTha chứng, ly phân biệt và không sai loạn, được chỉ ra ngay thời điểm này, sanh từ tăng\nthượng duyên bất cộng của chính nó đó là ý căn là tánh tướng của Ý hiện tiền được chỉ ra ngay\nthời điểm này.\nMinh Giải Thâm Ý\nTrong Thích Lượng Luận Minh Giải Thâm Ý của Panchen: “Bởi vì nếu là bất kỳ duyên nào trong 3 duyên của ý hiện tiền thì cần\nphải là thời biên tế sát na và cực kỳ ẩn tế.”\nLượng Lý Trang Nghiêm Luận\nTrong Lượng Lý Trang Nghiêm Luận: “Không có lượng năng sanh trực tiếp Nghi bởi vì tâm ngụy tạo bài phá việc làm của lượng,\ntương tự, Nghi cũng bài phá việc làm của lượng.”","13":"Phân loại có 5: Chấp sắc ý hiện tiền, Chấp thanh ý hiện tiền, Chấp hương ý hiện tiền, Chấp vị ý\nhiện tiền, Chấp xúc ý hiện tiền.\nTrong Minh Giải Thâm Ý Ngài Panchen có nói nếu là ý hiện tiền được chỉ ra ngay thời điểm này thì nhất thiết là giác tri\nbất chứng cảnh.\nBk – YHT thời điểm này\nỨng thành nếu là ý hiện tiền được chỉ ra ngay thời điểm này thì nhất thiết là giác tri bất chứng cảnh sao? đý\nỨng thành nếu là ý hiện tiền được chỉ ra ngay thời điểm này thì nhất thiết xảy ra sau căn hiện tiền sao? đý\nLấy ý hiện tiền trong dòng tương tục của Bồ tát Thánh giả làm bđ.\nỨng thành là giác tri bất chứng cảnh sao? Tại sao?\nBởi vì là ý hiện tiền được chỉ ra ngay thời điểm này.\nLý do không thành lập.\nLấy ý tiền trong dòng tương tục của Bồ tát Thánh giả làm bđ.\nỨng thành là ý hiện tiền được chỉ ra ngay thời điểm này bởi vì là xảy ra sau căn hiện tiền trong dòng tương tục của\nNgài.\nLấy ý tiền trong dòng tương tục của Bồ tát Thánh giả làm bđ.\nỨng thành không là giác tri bất chứng cảnh bởi vì Bồ tát Thánh giả có năng lực có thể chứng được cảnh trong khoảng\nthời gian ngắn nhất. đý\nLấy ý tiền trong dòng tương tục của Bồ tát Thánh giả làm bđ.\nỨng thành không là giác tri bất chứng cảnh sao? đý\nỨng thành không là ý hiện tiền được chỉ ra ở thời điểm này sao? đý\nỨng thành là ý hiện tiền được chỉ ra ở thời điểm này bởi vì là xảy ra sau căn hiện tiền trong dòng tương tục của Ngài.\nÝ hiện tiền được chỉ ra ở thời điểm này là cực ẩn tế, là ý hiện tiền trong dòng tương tục của phàm phu.\nSở duyên duyên của Ý hiện tiền chấp trì cái bình không là cái bình. Cái bình là sở duyên duyên của nhãn tri chấp trì cái\nbình. Cái bình thời biên tế sát na xảy ra cùng lúc với căn hiện tiền thời biên tế sát na mà đó đã trở thành bộ phận của\nchấp sắc căn hiện tiền sát na cuối cùng là sở duyên duyên của ý hiện tiện chấp trì cái bình.","14":"Thời biên tế sát na là tối đoạn thời gian, là thời gian ngắn nhất, là 1/65 của khoảng thời gian một búng tay của một\nngười khỏe mạnh hay 1/65 của khoảng thời gian của một cái chớp mắt.\nCách ý hiện tiền sinh khởi\nCách ý hiện tiền được chỉ vào thời điểm này sinh khởi có 3 cách thừa nhận: Giao thế sinh\nkhởi ,Tam hành sinh khởi, Duy tục biên sinh khởi.\nGiao thế sinh khởi\nCách thứ nhất Giao thế sinh khởi:\nChấp sắc căn hiện tiền sát na đầu tiên sinh khởi. Sau đó chấp sắc ý hiện tiền sát na đầu\ntiên sinh khởi. Sau đó chấp sắc căn hiện tiền sát na thứ hai sinh khởi v..v.. Cứ sau mỗi sát na của\nchấp sắc căn hiện tiền sinh khởi thì chấp sắc ý hiện tiền sinh khởi.\nTrong Lượng lý trang nghiệm luận do Đức Đạt Lai Lạt Ma đời thứ nhất Gyalwa Gedun Drupa biên soạn đã nói rằng: “Sẽ không\ntrở nên trình hiện mà tướng không gián đoạn”. Ý là nếu giao thế sinh khởi thì tướng của cảnh sẽ không thể trình hiện mà không\ngián đoạn. Ở đây bài phá tha tông cho rằng ý hiện tiền sinh khởi theo cách xen kẻ bởi vì mọi người đều hiểu rằng căn hiện tiền\nliên tục chấp trì cảnh nhưng tha tông cho rằng căn hiện tiền bị ý hiện tiền làm gián đoạn vì thế cảnh không thể trình hiện trước\ncăn hiện tiền mà không gián đoạn.\nTam hành sinh khởi\nCách thứ hai Tam hành sinh khởi:\nChấp sắc căn hiện tiền sát na thứ hai, chấp sắc ý hiện tiền sát na đầu tiên và tự chứng\nhiện tiền nhận thức hai hiện tiền đó đồng sinh khởi cùng lúc. Tóm lại, nghĩa chứng lưỡng hành\nhướng ngoại và tự chứng nhất hành hướng nội đồng sinh khởi.","15":"Ngài Gyen Khenpo cũng công nhận Tam hành sinh khởi bởi vì trong Thích Lượng Luận Minh Giải Thâm Ý của Panchen\nSonam Dragpa có nói: “Nếu vậy, nếu hỏi vậy Gyen Khenpo công nhận Tam hành sinh khởi sao? Công nhận điều đó bởi\nvì trong Trang có nói.”\nLượng Lý Tạng do Sakya Pandita Kunga Gyaltsen trước tác công nhận Tam hành sinh khởi: “Giao thế và duy tục biên,\ncả hai đều có cái làm hại, do đó hiện tiền là tam hành.”\nDuy tục biên sinh khởi\nCách thứ ba Duy tục biên sinh khởi (sinh vào duy cuối cùng của dòng lưu):\nTôn ý của Tổ Tsong Khapa và 2 đại đệ tử đồng ý là chấp sắc ý hiện tiền sinh ở duy sau\ncuối của sát na cuối cùng của chấp sắc căn hiện tiền.\nBk – Duy tục biên sinh khởi\nỨng thành tự tông công nhận Duy tục biên sinh khởi sao? đý\nỨng thành tự tông công nhận chấp sắc ý hiện tiền sinh ở duy sau cuối của sát na cuối cùng của chấp sắc căn hiện tiền\nsao? đý\nỨng thành chấp sắc ý hiện tiền sinh ở duy sau cuối của sát na cuối cùng của chấp sắc căn hiện tiền sao? Đý\nThí dụ căn tri chấp sắc trong 5 sát na thì ứng thành chấp sắc ý hiện tiền sinh ở duy sau cuối của sát na thứ năm của\nchấp sắc căn hiện tiền sao? Đý\nỨng thành chấp sắc ý hiện tiền không sinh trước chấp sắc căn hiện tiền sát na thứ năm sao? Đý. Chữ sinh ở đây là thì\ntương lai.\nỨng thành chấp sắc ý hiện tiền không sinh ở lúc chấp sắc căn hiện tiền thứ nhất nhì ba tư sao? đý.\nỨng thành là sinh ở lúc chấp sắc căn hiện tiền thứ nhất nhì ba tư bởi vì chấp sắc căn hiện tiền thứ nhất nhì ba tư cũng\nlà nhân của chấp sắc ý hiện tiền.\nLý do không thành lập.\nỨng thành là nhân của chấp sắc ý hiện tiền bởi vì là gián tiếp nhân của chấp sắc ý hiện tiền.\nỨng thành chấp sắc ý hiện tiền không sinh ở duy sau cuối của sát na thứ năm của chấp sắc căn hiện tiền sao? Tại sao?","16":"Bởi vì chấp sắc ý hiện tiền cũng sinh ở lúc chấp sắc căn hiện tiền thứ nhất nhì ba tư.\nLý do không thành lập.\nỨng thành là vậy bởi vì chấp sắc căn hiện tiền thứ nhất nhì ba tư cũng là nhân của chấp sắc ý hiện tiền.\nỨng thành tự tông không công nhận Duy tục biên sinh khởi sao?\nBởi vì chấp sắc ý hiện tiền không sinh ở duy sau cuối của sát na thứ năm của chấp sắc căn hiện tiền mà tự tông lại\ncông nhận điều này.\nỨng thành tự tông công nhận Duy tục biên sinh khởi bởi vì là tôn ý của Tổ Tsong Khapa và 2 đại đệ tử.\nNgoài ra trong Thích lượng luận Minh giải thâm ý của Sonam Dragpa có nói trong dòng tương\ntục của quán hiện thế giả thời gian cho chấp sắc ý hiện tiền sinh khởi không dài hơn một tối\nđoạn (ngắn nhất) sát na (thời biên tế sát na).\nNên hiểu rằng ‘Ý hiện Tiền đang nói ở ngay thời điểm này’ là thời điểm nói: “tri Sắc, có hai\ntướng. Dựa vào nhãn và ý”.\nNên hiểu rằng Ý hiện tiền đang nói ở ngay thời điểm này là thời điểm mà kinh nói: “tri Sắc, có hai tướng. Dựa vào nhãn\nvà ý”.\n✔ Được nói trong kinh tức là lời Phật dạy\n✔ Tri Sắc có nghĩa là biết Sắc.\n✔ Biết về Sắc thì có 2 tướng đó là Nhãn và Ý i.e Căn hiện tiền và Ý hiện tiền\n▪     Câu này có nghĩa là: Tri thức mà chứng được Sắc gồm có 2, đó là Nhãn (tức là Căn hiện tiền) và Ý (tức là Ý\nhiện tiền). Ý hiện tiền được nhắc đến trong kinh là Ý hiện tiền đang nói ở ngay thời điểm này.\nÝ hiện tiền mà đó không là cái đó\nThứ hai, Ý hiện tiền mà đó không là cái đó: Thí dụ Tha tâm thông.\nTự chứng hiện tiền\nNăng thủ hành tướng là tánh tướng của Tự chứng.\nNăng thủ hành tướng, ly phân biệt, không sai loạn là tánh tướng của Tự chứng hiện tiền.","17":"Phân loại có 3: Lượng mà đã trở thành là tự chứng hiện tiền, Tái quyết tri mà đã trở thành là tự\nchứng hiện tiền, Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền.\nMinh Giải Thâm Ý\nThích Lượng Luân Minh Giải Thâm Ý của Panchen: “Nếu là lượng thì cần phải được thành lập bởi tự chứng hiện tiền trải\nnghiệm chính nó, còn tri thức đơn thuần thì không cần như thế.”\nThích Lượng Luân Minh Giải Thâm Ý của Panchen:\n“Bởi vì nếu là bất kỳ duyên nào trong ba duyên của chấp sắc ý hiện tiền trong dòng tương tục của quán hiện thế giả thì nhất\nthiết đều là thời biên tế sát na và cực kỳ ẩn tế.”\n“Tăng thượng duyên và Vô gián duyên của chấp sắc ý hiện tiền trong dòng tương tục của quán hiện thế giả làm câu hữu duyên\ncủa ý hiện tiền đó, không là cận thủ của cái đó bởi vì không là tiền đồng loại của cái đó. Bởi vì không có tiền đồng loại của cái\nđó. Bởi vì cái đó là thời biên tế sát na. Nhất thiết bởi vì…”\n“Nếu là lượng thì cần phải được thành lập bởi tự chứng hiện tiền trải nghiệm chính nó, cón nếu là tri thức đơn thuần thì không\ncần như thế.”\nLượng Lý Trang Nghiêm Luận\nLượng Lý Trang Nghiêm Luận của Gyalwa Gedun Drup:\n“Ý hiện tiền được chỉ ra ở đây phải được có từ vô gián duyên căn hiện tiền, không có đồng loại của căn hiện tiền vào thời của ý\nhiện tiền. Nếu vậy, không có ý hiện lượng được chỉ ra ở đây trong dòng tương tực của quán hiện thế giả bởi vì ý hiện tiền được\nchỉ ra ở đây là một sát na. Nhất thiết bởi vì nếu là lượng thì nt dẫn xuất định tri và hiện tiền một sát na của quán hiện thế giả\nkhông thể dẫn xuất định tri.\nNếu vậy, thành ra không có ý hiện lượng được chỉ ra ở đây sao? Không có lỗi bởi vì có ý hiện lượng được chỉ ra ở đây trong dòng\ntương tục của Thánh giả. Tri thức một sát na trong dòng tương tục của Thánh giả dẫn xuất định tri không là tương nghịch bởi vì\ntrong Thích Lượng Luận có nói: ‘đại tuệ thấy thì khẳng định tất cả tướng’","18":"Minh Chiếu Giải Thoát Đạo\nMinh chiếu giải thoát đạo do Ngài Gyaltsab Rinpoche biên soạn có dạy rằng: “Nếu chính nó không được chứng bởi Tự chứng\nhiện tiền thì chính nó không thể là lượng”.\nBk – LÀ tỷ lượng\nTự chứng hiện tiền kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư là Lượng đối với tỷ lượng trong\ndòng tương tục của Thuận Thế tông luận sư VÀ là hiển nhi bất định đối với LÀ tỷ lượng trong dòng tương tục của Thuận thế\ntông luận sư.\nỨng thành là nt bởi vì trong Minh chiếu giải thoát đạo do Ngài Gyaltsab Rinpoche biên soạn có dạy rằng: “Nếu chính nó không\nđược chứng bởi Tự chứng hiện tiền thì chính nó không thể là lượng”.\nỨng thành không phải như vậy bởi vì chưa nói ra sự tướng của Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền.\nLấy Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư làm bđ.\nỨng thành là giác tri hiển nhi bất định mà đã trở thành Tự chứng sao? đý\nTại sao là hiển nhi bất định?\nBởi vì hiển nhi bất định đối với LÀ tỷ lượng.\nTự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư làm bđ\nỨng thành không hiển nhi bất định đối với tỷ lượng sao?\nĐý.\nTại sao?--------\nLấy tỷ lượng mà được kinh nghiệm bởi tự chứng hiện tiền kinh nghiệm Là tỷ lượng trong dòng tương tục của Thuận thế giả làm\nbđ.\nỨng thành không là lượng sao?\nTại sao?\nBởi vì không được chứng bởi Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư.","19":"Knt.\nỨng thành là nt bởi vì trong Minh chiếu giải thoát đạo do Ngài Rgyal Tsab Rinpoche biên soạn có dạy rằng: “Nếu chính nó không\nđược chứng bởi Tự chứng hiện tiền thì chính nó không thể là lượng”.\nỨng thành hiển nhi bất định đối với bất kỳ pháp nào nên là hiển nhi bất định sao?\nĐý.\nỨng thành có giác tri hiển nhi bất định mà đã trở thành du già hiện tiền sao?\nTại sao?\nBởi vì có du già hiện tiền hiện tiền chứng nhất thiết chủng trí vô thường trong dòng tương tục của Bồ tát Thánh giả.\nKhông nt\nLấy du già hiện tiền hiện tiền chứng nhất thiết chủng trí vô thường trong dòng tương tục của Bồ tát Thánh giả làm bđ.\nỨng thành không là giác tri hiển nhi bất định sao?\nĐý\nỨng thành là giác tri hiển nhi bất định bởi vì hiển nhi bất định đối với nhất thiết chủng trí.\nKhông nhất thiết.\nỨng thành nếu hiển nhi bất định đối với ntct thì không nt là giác tri hiển nhi bất định sao?\nĐý.\nỨng thành là nt bởi vì Tự chứng kinh nghiệm LÀ tỷ lượng trong dòng tương tục của Thuận Thế tông luận sư là giác tri hiển nhi\nbất định bởi vì hiển nhi bất định đối với LÀ tỷ lượng, tương tự như thế du già hiện tiền hiện tiền chứng nhất thiết chủng trí vô\nthường trong dòng tương tục của Bồ tát Thánh giả cũng là Hiển nhi bất định bởi vì hiển nhi bất định đối với nhất thiết chủng trí.\nLý do không thành lập.\nỨng thành là hiển nhi bất định đối với nhất thiết chủng trí bởi vì không chứng nhất thiết chủng trí.\nỨng thành không chứng được Nhất thiết chủng trí bởi vì NTCT đó là thọ dụng cảnh duy nhất của Hiện tiền trong dòng tương tục\ncủa Phật thánh giả.\nLấy du già hiện tiền hiện tiền chứng nhất thiết chủng trí vô thường trong dòng tương tục của Bồ tát Thánh giả làm bđ.\nỨng thành không là giác tri hiển nhi bất định bởi vì là du già hiện tiền.\nKhông nt\nỨng thành là nt bởi vì trong Thích Lượng Luận của Ngài Pháp Xứng có nói: “Đại trí khi thấy thì đều khẳng định được tất cả hành\ntướng”\nNhãn tri chấp trì căn nhà và tự chứng kinh nghiệm nhãn tri chấp trì căn nhà là đồng thời. Nhãn tri chấp trì căn nhà dẫn tới sự\nnhớ lại cái nhà đó tôi đã thấy. Tự chứng kinh nghiệm nhãn tri chấp trì căn nhà dẫn tới sự nhớ lại tôi đã thấy cái nhà đó.","20":"Du già hiện tiền\nTrí thuộc dòng tương tục của Thánh giả, ly phân biệt, không sai loạn, sinh từ tăng thượng\nduyên bất cộng của chính nó đó là chánh quán song vận tam ma địa là tánh tướng của Du già\nhiện tiền.\nPhân loại có 3:Thinh văn du già hiện tiền, Duyên giác du già hiện tiền, Đại thừa du già hiện tiền.\nMinh Giải Thâm Ý\nTrong Thích Lượng Luận Minh Giải Thâm Ý do Panchen biên soạn: “Có người nói, nếu vậy, ứng thành cái đó (du già hiện tiền\nhiện tiền chứng nhất thiết chủng trí là vô thường trong dòng tương tục của Bồ tát Thánh giả) là hiển nhi bất định đối với cái đó\n(nhất thiết chủng trí) bởi vì cái đó là hiện tiền đối với cái đó và không chứng cái đó bằng lượng. Nếu đồng ý (du già hiện tiền\nhiện tiền chứng nhất thiết chủng trí là vô thường trong dòng tương tục của Bồ tát Thánh giả là hiển nhi bất định đối với nhất\nthiết chủng trí) thì, ứng thành (du già hiện tiền đó) là hiển nhi bất định sao?” Không nhất thiết (nếu du già hiện tiền hiện tiền\nchứng nhất thiết chủng trí là vô thường trong dòng tương tục của Bồ tát Thánh giả là hiển nhi bất định đối với nhất thiết chủng\ntrí thì không nhất thiết là hiển nhi bất định) bởi vì Thánh giả không có hiển nhi bất định và đã có nói nếu hiển nhi bất định đối\nvới vô thường căn cứ trên âm thanh thì nói chung không nhất thiết là hiển nhi bất định.\nLượng Lý Trang Nghiêm luận\nLượng Lý Trang Nghiêm luận có nói: “Hiện tiền này đối với bất kỳ cảnh nào cũng không có khẳng định.” (lưu ý: chỉ có Phân biệt\nmới khẳng định cảnh và đam trước cảnh. Hiện tiền không khẳng định cảnh)\nCăn bản Thích lượng luận\nCăn bản Thích lượng luận dạy rằng: ““Đại trí khi thấy thì đều khẳng định được tất cả hành tướng”","21":"Bởi vì là Du già hiện tiền. Không nhất thiết.\nỨng thành là nhất thiết bởi vì trong Căn bản Thích lượng luận dạy rằng: ““Đại trí khi thấy thì đều khẳng định được tất cả hành\ntướng”\nỨng thành nếu trình hiện trước nó thì nhất thiết nó phải khẳng định sao?\nLấy Nhất thiết chủng trí làm biện đề. Ứng thành Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục\ncủa một vị Bồ tát Thánh giả chứng được Nhất thiết chủng trí sao? Tại sao?\nBởi vì NTCT trình hiện trước Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát\nThánh giả.\nỨng thành Du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả không\nchứng được Nhất thiết chủng trí bởi vì NTCT đó là thọ dụng cảnh duy nhất của Hiện tiền trong dòng tương tục của Phật thánh\ngiả.\nỨng thành đối với du già hiện tiền thì không có khẳng định cảnh sao? Tại sao?\nBởi vì du già hiện tiền là Hiện tiền.\nBởi vì trong Lượng Lý Trang Nghiêm luận có nói: “Hiện tiền này đối với bất kỳ cảnh nào cũng không có khẳng định.” (lưu ý: chỉ\ncó Phân biệt mới khẳng định cảnh và đam trước cảnh. Hiện tiền không khẳng định cảnh)\nLấy du già hiện tiền chứng Nhất thiết chủng trí là vô thường trong dòng tương tục của một vị Bồ tát Thánh giả làm biện đề.\nỨng thành không có khẳng định cảnh sao? Đồng ý.\nỨng thành có khẳng định cảnh bởi vì trong Căn bản Thích lượng luận dạy rằng: ““Đại trí khi thấy thì đều khẳng định được tất cả\nhành tướng”\nỨng thành không có khẳng định cảnh bởi vì du già hiện tiền đó là hiện tiền.","22":"Có nói Tự chứng hiện tiền và Du già hiện tiền cần phải là ý hiện tiền. Các tánh tướng trên căn cứ\ntheo lập thuyết của Kinh bộ tông. Cả hai Duy thức tông luận sư và Trung quán du già hành y tự\nkhởi tông luận sư cho rằng tánh tướng của Hiện tiền là ‘Liễu tri ly phân biệt, tập khí kiên hữu’\n(sanh từ tập khí kiên cố).\nTự hiện tiền\nThuận thuyết một chút về kiến lập Tự hiện tiền. Như đã được thuyết (Trần Na trong\nLượng Kinh) ‘Cái mà gọi là sai loạn, tri thức thế tục và tỷ độ, sanh từ tỷ độ, niệm và hiện cầu là\nTự hiện tiền, có đục nhân mắt’ nên công nhận có 7 loại Tự hiện tiền đó là 6 Tự hiện tiền phân\nbiệt và 1 Tự hiện tiền vô phân biệt.\n1. Phân biệt sai loạn: Ví dụ: Phân biệt chấp âm thanh là thường hằng.\n2. Phân biệt thế tục: Ví dụ Phân biệt nghĩ đó là cái nhà, đó là cái bình.\n3. Phân biệt tỷ độ: Ví dụ: Phân biệt chứng tam chi.\n4. Phân biệt sanh từ tỷ độ: Dựa vào Tỷ độ, khi đã có lý do thì mới xác quyết nó đúng là như\nvậy, tâm xác quyết đó gọi là Phân biệt có từ Tỷ độ. Ví dụ: Phân biệt chứng Sở lập.\n5. Phân biệt niệm: Ví dụ: Phân biệt nghĩ tới tháng trước, năm trước mình đã là như vậy.\n6. Phân biệt hiện cầu (Hiện Tiền mong cầu, nghĩ về tương lai): Ví dụ: Phân biệt nghĩ tương\nlai mình sẽ làm như thế này, sẽ trở thành như vầy.\nCăn Bản Thích Lượng Luận nhập các tự hiện tiền đó thành 4 để giảng giải. Nếu muốn biết chi\ntiết về những điều này thì nên tham khảo Kiến lập tâm loại học của Ratod và phẩm thứ ba trong\nMinh giải thâm ý.","23":"Những cái đó được gom làm bốn đó là:\n1. Phân biệt dựa vào ký hiệu: Phân biệt thế tục.\n2. Phân biệt phóng đại tha nghĩa: Phân biệt sai loạn.\n3. Phân biệt sở hữu ẩn tế nghĩa: Phân biệt tỷ độ, Phân biệt sanh từ tỷ độ, Phân biệt\nniệm, Phân biệt hiện cầu.\n4. Vô phân biệt tự hiện tiền.\nTỷ độ\nĐam trước tri dựa vào sở y (điểm tựa) của chính nó đó là chánh nhân để không nhầm lẫn sở\nlượng ẩn tế của chính nó là tánh tướng của Tỷ độ.\nLiễu tri dựa vào sở y của chính nó đó là chánh nhân để không nhầm lẫn, mới mẻ đối với sở\nlượng ẩn tế của chính nó là tánh tướng của Tỷ lượng.\nCó nói nếu là tỷ độ thì không nhất thiết là lượng.\nPhân loại có 3 đó là Tín hứa tỷ độ, Cực thành tỷ độ và Sự thế tỷ độ.\nTín hứa tỷ độ\nĐam trước tri dựa vào sở y của chính nó đó là tín hứa chánh nhân để không nhầm lẫn đối với\nsở lượng cực ẩn tế của chính nó là tánh tướng của Tín hứa tỷ độ.\nSự tướng: Tỷ độ chứng kinh văn: ‘Thí đắc tài, giới sinh lạc’ ý nghĩa của tự sở thuyết là không\nnhẫm lẫn.\nLấy kinh văn: “Thí đắc tài, giới sinh lạc” làm biện đề.","24":"Tại sao ý nghĩa của tự sở thuyết là không nhầm lẫn.\nBởi vì là Giáo ngôn được thanh tịnh bởi ba khảo sát.\n❖     Không bị tổn hại bởi hiện lượng tri nhận hiện tượng hiện tiền – cái thấy\n❖     Không bị tổn hại bởi Sự thế tỷ độ tri nhận hiện tượng lược ẩn tế - cái thấy\n❖     Tự ngữ cú trực và gián tiếp không tương nghịch và sự thừa nhận trước sau không tương nghịch đối với việc\nchỉ ra hiện tượng cực ẩn tế - cái không thấy\nKhedrup Rinpoche dạy rằng: “Kinh văn ‘thí đắc tài, giới sinh lạc’ là kinh văn giảng duy cực ẩn tế”.\nTrong Thích Lượng Luận Minh Chiếu Giải Thoát Đạo do Ngài Gyaltsab Rinpoche có nói: “Nếu đối với khổ và chấp ngã\ncủa kiếp này được thành lập như là nhân và quả bởi Hiện lượng, hậu đồng loại liên kết từ Ái của cận tử được thành\nlập bởi Sự thế tỷ độ, hậu đồng loại được liên kết đó chính nó cũng là danh ngôn ‘Khổ’, cho nên điều đó (Ái, chấp ngã)\nvà khổ ở kiếp sau được thành lập như là nhân và quả bởi Sự thế tỷ độ.\nCực thành tỷ độ\nĐam trước tri dựa vào sở y của chính nó là cực thành chánh nhân để không nhầm lẫn\nđối với tự sở lượng thanh khởi cộng xứng (âm thanh phát ra đều phù hợp để gọi hay xưng hô) là\ntánh tướng của Cực thành tỷ độ.\nSự tướng: Tỷ độ tri nhận cái có con thỏ phù hợp gọi là ‘mặt trăng’.\nLấy cái có con thỏ làm biện đề.\nTại sao phù hợp gọi là mặt trăng?\nBởi vì có trong phân biệt cảnh.","25":"Sự thế tỷ độ\nĐam trước tri dựa vào sở y của chính nó là sự thế chánh nhân để không nhầm lẫn đối với sở\nlượng lược ẩn tế của chính nó là tánh tướng của Sự thế tỷ độ.\nSự tướng: Tỷ độ chứng âm thanh vô thường.\nTái quyết tri\nLiễu tri phi lượng chứng lại mà lượng trước đó dẫn đến nó đã chứng là tánh tướng của Tái\nquyết tri.\nMinh Chiếu Giải Thoát Đạo\nTrong Minh Chiếu Giải Thoát Đạo của Ngài Gayltsab Rinpoche, Ngài đã nói rằng: “Tìm hết trong tâm trí nhưng không hề có cảm\nxúc nếu là bản trí biến tri thì không nhất thiết là lượng”. Ý của Ngài là “Nếu là Nhất thiết chủng trí thì nhất thiết phải là Lượng”.\nLượng Lý Trang Nghiêm Luận\nTrong Lượng Lý Trang Nghiêm Luận của Gyalwa Gedun Drup: “Tánh tướng của Tái quyết tri: Giác tri lại chấp trì nghĩa mà lượng\ncận thủ trước đó của nó đã chứng không quên.”\nThích Lượng Luận Minh Giải Thâm Ý\nTrong Thích Lượng Luận Minh Giải Thâm Ý chương Thành lập là lượng, do Panchen Sonam Dragpa biên soạn: “Nếu nghiên cứu\nmột chút thì, có người nói: ‘Liễu tri lại chứng mà lượng trước đó dẫn đến nó
