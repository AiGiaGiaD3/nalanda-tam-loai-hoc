 phân biệt và không sai loạn’: vì nó là Ý hiện tiền, mà Ý hiện tiền là\n               Hiện tiền, nên trong tánh tướng luôn phải có cụm ly phân biệt và không sai\n               loạn.\n           ○ [‘được chỉ ra ngay thời điểm này’: tham chiếu mục bên dưới.]\n           ○ ‘sanh từ tăng thượng duyên bất cộng của chính nó đó là ý căn’: vì nó là\n               Ý tri nên nó sanh từ tăng thượng duyên bất cộng của chính nó đó là ý căn.\nNhư vậy, trong tánh tướng này có hai phần mình đã biết chắc chắn và hai phần [đến]\nhiện tại chưa học:\n   -   Hai phần đã biết: ‘Ly phân biệt và không sai loạn’ (vì nó là Hiện tiền) và ‘Sanh\n       từ tăng thượng duyên bất cộng của chính nó đó là ý căn’ (vì nó là ý tri).\n   -   Hai phần chưa biết: ‘Tha chứng’ và ‘được chỉ ra ngay thời điểm này’\nHai phần chưa biết này mình sẽ tiếp tục tìm hiểu.\n\n\n                                                      Bàn về ‘tha chứng’\n\n\n                                                © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 14 / 23>\n        TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n i. Phân biệt ‘tự chứng’ và ‘tha chứng’\n [Trong tánh tướng của Ý hiện tiền được chỉ ra ngay thời điểm này] có chữ ‘tha chứng’.\n [Trước hết cần] phân biệt ‘tự chứng’ và ‘tha chứng’.\n\n              Tha chứng                                       Tự chứng\n\nTâm thức hướng ngoại.                     Tâm thức hướng nội.\n                                          Hướng vào bên trong.\n\nChứng cái bên ngoài (sắc, thanh, hương, Chỉ chứng được tâm thức, tri thức, không chứng\nvị, xúc).                               được những cái bên ngoài.\n                                        Chỉ có tâm thức trình hiện trước tâm Tự chứng.\n                                        Tri thức là cái bên trong, cho nên gọi là tự chứng.\n\nÝ hiện tiền được chỉ ra ngay thời điểm Ví dụ: Tự chứng hiện tiền trải nghiệm nhãn tri\nnày: là tha chứng, không phải ‘tự chứng’. chấp trì cái bình.\n\n\n ii. [Trong tánh tướng của Ý hiện tiền được chỉ ra ngày thời điểm này] Vì sao dùng\n ‘tha chứng’ mà không dùng ‘liễu tri’\n Trong tánh tướng của Căn hiện tiền hay Ý hiện tiền: dùng chữ ‘liễu tri’ (Liễu tri ly phân\n biệt).\n Vậy tại sao trong tánh tướng của Ý hiện tiền được chỉ ra ngay thời điểm này lại dùng\n ‘tha chứng’ mà không dùng ‘liễu tri’?\n Trước hết, mình phải biết một kiến thức chung theo Tự tông: ‘Ý hiện tiền được chỉ ra\n ngay thời điểm này là Giác tri bất chứng cảnh.’\n    -   Giác tri bất chứng cảnh: nghĩa là dạng giác tri chỉ chấp trì cảnh, không chứng\n        được cảnh.\n    -   Chấp trì cảnh không có nghĩa là chứng được cảnh.\n               Ví dụ: Nhãn tri chấp trì một mặt trăng thành hai mặt trăng\n               → Nó chấp trì hai mặt trăng, nhưng không chứng được hai mặt trăng, bởi\n               vì hai mặt trăng đó không có thật. Muốn chứng thì cảnh đó phải có thật.\n Theo Tự tông: Ý hiện tiền được chỉ ra ngay thời điểm này là giác tri không chứng\n cảnh, gọi là giác tri bất chứng cảnh.\n Vậy tại sao trong tánh tướng lại dùng chữ “tha chứng”?\n Thầy nói rằng, trong kinh điển không nói rõ chỗ này, nhưng theo thầy nghĩ/ theo cách\n thầy hiểu thì dùng như vậy là để phân biệt. Để cho thấy rằng nó là giác tri bất chứng\n cảnh: nó chỉ chấp trì cảnh, nó không chứng cảnh.\n Lưu ý:\n\n\n\n                                © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 15 / 23>\n                               TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n      Chúng ta đang nói về Ý hiện tiền được chỉ ra ngay thời điểm này. Người ta có thể\nthắc mắc: “Vậy Ý hiện tiền này là gì? Nó có phải là tự chứng không?”\n       Ở đây dùng chữ “tha chứng” để ngăn sự hoài nghi rằng Ý hiện tiền được chỉ ra\nngay thời điểm này là tự chứng. Nó không phải tự chứng.\n       Nếu để chữ “liễu tri” cũng không được, vì như vậy sẽ thành chứng cảnh. Ý hiện\ntiền (Liễu tri ly phân biệt, không sai loạn, sinh từ tăng thượng duyên bất cộng của chính\nnó là ý căn) là chứng cảnh. Trong khi Ý hiện tiền được chỉ ra ngay thời điểm này không\nchứng cảnh, cho nên nó là giác tri bất chứng cảnh. Dùng chữ “tha chứng” ở đây là để\nphân biệt rõ giữa tha chứng và tự chứng.\n       Ý hiện tiền nói chung thì trong đó có cái chứng cảnh, có cái không chứng cảnh.\nVí dụ, Ý hiện tiền được chỉ ra ngay thời điểm này trong dòng tương tục của phàm phu\nlà giác tri bất chứng cảnh. (Từ từ học xuống dưới mình sẽ thấy.)\n\n\n                            Bàn về ‘được chỉ ra ngay thời điểm này’\n               ‘được chỉ ra ngay thời điểm này’:\n               Nên hiểu rằng ‘Ý hiện tiền đang nói ở ngay thời điểm này’ là thời điểm\n               nói: “tri Sắc, có hai tướng. Dựa vào nhãn và ý”.\n               །སྐའས་ཁྲུདིང་འསྟན་ཞྱེས་པ། གཟུགས་ཤྱེས་པ་ནི་རྣ་་གཉིས་དྱེ། །་ིག་དང་ཡིད་ལ་འངྱེན་པའྟོ། ཞྱེས་པཁྲིུ་སྐའས་ལ་གྟོ་དགྟོས་སྟོ།\n               ▪ Câu này có nghĩa là: Tri thức mà chứng được Sắc gồm có 2, đó là Nhãn (tức là Căn\n               hiện tiền) và Ý (tức là Ý hiện tiền). Ý hiện tiền được nhắc đến trong kinh là Ý hiện tiền\n               đang nói ở ngay thời điểm này.\n                                                                          (trích dẫn SGK Tâm Loại Học - 2026)\n               Giải thích:\n          - Khi bàn về Ý hiện tiền được nhắc đến trong câu ‘tri Sắc, có hai tướng.\n            Dựa vào nhãn và ý’ (trích trong Tập Lượng Luận của ngài Trần Na.), Ý\n            hiện tiền đó được gọi là Ý hiện tiền được chỉ ra ngay thời điểm này.\n          - Cụm từ ‘ngay thời điểm này’ có nghĩa là gì? [Là thời điểm nói ‘tri sắc, có\n            hai tướng. Dựa vào nhãn và ý.’]\n          ➢ Phải nhớ rằng cụm từ ‘Ý hiện tiền được chỉ ra ngay thời điểm này’ ở đây\n            muốn nói đến Ý hiện tiền được thể hiện trong câu ‘tri Sắc, có hai tướng.\n            Dựa vào nhãn và ý.’\n          - Còn ‘Ý hiện tiền không được chỉ ra ngay thời điểm này’ là một loại Ý hiện\n            tiền khác.\n\n\nb. Phân loại\nÝ hiện tiền được chỉ ra ngay thời điểm này được chia làm năm loại:\n       Phân loại có 5: Chấp sắc ý hiện tiền, Chấp thanh ý hiện tiền, Chấp hương ý hiện\n       tiền, Chấp vị ý hiện tiền, Chấp xúc ý hiện tiền.\n\n\n                                         © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 16 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n       དབྱེ་ན། གཟུགས་ཁྲུཛིན་ཡིད་་ངྟོན་ནས་ངྱེག་བ་ཁྲུཛིན་པཁྲིུ་ཡིད་་ངྟོན་གི་འང་ལྔ།\n                                                                                                       (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Ý hiện tiền được chỉ ra ngay thời điểm này được chia làm năm loại.\n          1. Chấp sắc ý hiện tiền được chỉ ra ngay thời điểm này.\n          2. Chấp thanh ý hiện tiền được chỉ ra ngay thời điểm này.\n          3. Chấp hương ý hiện tiền được chỉ ra ngay thời điểm này.\n          4. Chấp vị ý hiện tiền được chỉ ra ngay thời điểm này.\n          5. Chấp xúc ý hiện tiền được chỉ ra ngay thời điểm này.\n   -   Ý hiện tiền được chỉ ra ngày thời điểm này có thể chấp trì sắc, thanh, hương, vị\n       và xúc, giống như căn hiện tiền, nhưng ở đây nó chỉ chấp trì [cảnh], không chứng\n       cảnh. (Sau này học lên sẽ hiểu tại sao)\n\n\nc. Cách sinh khởi\nÝ hiện tiền được chỉ ra ngay thời điểm này sinh khởi như thế nào? Có ba cách thừa\nnhận/ba luận điểm khác nhau\n       Cách ý hiện tiền được chỉ vào thời điểm này sinh khởi có 3 cách thừa nhận: Giao\n       thế sinh khởi, Tam hành sinh khởi, Duy tục biên sinh khởi.\n       སྐའས་ཁྲུདིང་འསྟན་གི་ཡིད་་ངྟོན་སྱེ་ཚུལ་ལ། སྱེལ་་ང་སྱེ་འ། ཁྲུགྟོས་གསུ་་པང་སྱེ་འ། རྒྱུན་་ཐཁྲུ་ཁྟོ་ནང་སྱེ་འ་དང་ཁྲུདྟོད་ཚུལ་གསུ་་ལས།\n                                                                                                       (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   Về cách sinh khởi của ý hiện tiền được chỉ ra ngay thời điểm này, có ba cách thừa\n       nhận/ba luận điểm khác nhau, đó là:\n          1. Giao thế sinh khởi\n              2. Tam hành sinh khởi\n              3. Duy tục biên sinh khởi\n\n\nc1. Cách thừa nhận thứ nhất: Giao thế sinh khởi\n              Cách thứ nhất Giao thế sinh khởi:\n              Chấp sắc căn hiện tiền sát na đầu tiên sinh khởi. Sau đó chấp sắc ý hiện tiền sát\n       na đầu tiên sinh khởi. Sau đó chấp sắc căn hiện tiền sát na thứ hai sinh khởi v..v.. Cứ\n       sau mỗi sát na của chấp sắc căn hiện tiền sinh khởi thì chấp sắc ý hiện tiền sinh khởi.\n                         དང་པྟོཁྲིུ་ཚུལ་ནི། གཟུགས་ཁྲུཛིན་དའང་་ངྟོན་སྐད་ཅིག་དང་པྟོ་སྱེ། དྱེཁྲིུ་རྱེས་སུ་གཟུགས་ཁྲུཛིན་ཡིད་་ངྟོན་སྐད་ཅིག་དང་པྟོ་སྱེ།\n       དྱེཁྲིུ་རྱེས་སུ་གཟུགས་ཁྲུཛིན་དའང་་ངྟོན་སྐད་ཅིག་གཉིས་པ་སྱེ་འ་སྟོགས་དའང་་ངྟོན་སྐད་ཅིག་ངྱེ་ངྱེཁྲིུ་འང་ཡིད་་ངྟོན་སྐད་ཅིག་ངྱེ་སྱེ་འང་ཁྲུདྟོད༑\n                                                                                                       (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   ‘Giao’: là giao nhau, đan xen.\n   -   ‘Thế’: là vị trí.\n\n\n                                                         © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 17 / 23>\n                                         TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n   -   Theo quan điểm Giao thế sinh khởi , Ý hiện tiền được chỉ ra ngay thời điểm này\n       sinh khởi như sau: Cứ sau mỗi sát-na của chấp sắc căn hiện tiền sinh khởi thì\n       chấp sắc ý hiện tiền sinh khởi. [Hai cái] cứ xen nhau như vậy, nên gọi là giao thế\n       sinh khởi:\n          ○ Đầu tiên, chấp sắc căn hiện tiền sát-na thứ nhất sinh khởi.\n          ○ Sau đó, chấp sắc ý hiện tiền sát-na thứ nhất sinh khởi.\n          ○ Tiếp theo, chấp sắc căn hiện tiền sát-na thứ hai sinh khởi,\n          ○ Rồi chấp sắc ý hiện tiền sát-na thứ hai sinh khởi.\n\n\n                                          Tự tông bài phá Giao thế sinh khởi\n               Trong Lượng lý trang nghiệm luận do Đức Đạt Lai Lạt Ma đời thứ nhất Gyalwa\n       Gedun Drup biên soạn đã nói rằng: “Sẽ không trở nên trình hiện mà tướng không gián\n       đoạn”. Ý là nếu giao thế sinh khởi thì tướng của cảnh sẽ không thể trình hiện mà không\n       gián đoạn. Ở đây bài phá tha tông cho rằng ý hiện tiền sinh khởi theo cách xen kẻ bởi vì\n       mọi người đều hiểu rằng căn hiện tiền liên tục chấp trì cảnh nhưng tha tông cho rằng căn\n       hiện tiền bị ý hiện tiền làm gián đoạn vì thế cảnh không thể trình hiện trước căn hiện\n       tiền mà không gián đoạn.\n                  རྒྱལ་འ་དགྱེ་ཁྲུདུན་སྒྲའ་པས་་ཛད་པཁྲིུ་ཚད་་ཁྲིུ་ངིགས་རྒྱན་ལས་རྣ་་ཆད་་ྱེད་པ་ངང་་ི་ཁྲུརྒྱུང།                   ཞྱེས་གསུངས།\n       དའང་་ངྟོན་དྱེ་ཚོ་ལ་ལལ་འང་་་ཆད་པང་ངང་་ི་ཐུའ་ཆགས།\n                                                                                                (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   ‘Đức Đạt Lai Lạt Ma đời thứ nhất Gyalwa Gedun Drup’: Chữ ‘đời thứ nhất’ ở\n       đây không có nghĩa như vua đời thứ nhất, đời thứ hai, đời thứ ba, hay tổng thống\n       nhiệm kỳ thứ nhất, thứ hai.\n       Ở đây nói về ‘hóa thân’, có thể tạm hiểu là một cá thể trải qua nhiều kiếp sống.\n   -   Trong Lượng Lý Trang Nghiêm Luận do Đức Đạt Lai Lạt Ma đời thứ nhất Gyalwa\n       Gedun Drup biên soạn có nói: “Sẽ không trở nên trình hiện mà tướng không gián\n       đoạn.”\n       Câu này nghĩa là gì? Ở đây đang bài phá quan điểm Giao thế sinh khởi.\n                    Giao thế sinh khởi là xen [kẽ] nhau.\n       Ví dụ:\n        [Theo Giao thế sinh khởi:] Nhãn tri chấp trì cái bình ở sát na thứ nhất vừa xong\n→ Ý hiện tiền chấp trì cái bình sát na thứ nhất sinh khởi lên, [rồi đến] → Nhãn tri chấp\ntrì cái bình sát na thứ nhì [khởi lên và chấm dứt, rồi đến] → Ý hiện tiền chấp trì cái bình\nsát na thứ nhì khởi lên [và chấm dứt];\n       => Nó cứ đan xen nhau như vậy; tức là nó bị gián đoạn. Bị gián đoạn như vậy\nthì cảnh của cái bình cũng bị gián đoạn.\n       [Tha tông cho rằng] Khi mình đang nhìn cái bình liên tục trong năm giây thì cảnh\nbị xen kẽ/bị gián đoạn.\n\n                                                      © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 18 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n   -   Giao thế sinh khởi là căn hiện tiền bị ý hiện tiền làm gián đoạn. Vì vậy, cảnh\n       không thể trình hiện trước căn hiện tiền mà không gián đoạn. Nghĩa là, cảnh đó\n       bị gián đoạn nên không thể trình hiện trước căn hiện tiền.\n   -   [Tự tông bài phá Giao thế sinh khởi]: Cho nên, nếu chấp nhận quan điểm Giao\n       thế sinh khởi, thì tướng của cảnh “sẽ không trở nên trình hiện mà tướng không\n       gián đoạn”. [Trong khi mình đang nhìn cái bình liên tục trong năm giây thì cảnh\n       không thể bị xen kẽ/bị gián đoạn] => Đây là cách bài phá tha tông, những quan\n       điểm cho rằng ý hiện tiền sinh khởi theo cách Giao thế sinh khởi.\n\n\nc2. Cách thừa nhận thứ 2: Tam hành sinh khởi\n       Cách thứ hai Tam hành sinh khởi:\n       Chấp sắc căn hiện tiền sát na thứ hai, chấp sắc ý hiện tiền sát na đầu tiên và tự chứng\n       hiện tiền trải nghiệm hai hiện tiền đó đồng sinh khởi cùng lúc. Tóm lại, nghĩa chứng\n       lưỡng hành hướng ngoại và tự chứng nhất hành hướng nội đồng sinh khởi.\n       གཉིས་པཁྲིུ་ཚུལ་ནི་གཟུགས་ཁྲུཛིན་དའང་་ངྟོན་སྐད་ཅིག་གཉིས་པ་དང་། གཟུགས་ཁྲུཛིན་ཡིད་་ངྟོན་སྐད་ཅིག་དང་པྟོ།\n       དྱེ་གཉིས་ཉ་ས་སུ་མྟོང་འཁྲིུ་ངིང་ངིག་་ངྟོན་སུ་་དང་གསུ་་དུས་་ཉ་་དུ་སྱེ་འང་ཁྲུདྟོད་པ་སྟྱེ།\n       ་དྟོང་ན་ཁ་ཕིང་ལྟས་ཀི་ཁྲུགྟོས་གཉིས་དང་ཁ་ནང་ལྟས་ཀི་ཁྲུགྟོས་གཅིག་ཅིག་ཆང་དུ་སྱེ་འང་ཁྲུདྟོད།\n                                                                                           (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   ‘Tam’: ba\n   -   ‘Hành’: đi\n   -   ‘Tam hành’: nghĩa là ba cái đi cùng lúc\n   -   ‘Đồng sinh khởi’: cùng xảy ra một lúc.\n   -   Ban đầu là chấp sắc căn hiện tiền sát-na thứ nhất sinh khởi riêng/không đi chung\n       với ai. Sau đó, chấp sắc căn hiện tiền sát-na thứ hai sảy ra chung [sinh khởi đồng\n       thời] với chấp sắc ý hiện tiền sát-na đầu tiên và cùng lúc với tự chứng hiện tiền\n       mà trải nghiệm hai hiện tiền trên. Nghĩa là một tự chứng hiện tiền trải nghiệm\n       hai hiện tiền (Chấp sắc căn hiện tiền sát-na thứ hai và chấp sắc ý hiện tiền sát-\n       na đầu tiên), ba cái này sinh khởi cùng một lúc nên gọi là tam hành sinh khởi.\n   -   ‘Nghĩa chứng Lưỡng hành hướng ngoại và tự chứng nhất hành hướng nội đồng\n       sinh khởi’:\n          ○ ‘Lưỡng hành hướng ngoại’: là hai cái hướng ngoại đi chung\n                  ○ Chấp sắc căn hiện tiền sát-na thứ hai.\n                          ○ Chấp sắc ý hiện tiền sát-na đầu tiên.\n             ○ ‘Nhất hành hướng nội’ là tự chứng hiện tiền.\n                  ○ Tự chứng hướng nội vì nó chứng tâm thức, và ở đây nó trải nghiệm\n                      hai hiện tiền kia.\n             ➢ Như vậy, lưỡng (hai) hành hướng ngoại và nhất (một) hành hướng nội\n               đồng thời sinh khởi, nên gọi là tam hành sinh khởi.\n\n\n\n                                                   © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 19 / 23>\n                               TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n\n\n                              Tự tông bài phá Tam hành sinh khởi\n             Ngài Gyen Khenpo cũng công nhận Tam hành sinh khởi bởi vì trong Thích\n      Lượng Luận Minh Giải Thâm Ý của Panchen Sonam Dragpa có nói: “Nếu vậy, nếu hỏi\n      vậy Gyen Khenpo công nhận Tam hành sinh khởi sao? Công nhận điều đó bởi vì trong\n      Trang có nói.”\n\n\n             Lượng Lý Tạng do Sakya Pandita Kunga Gyaltsen trước tác công nhận Tam hành\n      sinh khởi: “Giao thế và duy tục biên, cả hai đều có cái làm hại, do đó hiện tiền là tam\n      hành.”\n             ཚད་་་ངིགས་གཏྱེང་ལས། སྱེལ་་ང་འ་དང་རྒྱུན་གི་་ཐཁྲུ། གཉིས་ཀ་ལ་ཡང་གནྟོད་བྱེད་ཡྟོད། དྱེས་ན་་ངྟོན་སུ་་ཁྲུགྟོས་གསུ་་པ།\n                                                                       (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n      1. Quan điểm tam hành sinh khởi cho rằng có ba cái cùng sinh khởi:\n                i. Chấp sắc căn hiện tiền sát na thứ hai.\n                ii. Chấp sắc ý hiện tiền sát na thứ nhất.\n                iii. Tự chứng hiện tiền trải nghiệm hai hiện tiền đó.\n           Ba cái sinh khởi cùng một lúc nên gọi là tam hành sinh khởi.\n           Trong đó, có hai hành hướng ngoại và một hành hướng nội.\n           => Có 3 cái đi chung với nhau nên gọi là Tam hành sinh khởi.\n      2. Nhưng tự tông lại cho rằng:\n           ● Cách này không phải là tam hành sanh khởi.\n           ● Nó chỉ là lưỡng hành sanh khởi thôi. Bởi vì:\n                Tự chứng [iii. Tự chứng hiện tiền trải nghiệm hai hiện tiền đó] không là\n                nhất hành hướng nội. Bởi vì, có đến 2 tự chứng:\n                ○ Một là Tự chứng trải nghiệm chấp sắc căn hiện tiền sát na thứ hai.\n                ○ Hai là Tự chứng hiện tiền trải nghiệm chấp sắc ý hiện tiền sát na đầu\n                  tiên.\n                     => Như vậy, có đến 2 Tự chứng.\n                          [Cùng với 2 Chấp sắc trước đó là Chấp sắc căn hiện tiền sát na thứ\n                          hai và Chấp sắc ý hiện tiền sát na đầu tiên] thành ra là đến 4, như\n                          vậy là tứ hành sinh khởi rồi.\n      3. Đối lập giả mới nói rằng không cần tính thành hai; bởi vì hai tự chứng hiện\n         tiền đều hướng nội, nên có thể nhập lại thành một. Như vậy, vẫn tính là ba.\n      4. Lập giả/[tự tông] bắt bẻ tiếp: Nếu như bạn nói thì có thể gộp thành hai thôi,\n         tức là nhị hành sinh khởi/lưỡng hành sinh khởi.\n\n\n\n                                        © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 20 / 23>\n       TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n            Bởi vì Chấp sắc căn hiện tiền sát na thứ hai và Chấp sắc ý hiện tiền sát na thứ\n            nhất đều hướng ngoại, cho nên có thể gộp thành một luôn.\n            [Một hành hướng nội và một hành hướng ngoại] Cho nên chỉ còn hai hành.\n\n\nc3. Cách thừa nhận thứ 3: Duy tục biên sinh khởi\n       Cách thứ ba Duy tục biên sinh khởi (sinh vào duy cuối cùng của dòng lưu):\n       Tôn ý của Tổ Tsong Khapa và 2 đại đệ tử đồng ý là chấp sắc ý hiện tiền sinh ở duy sau\n       cuối của sát na cuối cùng của chấp sắc căn hiện tiền.\n       གསུ་་པཁྲིུ་ཚུལ་ནི། རྱེ་ཡའ་སྲས་ཀི་དགྟོངས་པ། གཟུགས་ཁྲུཛིན་དའང་་ངྟོན་སྐད་ཅིག་ཐ་་ཁྲིུ་་ཇུག་ཐྟོགས་ཁྟོ་ནང་གཟུགས་ཁྲུཛིན་ཡིད་་ངྟོན་སྱེ་འང་འཞྱེད།\n                                                                                              (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n   -   ‘Duy tục biên sinh khởi’: nghĩa là sinh vào duy cuối cùng của dòng lưu.\n   -   Cách thứ ba này cũng là quan điểm của tự tông, là tôn ý của Tổ Tsong Khapa và\n       hai đại đệ tử là Khedrup Rinpoche [Khedrup Gelek Pelzang] và Gyaltsab\n       Rinpoche [Gyaltsab Je Dharma Rinchen].\n   -   Theo tôn ý của Tổ Tsong Khapa và hai đại đệ tử: chấp sắc ý hiện tiền sinh ở duy\n       sau cuối của sát-na cuối cùng của chấp sắc căn hiện tiền.\n              Ở đây mình chưa học kỹ về sát-na; trước mắt hiểu sát-na là một đơn vị đo\n       thời gian.\n       Ví dụ: Lấy Nhãn tri chấp trì cái bình, giả sử nhãn tri nhìn cái bình trong một\n       khoảng thời gian:\n       Mình đang nhìn cái bình trong năm giây. Phải chờ cho nhãn tri chấp trì/nhìn cái\n       bình hết năm giây, sau khi ngừng nhìn/nhãn tri [chấp trì cái bình] đó chấm dứt thì\n       ý hiện tiền chấp trì cái bình mới sinh khởi. Nghĩa là phải chờ cho nhãn tri chấp\n       trì cái bình kết thúc, rồi chấp sắc ý hiện tiền mới sinh khởi ngay sau đó.\n       Cho nên mới nói: Chấp sắc ý hiện tiền sinh ở duy sau cuối của sát-na cuối cùng\n       của chấp sắc căn hiện tiền. Ví dụ, nếu nhãn tri nhìn cái bình trong năm giây thì\n       ngay sau khi khoảng năm giây đó vừa chấm dứt, chấp sắc ý hiện tiền mới sinh\n       khởi.\n   -   Quan điểm Duy tục biên sinh khởi không giống hai quan điểm trước.\n\n\nTóm tắt\n   1. Giao thế sinh khởi:\n   - Chấp sắc căn hiện tiền sinh khởi → Chấp sắc ý hiện tiền sinh khởi;\n   - Sau đó, lại căn hiện tiền sinh khởi → Rồi lại Chấp sắc ý hiện tiền sinh khởi;\n   - Cứ xen kẽ nhau như vậy.\n   2. Tam hành sinh khởi:\n   - Đi “bộ ba” [“bộ ba” đồng sinh khởi]\n\n\n                                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 21 / 23>\n                         TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n   3. Duy tục biên sinh khởi: Không đi “bộ ba” [như Tam hành sinh khởi], cũng\n      không đi xen kẽ [như Giao thế sinh khởi]. [Đối với Duy tục biên sinh khởi,] chờ\n      Chấp sắc căn hiện tiền chấm dứt → Chấp sắc ý hiện tiền sinh khởi ngay sau cuối\n      cùng của Chấp sắc căn hiện tiền.\n\n\n[Thầy hướng dẫn cách biện kinh cho Bài tập về nhà-câu số 03]\nBiện kinh: Liễu tri vô sai loạn có phải là tánh tướng của Hiện tiền không.\nLG:    Lấy Liễu tri vô sai loạn làm biện đề, ứng thành là tánh tướng của Hiện tiền sao?\nĐLG: Tại sao?\nLG: Ứng thành là tánh tướng của Hiện tiền, bởi vì giữa nó và Hiện tiền, mối quan hệ\ngiữa sở tướng và tánh tướng được thành lập và tám ngả nhất thiết được khẳng định.\nĐLG: Không nhất thiết.\n   -   Nếu ĐLG trả lời “Lý do không thành lập” thì phải đi chứng minh.\n   -   Nếu trả lời “Không nhất thiết”, nghĩa là: Nếu mối quan hệ giữa sở tướng và tánh\n       tướng được thành lập và tám ngả nhất thiết được khẳng định thì không nhất thiết\n       là tánh tướng của cái đó [Hiện tiền].\nLG: Ứng thành là nếu mối quan hệ giữa sở tướng và tánh tướng được thành lập và tám\nngả nhất thiết được khẳng định thì không nhất thiết là tánh tướng của Hiện tiền sao?\nĐLG: Đồng ý.\nLG: Ứng thành nếu mối quan hệ giữa nó và Vô thường được thành lập và tám ngả\nnhất thiết được khẳng định thì không nhất thiết nó là tánh tướng của Vô thường sao?\nĐLG: Đồng ý.\n   -   Nếu ĐLG nói “Không nhất thiết” thì phải đưa ra sự tướng.\n   -   Nêu· ĐLG đồng ý thì lại quay trở về chỗ cũ là: Nếu mối quan hệ giữa sở tướng\n       và tánh tướng được thành lập và tám ngả nhất thiết được khẳng định thì nhất\n       thiết là tánh tướng [của Hiện tiền].\n       → ĐLG phải đồng ý.\nLG:    Lấy Liễu tri vô sai loạn làm biện đề, ứng thành là tánh tướng của Hiện tiền sao?\nĐLG: Đồng ý.\nLG: Lấy Liễu tri vô sai loạn làm biện đề, ứng thành là Một với Liễu tri ly phân biệt và\nkhông sai loạn sao?\nĐLG: Tại sao?\nLG: Lấy Liễu tri vô sai loạn làm biện đề, ứng thành là Một với Liễu tri ly phân biệt và\nkhông sai loạn, bởi vì là tánh tướng của Hiện tiền.\nĐLG: Không nhất thiết.\n   -   Biện đề: [Lấy] Liễu tri vô sai loạn [làm biện đề]\n   -   Vi pháp: [Ứng thành] Là Một với Liễu tri ly phân biệt và không sai loạn\n\n                              © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 22 / 23>\n      TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n   - Nhân: [Bởi vì là] Tánh tướng của Hiện tiền.\n   ➢ ĐLG không thể nói “Lý do không thành lập”, bởi vì ở trên ĐLG đã đồng ý “Liễu\n     tri vô sai loạn là tánh tướng của Hiện tiền”.\n   ➢ ĐLG phải trả lời “Không nhất thiết”, nghĩa là: Ứng thành nếu là tánh tướng của\n     Hiện tiền thì không nhất thiết là Một với Liễu tri ly phân biệt và vô sai loạn.\n             Sư cô hỏi mọi người có hiểu chỗ này không? Có hiểu mình đang biện kinh\n      gì không? Đừng ngồi im, phải biết mình đang biện về cái gì.\nLG: Ứng thành là nếu là tánh tướng của Hiện tiền thì không nhất thiết là Một với Liễu\ntri ly phân biệt và không sai loạn sao?\nĐLG: Đồng ý.\n             Các pháp đồng nghĩa với Phản thể của Liễu tri ly phân biệt và không sai\n      loạn (Nếu không biết thì nhớ lại phần Phản thể của Thực hữu.)\n          1. Là Một với Liễu tri ly phân biệt và không sai loạn.\n          2. Liễu tri ly phân biệt và không sai loạn mà đã trở thành Một với Liễu tri\n             ly phân biệt và không sai loạn.\n          3. Là tánh tướng của Hiện tiền.\n          4. Hội tam chất hữu pháp của Hiện tiền.\n             Bốn điểm này nhất thiết lẫn nhau.\n            Một với Liễu tri ly phân biệt và không sai loạn thì nhất thiết là Tánh tướng\n      của Hiện tiền\n             =>ĐLG không được trả lời là “Không nhất thiết”.\n             => Nếu ĐLG trả lời “Không nhất thiết” thì LG hỏi: Xin bạn hãy nêu ra\n      [các pháp đồng nghĩa với] Phản thể của Liễu tri ly phân biệt và không sai loạn.\n             => Khi ĐLG nêu 4 [pháp] đồng nghĩa với Phản thể của Liễu tri ly phân\n      biệt và không sai loạn thì LG có thể [tuyên bố] Otsa.\n             => Cho nên, ĐLG phải đồng ý khi LG nói “Ứng thành là nếu là tánh\n      tướng của Hiện tiền thì không nhất thiết là Một với Liễu tri ly phân biệt và không\n      sai loạn sao?”\nLG: Ứng thành không là Một với Liễu tri ly phân biệt và không sai loạn bởi vì là Khác\nvới Liễu tri ly phân biệt và vô sai loạn.\n      LG chứng minh ngược lại, quay về điều gốc [là “ứng thành” đầu tiên].\n\n\nBÀI TẬP VỀ NHÀ\n   1. Sự khác biệt giữa Liễu tri Ly phân biệt và Ý tri\n   2. Sự khác biệt giữa Liễu tri Vô sai loạn và Căn tri\n\n\n\n                              © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 23 / 23>\n                      TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n 3. Viết bài biện kinh về Liễu tri vô sai loạn có phải là tánh tướng của Hiện tiền\n    không?\n\n\nGhi bài: Nguyễn Thị Hiệp, Trịnh Thanh,Hoàng Thị Trúc Quỳnh, Phạm Thị Thu Hòa, Vương\n Đình Thái Quý, Đỗ Thị Thu Hiền, Hoàng Mai Anh, Lục Thị Thu Thủy, Nguyễn Mai Thảo,","note":"Văn bản trích xuất từ tài liệu bài giảng; đối chiếu với bản gốc khi cần nguyên văn LG/ĐLG."},{"id":"TLH20261011","title":"Bài giảng – Căn hiện tiền và Ý hiện tiền (11/10/2026)","text":"<PARSED TEXT FOR PAGE: 1 / 15>\n                     TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n\n\n                                                                              Bài 04\n\n                                             CĂN HIỆN TIỀN (tiếp theo)\n                                                       Ý HIỆN TIỀN\n\n                                                       Ngày 11 tháng 10 năm 2026\n\n                                 Giảng sư: Geshe Lharampa Lobsang Ngodrup\n                                        Việt dịch: Ani Tenzin Palyon Pháp Đăng\n\n\n\n\n[Sư cô nhắc nhở và động viên học viên cố gắng hiểu bài mỗi tuần, đừng để mình bị rơi\nlại, bị tụt hậu. Mình phải bảo đảm hiểu bài mỗi tuần thì mới theo kịp. Cô cho biết năm\nnay môn này thật sự không khó, trong các môn học ở đây, môn này là môn dễ nhất.\nThầy & Sư cô cho biện kinh để ôn bài cũ. ]\nLG: Ứng thành không phải như vậy đâu, bởi vì bạn chưa nói ra được cách ‘Ý hiện\ntiền được chỉ ra ngay thời điểm này’ sinh khởi như thế nào?\nĐLG: Lý do không thành lập.\nLG:    Ứng thành có sao?\nĐLG: Đồng ý.\nLG:    Xin hãy nói ra có bao nhiêu cách thừa nhận?\nĐLG: Giao thế sinh khởi, Tam hành sinh khởi và Duy tục biên sinh khởi.\nLG:    Xin hãy giải thích Giao thế sinh khởi như thế nào?\nĐLG: Chấp sắc căn hiện tiền sát na đầu tiên sinh khởi. Sau đó Chấp sắc ý hiện tiền sát\nna đầu tiên sinh khởi. Sau đó Chấp sắc căn hiện tiền sát na thứ hai sinh khởi v..v.. Cứ\nsau mỗi sát na của Chấp sắc căn hiện tiền sinh khởi thì Chấp sắc ý hiện tiền sinh khởi.\nLG:    Xin hãy giải thích Tam hành sinh khởi như thế nào?\nĐLG: Chấp sắc căn hiện tiền sát na thứ hai, Chấp sắc ý hiện tiền sát na đầu tiên và Tự\nchứng hiện tiền trải nghiệm hai hiện tiền đó đồng sinh khởi cùng lúc. Tóm lại, nghĩa\nchứng lưỡng hành hướng ngoại và tự chứng nhất hành hướng nội đồng sinh khởi.\n\n\n                           © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 2 / 15>\n         TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nSư cô tiếp tục làm rõ xem học viên có hiểu bài không:\nSư cô:         Tiếp tục sau đó là gì nữa?\nHọc viên:     Sau đó là Chấp sắc căn hiện tiền ở sát na thứ ba, Chấp sắc ý hiện tiền ở\nsát na thứ hai và Tự chứng hiện tiền trải nghiệm hai hiện tiền đó đồng sinh khởi.\nSư cô:         Đúng rồi, nó cứ xen xen vậy đó.\nSư cô lưu ý thêm, bộ ba này sẽ xảy ra cùng một lúc:\n-   Chấp sắc căn hiện tiền ở sát na thứ hai;\n-   xảy ra cùng một lúc với Chấp sắc ý hiện tiền ở sát na đầu tiên;\n-   [cùng với] Tự chứng hiện tiền trải nghiệm hai hiện tiền đó xảy ra cùng một lúc.\n-   Và sau đó cứ tiếp tục như vậy. Hai cái hướng ngoại và một cái hướng nội [cùng\n    sinh khởi].\nLG: Xin hãy giải thích Duy tục biên sinh khởi như thế nào?\nĐLG: Tôn ý của Tổ Tsong Khapa và 2 đại đệ tử đồng ý là chấp sắc ý hiện tiền sinh ở\nduy sau cuối của sát na cuối cùng của chấp sắc căn hiện tiền.\nSư cô yêu cầu học viên giải thích một cách đơn giản để thể hiện là đã hiểu bài.\nHọc viên lấy ví dụ khi mình nhìn cái bình trong 5 sát na, thì cái sát na trước cái sát\ncuối cùng chấm dứt thì Chấp sắc ý hiện tiền sẽ sinh khởi.\nSư cô sửa lại là [theo cách thừa nhận của Duy tục biên sinh khởi], thì phải nhìn cái\nbình trong 5 sát na, cho đến khi sát na cuối cùng chấm dứt thì Chấp sắc ý hiện tiền mới\nsinh khởi [chứ không phải là sát na trước cái sát na cuối cùng như học viên đã nói].\nLG:      Vì sao Giao thế sinh khởi không được tự tông mình chấp nhận?\nĐLG: Bởi vì Trong Lượng lý trang nghiêm luận do Đức Đạt Lai Lạt Ma đời thứ nhất\nGyalwa Gedun Drup biên soạn đã nói rằng: “Sẽ không trở nên trình hiện mà tướng\nkhông gián đoạn”.\nLG:      Vì sao Tam hành sinh khởi không được tự tông mình chấp nhận?\nĐLG: Thứ nhất, Tự tông mình cho rằng, không phải là Tam hành sinh khởi mà chỉ có\nLưỡng hành sinh khởi thôi. Bởi vì Chấp sắc căn hiện tiền sát na thứ hai và Chấp sắc ý\nhiện tiền sát na đầu tiên đều là hướng ngoại nên có thể gộp thành một; cùng với một\nhành hướng nội là Tự chứng hiện tiền trải nghiệm hai hiện tiền đó; cho nên chỉ có hai\nhành cùng sinh khởi thôi, chứ không phải là ba hành cùng sinh khởi.\nThứ hai, có hai hành hướng ngoại là Chấp sắc căn hiện tiền sát na thứ hai và Chấp sắc\ný hiện tiền sát na đầu tiên; cũng có hai hành hướng nội là Tự chứng hiện tiền trải\nnghiệm cho mỗi hành hướng ngoại; như vậy là có bốn hành cùng sinh khởi, chứ không\nphải là chỉ có ba hành cùng sinh khởi.\nSư cô:         Nếu theo [cách thừa nhận] tứ hành sinh khởi thì biện kinh như thế nào?\n               Lập giả sẽ lấy lý do gì để cho rằng tứ hành sinh khởi?\n\n\n                            © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 3 / 15>\n                      TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nHọc viên:     Tự chứng hiện tiền trải nghiệm hai hiện tiền đó có thể tách ra làm hai:\n              1. Tự chứng hiện tiền trải nghiệm chấp sắc căn hiện tiền sát na thứ\n                 hai\n              2. Tự chứng hiện tiền trải nghiệm chấp sắc ý hiện tiền sát na đầu tiên\n              [Lưỡng hành hướng nội, cùng với lưỡng hành hướng ngoại (Chấp sắc\n              căn hiện tiền sát na thứ hai và Chấp sắc ý hiện tiền sát na đầu tiên),\n              thành ra là tứ hành sinh khởi.]\nSư cô:        Tại sao nhập lại thành hai [hành sinh khởi]?\nHọc viên:     Lưỡng hành hướng ngoại [Chấp sắc căn hiện tiền sát na thứ hai và\n              Chấp sắc ý hiện tiền sát na đầu tiên] có thể nhập lại thành một [cùng\n              với nhất hành hướng nội là Tự chứng hiện tiền trải nghiệm hai hiện tiền\n              đó, thành ra là lưỡng hành sinh khởi].\nThầy:         Tại sao mình có thể gộp lưỡng hành hướng ngoại thành một được?\n              Lý do là gì?\nHọc viên:     Bởi vì Chấp sắc căn hiện tiền sát na thứ hai và Chấp sắc ý hiện tiền sát\nna\n              thứ nhất, đều là hướng ngoại, cho nên mình có thể gộp lại thành một.\nCô:           Hướng ngoại là gì? Hướng ra ngoài là hướng ra đâu?\nHọc viên:     Hướng ngoại là chấp vào cảnh ở bên ngoài.\nThầy:         Tự vì ở trong Tự chứng hiện tiền là nhất hành hướng nội.\n              Có hai tự chứng, nhưng cả hai đều hướng nội, cho nên có thể gộp lại\n              thành một cái, [thành ra là nhất hành hướng nội].\n              Tương tự như vậy, Chấp sắc căn hiện tiền sát na thứ hai và Chấp sắc ý\n              hiện tiền sát na thứ nhất cũng đồng hướng ngoại. Cho nên mình có thể\n              gộp lại thành nhất hành hướng ngoại, giống như Tự chứng hiện tiền.\n              Vì vậy, mình có thể dựa vào đây để biện kinh rằng không có tam hành\n              sinh khởi, mà phải là tứ hành sinh khởi hoặc lưỡng hành sinh khởi.\n              Vậy trong ba cách sinh khởi này, tự tông mình công nhận cách nào?\nHọc viên:     Tự tông công nhận Duy tục biên sinh khởi.\n\n\nSư cô:       Lấy thí dụ Nhãn tri chấp trì cái bình trong năm sát na, vậy ở chỗ nào\nsanh ra được Ý hiện tiền được chỉ ra ngay thời điểm này, nếu theo tự tông của mình?\nSư cô giảng lại về Duy tục biên sinh khởi:\n-   ‘Duy tục biên sinh khởi’: [theo nghĩa Hán - Tạng] có nghĩa là ‘ở ngay cuối của\n    dòng lưu’.\n-   ‘Tục’: có nghĩa là ‘liên tục’.\n\n\n                             © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 4 / 15>\n         TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n-   ‘Biên’: có nghĩa là ‘biên giới’.\n-   ‘Duy tục biên’: có nghĩa là ‘ngay cuối cùng của biên giới đó’.\nSư cô:         Nếu nhãn tri chấp trì cái bình diễn ra trong năm sát na thì Ý hiện tiền\n               chấp trì cái bình sinh khởi lúc nào, theo tự tông?\nHọc viên:      Khi Chấp sắc căn hiện tiền của nhãn tri chấp trì cái bình vừa chấm dứt\n               thì Ý hiện tiền sinh khởi liền luôn.\nLG: [Lấy nhãn tri chấp trì cái bình diễn ra trong năm sát na làm biện đề,] Ứng thành\ntục biên là chỗ nào/biên giới của dòng lưu là chỗ nào?\nĐLG: Là ngay sau cuối cùng của sát na thứ năm.\nLG: Ứng thành sinh ngay sau cuối cùng của sát na thứ năm của [Nhãn tri chấp trì]\ncái bình sao?\nĐLG: Đồng ý.\nLG:      Ứng thành không sinh ở sát na thứ hai hay thứ ba sao?\nĐLG: Đồng ý.\nLG: Lấy [Chấp sắc] Căn hiện tiền sát na thứ tư làm biện đề, ứng thành không là nhân\ncủa [Chấp sắc] Ý hiện tiền sao?\nĐLG: Tại sao?\nLG: Chấp sắc căn hiện tiền sát na thứ tư, ứng thành có phải là nhân của chấp sắc ý\nhiện tiền không?\nĐLG: Tại sao?\nLG:      Ứng thành là nhân sao?\nĐLG: Đồng ý.\nLG: Ứng thành sinh ngay sau sát na cuối cùng, tức là sát na thứ năm của chấp sắc\ncăn hiện tiền sao?\nĐLG: Đồng ý.\nLG: Ứng thành không sinh ngay sau sát na thứ năm (tức là sát na cuối cùng) mà là\nsanh ra ở ngay sau sát na thứ tư.\nĐLG: Lý do không thành lập.\nLG: Ứng thành sinh ngay sau phần cuối cùng của sát na thứ tư, bởi vì là sinh ra ở\nsát na thứ tư.\nĐLG: Lý do không thành lập.\nLG: Ứng thành sinh ngay sau cuối cùng của sát na thứ tư, bởi vì là quả của sát na\nthứ tư.\nĐLG: Lý do không thành lập.\nSư cô giải thích thêm:\n\n\n                             © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 5 / 15>\n                        TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n-       Sư cô hỏi học viên có biết cái gì là quả sát na thứ tư không? (Biện đề là gì?)\n        Và sư cô xác định [biện đề] là Chấp sắc Ý hiện tiền.\n-       Nếu ĐLG trả lời “Lý do không thành lập”, có nghĩa là: Chấp sắc Ý hiện tiền\n        KHÔNG LÀ quả của sát na thứ tư.\n-       [Trong khi đó, Chấp sắc Ý hiện tiền đúng là quả của sát na thứ tư.]\n-       Học viên cho rằng Chấp sắc Ý hiện tiền không được sinh ra ở sát na thứ tư mà\n        đến ngay sau cuối cùng của sát na thứ năm mới được sinh.\n        → Sư cô trả lời rằng không cần phải sanh trực tiếp, có thể sinh gián tiếp; có nhân\n         trực tiếp và [cũng có] nhân gián tiếp mà.\n          Ở đây không cần xác định là trực tiếp nhân hay gián tiếp nhân, chỉ cần xác\n          định là nhân thôi.\nSư cô tóm tắt lại bài biện kinh:\n    -     Lúc đầu, LG/Thầy yêu cầu ĐLG/Học viên đưa ra cách Ý hiện tiền sinh khởi như\n          thế nào, theo cách Duy tục biên sinh khởi như tự tông của mình đã thừa nhận.\n    -     LG/Thầy hỏi tiếp: Vậy tục biên là chỗ nào? (Tục biên: có nghĩa là biên giới của\n          dòng tương tục. Ở đây, biên giới của dòng tương tục chấm hết ngay chỗ nào?)\n          Lấy ví dụ Nhãn tri chấp trì cái bình trong vòng 5 sát na, thì duy tục biên sinh\n          khởi là sanh ở ngay chỉ ngay cái biên giới cuối cùng của cái dòng lưu của sát\n          na.\n    -     Khi nãy, ĐLG/Học viên trả lời là Ý hiện tiền sinh khởi ngay sau cái cuối cùng\n          của sát na thứ năm.\n                 → Tục biên là biên giới của dòng tương tục. Vậy biên giới của dòng\n          tương tục chấm hết tại chỗ nào?\n    -     Ví dụ, nhãn tri chấp trì cái bình diễn ra trong năm sát na. Theo cách Duy tục\n          biên sinh khởi, ý hiện tiền chỉ sinh khởi ngay sau phần cuối cùng của dòng\n          tương tục, tức là ngay sau khi sát na thứ năm vừa chấm dứt.\n    -     LG/Thầy mới nói là “Ứng thành là có sanh sau sát na thứ tư bởi vì nó là quả\n          của sát na thứ tư.” (Nó: là [Chấp sắc] Ý hiện tiền, nó là quả nên nó phải sanh\n          sau, chứ không được sanh trước.)\n    -     Ở đây, mình đang bàn về cách [Chấp sắc] Ý hiện tiền sinh khởi. Theo Duy tục\n          biên sinh khởi, trước hết phải xác định tục biên nằm ở đâu.\n          Ví dụ, mình nhìn cái bình (nhãn tri chấp trì cái bình) trong vòng mười phút.\n          Vậy tục biên nằm ở đâu?\n                 → Tục biên nằm ngay sau khi phút thứ mười vừa chấm dứt.\n    -     Bây giờ mình thế số vào thôi.\n          Nếu nhãn tri chấp trì cái bình diễn ra trong năm sát na thì Chấp sắc Ý hiện tiền\n          sinh khởi lúc nào?\n\n                               © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 6 / 15>\n        TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n              → Chấp sắc Ý hiện tiền sinh khởi ngay sau khúc cuối cùng của sát na\n        thứ năm.\nLG:     Ứng thành không là quả sanh ngay sau khúc cuối của sát na thứ tư sao?\n    -   Ứng thành nó là quả vì nó sanh. Nhưng nó có sanh ngay sau khúc cuối của sát\n        na thứ tư không?\n        → Nó chỉ sanh ngay sau sát na thứ năm [nên không thể là quả sanh ngay sau\n        khúc cuối của sát na thứ tư.]\n\n\nThầy dặn dò lớp:\n-   Khi biện kinh, mình/ĐLG chỉ cần trả lời “Đồng ý”, “Tại sao’, “Không nhất thiết”,\n    “Lý do không thành lập” thì bài biện kinh sẽ tiếp tục được.\n-   [Sau khi kết thúc bài học] Mình về nghe đi nghe lại, nghe tới nghe lui là sẽ thông.\n-   Đừng đưa thêm những câu hỏi như “Cái này vậy phải không”, “Cái kia phải\n    không”, làm như vậy [sẽ khiến] mạch biện kinh bị đứt, tư duy của mình không tiếp\n    tục được.\n-   Biện kinh là phải để lập luận đi tới, đi tới.\n\n\n[Thầy & Sư cô hướng dẫn đi lại bài biện kinh.]\nLG: Lấy Chấp sắc Căn hiện tiền được năm sát na làm biện đề, ứng thành Chấp sắc\nÝ hiện tiền là duy tục biên sinh khởi sao?\nĐLG: Đồng ý.\nLG:     Ứng thành chỉ sinh ngay sau khúc cuối của sát na thứ năm sao?\nĐLG: Đồng ý.\nLG:     Ứng thành không phải Chấp sắc Ý hiện tiền chỉ duy sinh ngay sau sát na cuối\n        cùng, tức là sát na thứ năm của nhãn tri chấp trì cái bình, bởi vì nó cũng sinh\n        ngay sau cuối sát na thứ tư, sát na thứ ba.\nĐLG: Lý do không thành lập.\nLG:     Lấy Ý hiện tiền được chỉ ra ngay thời điểm này làm biện đề, ứng thành không\n        sinh ngay sau tục biên/ngay sau cuối của sát na thứ tư sao?\nĐLG: Đồng ý.\nLG:     Lấy Ý hiện tiền được chỉ ra ngay thời điểm này làm biện đề, ứng thành không\n        là quả của nhãn tri chấp trì cái bình sát na thứ tư sao?\nĐLG: Tại sao?\nLG:     Lấy Ý hiện tiền được chỉ ra ngay thời điểm này làm biện đề, ứng thành là quả\n        của nhãn tri chấp trì cái bình sát na thứ tư sao?\nĐLG: Đồng ý.\n\n\n                             © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 7 / 15>\n                    TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nLG:   Ứng thành sinh ngay sau sát na thứ tư sao?\nĐLG: Tại sao?\nLG:   Ứng thành sinh ngay sau sát na thứ tư, bởi vì là quả của sát na thứ tư.\nĐLG: Không nhất thiết.\nLG:   Ứng thành nếu Ý hiện tiền đó là quả của nhãn tri chấp trì cái bình ở sát na thứ\n      tư, thì không nhất thiết phải sinh ngay sau cuối của sát na thứ tư sao?\n      Khi thầy nói sinh ngay sau cuối sát na thứ tư, tức là nó phải sinh sau sát na thứ\n      tư.\nĐLG: Đồng ý.\nLG:   Ứng thành nếu là quả của sát na thứ tư thì nhất thiết phải sinh sau sát na thứ tư\n      sao?\n      Nếu là quả của sát na thứ tư thì phải sinh sau sát na thứ tư, nếu sinh trước thì\n      không phải là quả.\nĐLG: Đồng ý.\nLG:   Lấy Ý hiện tiền được chỉ ra ngay thời điểm này làm biện đề, ứng thành là sinh\n      ngay sau cuối của sát na thứ tư của nhãn tri chấp trì cái bình sao?\nĐLG: Đồng ý.\nLG:   Ứng thành không phải chỉ sinh ngay sau cuối của sát na thứ năm sao?\nĐLG: Tại sao?\n      -   ‘Duy tục biên sinh khởi’: có nghĩa là chỉ sinh duy nhất ngay sau sát na thứ\n          năm; nhưng ở đây không có duy nhất được, vì nó còn sinh sau sát na thứ\n          tư, sát na thứ ba nữa.\n      -   “Duy” là chỉ có một, trong khi ở đây nó còn sinh ở chỗ khác nữa.\nLG:   Ứng thành không phải là duy sinh ngay sau sát na thứ năm sao?\nĐLG: Tại sao?\nLG:   Ứng thành không sinh ở sát na thứ tư sao?\nĐLG: Đồng ý.\nLG:   Ứng thành sinh sau sát na thứ tư, bởi vì là quả của sát na thứ tư.\nĐLG: Không nhất thiết.\nLG:   Ứng thành là quả của sát na thứ tư thì không nhất thiết sinh sau sát na thứ tư\n      sao?\nĐLG: Đồng ý.\nLG:   Ứng thành nếu là quả của sát na thứ tư thì nhất thiết phải sinh ngay sau cuối của\n      sát na thứ tư, bởi vì nếu là quả của sát na thứ tư thì nhất thiết phải sinh sau sát\n      na thứ tư.\nĐLG: Lý do không thành lập.\n\n                           © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 8 / 15>\n           TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n\n\nThầy dặn dò lớp:\n-       Thầy hỏi lớp đã biết biện kinh chưa? Biện kinh không có đúng sai. Biết biện kinh\n        là được rồi. Mình cứ bẻ qua bẻ lại, giống như nướng bánh mì phải lật qua lật lại,\n        không thì nó cháy, chứ đâu phải chỉ để phân định đúng sai.\n-       Thầy thấy năm nay lớp mình yếu quá. Năm ngoái, khi biện kinh, mọi người tranh\n        nhau trả lời. Còn năm nay, sao biện kinh mà cứ e dè, thụt ra thụt vào, không giống\n        như ngày xưa vậy?\n-       Năm nay mọi người phải trả lời nhiều hơn. Thầy thấy lớp mình tham gia biện kinh\n        yếu quá.\n\n\n        Quan điểm của các vị đại học giả về ba cách thừa nhận: Giao thế sinh khởi,\n                     Tam hành sinh khởi, Duy tục biên sinh khởi.\n-       Ngài Gyen Khenpo, một trong những đại học giả Ấn Độ, là người công nhận Giao\n        thế sinh khởi và Tam hành sinh khởi.\n-       Ở đây, mình đang nói chuyện xưa, không nói chuyện nay. Những bậc hiền triết đó\n        cũng trước tác các bộ luận nói về Lượng và cũng bàn thảo về vấn đề này. Ngài\n        Gyen Khenpo cho rằng có Giao thế sinh khởi và Tam hành sinh khởi.\n-       Một vị khác là Ngài Lobpon Choe Chog, công nhận Duy tục biên sinh khởi.\n-       Cho nên Tổ Tsong Khapa, đại đệ tử của Ngài là Gyaltsab Rinpoche, và Ngài\n        Panchen Sonam Dragpa, những vị thầy Tây Tạng, cũng đồng ý với quan điểm của\n        Ngài Lobpon Choe Choq, công nhận Duy tục biên sinh khởi.\n-       Trong khi đó, Ngài Khedrup Rinpoche, đệ tử của Ngài Tsong Khapa, lại công nhận\n        Tam hành sinh khởi, giống như [quan điểm] của Ngài Gyen Khenpo.\n    -    Trong khi đó, Ngài Khedrup Rinpoche lại công nhận Tam hành sinh khởi. Trong\n         bộ Nhân Minh Thất Luận Trang Nghiêm Trừ Ám Sớ, do Ngài biên soạn có công\n         nhận Tam hành sinh khởi.\n    -    Ngài Gyen Khenpo nói như thế này: Giao thế sinh khởi và Duy tục biên sinh khởi,\n         cả hai quan điểm này đều có thể bị tổn hại, bị đả phá bởi một chánh nhân khác.\n         Cho nên, Ngài chỉ công nhận Tam hành sinh khởi.\n    -    Ngoài ra, trong bộ Thích Lượng Luận Minh Giải Thâm Ý của Ngài Panchen\n         Sonam Dragpa, có nói: “Trong dòng tương tục của quán hiện thế giả, thời gian\n         cho chấp sắc ý hiện tiền sinh khởi không dài hơn một tối đoạn sát na.”\n\n           Ngoài ra trong Thích lượng luận Minh giải thâm ý của Sonam Dragpa có nói trong\n           dòng tương tục của quán hiện thế giả thời gian cho chấp sắc ý hiện tiền sinh khởi\n           không dài hơn một tối đoạn (ngắn nhất) sát na (thời biên tế sát na).\n\n\n\n                                © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 9 / 15>\n                                    TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n\n             དེ་ཡང་ཚུར་མཐོང་གི་རྒྱུད་ལ་ནི་གཟུགས་འཛིན་ཡིད་མངོན་དུས་མཐའི་སྐད་ཅིག་མ་རེ་རེ་ལས་མི་སེ་བར་འདོད་དགོས་པར་ཡིག་ཆར་གསལ་ལོ།\n                                                                                    (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n1. ‘Quán hiện thế giả” là gì?\n     - ‘Quán hiện’: có nghĩa là chỉ thấy trước mắt thôi.\n     - ‘Quán hiện thế giả’: có nghĩa là những người chỉ thấy những gì trước mắt,\n       chỉ biết đến đời sống hiện tại. Đó là những người phàm phu như chúng ta.\n               Những người không nghĩ đến kiếp tương lai, chỉ biết sống trong kiếp hiện tại,\n               sống bám vào kiếp này, không biết gì hơn thì được gọi là ‘quán hiện thế giả’.\n     -  [Trong dòng tương tục của quán hiện thế giả,] Thời gian cho chấp sắc ý hiện\n        tiền sinh khởi không dài hơn một tối đoạn sát na.\n 2. Trình tự sinh khởi theo tự tông mình đang học\n     - Đầu tiên, nhãn tri chấp trì cái bình, nó nhìn cái bình trong một khoảng thời\n         gian, bao nhiêu giây cũng được.\n     - Khi nó vừa nhìn xong hết thời gian nó muốn, ví dụ như nó nhìn cái bình trong\n         5 sát nha, thì ngay sau cuối cùng của sát na thứ năm, thì Ý hiện tiền sanh\n         khởi.\n  3. Ý hiện tiền là gì?\n     - ‘Ý hiện tiền’ là Hiển nhi bất định, nó là giác tri bất chứng cảnh. Nó không\n         chứng cảnh được, bởi vì nó xảy ra quá nhanh.\n     - Ở đây nói rằng, trong dòng tương tục của quán hiện thế giả, tức là những\n         người chỉ biết sống trong thế gian hiện tại, không nghĩ đến kiếp tương lai,\n         những người phàm phu như chúng ta, thì chấp sắc ý hiện tiền sinh khởi trong\n         dòng tương tục thì nó sinh khởi trong một khoảng thời gian rất ngắn, nó\n         không trụ lâu và không dài hơn một tối đoạn sát na.\n   4. ‘Tối đoạn sát na’ là gì?\n     - ‘Tối đoạn sát na’: có nghĩa là ‘thời biên tế sát na’.\n     - ‘Thời biên tế sát na’: Ví dụ, một người đang khỏe mạnh bình thường, không\n         phải người ốm yếu, dùng hai ngón tay búng một cái. Hai ngón tay búng vô\n         một cái thì cái thời gian búng tay đó được chia thành 65 lần [là bằng thời\n         gian của một thời biên tế sát na].\n                 [Nói cách khác,] Thời biên tế sát na là 1/65 quãng thời gian của một cái búng\n                 tay của người khỏe mạnh. Như vậy, đó là một khoảng thời gian cực kỳ ngắn.\n         -       Cho nên, ví dụ nhãn tri chấp trì cái bình diễn ra trong năm sát na, thì ngay\n                 sau phần cuối cùng của sát na thứ năm, [chấp sắc] ý hiện tiền/Ý hiện tiền\n                 chấp trì cái bình sinh khởi.\n                 Nhưng ý hiện tiền này sinh khởi trong một khoảng thời gian rất ngắn, chỉ\n                 bằng 1/65 thời gian của một cái búng tay.\n\n\n                                              © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 10 / 15>\n            TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n              Sau đó, tâm phân biệt chấp trì cái bình mới sinh khởi và nhớ lại cái bình.\n              Trình tự phải diễn ra như vậy.\n        -     Nếu chấp sắc ý hiện tiền, tức ý hiện tiền chấp trì cái bình, sinh khởi trong\n              một khoảng thời gian quá dài thì đến khi tâm phân biệt chấp trì cái bình sinh\n              khởi, nó sẽ không còn nhớ được cái bình nữa.\n\n\nSư cô tóm tắt lại vì sao Chấp sắc ý hiện tiền sinh khởi không dài hơn một tối đoạn\n(ngắn nhất) sát na (thời biên tế sát na)\n-     Vì vậy, ở đây giải thích rằng thời gian sinh khởi của Chấp sắc ý hiện tiền rất ngắn,\n      chỉ bằng 1/65 khoảng thời gian của một cái búng tay của người khỏe mạnh, chứ\n      không phải người ốm yếu.\n-     Chính vì thời gian sinh khởi quá ngắn nên ngay sau đó, tâm phân biệt chấp trì cái\n      bình mới có thể sinh khởi và nhớ lại cái bình.\n-     Nếu ý hiện tiền kéo dài quá lâu thì đến khi tâm phân biệt sinh khởi, nó sẽ không\n      còn nhớ được cái bình nữa.\n\n\nTrường phái nào công nhận nếu là tâm Hiện tiền thì nhất thiết là Ly phân biệt?\n[Ở đây có một câu hỏi liên quan đến Hiện tiền và Ly phân biệt]\nNếu là Hiện tiền thì nhất thiết phải là Ly phân biệt.\n1. Hiền tiện phân loại có bốn, trong đó bao gồm Ý hiện tiền và Căn hiện tiền.\n2. Bốn trường phái tư tưởng Phật giáo, gồm có:\n   ● Hữu bộ tông\n   ● Kinh bộ tông\n   ● Duy thức tông\n   ● Trung quán tông.\n3. Từ Trung Quán Y Tự Khởi tự khởi trở xuống, các trường phái đều công nhận\n   rằng [nếu là] Hiện tiền nhất thiết phải là Ly phân biệt.\n       [Bởi vì,] Tánh tướng của Hiện tiền là: ‘Liễu tri ly phân biệt và không sai loạn.’\n       Cho nên, theo các trường phái này, [nếu là] Hiện tiền nhất thiết phải là Ly phân\n       biệt.\n    4. Trong khi đó, Trung quán Ứng thành phái lại không công nhận như vậy.\n       Trung quán Ứng thành phái cho rằng tâm Hiện tiền không nhất thiết phải là Ly\n       phân biệt, bởi vì vẫn có trường hợp Hiện tiền là Phân biệt.\n       Lấy ví dụ về tâm phân biệt nhớ lại cái bình (thấy cái bình, rồi sau đó nhớ lại cái\n       bình). Đây là tâm phân biệt, nhưng lại là Hiện tiền, bởi vì nó không chứng cái bình\n       dựa vào chánh nhân.\n\n\n\n                                © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 11 / 15>\n                                  TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n    5. Bởi vì những Tri thức chứng cảnh mà không dựa vào Chánh nhân thì đều là Hiện\n       tiền.\n        Cho nên, tâm phân biệt nhớ lại cái bình cũng là Hiện tiền, bởi vì nó chứng cái bình\n        mà không dựa vào Chánh nhân.\n    6. Trong khi đó, Kinh bộ tông cho rằng Hiện tiền nhất thiết là Ly phân biệt.\n        Vì công nhận Hiện tiền nhất thiết là Ly phân biệt, Ý hiện tiền nhất thiết là Ly phân\n        biệt, do đó, đặt Ý hiện tiền vào ngay giữa Căn hiện tiền và Phân biệt.\n        Ví dụ:\n        -     [Trước tiên] Nhãn tri chấp trì cái bình → Rồi đến Chấp sắc ý hiện tiền khởi\n              lên (Ý hiện tiền chấp trì cái bình) khởi lên rất nhanh → Sau đó đến tâm Phân\n              biệt chấp trì cái bình.\n        -     Bởi vì [trường phái Kinh bộ tông] cho rằng Ý hiện tiền là Hiện tiền, nó Ly\n              phân biệt, không phải là Phân biệt, vì vậy, Ý hiện tiền được đặt ngay giữa Nhãn\n              tri chấp trì cái bình và tâm Phân biệt chấp trì cái bình; Ý hiện tiền xảy ra rất\n              nhanh, sau đó tới tâm phân biệt chấp trì cái bình.\n\n\n\n1.3.2.2.1. Ý hiện tiền được chỉ ra ngay thời điểm này (tiếp theo)\n[Nên hiểu rằng “Ý hiện tiền được chỉ ra ngay thời điểm này” là thời điểm nói câu: “Tri\nsắc có hai tướng, dựa vào nhãn và ý.” (đã học ở bài trước).]\n                     Nên hiểu rằng ‘Ý hiện Tiền đang nói ở ngay thời điểm này’ là thời điểm nói:\n             “tri Sắc, có hai tướng. Dựa vào nhãn và ý”.\n                      །སྐབས་འདིར་བསྟན་ཞེས་པ། གཟུགས་ཤེས་པ་ནི་རྣམ་གཉིས་དེ། །མིག་དང་ཡིད་ལ་བརེན་པའོ། ཞེས་པའི་སྐབས་ལ་གོ་དགོས་སོ།\n                      Nên hiểu rằng Ý hiện tiền đang nói ở ngay thời điểm này là thời điểm mà kinh nói: “tri Sắc,\n             có hai tướng. Dựa vào nhãn và ý”.\n                      ✔        Được nói trong kinh tức là lời Phật dạy\n                      ✔        Tri Sắc có nghĩa là biết Sắc.\n                      ✔        Biết về Sắc thì có 2 tướng đó là Nhãn và Ý i.e Căn hiện tiền và Ý hiện tiền\n                      ▪        Câu này có nghĩa là: Tri thức mà chứng được Sắc gồm có 2, đó là Nhãn (tức là Căn\n             hiện tiền) và Ý (tức là Ý hiện tiền). Ý hiện tiền được nhắc đến trong kinh là Ý hiện tiền đang nói ở ngay\n             thời điểm này.\n                                                                                                 (Trích SGK Tâm loại học 2026)\nGiải thích:\n-       ‘Tri sắc có hai tướng’:\n        ○ (1) Nhãn: Căn hiện tiền chấp sắc, ví dụ: Nhãn tri chấp trì cái bình, và\n        ○ (2) Ý: Ý hiện tiền chấp sắc, ví dụ: Ý hiện tiền chấp trì cái bình.\n    -   ‘Dựa vào nhãn và ý’: nghĩa là dựa vào tăng thượng duyên.\n            Ví dụ:\n\n\n                                              © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 12 / 15>\n         TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n       ○ Nhãn tri chấp trì cái bình dựa vào tăng thượng duyên là Nhãn căn.\n       ○ Ý hiện tiền chấp trì cái bình dựa vào tăng thượng duyên là Ý căn.\n       => Như vậy, đúc kết lại, Ngài Panchen Sonam Dragpa có nói rằng: “Chấp sắc ý\n       hiện tiền sinh khởi không dài hơn một tối đoạn sát na”.\n\n\n                Ngoài ra trong Thích lượng luận Minh giải thâm ý của Sonam Dragpa có nói\n         trong dòng tương tục của quán hiện thế giả thời gian cho chấp sắc ý hiện tiền sinh khởi\n         không dài hơn một tối đoạn (ngắn nhất) sát na (thời biên tế sát na).\n                དེ་ཡང་ཚུར་མཐོང་གི་རྒྱུད་ལ་ནི་གཟུགས་འཛིན་ཡིད་མངོན་དུས་མཐའི་སྐད་ཅིག་མ་རེ་རེ་ལས་མི་སེ་བར་འདོད་དགོས་པར་ཡིག་ཆར་གསལ་ལོ།\n                                                                                           (Trích SGK Tâm loại học 2026)\nGiải thích:\n   -     Chấp sắc ý hiện tiền (Ý hiện tiền chấp sắc) là hiện tượng cực kỳ ẩn tế.\n         Ví dụ: Hiện tượng ẩn tế\n   -     Vô thường, vô ngã, vô ngã cá thể: được gọi là hiện tượng ẩn tế, không phải hiện\n         tượng cực kỳ ẩn tế.\n         ○ Tại sao những hiện tượng này chỉ là ẩn tế, mà không phải cực kỳ ẩn tế?\n            → Bởi vì những hiện tượng đó có thể dựa vào chánh nhân để chứng minh.\n            Từ đó sinh ra tỷ độ, gọi là sự thế tỷ độ.\n         ○ Chánh nhân được sử dụng ở đây gọi là Sự thế chánh nhân.\n         ○ Dựa vào chánh nhân ấy để chứng được vô thường, cho nên, sanh ra tỷ độ;\n           gọi là Sự thế tỷ độ.\n   -     Đối với hiện tượng cực kỳ ẩn tế, chẳng hạn như câu nói “Thí đắc tài, giới sinh\n         lạc”, có nghĩa là bố thí sẽ được giàu sang, giữ giới sẽ được hạnh phúc.\n   -     Đối với những hiện tượng này, bản thân mình đâu có thể hiểu hay trực tiếp thấy\n         được.\n                ‘Bố thí sẽ được giàu sang’, [vì xảy ra trong tương lai nên] mình không\n         thể thấy được, làm sao bây giờ mình thấy được? Vì quá ẩn tế nên những hiện\n         tượng như vậy được gọi là Cực kỳ ẩn tế.\n   -     Vì vậy, [để thấy được,] mình phải nương vào lời Phật dạy, Phật dạy sao thì nghe\n         vậy, tức là dựa vào cái gọi là “Tam sát thanh tịnh Thánh ngôn”, có nghĩa là\n         dựa vào giáo ngôn được thanh tịnh bởi ba sự khảo sát.\n               Điều đó có nghĩa là giáo ngôn ấy đã được khảo sát qua ba phương diện,\n         đem nó ra để thí nghiệm/để khảo xem nó có đậu hay không.\n               Ví dụ: Với câu “Thí đắc tài, giới sinh lạc”, mình cần xác định ý nghĩa\n         của câu này có đúng hay không?\n\n\n\n\n                                        © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 13 / 15>\n                     TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n        ● [Sau khi bàn cãi] Thì chứng minh là ý nghĩa câu này là đúng, không có nhầm\n          lẫn; bởi vì đây là giáo ngôn được thanh tịnh bởi ba khảo sát. Nó dựa vào\n          chánh nhân để chứng được. [Về phần chánh nhân, từ từ mình sẽ học đến.]\n        ● Chánh nhân này là cực kỳ ẩn tế. [Vì sao là cực kỳ ẩn tế?]\n           Bởi vì, để chứng minh ý nghĩa của câu “Thí đắc tài, giới sinh lạc” là đúng\n           và không nhầm lẫn, thì mình phải dựa vào việc cái lời này được thanh tịnh\n           bởi ba khảo sát.\n           Nói một cách dễ hiểu hơn là có những hiện tượng cực kỳ ẩn tế mà mình\n           không thể chiêm nghiệm, không thể thấy, không thể sờ mó, không thể hiểu\n           được, thì mình phải nghe theo lời Phật dạy.\n           => Đó là lý do tại sao ý nghĩa của câu “Thí đắc tài, giới sinh lạc” không bị\n           nhầm lẫn, không sai lệch bởi vì nó là giáo ngôn mà đã được thanh tỉnh bởi\n           ba khảo sát rồi.\n           Từ từ mình sẽ học đến đây.\n           Cho nên hiện tượng cực kỳ ẩn tế là như vậy.\n-       ‘Tri sắc có hai tướng, dựa vào nhãn và ý’: ‘dựa vào ý’ ở đây chính là Ý hiện\n        tiền được chỉ ra ngay thời điểm này.\n        ● Đối với câu nói này, mình chỉ có thể tin rằng ý nghĩa của nó không bị nhầm\n            lẫn, bởi vì đây là giáo ngôn được thanh tịnh bởi ba sự khảo sát.\n        ● Mình không thể chứng minh ý nghĩa của câu nói ấy bằng một chánh nhân\n            nào khác.\n           Không giống như cách mình chứng minh câu: “Lấy âm thanh làm biện đề,\n           tại sao là Vô thường, bởi vì là Tác”. Lúc này, mình có thể dựa vào chánh\n           nhân [bởi vì là Tác] để chứng minh một hiện tượng ẩn tế thôi.\n           Còn đối với hiện tượng cực kỳ ẩn tế, mình không dựa vào chánh nhân/Sự\n           thế chánh nhân mà mình phải dựa vào Tín hứa chánh nhân.\n    -   ‘Tín hứa chánh nhân’: có nghĩa là một tín tâm.\n         Ở đây là tín tâm cho rằng ‘Tri sắc có hai tướng, dựa vào nhãn và ý’ là giáo\n         ngôn mà được thanh tịnh bởi ba sự khảo sát.\n         Mình chỉ tin vậy thôi, chứ không giống như là mình chứng minh “lấy âm\n         thành làm biện để, ứng thành là Vô thường, bởi vì là Tác”. (“Âm thanh là vô\n         thường” chỉ là hiện tượng ẩn tế.)\n         Đối với hiện tượng cực kỳ ẩn tế thì không chứng minh bằng lý, mà phải chứng\n         mình bằng trích dẫn [để cho thấy] cái lời này là Tam sát thanh tịnh thanh ngôn\n         (lời mà đã được thanh tịnh qua khảo sát rồi), cho nên phải tin nó.\n         Đó là hiện tượng cực kỳ ẩn tế.\n\n\n\n\n                            © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 14 / 15>\n         TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nÝ hiện tiền được chỉ ra ngay thời điểm này nằm trong dòng tương tục của Quán\n                        hiện thế giả là Hiển nhi bất định .\nGiải thích:\n-     ‘Hiển nhi bất định’: có nghĩa là nó vừa là tâm hiện tiền, vừa là giác tri bất chứng\n      cảnh, tức là không chứng được cảnh.\n      Cho nên, theo tự tông, Ý hiện tiền được chỉ ra ngay thời điểm này là Hiển nhi bất\n      định.\n-     Mình đã học Y hiện tiền được chỉ ra ngay thời điểm này qua câu kinh “Tri sắc có\n      hai tướng, dựa vào nhãn và ý.”\n\n\nBây giờ, mình học đến Ý hiện tiền mà đó không là cái đó.\n1.3.2.2.2. Ý hiện tiền mà đó không là cái đó\n                Ý hiện tiền mà đó không là cái đó\n                Thứ hai, Ý hiện tiền mà đó không là cái đó: Thí dụ Tha tâm thông.\n                །གཉིས་པ་ནི་གཞན་སེམས་ཤེས་པའི་མངོན་ཤེས་ལྟ་བུའོ། །\n\n\n                                                                     (Trích SGK Tâm loại học 2026)\nGiải thích:\n-     ‘Không là cái đó’: Ví dụ như Tha tâm thông.\n-     ‘Tha tâm thông’: là một trong sáu loại thần thông (lục thông). [Khi một người] Đắc\n      được Tha tâm thông thì Tha tâm thông ấy là Ý hiện tiền mà không là cái đó.\n    - Có nghĩa là nó vẫn là Ý hiện tiền, nhưng không phải Ý hiện tiền được chỉ ra ngay\n       thời điểm này, cho nên gọi là Ý hiện tiền mà không là cái đó.\n\n\nBÀI TẬP VỀ NHÀ\nViết bài biện kinh bàn về Duy tục biên sinh khởi.\n\n\n       Ghi bài: Hoàng Mai Anh, Nguyễn Thị Hồng Diễm, Đỗ Thị Thu Hiền, Nguyễn Thị Hiệp,\n                        Phạm Thị Thu Hòa, Vương Đình Thái Quý, Hoàng Thị Trúc Quỳnh,\n                                                               Nguyễn Mai Thảo, Lục Thị Thu Thủy\n                                                     Duyệt bài ghi: Ani Tenzin Palyon Pháp Đăng\n                                         Chúng con nguyện Sư Thầy và Sư Cô được vĩnh khang!\n\n\n                  Nguyện cho các Bậc Thầy kính yêu phúc thọ an khang,\n         Nguyện cho cơn mưa to Mật pháp tối thượng thấm nhuần khắp mọi nơi,\nNguyện cho mật nhũ Kim Cang Thừa xuôi dòng Cửu Long đến tận quê hương con,\n\n\n\n                                 © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 15 / 15>\n             TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nNguyện cho giáo pháp diệu thâm của Đức Thích Ca chiếu sáng đời đời.\n\n\n\n\n                   © Nalanda Việt Học 2026 - 2027* lớp THPG11","note":"Văn bản trích xuất từ tài liệu bài giảng; đối chiếu với bản gốc khi cần nguyên văn LG/ĐLG."},{"id":"TLH20261018","title":"Bài giảng – Tự chứng và Du già hiện tiền (18/10/2026)","text":"<PARSED TEXT FOR PAGE: 1 / 24>\n                            TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n\n\n                                                                                  Bài 05\n\n\n                                                      TỰ CHỨNG HIỆN TIỀN\n                                                            DU GIÀ HIỆN TIỀN\n\n                                                            Ngày 18 tháng 10 năm 2026\n\n\n                                        Giảng sư: Geshe Lharampa Lobsang Ngodrup\n                                                Việt dịch: Ani Tenzin Palyon Pháp Đăng\n\n\n\n\nCầu nguyện và hồi hướng cho hai hương linh\nTrong tuần này có hai người mới qua đời, đó là:\n-       Bác Nguyễn Văn Thắng: Chồng của chị Lê Thị Thúy, lớp 5.\n-       Bác Lê Thị Sảng: Mẹ của anh Đình Quốc Trung, lớp 9.\nBây giờ, hai vị không còn là con người nữa mà được gọi là hương linh, đang ở trong thân\ntrung ấm.\n1. Thân trung ấm là gì?\n    Thân trung ấm là giai đoạn chuyển tiếp, giai đoạn trung gian (trung ấm) để đi tìm chỗ\n    đầu thai.\n    Trong giai đoạn này:\n    -    Hương linh đang đi tìm chỗ tái sinh.\n    -    Hương linh sống nhờ ngửi, không ăn được mà chỉ ngửi [mùi hương]. Vì vậy, mình\n         mới cúng kiến. Chữ “hương” ở đây có nghĩa là mùi hương.\n2. Quá trình tái sinh trong 49 ngày:\n\n                                   © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 2 / 24>\n                   TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n   Trong 49 ngày, người ta thường làm lễ cầu siêu, gồm bảy thất. Chữ “thất” có nghĩa là\n   số bảy; bảy thất, tức là bảy lần bảy, bằng 49 ngày.\n   a. Quá trình sinh khởi của thân trung ấm:\n       -   Cứ đến ngày thứ bảy, nếu thần thức trong thân trung ấm chưa tìm được chỗ đầu\n           thai thì thân trung ấm ấy phải chết đi, rồi lập tức sinh khởi trở lại.\n       -   Quá trình này diễn ra rất nhanh. Sau đó, [hương linh] lại tiếp tục đi tìm chỗ đầu\n           thai.\n       -   Cứ như vậy, cho đến ngày thứ bảy mà chưa tìm được chỗ đầu thai thì thân trung\n           ấm lại chết đi, rồi sống lại và tiếp tục tìm chỗ đầu thai.\n   b. Ví dụ về việc tìm chỗ đầu thai:\n       -   Muốn đầu thai thì phải có cha, có mẹ.\n       -   Ví dụ, mình có duyên làm con của một người nào đó, nhưng lúc mình chết thì\n           người ấy vẫn còn là một đứa trẻ, chưa lập gia đình. [Như vậy], mình không thể\n           đầu thai làm con của người ấy [ngay lúc đó].\n       -   Có khi phải chờ rất nhiều kiếp mới gặp lại nhau, bởi vì luân hồi rất xa. Cho nên,\n           mình phải đầu thai vào một chỗ khác.\n   c. Ngày thứ 49:\n           Đến ngày thứ 49, tức ngày cuối cùng của tuần thứ bảy, nếu trong 48 ngày trước\n       đó vẫn chưa tìm được chỗ đầu thai thì lúc này bắt buộc phải đầu thai.\n          Bắt buộc đầu thai có nghĩa là đầu thai “đại” [ngẫu nhiên], bởi vì [thần thức]\n       chưa có cha mẹ [mới].\n3. Nghiệp quyết định nơi tái sinh:\n      Điều nguy hiểm là khi còn sống, mình đã tạo rất nhiều nghiệp từ vô thủy đến nay,\n   gồm:\n       -   Ác nghiệp\n       -   Thiện nghiệp\n       -   Nghiệp vô ký\n       -   Và nhiều loại nghiệp khác.\n       Khi đi đầu thai, nghiệp nào trổ quả trước thì mình sẽ tái sinh theo nghiệp ấy.\n       -   Nếu ác nghiệp trổ quả trước: Có thể tái sinh vào ba nẻo ác và phải chịu khổ.\n       -   Nếu thiện nghiệp trổ quả trước: Được hưởng phước, tái sinh vào cõi lành.\n4. Cầu nguyện cho hai hương linh:\n\n\n                                 © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 3 / 24>\n                          TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n       Bây giờ mình cầu nguyện cho hai hương linh, Bác Nguyễn Văn Thắng và Bác Lê\n   Thị Sảng.\n   a. Được tái sinh vào cõi lành:\n       Cầu nguyện [cho hai vị] được thiện nghiệp trổ quả, tái sinh vào cõi lành, tức cõi\n   Trời hoặc cõi Người.\n   b. Gặp được Phật pháp và thoát khỏi luân hồi:\n       Không chỉ cầu nguyện cho hai vị được sáng suốt, tìm được chỗ tái sinh làm người\n   hay sinh lên cõi Trời, mình còn cầu nguyện cho hai vị:\n       -   Gặp được Phật pháp.\n       -   Gặp được minh sư, thiện tri thức chỉ dạy tu hành theo đạo Phật.\n       -   Từ đó thoát khỏi luân hồi, thành Phật để làm lợi lạc cho chúng sinh.\n5. Quán niệm về cái chết và sự vô thường:\n      [Khi cầu nguyện], mình không chỉ cầu nguyện một cách đơn giản, giống như một\n   người bàng quan thấy người khác qua đời rồi cầu nguyện cho họ.\n       Mình phải nhớ kỹ rằng, khi cầu nguyện, cần khởi động cơ suy nghĩ về cái chết và\n   sự vô thường của chính mình.\n   a. Suy nghĩ về cái chết của chính mình:\n      Bây giờ mình đang cầu nguyện cho hai người đã mất. Nhưng trong số những người\n   đang cùng cầu nguyện, không ai biết được ai sẽ là người ra đi trước, [để] rồi những\n   người còn lại sẽ cầu nguyện cho người ấy.\n       Biết đâu ngày mai, chính mình lại là người được người khác cầu nguyện. Mình\n   [không thể] biết [trước], bởi vì cái chết là vô thường.\n       Cho nên, mình phải tư duy về điều này và [nhận] thấy rằng bản thân mình cũng như\n   vậy.\n   b. Sự tiếp diễn của sinh tử trong luân hồi:\n      Trong luân hồi, mọi việc cứ tiếp diễn:\n       -   Người còn sống cầu nguyện cho người đã ra đi trước.\n       -   Rồi người còn sống ấy cũng sẽ ra đi.\n       -   Những người đi sau [lại tiếp tục] cầu nguyện cho họ.\n      Cứ như vậy mãi trong luân hồi.\n      Vì vậy, khi cầu nguyện [cho hai hương linh], mình phải nghĩ đến bản thân:\n       -   Sau này ai sẽ cầu nguyện cho mình\n\n\n                                 © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 4 / 24>\n                    TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n        -   Mình còn sẽ cầu nguyện cho ai nữa?\n       Biết cuộc đời là vô thường thì mình phải biết tu hành.\n6. Hướng dẫn tụng chú và hồi hướng:\n      Thầy hướng dẫn cả lớp cùng cầu nguyện và hồi hướng cho hai hương linh, Bác\n   Nguyễn Văn Thắng và Bác Lê Thị Sảng.\n    a. Quy Y và Phát tâm Bồ đề:\n       Lớp trưởng đọc lại bài Quy y và Phát tâm Bồ đề ba lần.\n    b. Tụng thần chú:\n      Mỗi người lấy chuỗi ra, chắp tay và cùng tụng một chuỗi, tức 108 biến thần chú Om\n   Mani Padme Hum, để cầu nguyện và hồi hướng cho hai hương linh.\n    c. Hồi hướng:\n       Sau khi tụng xong 108 biến, lớp trưởng đọc phần hồi hướng:\n        -   Bắt đầu từ câu:\n                              “Văn Thù tri nhận như thế,\n                              Phổ Hiền cũng chứng như vậy,”\n        -   Đọc đến trước bài cầu trường thọ cho Thầy thì dừng lại, không đọc bài cầu\n            trường thọ.\n      Lớp trưởng hướng dẫn mọi người lấy chuỗi ra, chắp tay và cùng cầu nguyện cho hai\n   hương linh.\n\n\nBây giờ, mình học đến phần Tự chứng hiện tiền.\n1.3.3. Tự chứng hiện tiền\n1. Phân biệt tâm thức hướng ngoại và hướng nội:\n       Khi học về Tự chứng hiện tiền, mình cần biết rằng tâm thức có loại hướng ngoại\n   và có loại hướng nội.\n    a. Tâm thức hướng ngoại:\n       Tâm thức hướng ngoại là tâm thức có đối cảnh ở bên ngoài.\n       Ví dụ:\n        -   Nhãn tri chấp trì cái bình.\n        -   Nhãn tri, nhĩ tri, tỷ tri, thiệt tri, thân tri [chấp trì pháp nào đó] đều là tâm thức\n            hướng ngoại, vì đối cảnh của chúng là những đối tượng bên ngoài.\n\n\n                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 5 / 24>\n                                         TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n    b. Tâm thức hướng nội:\n           -    Tự chứng là tâm thức hướng nội.\n           -    Tự chứng hướng nội có nghĩa đối cảnh của nó là tâm thức, chứ không phải\n                những đối tượng ở bên ngoài. Vì vậy mới gọi là hướng nội.\n2. Tánh tướng của Tự chứng:\n    Năng thủ hành tướng là tánh tướng của Tự chứng.\n    འཛིན་རྣམ་རང་རིག་གི་མཚན་ཉིད། རང་རིག་ཤེས་པ་ལ་གཉིས་སྣང་ནུབ། ཤེས་པ་ལས་གཞན་པའི་སྒྲ་དི་རློ་སློགས་སྣང་གི་མ་རེད།\n                                                                              (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n-   Tánh tướng của Tự chứng: Năng thủ hành tướng.\n-   ‘Năng thủ hành tướng’: có nghĩa là một dạng tâm thức mà chỉ có tâm thức khác trình\n    hiện trước nó.\n        + Bản thân nó là tâm thức.\n        + Đối tượng trình hiện trước nó cũng là một tâm thức khác, một tri thức khác.\n    → Cho nên mới gọi là Năng thủ hành tướng.\n\n\n3. Tánh tướng của Tự chứng hiện tiền:\n    Năng thủ hành tướng, ly phân biệt, không sai loạn là tánh tướng của Tự chứng hiện\n    tiền.\n    རློག་པ་དང་བལ་ཞིང་མ་འཁྲུལ་བའི་འཛིན་རྣམ་རང་རིག་མངློན་སུམ་གི་མཚན་ཉིད།\n(trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n    -     Tự chứng và Tự chứng hiện tiền là đồng nghĩa.\n    -     [Ngoài tánh tướng của Tự chứng,] Tự chứng hiện tiền có thêm tánh tướng của Hiện\n          tiền là [liễu tri] “ly phân biệt và không sai loạn”.\n          [→ Vì vậy, tánh tướng của Tự chứng hiện tiền là: Năng thủ hành tướng, ly phân\n          biệt, không sai loạn.]\n\n\n4. Tự chứng hiện tiền trải nghiệm tâm thức hướng ngoại:\n    -     Nếu là tri thức hướng ngoại thì nhất thiết phải có Tự chứng hiện tiền trải nghiệm\n          chính nó.\n    -     Ở đây, chữ “chính nó” có nghĩa là chính tâm thức hướng ngoại đó.\n\n                                                   © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 6 / 24>\n                        TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n        Ví dụ:\n        “Nhãn tri chấp trì cái bình” là một tri thức hướng ngoại\n        → nhất thiết phải có Tự chứng hiện tiền trải nghiệm nhãn tri chấp trì cái bình.\n5. Phân loại của Tự chứng hiện tiền:\n    Phân loại có 3: Lượng mà đã trở thành là tự chứng hiện tiền, Tái quyết tri mà đã trở\n    thành là tự chứng hiện tiền, Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền.\n    དབེ་ན། དེར་གྱུར་པའི་ཚད་མ། བཅད་ཤེས། སྣང་ལ་མ་ངེས་དང་གསུམ།\n                                                            (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n    Tự chứng hiện tiền được phân thành ba loại:\n                                   1. Lượng mà đã trở thành là tự chứng hiện tiền.\n                                   2. Tái quyết tri mà đã trở thành là tự chứng hiện tiền.\n                           3. Hiển nhi bất định mà đó đã trở thành là tự chứng hiện\n                              tiền.\n    a. Lượng mà đã trở thành là tự chứng hiện tiền:\n        -       Đây là một tri thức, vừa là Tự chứng hiện tiền, vừa là Lượng.\n        Ví dụ:\n        Lấy Tự chứng hiện tiền ở sát na thứ nhất trải nghiệm nhãn tri chấp trì cái bình làm\n        biện đề.\n    b. Tái quyết tri mà đã trở thành là tự chứng hiện tiền:\n        Ví dụ:\n        Lấy Tự chứng hiện tiền ở sát na thứ hai trải nghiệm nhãn tri chấp trì cái bình làm\n        biện đề.\n        Tự chứng hiện tiền ở sát na thứ hai này:\n            -    Không phải là Lượng, mà là Tái quyết tri.\n            -    Vừa là Tự chứng hiện tiền, vừa là Tái quyết tri.\n        Cho nên, được gọi là Tái quyết tri mà đã trở thành tự chứng hiện tiền.\n    c. Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền:\n[Để giải thích cho phân loại thứ ba, Sư cô dẫn chứng một trường phái ngoại đạo ở Ấn Độ,\ngọi là Thuận Thế phái.]\n6. Thuận thế phái là gì?\n\n\n\n                                      © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 7 / 24>\n                              TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n          Nếu hiểu theo nghĩa đen, những người theo Thuận thế phái là những người sống\n      thuận theo thời thế.\n          Quan điểm của trường phái này:\n           -   Chỉ công nhận đời sống hiện tại, không công nhận hay tin vào đời sau hay kiếp\n               sau.\n           -   Cho rằng con người chỉ có một kiếp sống duy nhất hiện tại, cho nên cứ sống\n               thoải mái và hưởng thụ những gì mình muốn trong đời này.\n           -   Không công nhận những hiện tượng ẩn tế mà chỉ công nhận hiện tượng hiện\n               tiền, vì muốn chứng được hiện tượng ẩn tế thì phải dựa vào chánh nhân.\n           -   Chỉ công nhận tâm hiện tiền, không công nhận tỷ độ..\n          Sư cô nhắc lại rằng người theo Thuận thế phái chỉ [công nhận] tâm hiền tiện, không\n      đề cập đến hiện tượng hiện tiền để tránh mọi người bị nhầm lẫn.\n      a. Ví dụ về tỷ độ trong dòng tâm thức của người theo Thuận thế phái:\n         [Mặc dù không công nhận Tỷ độ, nhưng] trong dòng tâm thức của người theo Thuận\n      Thế phái vẫn có tỷ độ sinh khởi, [chỉ là] họ không nhận biết được đó là tỷ độ.\nVí dụ:\nMột người theo Thuận Thế phái đi vào rừng và muốn tìm lửa để nấu trà.\n  -     Khi nhìn lên núi, ông thấy khói đang bay lên.\n  -     Ông liền nghĩ rằng: “Ở trên đó chắc chắn phải có lửa.”\n  -     Vì vậy, ông đi lên chỗ có khói để xin lửa nấu trà.\n→ Như vậy, trong dòng tâm thức của ông (người theo Thuận Thế phái) vẫn có tỷ độ sinh\nkhởi, mặc dù ông không công nhận tỷ độ.\n      b. Tỷ độ là gì? Tánh tướng của tỷ độ là gì?\nĐam trước tri dựa vào sở y (điểm tựa) của chính nó đó là chánh nhân để không nhầm\nlẫn sở lượng ẩn tế của chính nó là tánh tướng của Tỷ độ.\nརང་གི་རེན་རགས་ཡང་དག་ལ་བརེན་ནས་རང་གི་གཞལ་བ་ལགློ ་གྱུར་ལ་མི་སླུ་བའི་ཞེན་རིག་རེས་དཔག་གི་མཚན་ཉིད༑\n                                                    (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\nTỷ độ là tri thức chứng cảnh dựa vào chánh nhân\n       [Trong ví dụ trên], khi nhìn thấy khói, người theo Thuận Thế phái biết rằng trên đó\ncó lửa. Ông dựa vào lý do có khói để biết rằng nơi ấy có lửa, rồi đi lên xin lửa nấu trà.\n         Nhưng ông ấy không hề biết rằng trong dòng tâm thức của mình đang có tỷ độ sinh\nkhởi.\n      c. Sự tướng của ‘Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền’\n\n                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 8 / 24>\n                        TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n      Từ ví dụ trên, Sư cô đưa ra sự tướng:\n      ‘Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của người theo Thuận\n      Thế phái.’\n      Tự chứng hiện tiền ấy là hiển nhi bất định.\n      Tại sao?\n      -   Bởi vì người theo Thuận Thế phái không công nhận tỷ độ ngay từ đầu. Họ không\n          công nhận kiếp sau, cũng không công nhận những hiện tượng ẩn tế, mà chỉ công\n          nhận những hiện tượng hiện tiền.\n      -   Mặc dù trong dòng tâm thức của họ có tỷ độ sinh khởi, nhưng họ không biết đó\n          là tỷ độ.\n      → Cho nên, tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của người\ntheo Thuận Thế phái chính là sự tướng của ‘Hiển nhi bất định mà đó đã trở thành là tự\nchứng hiện tiền’.\n      -   Sở dĩ gọi là hiển nhi bất định vì người ấy không biết tri thức được tự chứng hiện\n          tiền trải nghiệm chính là tỷ độ.\n7. Tự chứng hiện tiền và Niệm tri\n   a. Phân biệt hai cách nói\n       [Khi] nói đến tự chứng hiện tiền trải nghiệm nhãn tri chấp trì cái bình, cần phân biệt\n   hai cách nói:\n          -       “Cái bình đó tôi thấy.”\n          -       “Tôi thấy cái bình.”\n       Hai câu này khác nhau ở điều được nhấn mạnh.\n       i. “Cái bình đó tôi thấy.”\n          [Câu này] đang nhấn mạnh vào cái bình, tức là đối cảnh ở phía trước.\n       ii. “Tôi thấy cái bình.”\n              -    Chữ “tôi” ở đây không có nghĩa là con mắt của mình thấy cái bình, mà chính\n                   là nhãn tri chấp trì cái bình.\n              -    Mình đã học rằng nhãn căn chỉ là tăng thượng duyên để sinh ra nhãn tri\n                   chấp trì cái bình.\n                   → Cho nên khi mình nhìn thấy cái bình, chính nhãn tri thấy cái bình, chứ\n                   không phải nhãn căn.\n    b. Tự chứng hiện tiền và sự sinh khởi của Niệm tri\n       Chẳng hạn mình nói: “Hôm qua tôi có thấy cái bình.”\n\n\n\n                                      © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 9 / 24>\n                        TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n     -   Đây là [lúc] mình đang nhớ lại chuyện hôm qua. Mình nhớ rằng hôm qua nhãn\n         tri của mình đã thấy cái bình.\n     -   Vậy tại sao hôm nay mình có thể nhớ được rằng hôm qua mình đã thấy cái\n         bình?\n         → Bởi vì có Tự chứng hiện tiền trải nghiệm nhãn tri chấp trì cái bình.\n   Từ tự chứng hiện tiền này mới dẫn xuất đến Niệm tri.\n     -   Niệm là nhớ.\n     -   Tri là tri thức.\n     -   Niệm tri là tâm nhớ lại.\n        Nhờ có Tự chứng hiện tiền trải nghiệm nhãn tri chấp trì cái bình mà sau đó\n   mới dẫn xuất đến niệm tri, giúp mình nhớ lại rằng hôm qua mình đã thấy cái bình.\nc. Phân biệt nguồn dẫn xuất của Niệm tri trong hai trường hợp\n   Mình phải phân biệt hai trường hợp.\n   i. Trường hợp thứ nhất: “Tôi thấy cái bình.”\n     -   Chữ “tôi” ở đây có nghĩa là nhãn tri chấp trì cái bình.\n     -   Vậy cái gì trải nghiệm nhãn tri này? Chính là tự chứng hiện tiền.\n     -   Từ Tự chứng hiện tiền trải nghiệm nhãn tri chấp trì cái bình mới dẫn xuất đến\n         Niệm tri, khiến mình nhớ lại rằng: “Hôm qua tôi đã thấy cái bình.”\n         → Tâm nhớ lại việc mình đã thấy cái bình được dẫn xuất từ tự chứng hiện tiền\n         trải nghiệm nhãn tri chấp trì cái bình.\n   ii. Trường hợp thứ hai: “Cái bình đó tôi thấy.”\n     -   Câu này cũng nói về sự nhớ lại, [nhưng nhấn mạnh vào cái bình.]\n     -   Sự nhớ [lại] này được dẫn xuất từ căn tri, tức là từ nhãn tri chấp trì cái bình.\n         → Tâm nhớ lại cái bình được dẫn xuất từ nhãn tri chấp trì cái bình.\n    Như vậy, hai trường hợp khác nhau:\n     Cách nói                                   Nguồn dẫn xuất của Niệm tri\n\n     “Tôi thấy cái bình.”                       Tự chứng hiện tiền trải nghiệm nhãn tri\n                                                chấp trì cái bình\n\n     “Cái bình đó tôi thấy.”                    Nhãn tri chấp trì cái bình\n\n\n\nd. Vì sao nói “Tôi thấy cái bình”, mà không nói “Nhãn tri thấy cái bình”\n\n\n\n                               © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 10 / 24>\n                         TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n            -   Khi nói “Tôi thấy cái bình”, có nghĩa là nhãn tri của mình thấy cái bình, chứ\n                không phải bản thân mình trực tiếp thấy.\n            -   Mình nói như vậy bởi vì nhãn tri là một thành phần của mình.\n           Ví dụ: Khi bàn tay mình sờ vào cái bình,\n            -   Mình nói: “Tôi sờ cái bình.”\n            -   Chứ không nói: “Bàn tay tôi sờ cái bình.”\n                → Thật ra, chính bàn tay sờ vào cái bình. Nhưng vì bàn tay là một [bộ phận cơ\n           thể] của mình, nên mình mới nói “Tôi sờ cái bình”.\n            -   Tương tự, nhãn tri chấp trì cái bình cũng là một thành phần của mình. Cho nên,\n                khi nhãn tri thấy cái bình thì mình nói “Tôi thấy cái bình.”\n            -   Vậy niệm tri nhớ lại việc “Tôi thấy cái bình.” được sinh ra từ đâu?\n                → Nó được sinh ra từ Tự chứng hiện tiền trải nghiệm nhãn tri chấp trì cái bình.\nBây giờ, mình chuyển sang phần biện kinh.\nBiện kinh 1.1: Biện kinh về Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền\na. Kiến thức cần nhớ trước khi biện kinh\n       i. Sự tướng của ‘Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền’\n     Mình đã học loại thứ ba của Tự chứng hiện tiền là ‘Hiển nhi bất định mà đó đã trở thành\nlà tự chứng hiện tiền'.\n       Sự tướng là:
