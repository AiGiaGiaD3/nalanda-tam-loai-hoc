<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sổ tay tương tác Tâm loại học Nalanda — kiến thức, sơ đồ, từ điển, flashcards, biện kinh và bài tự kiểm tra.">
<meta name="theme-color" content="#f7f8f3">
<title>Tâm loại học · Sổ tay tương tác</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f7f8f3;--bg2:#eef4ef;--paper:#ffffff;--ink:#22363a;--muted:#5d6f72;--faint:#8a9a9b;--line:#e2e9e3;--line2:#cfdcd3;
 --brand:#2f7f6d;--brand-ink:#1d5a4c;--soft:#e6f3ee;
 --mint:#3c9a7f;--mintsoft:#e3f4ec;--peach:#e0855a;--peachsoft:#fdeee4;--sky:#4d8fc6;--skysoft:#e6f0fa;
 --lav:#8473c4;--lavsoft:#efecfa;--butter:#c3962f;--buttersoft:#fdf4dc;--rose:#cc647a;--rosesoft:#fbe9ed;
 --danger:#b8574a;--redsoft:#fdeeea;--gold:#c3962f;--goldsoft:#fdf4dc;
 --shadow-sm:0 1px 2px rgba(34,54,58,.05),0 2px 8px rgba(34,54,58,.04);
 --shadow:0 2px 6px rgba(34,54,58,.05),0 12px 32px rgba(34,54,58,.08);
 --r:16px;--topbar:64px;
 --serif:'Lora',Georgia,'Times New Roman',serif;
 --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
 color-scheme:light;
}
[data-theme="dark"]{
 --bg:#121b1d;--bg2:#17252a;--paper:#1b2a2d;--ink:#e6eeea;--muted:#a6b8b4;--faint:#7f9390;--line:#2c3f41;--line2:#3a5153;
 --brand:#7cd0b6;--brand-ink:#a8e3d0;--soft:#1f3b36;
 --mint:#78cfb2;--mintsoft:#1d3a33;--peach:#f2a984;--peachsoft:#3d2c24;--sky:#8cbcea;--skysoft:#1d2f40;
 --lav:#b3a6ec;--lavsoft:#2b2840;--butter:#e7c46d;--buttersoft:#3a3220;--rose:#ee9aab;--rosesoft:#3c2630;
 --danger:#f0a596;--redsoft:#3d2826;--gold:#e7c46d;--goldsoft:#3a3220;
 --shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow:0 10px 30px rgba(0,0,0,.28);
 color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px;border-radius:8px}
a{color:inherit;text-decoration:none}
button:disabled{opacity:.45;cursor:default}
::selection{background:#bfe6d6;color:#173b33}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}

/* palette helpers */
.c-mint{--c:var(--mint);--cs:var(--mintsoft)}.c-peach{--c:var(--peach);--cs:var(--peachsoft)}.c-sky{--c:var(--sky);--cs:var(--skysoft)}
.c-lav{--c:var(--lav);--cs:var(--lavsoft)}.c-butter{--c:var(--butter);--cs:var(--buttersoft)}.c-rose{--c:var(--rose);--cs:var(--rosesoft)}

/* ---------- layout ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr)}
.sidebar{height:100vh;height:100dvh;position:sticky;top:0;overflow-y:auto;background:var(--paper);border-right:1px solid var(--line);padding:20px 14px 28px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;z-index:85}
.s-brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--line)}
.symbol{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--mintsoft),var(--skysoft));display:grid;place-items:center;flex-shrink:0}
.symbol svg{width:30px;height:30px}
.s-brand small{display:block;font-size:10px;letter-spacing:.18em;color:var(--faint);font-weight:600}
.s-brand strong{font:600 20px/1.2 var(--serif);display:block;margin-top:2px}
.iconbtn.s-close{display:none;margin-left:auto}
.s-head{padding:18px 10px 6px;font-size:10.5px;text-transform:uppercase;color:var(--faint);letter-spacing:.14em;font-weight:700}
.s-link{display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:0;color:var(--ink);padding:9px 11px;border-radius:11px;text-align:left;font-size:14px;font-weight:500;transition:background .15s}
.s-link:hover{background:var(--bg2)}
.s-link.active{background:var(--soft);color:var(--brand-ink);font-weight:600}
.s-link .navico{color:var(--brand);display:grid}
.s-link .number{margin-left:auto;font-size:11px;color:var(--faint);background:var(--bg2);border-radius:20px;padding:1px 8px;font-weight:600}
.s-link.active .number{background:var(--paper)}
.s-topnav{padding-bottom:10px;border-bottom:1px solid var(--line)}
.s-units{padding-top:4px}
.unit-toggle{display:flex;gap:10px;align-items:center;padding:8px 9px;width:100%;background:none;color:var(--ink);border:0;text-align:left;border-radius:11px;font-size:13px;font-weight:600;line-height:1.35}
.unit-toggle:hover,.unit-toggle.open{background:var(--bg2)}
.u-badge{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--cs);color:var(--c);font-size:14px;font-weight:700;flex-shrink:0;font-family:var(--sans)}
.unit-toggle .chev{margin-left:auto;color:var(--faint);transition:transform .2s}
.unit-toggle.open .chev{transform:rotate(90deg)}
.unit-sub{padding:2px 0 8px 22px;display:none;position:relative}
.unit-sub::before{content:'';position:absolute;left:23px;top:4px;bottom:12px;width:2px;background:var(--line);border-radius:2px}
.unit-sub.open{display:block}
.unit-item{display:flex;align-items:flex-start;gap:9px;padding:7px 10px 7px 0;color:var(--muted);border-radius:9px;font-size:12.5px;line-height:1.45;border:0;background:none;width:100%;text-align:left;position:relative}
.unit-item:hover{color:var(--ink)}
.unit-item.selected{color:var(--brand-ink);font-weight:600}
.mini-check{border:2px solid var(--line2);background:var(--paper);border-radius:50%;width:12px;height:12px;flex-shrink:0;margin-top:3px;position:relative;z-index:1;display:grid;place-items:center;font-size:7px;color:#fff}
.unit-item.selected .mini-check{border-color:var(--brand)}
.mini-check.done{background:var(--brand);border-color:var(--brand)}
.s-foot{font-size:11px;line-height:1.6;color:var(--faint);padding:18px 10px 0;margin-top:12px;border-top:1px solid var(--line)}

.main{min-width:0}
.topbar{height:var(--topbar);padding:0 clamp(16px,3.4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .trail{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .trail b{color:var(--ink);font-weight:600}
.m-brand{display:none;font:600 17px var(--serif);white-space:nowrap}
.iconbtn.mobile-menu{display:none}
.actions{display:flex;align-items:center;gap:8px;min-width:0}
.searchbar{height:40px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0 12px;width:clamp(200px,26vw,320px);color:var(--faint);transition:border-color .15s,box-shadow .15s}
.searchbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--soft)}
.searchbar input{border:0;background:transparent;outline:0;min-width:0;flex:1;color:var(--ink);font-size:13.5px;height:100%}
.searchbar input::placeholder{color:var(--faint)}
.kbd{border:1px solid var(--line);border-radius:6px;font-size:11px;padding:0 6px;color:var(--faint);line-height:18px}
.iconbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;height:40px;width:40px;display:grid;place-items:center;flex-shrink:0}
.iconbtn:hover{background:var(--bg2)}
.content{max-width:1180px;margin:0 auto;padding:32px clamp(16px,3.4vw,48px) 96px}
.content:focus{outline:0}

/* ---------- typography & atoms ---------- */
.eyebrow{font-size:11.5px;text-transform:uppercase;font-weight:700;letter-spacing:.14em;color:var(--brand)}
.page-title{font:600 clamp(30px,3.6vw,46px)/1.18 var(--serif);letter-spacing:-.015em;margin:10px 0 12px}
.lede{font-size:15.5px;color:var(--muted);line-height:1.75;max-width:760px;margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand-ink);white-space:nowrap}
.pill.gold{background:var(--goldsoft);color:color-mix(in srgb,var(--gold) 75%,var(--ink))}
.pill.done{background:var(--brand);color:#fff}
.smallmeta{color:var(--muted);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px;transition:transform .15s,background .15s,box-shadow .15s;text-align:center;line-height:1.3}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
[data-theme="dark"] .btn.primary{color:#0f2420}
.btn.tiny{padding:6px 12px;min-height:36px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand-ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.success{background:var(--soft);color:var(--brand-ink);border-color:transparent}
.inline-link{color:var(--brand);font-size:13.5px;font-weight:600;border:0;background:none;padding:6px 0;display:inline-flex;align-items:center;gap:5px;text-align:left}
.inline-link:hover{text-decoration:underline;text-underline-offset:3px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin:44px 0 18px;flex-wrap:wrap}
.section-head h2{font:600 clamp(22px,2.4vw,27px)/1.3 var(--serif);margin:0}
.section-head p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.source-note{display:flex;gap:12px;padding:16px 18px;background:var(--goldsoft);border-radius:14px;font-size:13.5px;line-height:1.7;color:var(--ink);margin-top:28px}
.source-note>svg{color:var(--gold);margin-top:3px}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:40px 22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.75;display:grid;justify-items:center;gap:10px}
.empty svg{width:72px;height:72px}

/* ---------- hero ---------- */
.hero{border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,#eaf6f0 0%,#eef3fb 55%,#fdf1e8 100%);padding:clamp(26px,4.5vw,52px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:28px;align-items:center;border:1px solid var(--line)}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#183530,#1a2a3a 60%,#352a24)}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--paper);padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-sm);font-size:10.5px}
.hero h1{font:600 clamp(32px,4.6vw,54px)/1.12 var(--serif);letter-spacing:-.02em;margin:18px 0 14px}
.hero h1 em{font-style:italic;color:var(--brand)}
.hero p{max-width:560px;color:var(--muted);line-height:1.75;font-size:15px;margin:0}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero-art{position:relative;display:grid;justify-items:center}
.hero-art svg{width:100%;max-width:360px;height:auto;overflow:visible}
.hero-art .cap{font-size:12px;color:var(--muted);margin-top:4px;text-align:center}
.orbit-node{cursor:pointer;transition:transform .2s}
.orbit-node:hover{transform:scale(1.12)}
.orbit-node,.orbit-node *{transform-box:fill-box;transform-origin:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0 0}
.stat{background:var(--paper);padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);display:flex;gap:14px;align-items:center;min-width:0}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cs);color:var(--c);flex-shrink:0}
.stat .num{font:600 26px/1.1 var(--serif)}
.stat .lab{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}

/* learning path */
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;position:relative;counter-reset:st}
.path::before{content:'';position:absolute;top:30px;left:10%;right:10%;border-top:2px dashed var(--line2)}
.step{position:relative;text-align:center;padding:0 6px}
.step .dot{width:60px;height:60px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--paper);border:2px solid var(--c);color:var(--c);box-shadow:0 0 0 6px var(--bg)}
.step .dot svg{width:24px;height:24px}
.step b{display:block;font-size:14px;line-height:1.35}
.step span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.step .n{position:absolute;top:-4px;left:calc(50% + 16px);width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* unit cards */
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.unit-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;text-align:left}
.unit-card::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--cs);opacity:.7;pointer-events:none}
.unit-card:hover{box-shadow:var(--shadow);transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.unit-card .top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.unit-card .u-badge{width:40px;height:40px;border-radius:12px;font-size:19px}
.unit-card .num{font-size:11.5px;font-weight:700;color:var(--c);letter-spacing:.08em}
.unit-card h3{margin:0;font-size:15.5px;line-height:1.4;font-weight:600}
.unit-card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0;flex:1}
.unit-card footer{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:500}
.mini-bar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--c);border-radius:inherit}
.progress-bg{height:8px;background:var(--bg2);border-radius:20px;overflow:hidden}
.progress-fg{height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:inherit;transition:width .3s}
.course-progress{padding:18px 20px;margin-top:22px;display:flex;align-items:center;gap:18px}
.course-progress .grow{flex:1;min-width:0}
.course-progress .between{display:flex;justify-content:space-between;font-size:13.5px;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.course-progress strong{color:var(--brand-ink)}

/* ---------- article ---------- */
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.crumb button{border:0;background:none;color:var(--brand);padding:2px 0;font-weight:500}
.crumb svg{width:14px;height:14px;color:var(--faint)}
.article-header{padding-bottom:24px;border-bottom:1px solid var(--line)}
.article-head-row{display:flex;gap:16px;align-items:flex-start;margin-top:20px}
.article-head-row .u-badge{width:52px;height:52px;border-radius:16px;font-size:24px;margin-top:6px}
.article-head-row .page-title{margin:6px 0 10px}
.article-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.two-pane{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:36px;padding-top:24px;align-items:start}
.article h2{font:600 24px/1.3 var(--serif);margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.article h2 .h-num{width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--brand);font:700 14px var(--sans);display:grid;place-items:center;flex-shrink:0}
.article section:first-child h2{margin-top:6px}
.definition{padding:26px 28px 22px;background:linear-gradient(120deg,var(--mintsoft),var(--skysoft));border-radius:20px;position:relative;overflow:hidden}
.definition .qm{position:absolute;right:18px;top:6px;font:600 120px/1 var(--serif);color:var(--brand);opacity:.12;pointer-events:none}
.definition .eyebrow{margin-bottom:10px;position:relative}
.definition blockquote{margin:0;font:500 clamp(18px,2vw,22px)/1.65 var(--serif);position:relative}
.definition .caption{font-size:12.5px;color:var(--muted);margin-top:14px;position:relative}
/* points as timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{position:relative;padding:0 0 14px 52px}
.timeline li::before{content:'';position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line2)}
.timeline li:last-child::before{display:none}
.timeline .node{position:absolute;left:0;top:10px;width:36px;height:36px;border-radius:50%;background:var(--cs);color:var(--c);font-weight:700;font-size:13px;display:grid;place-items:center;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.timeline .box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.timeline h3{margin:0 0 4px;font-size:15px;font-weight:600;line-height:1.45}
.timeline p{margin:0;font-size:14.5px;line-height:1.75;color:var(--muted)}
.tip-card{background:var(--goldsoft);border-radius:16px;padding:18px 20px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px}
.tip-card .ti{width:40px;height:40px;border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--gold)}
.tip-card .eyebrow{color:color-mix(in srgb,var(--gold) 80%,var(--ink))}
.tip-card ul{padding-left:18px;margin:8px 0 0}
.tip-card li{font-size:14.5px;line-height:1.7;margin:4px 0}
.tip-card.ok{background:var(--mintsoft)}.tip-card.ok .ti{color:var(--mint)}.tip-card.ok .eyebrow{color:var(--brand-ink)}
.tip-card.danger{background:var(--redsoft)}.tip-card.danger .ti{color:var(--danger)}.tip-card.danger .eyebrow{color:var(--danger)}
.note-area textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;min-height:130px;resize:vertical;font-size:14.5px;line-height:1.7}
.note-area textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--soft)}
.notelab{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
#noteStatus{display:inline-flex;align-items:center;gap:6px;color:var(--brand)}
.article-bottom{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:30px;padding-top:22px}
.article-bottom .grp{display:flex;gap:8px;flex-wrap:wrap}
.sidepanel{position:sticky;top:calc(var(--topbar) + 20px);display:grid;gap:14px}
.sidebox{padding:18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.sidebox h3{margin:0 0 12px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.sidebox p{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0 0 12px}
.info-rows{display:grid;gap:8px;font-size:13px}
.info-rows div{display:flex;justify-content:space-between;gap:10px}
.info-rows span{color:var(--muted)}
.info-rows b{font-weight:600;text-align:right}
.mini-path{list-style:none;margin:0;padding:0;position:relative}
.mini-path::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.mini-path button{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:5px 0;text-align:left;font-size:13px;line-height:1.45;color:var(--muted);position:relative}
.mini-path button:hover{color:var(--ink)}
.mini-path .d{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);background:var(--paper);flex-shrink:0;margin-top:1px;display:grid;place-items:center;color:#fff}
.mini-path .d svg{width:9px;height:9px;stroke-width:3.5}
.mini-path .done .d{background:var(--brand);border-color:var(--brand)}
.mini-path .cur{color:var(--ink);font-weight:600}
.mini-path .cur .d{border-color:var(--brand);box-shadow:0 0 0 4px var(--soft)}

/* list results */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.filter{border:1px solid var(--line2);color:var(--muted);background:var(--paper);padding:7px 14px;font-size:13px;font-weight:600;border-radius:999px;min-height:36px}
.filter.selected{background:var(--brand);color:#fff;border-color:transparent}
.search-result{border:1px solid var(--line);background:var(--paper);padding:16px 18px;border-radius:var(--r);margin:10px 0;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;transition:box-shadow .15s,border-color .15s;width:100%;text-align:left}
.search-result:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.search-result h3{font-size:15.5px;margin:4px 0;font-weight:600;line-height:1.4}
.search-result p{color:var(--muted);font-size:13.5px;line-height:1.6;margin:0}
.search-result .go{color:var(--faint)}
.search-result .u-badge{width:40px;height:40px;border-radius:12px;font-size:18px}
mark{background:#fde7a8;border-radius:3px;padding:0 2px;color:#2b2b1d}

/* ---------- map ---------- */
.tree{display:grid;justify-items:center;margin-top:28px}
.tree-root{border-radius:20px;padding:18px 34px;background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--sky)));color:#fff;text-align:center;max-width:460px;width:100%;box-shadow:var(--shadow);position:relative}
[data-theme="dark"] .tree-root{color:#0f2420}
.tree-root strong{font:600 28px/1.2 var(--serif);display:block}
.tree-root small{font-size:13px;opacity:.9}
.tree-stem{height:28px;width:2px;background:var(--line2)}
.tree-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;position:relative;padding-top:28px}
.tree-three::before{content:'';position:absolute;top:0;left:16.66%;right:16.66%;height:2px;background:var(--line2)}
.tree-branch{border:1px solid var(--line);background:var(--paper);padding:20px 18px;border-radius:var(--r);text-align:center;cursor:pointer;position:relative;transition:box-shadow .2s,transform .2s;display:grid;justify-items:center;gap:6px}
.tree-branch::before{content:'';position:absolute;top:-28px;left:50%;width:2px;height:28px;background:var(--line2)}
.tree-branch:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.tree-branch .bn{width:54px;height:54px;border-radius:50%;background:var(--cs);color:var(--c);display:grid;place-items:center;font:600 24px var(--serif)}
.tree-branch b{font-size:15.5px;font-weight:600}
.tree-branch small{color:var(--muted);font-size:13px;line-height:1.55}
.seven{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;counter-reset:s}
.seven-card{border:1px solid var(--line);background:var(--paper);padding:16px;border-radius:var(--r);cursor:pointer;display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:start;transition:box-shadow .2s;text-align:left}
.seven-card:hover{box-shadow:var(--shadow)}
.seven-card .sn{width:38px;height:38px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:15px}
.seven-card b{font-size:14.5px;font-weight:600;line-height:1.4;display:block}
.seven-card small{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:13px;line-height:1.55;margin-top:4px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three-card{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:18px;cursor:pointer;display:grid;gap:10px;align-content:start;transition:box-shadow .2s;text-align:left}
.three-card:hover{box-shadow:var(--shadow)}
.three-card .art{height:92px;border-radius:12px;background:var(--cs);display:grid;place-items:center;color:var(--c)}
.three-card .art svg{height:70px;width:auto}
.three-card h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.three-card p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pair-card{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:box-shadow .2s;text-align:left;display:grid;gap:12px}
.pair-card:hover{box-shadow:var(--shadow)}
.pair-card h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
.pair-card h3 i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-size:12px;font-weight:700}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;gap:6px}
.pair span{padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.4;font-weight:600;text-align:center}
.pair span:first-child{background:var(--mintsoft);color:color-mix(in srgb,var(--mint) 70%,var(--ink))}
.pair span:last-child{background:var(--skysoft);color:color-mix(in srgb,var(--sky) 70%,var(--ink))}
.pair svg{width:30px;height:20px;color:var(--faint)}

/* ---------- glossary ---------- */
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.term-card{border:1px solid var(--line);background:var(--paper);padding:16px 18px;border-radius:var(--r);cursor:pointer;display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;transition:box-shadow .2s;text-align:left}
.term-card:hover{box-shadow:var(--shadow)}
.term-card .av{width:42px;height:42px;border-radius:12px;background:var(--cs);color:var(--c);display:grid;place-items:center;font:600 19px var(--serif)}
.term-card h3{font:600 17px/1.35 var(--serif);margin:0 0 4px}
.term-card p{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0}
.term-card footer{font-size:12.5px;color:var(--brand);font-weight:600;margin-top:8px;display:flex;align-items:center;gap:4px}
.term-card footer svg{width:14px;height:14px}
.select{padding:0 12px;height:44px;background:var(--paper);border:1px solid var(--line2);border-radius:12px;color:var(--ink);font-size:14px;min-width:0;max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.toolbar .select{flex:1 1 220px;max-width:380px}

/* ---------- flashcards ---------- */
.flash-frame{max-width:680px;margin:26px auto 0}
.flashcard{perspective:1200px;cursor:pointer;outline:0}
.flash-inner{display:grid;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;min-height:300px}
.flashcard.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 28px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden}
.flash-front{background:linear-gradient(135deg,var(--mintsoft),var(--skysoft) 60%,var(--lavsoft))}
.flash-front::before,.flash-front::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.flash-front::before{width:220px;height:220px;right:-70px;top:-70px;background:color-mix(in srgb,var(--paper) 55%,transparent)}
.flash-front::after{width:140px;height:140px;left:-40px;bottom:-50px;border:2px dashed color-mix(in srgb,var(--brand) 30%,transparent)}
.flash-back{background:var(--paper);transform:rotateY(180deg)}
.flash-face .top{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--brand);position:absolute;top:20px;left:0;right:0}
.flash-face .big{font:600 clamp(26px,4.4vw,40px)/1.25 var(--serif);margin:0;position:relative}
.flash-back .big{font-size:22px;color:var(--brand-ink)}
.flash-face .sub{font-size:16px;line-height:1.75;max-width:540px;margin:0}
.flash-face .bottom{position:absolute;bottom:16px;left:0;right:0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.flash-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:18px}
.flash-controls .btn:first-child{justify-self:start}.flash-controls .btn:last-child{justify-self:end}
.flash-progress{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dots i.k{background:var(--mint)}.dots i.cur{background:var(--brand);transform:scale(1.4)}

/* ---------- quiz ---------- */
.quiz-panel{max-width:780px}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:24px 0 10px;font-size:13.5px;color:var(--muted)}
.quiz-top b{color:var(--brand-ink)}
.seg{display:flex;gap:4px}
.seg i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.seg i.ok{background:var(--mint)}.seg i.bad{background:var(--rose)}.seg i.cur{background:var(--sky)}
.quiz-question{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:18px}
.quiz-question h2{font:600 clamp(19px,2.2vw,24px)/1.5 var(--serif);margin:10px 0 20px}
.answers{display:grid;gap:10px}
.answer{background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--ink);font-size:14.5px;line-height:1.55;width:100%;transition:border-color .15s,background .15s}
.answer:hover:not(:disabled){border-color:var(--brand);background:var(--soft)}
.answer .letter{flex-shrink:0;width:28px;height:28px;border-radius:9px;background:var(--paper);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700}
.answer.correct{border-color:var(--mint);background:var(--mintsoft)}
.answer.correct .letter{background:var(--mint);color:#fff;border-color:transparent}
.answer.wrong{border-color:var(--rose);background:var(--rosesoft)}
.answer.wrong .letter{background:var(--rose);color:#fff;border-color:transparent}
.answer:disabled{opacity:1;cursor:default}
.explain{padding:14px 16px;border-radius:14px;background:var(--skysoft);font-size:14px;line-height:1.7;margin-top:16px}
.explain.ok{background:var(--mintsoft)}.explain.bad{background:var(--rosesoft)}
.quiz-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.final-score{padding:34px 24px;text-align:center;border-radius:24px;border:1px solid var(--line);background:var(--paper);margin-top:22px;display:grid;justify-items:center;gap:8px}
.final-score svg{width:150px;height:150px}
.final-score p{color:var(--muted);margin:4px 0 12px;max-width:440px}

/* ---------- cases ---------- */
.case-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;margin-top:22px;align-items:start}
.venn-card{padding:16px;display:grid;gap:12px}
.venn-card svg{width:100%;height:auto;display:block}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.case-rule{padding:16px 18px;background:var(--soft);border-radius:16px}
.case-rule .ab{font:600 clamp(19px,2.2vw,23px)/1.4 var(--serif);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.case-rule .ab .a{color:color-mix(in srgb,var(--mint) 75%,var(--ink))}.case-rule .ab .b{color:color-mix(in srgb,var(--sky) 75%,var(--ink))}
.case-rule .smallmeta{margin-top:8px}
.case-rule code{font-family:var(--sans);font-weight:700;background:var(--paper);padding:2px 8px;border-radius:7px}
.caseboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.casecell{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px;border-left:4px solid var(--c)}
.casecell .label{font-size:12.5px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:8px}
.casecell .label i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:11px}
.casecell p{font-size:14px;line-height:1.65;color:var(--ink);margin:8px 0 0}
.casecell.impossible{background:transparent;border-style:dashed;border-left-style:dashed}
.casecell.impossible p{color:var(--faint)}
.c-gray{--c:var(--faint);--cs:var(--bg2)}
.case-explain{font-size:14.5px;line-height:1.75;padding:16px 18px;background:var(--goldsoft);border-radius:14px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how .card{padding:16px}
.how .hi{width:36px;height:36px;border-radius:11px;background:var(--cs);color:var(--c);display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.how h3{margin:0 0 4px;font-size:14.5px}
.how p{margin:0;font-size:13.5px;line-height:1.65;color:var(--muted)}

/* ---------- notes ---------- */
.notebook-list{display:grid;gap:12px}
.notebook-item{padding:16px 18px;border-left:4px solid var(--c)}
.notebook-item h3{font-size:15.5px;margin:4px 0 8px}
.notebook-item p{font-size:14px;color:var(--muted);line-height:1.7;white-space:pre-wrap;margin:0 0 8px;overflow-wrap:anywhere}

/* ---------- misc ---------- */
.mobile-overlay{display:none}
.toast{position:fixed;right:24px;bottom:24px;z-index:99;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:none}
.bottom-nav{display:none}
.print-only{display:none}

/* ---------- responsive ---------- */
@media(max-width:1180px){.two-pane{grid-template-columns:minmax(0,1fr) 240px;gap:26px}.path{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:980px){
 .app{grid-template-columns:minmax(0,1fr)}
 .sidebar{position:fixed;left:0;top:0;width:min(320px,88vw);transform:translateX(-104%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
 .sidebar.open{transform:none}
 .iconbtn.s-close{display:grid}
 .iconbtn.mobile-menu{display:grid}
 .mobile-overlay.open{display:block;position:fixed;inset:0;background:rgba(20,40,40,.35);z-index:80;backdrop-filter:blur(2px)}
 .two-pane{grid-template-columns:minmax(0,1fr)}
 .sidepanel{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .case-grid{grid-template-columns:minmax(0,1fr)}
 .venn-card{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
}
@media(max-width:760px){
 :root{--topbar:auto}
 body{font-size:15px}
 .topbar{flex-wrap:wrap;padding:10px 16px;gap:10px;row-gap:10px}
 .topbar .trail{display:none}
 .m-brand{display:block}
 .actions{display:contents}
 .searchbar{order:3;width:100%;flex:1 1 100%;height:42px}
 .searchbar .kbd{display:none}
 .actions .iconbtn{order:2}
 .hide-small{display:none!important}
 .topbar .left{flex:1}
 .content{padding:22px 16px calc(96px + env(safe-area-inset-bottom))}
 .hero{grid-template-columns:minmax(0,1fr);padding:24px 20px 26px;border-radius:24px;gap:6px}
 .hero-art{order:-1}
 .hero-art svg{max-width:330px}
 .hero h1{margin:14px 0 10px}
 .hero-actions .btn{flex:1 1 auto}
 .stat{padding:14px;gap:10px}
 .stat .ic{width:36px;height:36px}
 .stat .num{font-size:22px}
 .path{grid-template-columns:minmax(0,1fr);gap:0}
 .path::before{top:24px;bottom:24px;left:23px;right:auto;border-top:0;border-left:2px dashed var(--line2)}
 .step{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;text-align:left;padding:8px 0;align-items:center}
 .step .dot{width:48px;height:48px;margin:0;box-shadow:0 0 0 5px var(--bg)}
 .step .dot svg{width:20px;height:20px}
 .step .n{left:32px;top:2px;width:20px;height:20px}
 .step span{margin-top:2px}
 .units-grid{grid-template-columns:minmax(0,1fr)}
 .course-progress{flex-direction:column;align-items:stretch}
 .article-head-row .u-badge{display:none}
 .definition{padding:20px 18px}
 .timeline li{padding-left:46px}
 .timeline .node{width:32px;height:32px;font-size:12px}
 .timeline li::before{left:15px;top:34px}
 .sidepanel{grid-template-columns:minmax(0,1fr)}
 .article-bottom{display:grid;grid-template-columns:minmax(0,1fr)}
 .article-bottom .grp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .article-bottom .grp .btn:only-child{grid-column:1/-1}
 .tree-three{grid-template-columns:minmax(0,1fr);padding-top:0;gap:12px}
 .tree-three::before{display:none}
 .tree-branch::before{top:-12px;height:12px}
 .tree-branch:first-child::before{display:none}
 .tree-branch{grid-template-columns:54px minmax(0,1fr);text-align:left;justify-items:start;column-gap:14px;align-items:center}
 .tree-branch .bn{grid-row:span 2}
 .tree-branch small{grid-column:1/-1}
 .three{grid-template-columns:minmax(0,1fr)}
 .three-card{grid-template-columns:92px minmax(0,1fr);align-items:center}
 .three-card .art{grid-row:span 2;height:80px}
 .three-card .art svg{height:56px}
 .pairs,.glossary,.seven{grid-template-columns:minmax(0,1fr)}
 .search-result{grid-template-columns:auto minmax(0,1fr)}
 .search-result .go{display:none}
 .quiz-question{padding:18px}
 .flash-face{padding:52px 20px}
 .flash-controls{grid-template-columns:1fr 1fr}
 .flash-controls .btn{justify-self:stretch!important}
 .flash-controls .mid{grid-column:1/-1;order:-1}
 .venn-card{grid-template-columns:minmax(0,1fr)}
 .venn-card svg{max-width:320px;margin:0 auto}
 .caseboard{grid-template-columns:minmax(0,1fr)}
 .how{grid-template-columns:minmax(0,1fr)}
 .toolbar .select{max-width:none;flex-basis:100%}
 .toast{left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));text-align:center}
 .bottom-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom-nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);padding:6px 2px;border-radius:12px;min-height:48px}
 .bottom-nav button svg{width:22px;height:22px}
 .bottom-nav button.active{color:var(--brand)}
 .bottom-nav button.active svg{background:var(--soft);border-radius:10px;padding:2px;width:26px;height:26px;margin:-2px 0}
}
@media(max-width:400px){
 .stats{gap:10px}
 .stat{flex-direction:column;align-items:flex-start}
 .page-title{font-size:28px}
 .hero h1{font-size:30px}
 .pair{grid-template-columns:minmax(0,1fr)}
 .pair svg{transform:rotate(90deg);justify-self:center;height:16px}
 .three-card{grid-template-columns:minmax(0,1fr)}
 .three-card .art{grid-row:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
 .sidebar,.topbar,.mobile-overlay,.hero-actions,.article-bottom,.note-area,.btn,.toast,.bottom-nav,.sidepanel{display:none!important}
 .app{display:block}.content{max-width:100%;padding:0}.two-pane{display:block}
 .timeline li,.definition,.tip-card{break-inside:avoid}
 body{background:#fff;color:#000}
}
</style>
</head>
<body>
<div class="mobile-overlay" id="mobileOverlay"></div>
<div class="app">

/* Venn diagram per relation */
function venn(c){
 const has=i=>!!c.cells[i];
 const A='#3c9a7f',B='#4d8fc6';
 const mark=(x,y,n,col)=>`<g><circle cx="${x}" cy="${y}" r="12" fill="${col}"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-family="Be Vietnam Pro,system-ui" font-size="12" font-weight="700" fill="#fff">${n}</text></g>`;
 const lab=(x,y,t,col)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Lora,Georgia,serif" font-size="18" font-weight="600" fill="${col}">${t}</text>`;
 let body='';
 if(c.type==='dongnghia'){
  body=`<circle cx="160" cy="105" r="70" fill="${A}" fill-opacity=".18" stroke="${A}" stroke-width="2"/><circle cx="160" cy="105" r="70" fill="none" stroke="${B}" stroke-width="2" stroke-dasharray="6 5"/>${lab(160,96,'A = B','#2b6b5b')}${has(2)?mark(160,120,3,'#8473c4'):''}`;
 }else if(c.type==='tuongnghich'){
  body=`<circle cx="98" cy="105" r="56" fill="${A}" fill-opacity=".18" stroke="${A}" stroke-width="2"/><circle cx="222" cy="105" r="56" fill="${B}" fill-opacity=".18" stroke="${B}" stroke-width="2"/>${lab(98,92,'A',A)}${lab(222,92,'B',B)}${has(0)?mark(98,120,1,A):''}${has(1)?mark(222,120,2,B):''}<text x="160" y="110" text-anchor="middle" font-size="12" fill="#8a9a9b" font-family="Be Vietnam Pro,system-ui">∅</text>`;
 }else if(c.type==='musum'){
  const aInB=!has(0); // only-A empty => A ⊂ B
  const big=aInB?{n:'B',c:B}:{n:'A',c:A}, small=aInB?{n:'A',c:A}:{n:'B',c:B};
  body=`<circle cx="160" cy="105" r="80" fill="${big.c}" fill-opacity=".16" stroke="${big.c}" stroke-width="2"/><circle cx="185" cy="112" r="40" fill="${small.c}" fill-opacity=".28" stroke="${small.c}" stroke-width="2"/>${lab(110,82,big.n,big.c)}${lab(185,104,small.n,small.c)}${aInB?(has(1)?mark(118,128,2,B):''):(has(0)?mark(118,128,1,A):'')}${has(2)?mark(185,128,3,'#8473c4'):''}`;
 }else{
  body=`<circle cx="125" cy="105" r="66" fill="${A}" fill-opacity=".18" stroke="${A}" stroke-width="2"/><circle cx="195" cy="105" r="66" fill="${B}" fill-opacity=".18" stroke="${B}" stroke-width="2"/>${lab(100,82,'A',A)}${lab(220,82,'B',B)}${has(0)?mark(95,118,1,A):''}${has(2)?mark(160,108,3,'#8473c4'):''}${has(1)?mark(225,118,2,B):''}`;
 }
 return `<svg viewBox="0 0 320 210" role="img" aria-label="Biểu đồ Venn quan hệ ${esc(c.a)} và ${esc(c.b)}"><rect x="4" y="4" width="312" height="202" rx="18" fill="var(--bg)" stroke="var(--line2)" stroke-width="1.5" stroke-dasharray="5 5"/>${body}${has(3)?mark(290,184,4,'#8a9a9b'):''}</svg>`;
}

function renderNotes(){const entries=L.filter(x=>(saved.notes[x.id]||'').trim());return `<div class="eyebrow">Notebook · lưu trên thiết bị</div><h1 class="page-title">Ghi chú cá nhân</h1><p class="lede">Các ghi chú trong từng bài được tổng hợp tại đây. Có thể xuất một file JSON để sao lưu và nhập lại khi chuyển trình duyệt hoặc máy tính.</p><div class="toolbar"><button class="btn primary" data-action="exportNotes">${ic('download')} Xuất tiến độ + ghi chú</button><button class="btn" data-action="importNotes">${ic('upload')} Nhập bản sao lưu</button><button class="btn ghost" data-action="resetProgress">Đặt lại tiến độ</button></div>
 <div class="stats" style="margin-top:22px"><div class="stat c-mint"><span class="ic">${ic('check')}</span><div><div class="num">${saved.done.length}</div><div class="lab">Bài đã học</div></div></div><div class="stat c-sky"><span class="ic">${ic('pen')}</span><div><div class="num">${entries.length}</div><div class="lab">Bài có ghi chú</div></div></div><div class="stat c-lav"><span class="ic">${ic('cards')}</span><div><div class="num">${saved.known.length}</div><div class="lab">Thuật ngữ đã thuộc</div></div></div><div class="stat c-peach"><span class="ic">${ic('star')}</span><div><div class="num">${percent()}%</div><div class="lab">Tiến độ</div></div></div></div>
 <div class="section-head"><h2>Nhật ký kiến thức</h2></div><div class="notebook-list">${entries.map(x=>`<div class="card notebook-item ${uc(x.unit)}"><div class="smallmeta">${esc(unitOf(x.unit).name)}</div><h3>${esc(x.title)}</h3><p>${esc(saved.notes[x.id])}</p><button class="inline-link" data-lesson="${x.id}">Mở bài học để chỉnh sửa ${ic('up')}</button></div>`).join('')||`<div class="empty">${emptyArt}Chưa có ghi chú. Mở một bài học, nhập nội dung vào mục “Ghi chú của chị”.</div>`}</div><div class="source-note">${ic('info')}<div>Dữ liệu được lưu bằng bộ nhớ cục bộ của trình duyệt trên thiết bị này, không gửi đi đâu. Với file HTML mở theo giao thức file://, một số trình duyệt có thể xóa dữ liệu khi dọn lịch sử — hãy xuất bản sao lưu định kỳ.</div></div>`}

/* ---------- events ---------- */
function attachLocal(){
 get('#termSearch')?.addEventListener('input',e=>{const p=e.target.selectionStart;termFilter=e.target.value;render();const input=get('#termSearch');input?.focus();input?.setSelectionRange(p,p)});
 get('#lessonNote')?.addEventListener('input',e=>{saved.notes[e.target.dataset.notekey]=e.target.value;persist();const st=get('#noteStatus');if(st)st.innerHTML=ic('check')+' Đã lưu cục bộ'});
 get('#flashcard')?.addEventListener('click',()=>flipFlash());
 get('#flashcard')?.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flipFlash()}});
 get('#flashFilter')?.addEventListener('change',e=>{flashState={...flashState,filter:e.target.value,idx:0,flip:false,list:[]};render()});
 get('#quizFilter')?.addEventListener('change',e=>{newQuiz(e.target.value);render()});
 get('#caseSelect')?.addEventListener('change',e=>{visibleCase=Number(e.target.value);render()});
}
function flipFlash(){flashState.flip=!flashState.flip;get('#flashcard')?.classList.toggle('flipped',flashState.flip)}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)}
function action(name){
 if(name==='nextFlash'||name==='prevFlash'){const n=flashState.list.length||1;flashState.idx=(flashState.idx+(name==='nextFlash'?1:-1)+n)%n;flashState.flip=false;render()}
 else if(name==='knownFlash'){const subset=T.filter(t=>flashState.filter==='all'||byId[t[2]]?.unit===flashState.filter),t=subset[flashState.list[flashState.idx]];if(t){if(saved.known.includes(t[0]))saved.known=saved.known.filter(x=>x!==t[0]);else saved.known.push(t[0]);persist();render()}}
 else if(name==='shuffleFlash'){flashState.list=shuffled(flashState.list);flashState.idx=0;flashState.flip=false;render();toast('Đã trộn thứ tự thẻ')}
 else if(name==='newQuiz'){newQuiz(quizState?.filter||'all');render()}
 else if(name==='nextQuiz'){quizState.idx++;render();window.scrollTo({top:0,behavior:'smooth'})}
 else if(name==='openToc'){openSidebar()}
 else if(name==='exportNotes'){download('Nalanda_TamLoaiHoc_StudyBackup.json',JSON.stringify({type:'Nalanda_TLH_HandbookBackup',version:1,exportedAt:new Date().toISOString(),saved},null,2),'application/json;charset=utf-8');toast('Đã xuất file sao lưu')}
 else if(name==='importNotes'){get('#importFile').click()}
 else if(name==='resetProgress'){if(confirm('Đặt lại toàn bộ tiến độ, ghi chú và flashcards trên thiết bị? Hành động này không thể hoàn tác nếu chị chưa xuất sao lưu.')){saved={done:[],notes:{},known:[],theme:saved.theme};persist();render();toast('Đã đặt lại dữ liệu')}}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-lesson],[data-go],[data-unit],[data-toggle],[data-complete],[data-action],[data-answer],[data-unit-filter]');if(!el)return;const ds=el.dataset;
 if(ds.lesson){setRoute('lesson',ds.lesson)}
 else if(ds.unit){filterUnit='all';setRoute('unit',ds.unit)}
 else if(ds.go){setRoute(ds.go)}
 else if(ds.toggle){const id=ds.toggle;openUnits.has(id)?openUnits.delete(id):openUnits.add(id);renderNav()}
 else if(ds.complete){const id=ds.complete;saved.done.includes(id)?saved.done=saved.done.filter(x=>x!==id):saved.done.push(id);persist();render();toast(saved.done.includes(id)?'Đã đánh dấu hoàn thành':'Đã bỏ dấu hoàn thành')}
 else if(ds.action){action(ds.action)}
 else if(ds.answer!==undefined){const idx=Number(ds.answer);if(quizState.answers[quizState.idx]!==undefined)return;quizState.answers[quizState.idx]=idx;if(quizState.qs[quizState.idx].opts[idx].correct)quizState.score++;render()}
 else if(ds.unitFilter){filterUnit=ds.unitFilter;render()}
});
document.addEventListener('keydown',e=>{const n=e.target.closest?.('.orbit-node');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setRoute('lesson',n.dataset.lesson)}});
get('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value;route={view:'search',id:''};history.replaceState(null,'','#search');render()});
function paintTheme(){document.documentElement.dataset.theme=saved.theme||'light';get('#themeBtn').innerHTML=ic(saved.theme==='dark'?'sun':'moon');document.querySelector('meta[name=theme-color]').content=saved.theme==='dark'?'#121b1d':'#f7f8f3'}
get('#themeBtn').addEventListener('click',()=>{saved.theme=saved.theme==='dark'?'light':'dark';paintTheme();persist()});
get('#printBtn').addEventListener('click',()=>window.print());
function openSidebar(){get('#sidebar').classList.add('open');get('#mobileOverlay').classList.add('open')}
function closeSidebar(){get('#sidebar').classList.remove('open');get('#mobileOverlay').classList.remove('open')}
get('#menuBtn').addEventListener('click',openSidebar);
get('#closeBtn').addEventListener('click',closeSidebar);
get('#mobileOverlay').addEventListener('click',closeSidebar);
get('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const b=JSON.parse(await f.text());if(b.type!=='Nalanda_TLH_HandbookBackup'||!b.saved)throw Error('invalid');if(!confirm('Nhập dữ liệu từ bản sao lưu sẽ thay thế ghi chú và tiến độ hiện tại. Tiếp tục?'))return;saved={...saved,...b.saved};persist();paintTheme();render();toast('Đã nhập thành công')}catch(err){toast('File JSON không phải bản sao lưu hợp lệ')}e.target.value=''});
document.addEventListener('keydown',e=>{const t=e.target?.tagName?.toLowerCase(),typing=['input','textarea','select'].includes(t);if(e.key==='Escape'){closeSidebar();if(!typing)get('#globalSearch')?.blur()}if(e.key==='/'&&!typing){e.preventDefault();get('#globalSearch').focus()}if(!typing&&route.view==='flash'){if(e.key==='ArrowRight')action('nextFlash');else if(e.key==='ArrowLeft')action('prevFlash')}});
window.addEventListener('hashchange',syncHash);
get('#brandMark').innerHTML=lotus;get('#menuBtn').innerHTML=ic('menu');get('#closeBtn').innerHTML=ic('x');get('#printBtn').innerHTML=ic('print');get('#searchIco').innerHTML=ic('search');
paintTheme();syncHash();
})();
</script>
</body>
</html>
