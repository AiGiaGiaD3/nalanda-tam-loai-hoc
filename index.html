\n‘Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của Thuận Thế giả.1’\nNhư đã học ở trên:\n-      Thuận Thế phái không tin có kiếp trước, kiếp sau.\n-      Họ chỉ tin tâm hiện tiền, không tin tỷ độ hay việc chứng dựa vào chánh nhân.\n-      Mặc dù không tin tỷ độ, trong dòng tâm thức của họ vẫn có tỷ độ sinh khởi, chỉ là họ\n       không biết đó là tỷ độ.\nVí dụ: Một người đi trong rừng, khát nước và muốn nấu trà.\n-      Khi nhìn lên núi thấy khói bay lên, ông ấy liền nghĩ: “Ở trên đó có lửa”.\n-      [Dựa vào lý do] có khói, ông biết trên núi có lửa.\n-      Ông đã dựa vào chánh nhân là có khói để chứng được trên núi có lửa.\n       → Đó chính là tỷ độ, nhưng ông ấy không biết đó là tỷ độ.\n       ii. Mối quan hệ giữa ‘Hiển nhi bất định’ và ‘Giác tri bất chứng cảnh’\n\n1\n    Thuận Thế giả: người theo trường phái Thuận Thế, hay còn gọi là Thuận Thế phái.\n\n\n\n\n                                         © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 11 / 24>\n                              TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nTheo tự tông:\n      Nếu là Hiển nhi bất định thì nhất thiết là Giác tri bất chứng cảnh,\n-     ‘Giác tri bất chứng cảnh’: có nghĩa là tâm thức không chứng được cảnh.\n-     Còn nếu giải thích một cách thoát ý [dễ hiểu], ‘Hiển nhi bất định’ là một tâm thức mà\n      mặc dù cảnh trình hiện trước nó, nhưng nó không thấy rõ ràng, không nắm bắt được đối\n      tượng ấy.\nVí dụ: Mình đang say mê thưởng thức tiếng nhạc du dương. Lúc đó, nhĩ tri đang nghe nhạc.\nCó một người đi ngang qua trước mắt mình:\n-     Hình ảnh người ấy vẫn trình hiện trước nhãn tri.\n-     Vì đang tập trung nghe nhạc nên mình không để ý, không biết người ấy có khuôn mặt\n      như thế nào.\n-     Người ấy chỉ thoáng qua trước mắt mình.\n      → Nhãn tri thấy người đi ngang qua là hiển nhi bất định, bởi vì nó không chứng được\n      người đó là ai.\nCho nên, mọi người phải hiểu chỗ này trước khi bắt đầu biện kinh.\n[Bây giờ], [mời] cả lớp mở mic lên tham gia biện kinh.\nb. Biện kinh:\nBiện đề:\nTự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của Thuận Thế giả.\nLG:     Lấy Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của Thuận Thế giả\n        làm biện đề, ứng thành là Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền\n        sao?\nĐLG: Đồng ý.\nLG:     Ứng thành là Giác tri bất chứng cảnh sao?\nĐLG: Đồng ý.\n        Trường hợp ĐLG trả lời “Tại sao?”\n        ĐLG: Tại sao?\n        LG:     Ứng thành là Giác tri bất chứng cảnh, bởi vì là Hiển nhi bất định.\n                Sư cô giải thích:\n                   -   Theo tự tông: “Nếu là Hiển nhi bất định thì nhất thiết là Giác tri bất\n                       chứng cảnh.”\n                   -   Mọi người cần nhớ [mối quan hệ này].\nLG : Ứng thành không là Giác tri bất chứng cảnh, bởi vì là Giác tri chứng cảnh.\n\n                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 12 / 24>\n                            TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nĐLG: Lý do không thành lập.\nLG : Ứng thành là Giác tri chứng cảnh, bởi vì Tự chứng hiện tiền trải nghiệm là tỷ độ trong\n     dòng tương tục của Thuận Thế giả là Lượng.\nĐLG: Không nhất thiết.\nLG : Ứng thành nếu là Lượng thì không nhất thiết là được chứng bởi Tự chứng hiện tiền\n     trải nghiệm nó sao?\nĐLG : Không nhất thiết.\nSư cô dặn mọi người theo dõi và ghi xuống bài biện kinh này. Thầy đang biện thử để mọi\nngười nghe, theo dõi và nắm cách biện kinh. Rồi sau đó, mọi người mới bắt đầu thực hành.\nc. Trích dẫn luận chứng từ bộ Thích Lượng Luận Minh Giải Thâm Ý:\n    Trong bộ Thích Lượng Luận Minh Giải Thâm Ý của Ngài Panchen Sonam Dragpa\n(Panchen là Tổ), có nói:\nThích Lượng Luận Minh Giải Thâm Ý của Panchen: “Nếu là lượng thì cần phải được\nthành lập bởi tự chứng hiện tiền trải nghiệm chính nó, còn tri thức đơn thuần thì không cần\nnhư thế.”\nཔན་ཆེན་གི་རྣམ་འགེལ་དགློངས་པ་རབ་གསལལས། ཚད་མ་ཡིན་ན་རང་མློང་རང་རིག་མངློན་སུམ་གིས་གྲུབ་དགློས་ཀི་ཤེས་པ་ཙམ་ལ་དེ་ལྟར་མི་དགློས་པའི་ཕིར།\n                                                                             (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\n i. Ý nghĩa của câu trích dẫn\n       -    Nếu là Lượng: phải được Tự chứng hiện tiền trải nghiệm chính nó, chứng được nó.\n       -    Nếu là tri thức đơn thuần: tức tri thức nói chung, không phải lượng, thì không cần\n            như thế.\n      Ở đây, ‘được thành lập’ có nghĩa là được chứng bởi tự chứng hiện tiền trải nghiệm\nchính nó.\n ii.       Áp dụng vào biện đề\nMình biết có cái gọi là:\n‘Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của Thuận Thế Tông luận\nsư.’\n  -    Tỷ lượng ở đây cũng chính là tỷ độ.\n  -    Phải dùng từ ‘trải nghiệm’, không phải “kinh nghiệm”.\nỞ đây, mình cần chứng minh:\n      Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của Thuận Thế tông\nluận sư là Giác tri chứng cảnh.\n\n\n                                                © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 13 / 24>\n                            TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nTại sao Tự chứng hiện tiền này là Giác tri chứng cảnh?\n      → Bởi vì cái đối cảnh mà được trải nghiệm bởi nó là Lượng.\nNếu ĐLG trả lời “Không nhất thiết”:\n      Mình/LG chứng minh “Nhất thiết” và đưa trích dẫn trong bộ Thích Lượng Luận Minh\nGiải Thâm Ý ra để chứng minh:\n‘Nếu là lượng thì cần phải được thành lập bởi tự chứng hiện tiền trải nghiệm chính nó.’\n\n\nBây giờ, mọi người mở mic và tham gia biện kinh để hiểu bài. Chỉ nghe thôi thì chưa chắc\nđã hiểu.\nBiện kinh 1.2: Biện kinh về Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền\nLG:   Ứng thành không phải như vậy, bởi vì bạn chưa nói ra được tánh tướng của Tự chứng\n      hiện tiền.\nĐLG: Lý do không thành lập.\nLG:   Ứng thành có sao?\nĐLG: Đồng ý.\nLG:   Xin hãy nói ra.\nĐLG: Lấy Năng thủ hành tướng, ly phân biệt, không sai loạn làm biện đề\nLG: Lấy cái đó [Năng thủ hành tướng, ly phân biệt, không sai loạn] làm biện đề, ứng\nthành là tánh tướng của Tự chứng hiện tiền sao?\nĐLG: Đồng ý.\nLG:   Phân loại của Tự chứng hiện tiền có mấy?\nĐLG: Phân loại có ba.\nLG:   Xin hãy nêu ra.\nĐLG: Lượng mà đã trở thành là tự chứng hiện tiền, Tái quyết tri mà đã trở thành là tự chứng\n     hiện tiền, Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền.\nLG:   Xin hãy nêu sự tướng của Hiển nhi bất định mà đó đã trở thành là tự chứng hiện tiền.\nĐLG: Lấy Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của ông Thuận Thế\n     giả làm biện đề.\nLG:   Lấy Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của ông Thuận\n      Thế giả làm biện đề, ứng thành là Hiển nhi bất định mà đó đã trở thành là tự chứng\n      hiện tiền sao?\nĐLG: Đồng ý.\n\n\n                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 14 / 24>\n                    TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nLG:   Lấy cái đó [Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của ông\n      Thuận Thế giả] làm biện đề, ứng thành là Lượng mà đã trở thành là tự chứng hiện\n      tiền sao?\n       -   Mình vừa đưa sự tướng của ‘Hiển nhi bất định mà đó đã trở thành là tự chứng\n           hiện tiền’ là Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục\n           của ông Thuận Thế giả.\n       -   Bây giờ, lấy tự chứng hiện tiền ấy [Tự chứng hiện tiền trải nghiệm là tỷ lượng\n           trong dòng tương tục của ông Thuận Thế giả] làm biện đề.\nĐLG: Đồng ý.\nLG:   Ứng thành không là Lượng, bởi vì là Hiển nhi bất định.\nĐLG: Lý do không thành lập. [Câu trả lời này sai]\n      Ở đây, ĐLG không thể trả lời “Lý do không thành lập!”, bởi vì:\n       -   Ở trên, khi được yêu cầu nêu sự tướng của hiển nhi bất định mà đó đã trở thành\n           là tự chứng hiện tiền, chính ĐLG đã đưa ra ‘tự chứng hiện tiền trải nghiệm là tỷ\n           độ trong dòng tương tục của ông Thuận Thế giả’.\n       -   Bây giờ, [khi LG lấy chính sự tướng ấy làm biện đề], ĐLG không thể trả lời “Lý\n           do không thành lập!”, vì đó là sự tướng mà mình đã tự đưa ra.\nLG:   Xin hãy cho biết sự tướng của Lượng mà đã trở thành là tự chứng hiện tiền.\n      Câu này nghĩa là [yêu cầu] nêu một sự tướng vừa là Tự chứng hiện tiền, vừa là lượng.\nĐLG: Lấy Tự chứng hiện tiền ở sát na thứ nhất trải nghiệm nhãn tri chấp trì cái bình làm\n     biện đề.\n      Mọi người phải nói đầy đủ là “tự chứng hiện tiền ở sát na thứ nhất trải nghiệm nhãn\n      tri chấp trì cái bình”, chứ không phải chỉ lấy cái bình làm biện đề.\nLG:   Xin hãy cho biết sự tướng của Tái quyết tri mà đã trở thành là tự chứng hiện tiền.\nĐLG: Lấy Tự chứng hiện tiền ở sát na thứ hai trải nghiệm nhãn tri chấp trì cái bình làm\n     biện đề.\n      Ở đây, mọi người không dùng động từ quá khứ. Chỉ nói “trải nghiệm”, không thêm\n      chữ “đã” vào trước.\nLG:   Xin hãy cho biết sự tướng của Tự chứng hiện tiền mà đó là hiển nhi bất định.\nĐLG: Lấy Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của Thuận Thế giả\n     làm biện đề.\nLG:   Lấy Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của ông Thuận Thế\n      giả làm biện đề, ứng thành là Tự chứng hiện tiền mà đó là hiển nhi bất định sao?\nĐLG: Đồng ý.\n\n\n                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 15 / 24>\n                           TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nLG:   Lấy Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của ông Thuận Thế\n      giả làm biện đề, ứng thành là Giác tri bất chứng cảnh sao?\nĐLG: Đồng ý.\nLG:   Ứng thành không là Giác tri bất chứng cảnh, bởi vì là Giác tri chứng cảnh.\nĐLG: Lý do không thành lập.\nLG:   Ứng thành là Giác tri chứng cảnh, bởi vì Tự chứng hiện tiền trải nghiệm là tỷ độ trong\n      dòng tương tục của ông Thuận Thế giả chứng được Tỷ độ trong dòng tương tục của\n      ông đó.\nĐLG: Lý do không thành lập.\nLG:   Lấy Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của ông Thuận Thế\n      giả làm biện đề, ứng thành không chứng được Tỷ lượng trong dòng tương tục của\n      ông đó sao?\nĐLG: Đồng ý.\nLG:   Ứng thành là chứng được, bởi vì Tỷ lượng trong dòng tương tục của ông Thuận Thế\n      giả đó là Lượng.\nĐLG: Lý do không thành lập.\nLG:   Lấy Tỷ lượng trong dòng tương tục của ông Thuận Thế giả làm biện đề, ứng thành\n      không là Lượng sao?\nĐLG: Đồng ý.\nLG:   Ứng thành là Lượng, bởi vì là Tỷ lượng.\nĐLG: Đồng ý là Lượng.\nLG:   Lấy Tỷ lượng trong dòng tương tục của ông Thuận Thế giả làm biện đề, ứng thành là\n      Lượng sao?\nĐLG: Đồng ý.\nLG:   Lấy Tỷ lượng trong dòng tương tục của ông Thuận Thế giả làm biện đề, ứng thành là\n      được chứng bởi Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của\n      ông đó sao?\n      [Cách nói khác] Lấy Tỷ lượng trong dòng tương tục của ông đó làm biện đề, ứng\n      thành là Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của ông đó,\n      chứng được nó sao?\nĐLG: Tại sao?\nLG:   Ứng thành là được chứng bởi Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng\n      tương tục của ông đó, bởi vì là Lượng.\n\n\n                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 16 / 24>\n                   TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nĐLG: Không nhất thiết.\nLG:   Ứng thành nếu là Lượng thì không nhất thiết là được chứng bởi Tự chứng hiện tiền\n      trải nghiệm là tỷ lượng trong dòng tương tục của ông Thuận Thế giả sao?\nĐLG: Đồng ý.\nLG:   Ứng thành là nhất thiết bởi vì là tôn ý của Ngài Panchen.\nĐLG: Lý do không thành lập.\nLG:   [Ứng thành là tôn ý của Ngài Panchen,] Bởi vì trong Thích Lượng Luận Minh Giải\n      Thâm Ý của Ngài Panchen biên soạn có nói: ‘Nếu là Lượng thì cần phải được thành\n      lập bởi Tự chứng hiện tiền trải nghiệm chính nó, còn tri thức đơn thuần thì không\n      cần như thế.’\n      Câu này nghĩa là: Nếu là Lượng thì nhất thiết phải được chứng bởi Tự chứng hiện\n      tiền trải nghiệm chính lượng đó.\nĐLG: Đồng ý là.\nLG:   Ứng thành Nếu là Lượng thì nhất thiết là được chứng bởi Tự chứng hiện tiền trải\n      nghiệm chính nó sao?\nĐLG: Đồng ý.\nLG:   Lấy Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của Thuận Thế\n      giả làm biện đề, ứng thành là chứng được Tỷ lượng trong dòng tương tục của ông\n      Thuận Thế giả sao?\nĐLG: Đồng ý.\nLG:   Lấy Tự chứng hiện tiền trải nghiệm là tỷ lượng trong dòng tương tục của ông Thuận\n      Thế giả làm biện đề, ứng thành không là Giác tri bất chứng cảnh sao?\n      -   Ngay từ đầu ĐLG nói nó là Giác tri bất chứng cảnh, bây giờ LG đang biện để\n          chứng minh nó là Giác tri chứng cảnh.\n      -   “Không là Giác tri bất chứng cảnh” nghĩa là “Là Giác tri chứng cảnh”.\nĐLG: Đồng ý.\nLG:   Ứng thành là Giác tri bất chứng cảnh, bởi vì là Hiển nhi bất định.\nĐLG: Không nhất thiết.\n      ĐLG không thể trả lời “Lý do không thành lập”, bởi vì:\n      -   ĐLG đã đưa ra sự tướng của ‘Hiển nhi bất định mà đó đã trở thành là tự chứng\n          hiện tiền’.\n      -   Do đó, khi LG lấy chính sự tướng mà ĐLG đưa ra làm biện đề thì ĐLG không\n          thể trả lời “Lý do không thành lập”.\n\n\n\n                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 17 / 24>\n                                                 TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\nLG:        Ứng thành nếu là Hiển nhi bất định thì không nhất thiết là Giác tri bất chứng cảnh\n           sao?\nĐLG: Đồng ý.\n\n\nBây giờ, mình xem lại tánh tướng của Hiển nhi bất định.\nHiển nhi bất định\nLiễu tri mà tự tướng mà đã trở thành xúc nhập cảnh của chính nó trình hiện rõ ràng nhưng không có\nkhả năng dẫn đến khẳng định cái đó là tánh tướng của Hiển nhi bất định.\nརང་གི་འཇུག་ཡུལ་དུ་གྱུར་པའི་རང་མཚན་གསལ་བར་སྣང་ཡང་དེ་ལ་ངེས་པ་འདེན་མི་ནུས་པའི་རིག་པ། སྣང་ལ་མ་ངེས་པའི་བློའ་ི མཚན་ཉིད། རློག་པ་གང་ཡིན་པ་བཀག ལློག་ཤེས་བཀག བཅད་ཤེས་བཀག\n\n                                                                                           (trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\nGiống như ví dụ lúc nãy cô đã nói:\n-      Mình đang ngồi nghe nhạc, nhĩ tri đang làm việc, đang nghe âm thanh. Bỗng nhiên, có\n       một người đi ngang qua cửa sổ nhà mình.\n-      Cảnh ấy vẫn trình hiện rõ ràng [trước nhãn tri] nhưng mình không có khả năng khẳng\n       định được đối tượng đó. Mình không chứng được người ấy là ai, bởi vì lúc đó [nhĩ tri\n       của] mình đang chăm chú nghe nhạc.\n→ Cho nên, tánh tướng của hiển nhi bất định là: cảnh trình hiện rõ ràng, nhưng [tâm thức]\nkhông có khả năng dẫn đến khẳng định, không chứng được [cảnh ấy].\nThầy cô giải thích cách biện kinh:\n[Thầy cô] hỏi lớp đã hiểu cách biện kinh vừa rồi chưa, có hiểu đường đi [của bài biện kinh]\nhay không?\nLớp trả lời rằng chỉ mới hiểu sơ sơ.\nCô hỏi tiếp: mình đang gài người ta ở chỗ nào?\n1. Yêu cầu đối phương đưa ra sự tướng:\n       - Đầu tiên, mình/LG yêu cầu [ĐLG] đưa ra sự tướng của ‘Hiển nhi bất định mà đã trở\n         thành tự chứng hiện tiền’.\n       - [ĐLG] tự đưa ra sự tướng.\n2. Lấy sự tướng đó làm biện đề:\nSau đó, mình lấy chính sự tướng ấy làm biện đề rồi hỏi:\nLG: [Lấy tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của Thuận Thế giả\nlàm biện đề], ứng thành là Giác tri bất chứng cảnh sao?\nĐLG: Đồng ý.\n\n                                                            © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 18 / 24>\n                                TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\nTiếp theo:\nLG:       Ứng thành không là giác tri bất chứng cảnh, bởi vì là Giác tri chứng cảnh.\nĐLG: Lý do không thành lập!\n3. Tiếp tục biện để chứng minh đó là Giác tri chứng cảnh:\n[Khi ĐLG trả lời “Lý do không thành lập”], mình/LG tiếp tục biện để chứng minh đó là Giác\ntri chứng cảnh.\nĐLG: Tại sao?\nLG: Bởi vì Tự chứng hiện tiền ấy chứng được Tỷ lượng trong dòng tương tục của Thuận\nthế giả.\n      Nó trải nghiệm tỷ lượng ấy, cho nên nó chứng được tỷ lượng trong dòng tương tục\ncủa ông đó.\n4. Đưa ra lý do khi đối phương trả lời “Không nhất thiết.”:\nNếu [ĐLG] trả lời “Không nhất thiết”, mình tiếp tục đưa ra lý do:\n            - Tỷ lượng ấy là Lượng.\n            - Nếu là Lượng thì nhất thiết phải được chứng bởi Tự chứng hiện tiền trải nghiệm\n              chính nó.\nCho nên, mình đưa trích dẫn trong Luận ra để chứng minh.\nCách biện kinh là như vậy thôi. Mọi người về nghe lại cho kỹ. Bài này rất đơn giản.\n\n\nBây giờ, mình học đến du già hiện tiền.\n1.3.4. Du già hiện tiền\nTrí thuộc dòng tương tục của Thánh giả, ly phân biệt, không sai loạn, sinh từ tăng\nthượng duyên bất cộng của chính nó đó là chánh quán song vận tam ma địa là tánh\ntướng của Du già hiện tiền.\nརང་གི་ཐུན་མློངས་མ་ཡིན་པའི་བདག་རེན་དུ་གྱུར་པའི་ཞི་ལྷག་ཟུང་འབེལ་གི་ཏིང་ངེ་འཛིན་ལས་སེས་པའི་རློག་བལ་མ་འཁྲུལ་བའི་འཕགས་རྒྱུད་ཀི་མཁེན་པ་རྣལ་འབློར་མངློན\n་སུམ་གི་མཚན་ཉིད།\n                                                                             (Trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\nTánh tướng của Du già hiện tiền có nhiều [thuật ngữ] mới. Khi học Phật pháp mình sẽ gặp\nnhiều thuật ngữ như vậy. Cô dặn mọi người cứ học từ từ, Thầy Cô sẽ lần lượt giải thích.\n1. Du già hiện tiền là gì?\nTrước hết cần xác định:\n\n\n                                                      © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 19 / 24>\n                            TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n    - Du già hiện tiền là tên của một loại tâm thức, không phải một vật ở bên ngoài mà\n      mình có thể cầm, nắm hay đụng chạm.\n    - Du già hiện tiền chỉ có trong dòng tương tục của bậc Thánh giả trở lên.\nVậy, Thánh giả là ai? Ai mới được gọi là Thánh giả?\n2. Thánh giả là ai?\nTrong đạo Phật, quy y Tam bảo gồm:\n    i. Phật bảo\n    ii. Pháp bảo\n    iii. Tăng bảo\nTăng bảo phải là những bậc Thánh giả.\nThánh giả bao gồm:\n    - Thinh văn Thánh giả.\n    - Du già Thánh giả.\n    - Bồ tát Thánh giả.\n    - Phật Thánh giả.\nĐể hiểu ai được gọi là Thánh giả, mình cần tìm hiểu về năm đạo trong Phật học.\n3. Năm đạo trong Thinh văn, Duyên giác và Đại thừa:\nTrong Phật học có 3 đạo: Thinh văn đạo, Duyên giác đạo và Đại thừa đạo.\nMỗi đạo đều được chia thành năm đạo:\n    i.   Tư lương đạo.\n    ii. Gia hành đạo.\n    iii. Kiến đạo.\n    iv. Tu đạo.\n    v. Vô học đạo.\nKhi áp dụng vào từng thừa, ta có:\n\n         Thinh văn đạo                  Duyên giác đạo                Đại thừa đạo\n\n    1. Thinh văn tư lương đạo       1. Duyên giác tư lương đạo   1. Đại thừa tư lương đạo\n    2. Thinh văn gia hành đạo       2. Duyên giác gia hành đạo   2. Đại thừa gia hành đạo\n    3. Thinh văn kiến đạo           3. Duyên giác kiến đạo       3. Đại thừa kiến đạo\n\n\n                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 20 / 24>\n                    TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n\n    4. Thinh văn tu đạo          4. Duyên giác tu đạo           4. Đại thừa tu đạo\n                                 5. Duyên giác vô học đạo       5. Đại thừa vô học đạo\n    5. Thinh văn vô học đạo\n\nNhư vậy, Thinh văn, Duyên giác và Đại thừa đều có năm đạo.\n4. Khi nào được gọi là Thánh giả?\n    a. Đối với Thinh văn đạo:\n    Một người tu theo Thinh văn đạo:\n    - Khi đắc được Thinh văn tư lương đạo, vị ấy vẫn là phàm phu.\n    - Khi tiếp tục đắc Thinh văn gia hành đạo, vị ấy vẫn còn là phàm phu.\n    - Khi đắc được Thinh văn kiến đạo, từ lúc đó [vị ấy] mới được gọi là bậc Thánh, tức\n      Thinh văn Thánh giả.\n    b. Đối với Duyên giác đạo:\n       Tương tự, nếu một vị đắc được Duyên giác kiến đạo trở lên, thì được gọi là Duyên\n    giác Thánh giả.\n    c. Đối với Đại thừa đạo:\n    Nếu một vị đắc được Đại thừa kiến đạo trở lên, [vị ấy] được gọi là Đại thừa Thánh giả.\n5. Kết luận về Thánh giả:\n    - Khi nói đến Thánh giả, mình phải hiểu rằng đó là những vị đã đắc được Kiến đạo trở\n      lên, bất luận theo Thinh văn, Duyên giác hay Đại thừa.\n      + Tư lương đạo và Gia hành đạo: [vẫn là phàm phu], chưa được gọi là Thánh giả.\n      + Kiến đạo trở lên: được gọi là Thánh giả.\n    - Vì vậy, khi nói quy y Tam bảo, tức quy y Phật, Pháp và Tăng, thì Tăng bảo là những\n      bậc Thánh giả.\n      → Nói chung, phải đắc được Kiến đạo trở lên mới được gọi là Thánh giả.\n\n\nBây giờ, mình nhìn lại tánh tướng của Du già hiện tiền.\n6. Tánh tướng của Du già hiện tiền\n    Du già hiện tiền nằm trong dòng tương tục của những vị đã đắc được:\n        - Thinh văn kiến đạo trở lên;\n        - Duyên giác kiến đạo trở lên;\n        - Đại thừa kiến đạo trở lên.\n\n\n                                  © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 21 / 24>\n                            TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n        → Những vị này được gọi là Thánh giả.\n   Cho nên, trong tánh tướng của Du già hiện tiền có nói:\n   ‘Trí thuộc dòng tương tục của Thánh giả, ly phân biệt, không sai loạn, sinh từ tăng\n   thượng duyên bất cộng của chính nó đó là chánh quán song vận tam ma địa.’\n      Như vậy, điều kiện để có Du già hiện tiền phải là ‘Trí thuộc dòng tương tục của bậc\n   Thánh giả’.\n\n\nBây giờ, Thầy/Cô sẽ giải thích thêm phần tánh tướng này. Do mọi người mới nghe lần đầu\nnên có thể chưa hiểu hết, nhưng sau này học lên cao thì sẽ hiểu rõ hơn. Còn giờ trước mắt\nmình cứ hiểu như vậy thôi.\n7. Giải thích tánh tướng của Du già hiện tiền\n   a. ‘Trí’\n       - Để hiểu chữ ‘Trí’, trước hết cần hiểu về Đạo.\n       - Tuy tên gọi là “Đạo” nhưng Đạo ở đây không phải là con đường bên ngoài mà\n           mình đi trên đó mà nó là một dạng tâm thức.\n       - Đạo là tri thức, là ‘Trí’. Đạo đồng nghĩa với Trí.\n       - Đạo được chia thành năm loại, gọi là Ngũ đạo (Tư lương đạo, Gia hành đạo,\n           Kiến đạo, Tu đạo, Vô học đạo), như đã trình bày ở phần “Năm đạo trong Thinh\n           văn, Duyên giác và Đại thừa.\n   b. ‘Thuộc dòng tương tục của bậc Thánh giả’\n       - Thánh giả là những vị đã đắc được từ Kiến đạo trở lên.\n       - Có bốn loại Thánh giả:\n            + Thinh văn Thánh giả\n            + Duyên giác Thánh giả\n            + Bồ Tát Thánh giả\n            + Phật Thánh giả\n   c. ‘Chánh quán song vận tam ma địa’\n         i. Tư lương đạo\n           Ở Tư lương đạo, hành giả đắc được Tịch chỉ.\n            -   Tịch chỉ là tên của một dạng tâm thức, một dạng định.\n            -   Tịch chỉ cũng là một dạng tam ma địa.\n         ii. Gia hành đạo\n              Lên đến Gia hành đạo, hành giả đắc được Thắng quán, cũng được gọi là\n           ‘Chánh quán song vận tam ma địa’.\n            -   Chữ ‘chánh’ cũng có nghĩa là ‘thắng’, nên ‘chánh quán’ cũng chính là\n                ‘thắng quán’.\n\n                                 © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 22 / 24>\n                      TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n              -   ‘Tam ma địa’ là một dạng định.\n              -   ‘Song vận’ có nghĩa là đi song song với nhau.\n              Tại sao lại đi song song?\n              -   Bởi vì ở Tư lương đạo, hành giả đã đắc được Tịch chỉ. Tịch chỉ cũng là một\n                  dạng tam ma địa.\n              -   Khi lên đến Gia hành đạo, hành giả đắc được Thắng quán.\n                  → Như vậy, Thắng quán đi song song với Tịch chỉ, cho nên gọi là chánh\n              quán song vận tam ma địa.\n         iii. Kiến đạo\n              -   Sau Gia hành đạo, [hành giả] đắc được Kiến đạo.\n              -   Vậy nên chánh quán song vận tam ma địa là tăng thượng duyên bất cộng\n                  của Du già hiện tiền.\n              -   Sau Tư lương đạo và Gia hành đạo thì lên đến Kiến đạo mới gọi là Du già\n                  hiện tiền.\n8. Điều kiện để có Du già hiện tiền\n   - Du già hiện tiền phải là Trí thuộc dòng tương tục của Thánh giả, mà Thánh giả thì\n      phải đắc được từ Kiến đạo trở lên.\n   - Muốn có Du già hiện tiền, phải có tăng thượng duyên bất cộng của chính nó là\n      chánh quán song vận tam ma địa.\n9. Tóm tắt trình tự chứng đạo\n   - Tư lương đạo: Hành giả đắc được Tịch chỉ.\n   - Gia hành đạo: Hành giả đắc được Chánh quán song vận tam ma địa.\n   - Kiến đạo: Hành giả mới có Du già hiện tiền.\n\n      Sư cô căn dặn: Trước mắt, mọi người chỉ cần hiểu như vậy, không cần hiểu sâu hơn\nnữa. Nắm được trình tự chứng đạo như trên là đủ rồi.\n\n10. Phân loại Du già hiện tiền\nPhân loại có 3: Thinh văn du già hiện tiền, Duyên giác du già hiện tiền, Đại thừa du già hiện\ntiền.\nདབེ་ན། ཉན་ཐློས། རང་རྒྱལ། ཐེག་ཆེན་གི་དེ་གསུམ་ཡདློ །\n                                                  (Trích dẫn SGK Tâm Loại Học - 2026)\nGiải thích:\nCó ba hàng Thánh tương ứng với ba thừa: Thinh văn, Duyên giác và Đại thừa.\na. Thinh văn du già hiện tiền\n\n\n                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 23 / 24>\n                           TÂM LOẠI HỌC - Geshe Jampal Samphel trước tác|\n\n\n   Du già hiện tiền nằm trong dòng tương tục của Thinh văn thánh giả thì gọi là Thinh văn\n   du già hiện tiền.\n   Bao gồm Du già hiện tiền trong dòng tương tục của:\n                ● Thinh văn kiến đạo giả.\n                ● Thinh văn tu đạo giả.\n                ● Thinh văn vô học đạo giả.\nb. Duyên giác du già hiện tiền\n   Du già hiện tiền nằm trong dòng tương tục của Duyên giác Thánh giả thì gọi là Duyên\n   giác du già hiện tiền.\n   Bao gồm Du già hiện tiền trong dòng tương tục của:\n         -   Duyên giác kiến đạo giả.\n         -   Duyên giác tu đạo giả.\n         -   Duyên giác vô học đạo giả.\nc. Đại thừa du già hiện tiền\n   Du già hiện tiền nằm trong dòng tương tục của Đại thừa Thánh giả thì gọi là Đại thừa\n   du già hiện tiền.\n   Bao gồm Du già hiện tiền trong dòng tương tục của:\n         -   Đại thừa kiến đạo giả.\n         -   Đại thừa tu đạo giả.\n         -   Đại thừa vô học đạo giả.\n\nMọi người nhớ như vậy nha.\n\nBÀI TẬP VỀ NHÀ\n1. Tự chứng hiện tiền trải nghiệm là tỷ độ trong dòng tương tục của Thuận Thế phái có là\n   Hển nhi bất định không?\n2. Sự khác biệt giữa Tự chứng hiện tiền và Lượng là musum, mushi, đồng nghĩa hay tương\n   nghịch?\n\n\n   Ghi bài: Hoàng Mai Anh, Đỗ Thị Thu Hiền, Nguyễn Thị Hiệp, Phạm Thị Thu Hòa, Vương Đình\n                        Thái Quý, Hoàng Thị Trúc Quỳnh, Nguyễn Mai Thảo, Lục Thị Thu Thủy\n                                                  Duyệt bài ghi: Ani Tenzin Palyon Pháp Đăng\n                                          Chúng con nguyện Sư Thầy và Sư Cô được vĩnh khang!\n\n\n\n                                    © Nalanda Việt Học 2026 - 2027* lớp THPG11\n<PARSED TEXT FOR PAGE: 24 / 24>\n              TÂM LOẠI HỌC - Jampal Trinley Yonten Gyatso trước tác\n\n\n            Nguyện cho các Bậc Thầy kính yêu phúc thọ an khang,\n    Nguyện cho cơn mưa to Mật pháp tối thượng thấm nhuần khắp mọi nơi,\nNguyện cho mật nhũ Kim Cang Thừa xuôi dòng Cửu Long đến tận quê hương con,\n     Nguyện cho giáo pháp diệu thâm của Đức Thích Ca chiếu sáng đời đời.\n\n\n\n\n                           © Nalanda Việt Học 2026 - 2027* lớp THPG11","note":"Văn bản trích xuất từ tài liệu bài giảng; đối chiếu với bản gốc khi cần nguyên văn LG/ĐLG."}],"mindmap":{"root":"GIÁC TRI · LIỄU TRI · TRI THỨC","class7":["Hiện tiền","Tỷ độ","Tái quyết tri","Tứ sát tri","Hiển nhi bất định","Nghi","Điên đảo tri"],"hientien":["Căn hiện tiền","Ý hiện tiền","Tự chứng hiện tiền","Du già hiện tiền"],"tydo":["Tín hứa tỷ độ","Cực thành tỷ độ","Sự thế tỷ độ"],"class3":["Phân biệt lấy nghĩa tổng","Vô sai loạn vô phân biệt","Sai loạn vô phân biệt"],"class2":["Lượng ↔ Phi lượng","Phân biệt ↔ Vô phân biệt","Sai loạn ↔ Vô sai loạn","Ý tri ↔ Căn tri","Khiển nhập ↔ Thành nhập","Tâm ↔ Tâm sở"]},"comparisons":[{"a":"Căn hiện tiền","b":"Căn tri","type":"musum","test":["Căn hiện tiền ⇒ Căn tri","Căn tri ⇏ Căn const VIEWS=[['study','▤','Bài học'],['map','◇','Sơ đồ kiến thức'],['compare','⇄','So sánh & biện kinh'],['flash','▣','Flashcards'],['quiz','✎','Tự kiểm tra'],['glossary','☷','Tra cứu thuật ngữ'],['source','▥','Đối chiếu SGK']];
const groups=[...new Set(DB.lessons.map(x=>x.group))];
let view=store.view||'study',lessonId=Math.min(38,Math.max(1,store.lesson||1)),page=3,sideOpen=false;
let flashIndex=0,flashBack=false,flashFilter='all',flashDeck=[],flashOrder=[],compareIdx=0,caseRevealed={},searching='';
let quizIds=[],quizIndex=0,quizAnswers={},quizMode='quick',quizGroup='all';
let sourceName='SGK',sourceQuery='';
const e=s=>String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLocaleLowerCase('vi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const qs=s=>document.querySelector(s);
const lesson=id=>DB.lessons.find(x=>x.id===Number(id));
function save(){try{localStorage.setItem(SKEY,JSON.stringify(store))}catch(err){console.warn('Local storage unavailable')}}
function updateProgress(){const n=Object.keys(store.read).filter(k=>store.read[k]).length;const pct=Math.round(n/DB.lessons.length*100);qs('#sidePct').textContent=pct+'%';qs('#sideBar').style.width=pct+'%';qs('#sideFraction').textContent=`${n} / ${DB.lessons.length} bài đã hoàn thành`}
function toast(s){const el=qs('#toast');el.textContent=s;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function setDark(){document.body.classList.toggle('dark',!!store.dark);document.documentElement.style.setProperty('--fontscale',String(store.font||1))}
function sidebar(){const nav=qs('#navMain');nav.innerHTML=VIEWS.map(([v,i,t])=>`<button class="nav-btn ${v===view?'active':''}" data-view="${v}"><span class="sym">${i}</span>${t}</button>`).join('');qs('#chapterNav').innerHTML=groups.map((g,n)=>`<div class="chap"><button class="chap-ttl" data-chapter="${n}">⌄　${e(g)} <small>${DB.lessons.filter(x=>x.group===g).length}</small></button><div class="chap-items" id="chap-${n}">${DB.lessons.filter(x=>x.group===g).map(x=>`<button class="lesson-link ${view==='study'&&lessonId===x.id?'active':''}" data-lesson="${x.id}"><span class="num">${String(x.id).padStart(2,'0')}</span><span>${e(x.title)}</span>${store.read[x.id]?'<span class="done">✓</span>':''}</button>`).join('')}</div></div>`).join('');updateProgress()}
function closeSide(){sideOpen=false;qs('#sidebar').classList.remove('open');qs('#overlay').classList.remove('open')}
function go(v, id){qs('#searchPop').hidden=true;view=v;if(id){lessonId=Number(id);store.lesson=lessonId}store.view=view;save();render();closeSide();window.scrollTo({top:0,behavior:'instant'})}
function goPage(pg){page=Math.max(1,Math.min(57,Number(pg)||3));sourceName='SGK';go('source')}
function button(txt,action='',cl=''){return `<button class="btn ${cl}" ${action}>${e(txt)}</button>`}
function sourceButtons(pgs){return (pgs||[]).map(n=>`<button class="page-tag" data-page="${n}">SGK tr. ${n} ↗</button>`).join('')}
function badgeText(){const n=Object.keys(store.read).filter(k=>store.read[k]).length;return `${n} / 38 bài hoàn tất`}
function homeFlow(){const steps=[
  {group:groups[0],short:'Nền tảng',desc:'Giác tri, tánh tướng, cảnh và khung phân loại'},
  {group:groups[1],short:'Bảy loại giác tri',desc:'Khảo sát từng loại và các ví dụ chính'},
  {group:groups[2],short:'Ba loại giác tri',desc:'Phân loại theo sở thủ cảnh'},
  {group:groups[3],short:'Sáu cặp hai loại',desc:'So sánh theo từng tiêu chí nhận thức'},
  {group:groups[4],short:'Biện kinh',desc:'Musum, mushi, phản ví dụ và vận dụng'}
];return `<section class="flowband"><div class="section-kicker">SƠ ĐỒ TOÀN MÔN</div><div class="flowline">${steps.map((s,i)=>`<button class="flow-step" data-lesson="${DB.lessons.find(l=>l.group===s.group).id}"><span>${String(i+1).padStart(2,'0')}</span><b>${e(s.short)}</b><small>${e(s.desc)}</small></button>${i<steps.length-1?'<div class="flow-arrow">→</div>':''}`).join('')}</div></section>`}
function lessonGraphic(x){const g=String(x.group).slice(0,2);const titles={'01':'Nền tảng','02':'Bảy loại giác tri','03':'Ba loại giác tri','04':'Các cặp phân loại','05':'Biện kinh & vận dụng'};const meta={
  '01':{q:'Khái niệm nào đang được kiến lập và dùng theo nghĩa nào?',anchor:'Giác tri · Liễu tri · cảnh · ba hệ phân loại',practice:'Đọc định nghĩa → nói lại quan hệ → tự cho ví dụ.'},
  '02':{q:'Loại giác tri này có tánh tướng và phân loại con ra sao?',anchor:'Hiện tiền · tỷ độ · nghi · điên đảo tri...',practice:'Nhớ tên loại → định nghĩa → ví dụ/sự tướng.'},
  '03':{q:'Tâm này lấy loại sở thủ cảnh nào làm trọng tâm?',anchor:'Nghĩa tổng · tự tướng · hữu vô minh hiện',practice:'So với hệ bảy loại rồi kiểm tra chỗ đồng/khác.'},
  '04':{q:'Tiêu chí phân đôi đang xét là gì?',anchor:'Lượng/phi lượng · ý tri/căn tri · tâm/tâm sở',practice:'Xác định tiêu chí trước rồi mới phân loại.'},
  '05':{q:'A và B liên hệ thế nào trong bốn khả năng hoặc bao hàm?',anchor:'Musum · mushi · đồng nghĩa · tương nghịch',practice:'Cho đủ sự tướng và phản ví dụ cho từng chiều.'}
};const m=meta[g]||meta['01'];const order=['01','02','03','04','05'];return `<section class="panel lesson-overview"><div class="section-kicker">SƠ ĐỒ NHÌN NHANH</div><div class="journey">${order.map((id,i)=>`<div class="journey-step ${id===g?'active':''}"><span>${id}</span><b>${titles[id]}</b></div>${i<order.length-1?'<i class="journey-arrow">→</i>':''}`).join('')}</div><div class="insight-grid"><div class="insight-card"><b>Câu hỏi trung tâm</b><p>${e(m.q)}</p></div><div class="insight-card"><b>Trọng điểm của bài</b><p>${e(m.anchor)}</p></div><div class="insight-card"><b>Cách ôn nhanh</b><p>${e(m.practice)}</p></div></div></section>`}
function compareGuide(c){if(c.type==='mushi'){return `<div class="compare-guide"><div class="section-kicker">SƠ ĐỒ QUAN HỆ</div><div class="logic-matrix"><div class="logic-cell"><b>A không là B</b><span>Tìm một sự tướng thuộc A nhưng không thuộc B.</span></div><div class="logic-cell"><b>B không là A</b><span>Tìm một sự tướng thuộc B nhưng không thuộc A.</span></div><div class="logic-cell"><b>A và B</b><span>Tìm một trường hợp vừa thuộc cả hai.</span></div><div class="logic-cell"><b>Không A không B</b><span>Tìm một pháp không thuộc cả hai.</span></div></div><p class="small-text muted">Với <b>mushi</b>, mục tiêu là kiểm tra đủ bốn vùng khả hữu. Sau đó mới mở các sự tướng gợi ý ở bên dưới.</p></div>`}return `<div class="compare-guide"><div class="section-kicker">SƠ ĐỒ QUAN HỆ</div><div class="logic-lane"><div class="logic-node"><b>${e(c.a)}</b><span>Khái niệm A</span></div><div class="logic-arrow">⇒</div><div class="logic-node"><b>${e(c.b)}</b><span>Khái niệm B</span></div></div><div class="logic-pill-row"><span class="logic-pill strong">A ⇒ B</span><span class="logic-pill">B ⇏ A</span></div><p class="small-text muted">Với <b>musum</b>, trước hết xác định chiều bao hàm. Sau đó phải nêu được ít nhất một phản ví dụ cho chiều ngược lại.</p></div>`}

function home(){return `<div class="hero"><div class="eyebrow">CẨM NANG TƯƠNG TÁC • THPG / NALANDA 2026</div><h1>Hiểu rõ tâm thức.<br/>Học theo hệ thống.</h1><p>Toàn bộ giáo trình <b>Kiến lập Tâm loại học</b> được sắp xếp lại thành lộ trình học theo chủ đề, có sơ đồ liên kết, sự tướng, công cụ biện kinh và câu hỏi ôn tập. Mỗi bài đều chỉ rõ trang SGK để đối chiếu.</p><div class="stats"><div class="stat"><strong>38</strong><span>Bài học theo chủ đề</span></div><div class="stat"><strong>57</strong><span>Trang SGK đối chiếu</span></div><div class="stat"><strong>${DB.questions.length}</strong><span>Câu hỏi tự kiểm tra</span></div><div class="stat"><strong>${DB.glossary.length}</strong><span>Thuật ngữ tra cứu</span></div></div><div class="hero-actions"><button class="btn primary" data-lesson="${store.lesson||1}">Tiếp tục học ↗</button><button class="btn ghost" data-view="map">Xem cấu trúc kiến thức</button></div></div>${homeFlow()}<div class="grid2"><div class="panel"><div class="section-kicker">LỘ TRÌNH HỌC</div><h2>Đi từ tánh tướng đến biện kinh</h2>${groups.map((g,i)=>`<div style="display:flex;gap:14px;align-items:start;border-bottom:1px solid var(--line);padding:13px 0"><span style="color:var(--accent);font:normal 23px Georgia">0${i+1}</span><div style="flex:1"><b>${e(g.split(' · ')[1])}</b><div class="muted small-text">${DB.lessons.filter(x=>x.group===g).length} bài học · ${i===0?'Nắm định nghĩa và mối liên hệ':i===1?'Khảo sát từng loại giác tri':i===2?'Đổi góc nhìn theo sở thủ cảnh':i===3?'So sánh các hệ đôi':'Thực hành bốn khả năng và phản chứng'}</div></div><button class="btn small" data-lesson="${DB.lessons.find(x=>x.group===g).id}">Mở</button></div>`).join('')}</div><div><div class="panel"><div class="section-kicker">HỌC HẰNG NGÀY</div><h2>Tiến độ của chị</h2><div class="big-numb">${Math.round(Object.keys(store.read).filter(k=>store.read[k]).length/38*100)}%</div><p>${badgeText()}</p><div class="bar" style="background:var(--soft);height:10px"><i style="width:${Math.round(Object.keys(store.read).filter(k=>store.read[k]).length/38*100)}%"></i></div><div class="settings" style="margin-top:18px"><button class="btn small" data-view="flash">Luyện flashcards</button><button class="btn small" data-view="quiz">Bắt đầu kiểm tra</button><button class="btn small" data-action="exportProgress">Xuất tiến độ</button></div></div><div class="notice"><b>Nguyên tắc học thuật:</b> Những phần tánh tướng, ví dụ và kết luận quan trọng được đối chiếu giáo trình 2026. Các đoạn “Tóm tắt để học” là phần hệ thống hóa; khi biện kinh nên dùng nguyên văn SGK và bài giảng. Một số chỗ giáo trình trình bày quan điểm tranh luận, không nên rút thành khẳng định tuyệt đối.</div></div></div>`}
function topic(){const x=lesson(lessonId)||DB.lessons[0];const done=!!store.read[x.id],book=!!store.bookmarks[x.id];return `<div class="crumb">CẨM NANG / ${e(x.group)} / <b>Bài ${String(x.id).padStart(2,'0')}</b></div><div class="topic-head"><div><h1>${e(x.title)}</h1><p>${e(x.summary)}</p><div class="chips"><span class="chip">Bài ${String(x.id).padStart(2,'0')} / 38</span><span class="chip">${e(x.group.split(' · ')[1])}</span><span class="chip">SGK: tr. ${e(x.pages.join(', '))}</span></div></div><div class="topic-actions"><button class="btn small ${book?'saved':''}" data-action="bookmark">${book?'★ Đã đánh dấu':'☆ Đánh dấu'}</button><button class="btn small ${done?'success':''}" data-action="read">${done?'✓ Đã hoàn thành':'○ Hoàn thành'}</button></div></div><div class="lesson-layout"><div class="lesson-body">${lessonGraphic(x)}${x.definition?`<section class="panel"><div class="section-kicker">TÁNH TƯỚNG / LƯỢC TRÍCH TỪ GIÁO TRÌNH</div><div class="callout"><div class="hint">Nguồn · SGK 2026</div><p>${e(x.definition)}</p></div><div class="page-source">${sourceButtons(x.pages.slice(0,3))}</div></section>`:''}<section class="panel"><div class="section-kicker">TRỌNG TÂM CẦN HIỂU</div><h2>Cấu trúc kiến thức</h2><ul class="points">${x.points.map(p=>`<li>${e(p)}</li>`).join('')}</ul></section>${x.example?`<section class="emphasis"><b>SỰ TƯỚNG / VÍ DỤ</b><div>${e(x.example)}</div></section>`:''}${x.attention?`<section class="emphasis warn"><b>LƯU Ý KHI HỌC VÀ BIỆN KINH</b><div>${e(x.attention)}</div></section>`:''}${x.id===32?mentalBox():''}<section class="panel"><div class="section-kicker">ĐỐI CHIẾU TÀI LIỆU</div><h3>Trang gốc liên quan</h3><p class="small-text muted">Chọn một số trang để đọc lại bản văn SGK, bao gồm lập luận và các biện đề không rút gọn trong tóm tắt.</p><div class="page-source">${sourceButtons(x.pages)}</div></section><div class="lesson-footer"><button class="btn" ${x.id<=1?'disabled':''} data-lesson="${x.id-1}">← Bài trước</button><button class="btn primary" ${x.id>=38?'disabled':''} data-lesson="${x.id+1}">Bài tiếp →</button></div></div><aside class="note-right"><div class="panel"><div class="section-kicker">GÓC GHI CHÚ CÁ NHÂN</div><h4>Ghi chú bài ${x.id}</h4><textarea id="lessonNote" placeholder="Ghi lại lời Thầy/Cô, sự tướng cần nhớ, hoặc câu hỏi muốn hỏi lại...">${e(store.notes[x.id]||'')}</textarea><div class="small-text muted">Ghi chú lưu trong trình duyệt này.</div><button class="btn primary" data-action="saveNote">Lưu ghi chú</button><button class="btn" data-action="lessonQuiz">Luyện câu hỏi của bài</button></div><div class="panel" style="margin-top:15px"><div class="section-kicker">MẸO ÔN TẬP</div><p class="small-text muted">Đọc tánh tướng → nói lại phân loại → tự cho sự tướng → kiểm tra chiều “nhất thiết / không nhất thiết”.</p><div class="chips"><span class="chip">Tánh tướng</span><span class="chip">Phân loại</span><span class="chip">Sự tướng</span></div></div></aside></div>`}
function mentalBox(){return `<section class="panel"><div class="section-kicker">DANH MỤC ĐẦY ĐỦ · 51 TÂM SỞ</div><h2>Sáu nhóm tâm sở</h2><div class="mental-section">${DB.mental.map(([t,list])=>`<details class="mental-detail"><summary>${e(t)} <span>${list.length} tâm sở ⌄</span></summary><div class="mental-list">${list.map(x=>`<span>${e(x)}</span>`).join('')}</div></details>`).join('')}</div><p class="small-text muted" style="margin-top:13px">Đối chiếu tên gọi và thứ tự với SGK trang 56–57.</p></section>`}
function mapView(){const block=(title,items,group)=>`<section class="map-column"><div class="map-title">${e(title)}</div><div class="node-grid">${items.map((x,i)=>{const match=DB.lessons.find(l=>norm(l.title).includes(norm(x.split(' ↔ ')[0])));return `<button class="node" data-lesson="${match?match.id:(group||4)}"><b>${String(i+1).padStart(2,'0')}</b>${e(x)}</button>`}).join('')}</div></section>`;return `<div class="eyebrow">BẢN ĐỒ TỔNG THỂ</div><h1 class="sect-title" style="font-size:39px">Một đối tượng, ba hệ phân loại</h1><p class="muted">Chọn bất kỳ ô nào để mở bài học liên quan. Các hệ phân loại là những cách tiếp cận khác nhau đối với Giác tri.</p><div class="tree-root">${e(DB.mindmap.root)}</div><div class="trail"><i>↓</i><span class="chip">Tánh tướng</span><i>→</i><span class="chip">Phân loại</span><i>→</i><span class="chip">Nghĩa của từng loại</span></div><div class="map-grid">${block('HỆ 1 / BẢY LOẠI GIÁC TRI',DB.mindmap.class7,4)}<div>${block('HỆ 2 / BA LOẠI GIÁC TRI',DB.mindmap.class3,21)}</div></div><div class="map-grid" style="margin-top:16px"><section class="map-column"><div class="map-title">CÁC NHÁNH PHÂN LOẠI QUAN TRỌNG</div><details class="map-sub" open><summary>Hiện tiền có bốn loại</summary><div class="chips">${DB.mindmap.hientien.map(x=>`<button class="chip" data-lesson="${DB.lessons.find(l=>l.title.startsWith(x)).id}">${e(x)}</button>`).join('')}</div></details><details class="map-sub" open><summary>Tỷ độ có ba loại</summary><div class="chips">${DB.mindmap.tydo.map(x=>`<button class="chip" data-lesson="${DB.lessons.find(l=>l.title.startsWith(x)).id}">${e(x)}</button>`).join('')}</div></details><details class="map-sub"><summary>51 tâm sở</summary><div class="chips">${DB.mental.map(([t,v])=>`<button class="chip" data-lesson="32">${e(t)} (${v.length})</button>`).join('')}</div></details></section>${block('HỆ 3 / SÁU CẶP PHÂN LOẠI HAI',DB.mindmap.class2,25)}</div><div class="notice">Lưu ý: mũi tên trên đây biểu thị lộ trình học, không phải khẳng định quan hệ bao hàm giữa mọi khái niệm. Để xét quan hệ nhất thiết, chuyển sang <button class="btn small" data-view="compare">So sánh & biện kinh</button>.</div>`}
function compareView(){const c=DB.comparisons[compareIdx]||DB.comparisons[0];return `<div class="eyebrow">PHÒNG LUYỆN BIỆN KINH</div><h1 class="sect-title" style="font-size:38px">So sánh hai khái niệm</h1><p class="muted">Chọn cặp đối tự, thử suy nghĩ về chiều nhất thiết và các sự tướng, sau đó mở đáp án từng trường hợp. Các ví dụ được gắn nguồn SGK hoặc bài giảng.</p>${compareGuide(c)}<div class="panel"><div class="section-kicker">CHỌN ĐỐI TỰ</div><select id="compareSelect" style="width:100%;max-width:650px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:11px;border-radius:9px">${DB.comparisons.map((x,i)=>`<option value="${i}" ${i===compareIdx?'selected':''}>${e(x.a)}  ↔  ${e(x.b)}</option>`).join('')}</select><div class="compare-pair"><div class="compare-side"><div class="letter">KHÁI NIỆM A</div><h3>${e(c.a)}</h3></div><div class="compare-side"><div class="letter">KHÁI NIỆM B</div><h3>${e(c.b)}</h3></div></div><span class="rel-chip">${c.type==='mushi'?'MUSHI · Bốn khả năng':'MUSUM · Bao hàm một chiều'}</span><div class="chips" style="margin-top:14px">${c.test.map(t=>`<span class="chip">${e(t)}</span>`).join('')}</div><h3 class="compare-title">${c.type==='mushi'?'Bốn trường hợp để tự biện':'Thử nêu phản ví dụ và trường hợp bao hàm'}</h3><div class="case-grid">${c.examples.map((ex,i)=>`<div class="case-card"><h4>${e(c.test[i]||('Sự tướng '+(i+1)))}</h4>${caseRevealed[compareIdx+':'+i]?`<p class="reveal">${e(ex)}</p>`:'<p class="hint">Tự nêu sự tướng trước khi xem đáp án.</p>'}<button class="btn small" data-case="${i}">${caseRevealed[compareIdx+':'+i]?'Ẩn đáp án':'Xem sự tướng'}</button></div>`).join('')}</div><div class="notice"><b>Nguồn:</b> ${e(c.source)}. Mỗi biện đề phải giữ đúng pháp được xét và cụm điều kiện, đặc biệt ở các ví dụ về tỷ lượng, hiện tiền và chứng cảnh.</div></div>`}
function refreshDeck(){flashDeck=[];if(flashFilter==='all'||flashFilter==='term'){for(const a of DB.glossary)flashDeck.push({key:'g_'+a[0],front:a[0],back:a[1],source:'SGK tr. '+a[3]})}if(flashFilter==='all'||flashFilter==='def'){for(const l of DB.lessons.filter(l=>l.definition))flashDeck.push({key:'l_'+l.id,front:l.title,back:l.definition,source:'SGK tr. '+l.pages[0]})}if(flashOrder.length){const ranks=new Map(flashOrder.map((key,i)=>[key,i]));flashDeck.sort((a,b)=>(ranks.get(a.key)??9999)-(ranks.get(b.key)??9999))}flashIndex=Math.min(flashIndex,Math.max(0,flashDeck.length-1))}
function flashView(){refreshDeck();const f=flashDeck[flashIndex]||{key:'empty',front:'Không có thẻ',back:'',source:''};const k=Object.keys(store.known).filter(x=>store.known[x]).length;return `<div class="eyebrow">ÔN TẬP CHỦ ĐỘNG</div><h1 class="sect-title" style="font-size:38px">Thẻ ghi nhớ</h1><p class="muted">Đọc thuật ngữ, cố gắng nói lại tánh tướng hoặc nội dung, rồi nhấn vào thẻ để lật. Các thẻ đánh dấu “Đã nhớ” sẽ được lưu.</p><div class="selector">${[['all','Tất cả'],['def','Tánh tướng'],['term','Thuật ngữ']].map(([v,t])=>`<button class="${v===flashFilter?'active':''}" data-flash-filter="${v}">${t}</button>`).join('')}</div><div class="flash-shell"><div class="flash-meta"><span>THẺ ${flashIndex+1} / ${flashDeck.length}</span><span>${k} thẻ đã ghi nhớ</span></div><button class="flashcard" data-action="flip"><div class="section-kicker">${flashBack?'MẶT SAU / GHI NHỚ':'MẶT TRƯỚC / TỰ TRẢ LỜI'}</div>${flashBack?`<p>${e(f.back)}</p>`:`<h2>${e(f.front)}</h2>`}<div class="flash-hint">${flashBack?e(f.source):'Nhấn vào thẻ để xem mặt sau'}</div></button><div class="flash-actions"><button class="btn" data-action="flashPrev" ${flashIndex===0?'disabled':''}>← Trước</button><button class="btn ${store.known[f.key]?'success':''}" data-action="flashKnown">${store.known[f.key]?'✓ Đã nhớ':'☆ Đánh dấu đã nhớ'}</button><button class="btn primary" data-action="flashNext">Thẻ tiếp →</button><button class="btn" data-action="flashShuffle">⤨ Trộn thẻ</button></div></div>`}
function resetQuiz(mode,focus){quizMode=mode||'quick';quizGroup=focus||'all';let eligible=DB.questions.map((_,i)=>i);if(quizGroup!=='all'&&quizGroup!=='lesson')eligible=eligible.filter(i=>lesson(DB.questions[i].lesson)?.group===quizGroup);if(quizGroup==='lesson')eligible=eligible.filter(i=>DB.questions[i].lesson===lessonId);if(!eligible.length)eligible=DB.questions.map((_,i)=>i);if(quizMode==='quick'){eligible=eligible.sort(()=>Math.random()-.5).slice(0,Math.min(10,eligible.length))}quizIds=eligible;quizIndex=0;quizAnswers={}}
function quizView(){if(!quizIds.length)resetQuiz('quick','all');const total=quizIds.length,answered=Object.keys(quizAnswers).length,correct=Object.entries(quizAnswers).filter(([id,val])=>DB.questions[Number(id)].answer===val).length;if(quizIndex>=total)return `<div class="panel"><div class="eyebrow">HOÀN THÀNH BÀI KIỂM TRA</div><h1 class="sect-title">Kết quả của chị</h1><div class="big-numb">${correct} / ${total}</div><p>Trả lời đúng ${Math.round(correct/total*100)}%. ${correct===total?'Rất tốt, có thể ôn thêm biện kinh để củng cố.':'Xem lại những câu chưa chính xác và đối chiếu số trang SGK trong phần giải thích.'}</p><div class="settings"><button class="btn primary" data-action="quizAgain">Làm bài khác</button><button class="btn" data-view="study">Ôn lại bài học</button></div><div class="notice">Kết quả chỉ là bài tự kiểm tra kiến thức trong cẩm nang, không thay thế đánh giá của Thầy/Cô.</div></div>`;const id=quizIds[quizIndex],q=DB.questions[id],user=quizAnswers[id],isAnswered=user!==undefined;return `<div class="eyebrow">KIỂM TRA KIẾN THỨC</div><h1 class="sect-title" style="font-size:38px">Tự kiểm tra</h1><div class="section-tabs"><button class="btn small ${quizMode==='quick'&&quizGroup==='all'?'active':''}" data-quiz-mode="quick">10 câu nhanh</button><button class="btn small ${quizMode==='all'&&quizGroup==='all'?'active':''}" data-quiz-mode="all">Toàn bộ ${DB.questions.length} câu</button><select id="quizGroup" style="max-width:260px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px;border-radius:8px;font-size:12px"><option value="all">Tất cả chủ đề</option>${groups.map(g=>`<option value="${e(g)}" ${quizGroup===g?'selected':''}>${e(g)}</option>`).join('')}</select></div><section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)"><span>CÂU ${quizIndex+1} / ${total}</span><span>Đã trả lời ${answered} · Đúng ${correct}</span></div><div class="quiz-track"><span style="width:${((quizIndex+(isAnswered?1:0))/total)*100}%"></span></div><div class="chips"><span class="chip">${e(lesson(q.lesson)?.group.split(' · ')[1]||'Tổng hợp')}</span><button class="chip" data-lesson="${q.lesson}">Bài ${q.lesson} ↗</button></div><h2 class="question">${e(q.q)}</h2><div class="answers">${q.options.map((op,n)=>`<button class="answer ${isAnswered&&n===q.answer?'right':''} ${isAnswered&&n===user&&n!==q.answer?'wrong':''}" data-answer="${n}" ${isAnswered?'disabled':''}><span class="circle">${String.fromCharCode(65+n)}</span><span>${e(op)}</span></button>`).join('')}</div>${isAnswered?`<div class="feedback"><b>${user===q.answer?'✓ Chính xác':'✗ Chưa đúng'}.</b> ${e(q.reason)}<div style="margin-top:7px">Đáp án: <strong>${e(q.options[q.answer])}</strong>.</div></div>`:''}<div class="quiz-bottom"><span class="small-text muted">Chọn một đáp án để xem giải thích & nguồn.</span><button class="btn primary" ${!isAnswered?'disabled':''} data-action="quizNext">${quizIndex+1===total?'Xem kết quả':'Câu tiếp →'}</button></div></section>`}
function glossaryView(){return `<div class="eyebrow">TRA CỨU NHANH</div><h1 class="sect-title" style="font-size:38px">Từ điển Tâm loại học</h1><p class="muted">${DB.glossary.length} thuật ngữ và khái niệm được sắp xếp theo nội dung môn học. Gõ vào ô tìm kiếm chung phía trên để lọc theo tên hoặc nội dung.</p><div class="panel" style="margin-bottom:15px"><input id="glossaryInput" placeholder="Lọc thuật ngữ ở đây..." style="width:100%;background:var(--paper);color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:9px"/></div><div class="dictionary" id="dictionary"></div>`}
function fillDictionary(search=''){const arr=DB.glossary.filter(x=>norm(x[0]+' '+x[1]).includes(norm(search)));qs('#dictionary').innerHTML=arr.length?arr.map(x=>`<article class="term"><h3>${e(x[0])}</h3><p>${e(x[1])}</p><div style="display:flex;justify-content:space-between;gap:8px"><button data-lesson="${x[2]}">Mở bài ${x[2]}</button><button data-page="${x[3]}">SGK tr. ${x[3]} ↗</button></div></article>`).join(''):`<p class="empty">Không tìm thấy thuật ngữ phù hợp.</p>`}
function selectedSourceText(){if(sourceName==='SGK')return DB.pages[String(page)]||'';return (DB.lectures.find(l=>l.id===sourceName)||{}).text||''}
function sourceView(){const isBook=sourceName==='SGK';return `<div class="eyebrow">TỦ SÁCH & ĐỐI CHIẾU</div><h1 class="sect-title" style="font-size:38px">Đọc bản văn nguồn</h1><p class="muted">Giáo trình 2026 được gắn số trang để so sánh từng bài. Có thêm tài liệu bài giảng tham khảo, hiển thị nguyên văn phần trích xuất; tuyệt đối không coi tóm tắt của cẩm nang là bản thay thế.</p><div class="source-helper"><span class="tip-pill">◦ <b>57 trang SGK</b></span><span class="tip-pill">◦ <b>Tìm từ khóa</b> trong nguồn</span><span class="tip-pill">◦ <b>Đối chiếu</b> bài giảng bổ trợ</span></div><div class="source-layout"><aside class="source-left"><div class="section-kicker">CHỌN TÀI LIỆU</div><select id="sourceSelect"><option value="SGK" ${sourceName==='SGK'?'selected':''}>SGK Tâm loại học 2026</option>${DB.lectures.map(l=>`<option value="${l.id}" ${sourceName===l.id?'selected':''}>${e(l.title)}</option>`).join('')}</select>${isBook?`<div class="section-kicker" style="margin-top:13px">TRANG SGK</div><div class="pagegrid">${Array.from({length:57},(_,i)=>`<button class="${page===i+1?'active':''}" data-page="${i+1}">${i+1}</button>`).join('')}</div>`:''}<div class="section-kicker" style="margin-top:15px">TÌM TRONG NGUỒN</div><input id="sourceSearch" type="search" value="${e(sourceQuery)}" placeholder="Tìm từ/cụm từ..."/><div class="source-results" id="sourceResults"></div><div class="notice">Nội dung là văn bản trích xuất phục vụ tra cứu. Một số định dạng và ký tự Tây Tạng không được giữ trong bản đọc thuần văn bản; vui lòng đối chiếu PDF gốc nếu cần độ chính xác tuyệt đối.</div></aside><div class="source-reader"><div class="reader-top"><div><div class="section-kicker">${isBook?'KIẾN LẬP TÂM LOẠI HỌC':'BÀI GIẢNG BỔ TRỢ'}</div><b>${isBook?'Trang '+page+' / 57':e((DB.lectures.find(l=>l.id===sourceName)||{}).title||'')}</b></div>${isBook?`<div class="settings"><button class="btn small" data-action="pagePrev" ${page<=1?'disabled':''}>← Trước</button><button class="btn small" data-action="pageNext" ${page>=57?'disabled':''}>Sau →</button></div>`:''}</div><div class="reader-text" id="readerText">${highlightText(selectedSourceText(),sourceQuery)}</div></div></div>`}
function highlightText(t,k){if(!k||k.trim().length<2)return e(t);const s=t.toLocaleLowerCase('vi'),n=k.toLocaleLowerCase('vi');let pos=0,out='',i=s.indexOf(n);while(i>=0&&pos<500000){out+=e(t.slice(pos,i))+'<mark>'+e(t.slice(i,i+n.length))+'</mark>';pos=i+n.length;i=s.indexOf(n,pos)}return out+e(t.slice(pos))}
function updateSourceMatches(){const target=qs('#sourceResults');if(!target)return;const k=norm(sourceQuery);if(k.length<2){target.innerHTML='<span class="small-text muted">Nhập ít nhất 2 ký tự để tìm theo số trang.</span>';return}if(sourceName!=='SGK'){const text=norm(selectedSourceText()),count=(text.match(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;target.innerHTML=`<span class="small-text muted">${count} lượt xuất hiện trong bài giảng.</span>`;return}const matches=Object.entries(DB.pages).filter(([p,t])=>norm(t).includes(k));target.innerHTML=matches.length?matches.map(([p,t])=>`<button data-page="${p}">Trang ${p} · Có kết quả</button>`).join(''):'<span class="small-text muted">Không thấy trong bản văn SGK.</span>'}
function render(){setDark();sidebar();const el=qs('#content');const views={study:()=>lessonId===1?home()+`<h2 class="sect-title">Bài học đang mở</h2>`+topic():topic(),map:mapView,compare:compareView,flash:flashView,quiz:quizView,glossary:glossaryView,source:sourceView};el.innerHTML=(views[view]||views.study)();if(view==='glossary')fillDictionary();if(view==='source')updateSourceMatches();document.title=`${view==='study'?lesson(lessonId).title:VIEWS.find(x=>x[0]===view)?.[2]||'Tâm loại học'} · Nalanda Handbook`;}
function searchPop(term){const box=qs('#searchPop');const k=norm(term.trim());if(k.length<2){box.hidden=true;box.innerHTML='';return}const matchedLessons=DB.lessons.filter(x=>norm(x.title+' '+x.summary+' '+x.points.join(' ')).includes(k)).slice(0,9);const matchedWords=DB.glossary.filter(x=>norm(x[0]+' '+x[1]).includes(k)).slice(0,5);const matchedPages=Object.entries(DB.pages).filter(([p,t])=>norm(t).includes(k)).slice(0,5);box.innerHTML=`<div class="section-kicker" style="margin:5px 9px">KẾT QUẢ TÌM KIẾM</div>${matchedLessons.map(x=>`<button class="search-item" data-lesson="${x.id}"><b>${e(x.title)}</b><small>Bài ${x.id} · ${e(x.group)}</small></button>`).join('')}${matchedWords.map(x=>`<button class="search-item" data-lesson="${x[2]}"><b>${e(x[0])}</b><small>Thuật ngữ · Bài ${x[2]}</small></button>`).join('')}${matchedPages.map(([p,t])=>`<button class="search-item" data-page="${p}"><b>SGK · Trang ${p}</b><small>Khớp nội dung bản văn nguồn</small></button>`).join('')}${!(matchedLessons.length+matchedWords.length+matchedPages.length)?'<div class="empty">Không có kết quả. Thử từ khóa ngắn hơn.</div>':''}`;box.hidden=false}
function exportProgress(){const d={app:'Nalanda Tâm loại học 2026',exported_at:new Date().toISOString(),...store};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Nalanda_Tam_loai_hoc_tien_do.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
// event delegation
window.addEventListener('click',event=>{const button=event.target.closest('[data-view],[data-lesson],[data-page],[data-action],[data-chapter],[data-case],[data-answer],[data-flash-filter],[data-quiz-mode]');if(!button)return;
  if(button.hasAttribute('data-view')){go(button.dataset.view);return}
  if(button.hasAttribute('data-lesson')){const id=Number(button.dataset.lesson);if(id>=1&&id<=38)go('study',id);return}
  if(button.hasAttribute('data-page')){goPage(button.dataset.page);return}
  if(button.hasAttribute('data-chapter')){const elem=qs('#chap-'+button.dataset.chapter);if(elem)elem.hidden=!elem.hidden;return}
  if(button.hasAttribute('data-case')){const k=compareIdx+':'+button.dataset.case;caseRevealed[k]=!caseRevealed[k];render();return}
  if(button.hasAttribute('data-answer')){const id=quizIds[quizIndex];if(quizAnswers[id]!==undefined)return;quizAnswers[id]=Number(button.dataset.answer);render();return}
  if(button.hasAttribute('data-flash-filter')){flashFilter=button.dataset.flashFilter;flashIndex=0;flashBack=false;flashOrder=[];render();return}
  if(button.hasAttribute('data-quiz-mode')){resetQuiz(button.dataset.quizMode,quizGroup==='lesson'?'all':quizGroup);render();return}
  const act=button.dataset.action;
  if(act==='toggleSidebar'){sideOpen=!sideOpen;qs('#sidebar').classList.toggle('open',sideOpen);qs('#overlay').classList.toggle('open',sideOpen)}
  else if(act==='closeSidebar')closeSide();
  else if(act==='theme'){store.dark=!store.dark;save();render()}
  else if(act==='fontPlus'){store.font=(store.font||1)>=1.18?1:Math.round(((store.font||1)+.09)*100)/100;save();render()}
  else if(act==='print')window.print();
  else if(act==='exportProgress'){exportProgress();toast('Đã xuất dữ liệu học tập')}
  else if(act==='bookmark'){store.bookmarks[lessonId]=!store.bookmarks[lessonId];save();render();toast(store.bookmarks[lessonId]?'Đã lưu bài vào mục đánh dấu':'Đã bỏ dấu bài')}
  else if(act==='read'){store.read[lessonId]=!store.read[lessonId];save();render();toast(store.read[lessonId]?'Đã đánh dấu hoàn thành':'Đã bỏ trạng thái hoàn thành')}
  else if(act==='saveNote'){store.notes[lessonId]=qs('#lessonNote')?.value||'';save();toast('Đã lưu ghi chú trên trình duyệt')}
  else if(act==='lessonQuiz'){resetQuiz('all','lesson');go('quiz')}
  else if(act==='flip'){flashBack=!flashBack;render()}
  else if(act==='flashPrev'){flashIndex=Math.max(0,flashIndex-1);flashBack=false;render()}
  else if(act==='flashNext'){flashIndex=(flashIndex+1)%flashDeck.length;flashBack=false;render()}
  else if(act==='flashKnown'){const f=flashDeck[flashIndex];store.known[f.key]=!store.known[f.key];save();render()}
  else if(act==='flashShuffle'){flashOrder=flashDeck.map(x=>x.key).sort(()=>Math.random()-.5);flashIndex=0;flashBack=false;render();toast('Đã trộn vị trí thẻ')}
  else if(act==='quizNext'){if(quizIndex>=quizIds.length)return;quizIndex++;if(quizIndex>=quizIds.length){const correct=Object.entries(quizAnswers).filter(([id,val])=>DB.questions[id].answer===val).length;store.quizHistory.unshift({date:new Date().toISOString(),correct,total:quizIds.length});store.quizHistory=store.quizHistory.slice(0,20);save()}render()}
  else if(act==='quizAgain'){resetQuiz(quizMode,quizGroup);render()}
  else if(act==='pagePrev'){page=Math.max(1,page-1);render()}
  else if(act==='pageNext'){page=Math.min(57,page+1);render()}
});
window.addEventListener('change',ev=>{if(ev.target.id==='compareSelect'){compareIdx=Number(ev.target.value);render()}else if(ev.target.id==='sourceSelect'){sourceName=ev.target.value;render()}else if(ev.target.id==='quizGroup'){quizGroup=ev.target.value;resetQuiz(quizMode,quizGroup);render()}});
window.addEventListener('input',ev=>{if(ev.target.id==='search'){searchPop(ev.target.value)}else if(ev.target.id==='glossaryInput'){fillDictionary(ev.target.value)}else if(ev.target.id==='sourceSearch'){sourceQuery=ev.target.value;qs('#readerText').innerHTML=highlightText(selectedSourceText(),sourceQuery);updateSourceMatches()}else if(ev.target.id==='lessonNote'){store.notes[lessonId]=ev.target.value;save()}});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'){qs('#searchPop').hidden=true;closeSide()}if(ev.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ev.preventDefault();qs('#search').focus()}if(ev.key==='ArrowRight'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&view==='flash'){flashIndex=(flashIndex+1)%flashDeck.length;flashBack=false;render()}if(ev.key===' '&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)&&view==='flash'){ev.preventDefault();flashBack=!flashBack;render()}});
window.addEventListener('click',ev=>{if(!ev.target.closest('.search-wrap')&&!qs('#searchPop').hidden)qs('#searchPop').hidden=true});
window.addEventListener('beforeunload',()=>{const el=qs('#lessonNote');if(el){store.notes[lessonId]=el.value;save()}});
if(!VIEWS.some(x=>x[0]===view))view='study';render();
</script>
</body></html>
